<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LPU Scheduler">
<meta name="mobile-web-app-capable" content="yes">
<title>Rooms & Buildings · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/mobile-app.css">
<style>
  .rm-stats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:20px}
  .rm-stat{padding:16px 18px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
  .rm-stat-val{font-size:26px;font-weight:700;letter-spacing:-0.03em;color:var(--text);line-height:1}
  .rm-stat-lbl{font-size:11px;color:var(--text-secondary);margin-top:4px;text-transform:uppercase;letter-spacing:0.05em;font-weight:600}

  .bld-section{margin-bottom:32px}
  .bld-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:16px}
  .bld-section-title{font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:10px}
  .bld-section-title i{color:var(--brand);font-size:14px}
  .bld-section-meta{display:flex;gap:14px;font-size:12px;color:var(--text-secondary)}
  .bld-section-meta strong{color:var(--text);font-weight:600}

  .floor-section{margin-bottom:24px}
  .floor-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
  .floor-head-title{font-size:13px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:0.05em}
  .floor-head-count{font-size:11px;color:var(--text-secondary);background:var(--surface-active);padding:2px 8px;border-radius:999px;font-weight:600}

  .room-grid-modern{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .room-card-mod{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;transition:all 160ms ease;position:relative}
  .room-card-mod:hover{border-color:var(--brand);box-shadow:var(--shadow-md);transform:translateY(-2px)}
  .room-card-mod-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
  .room-card-mod-name{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:15px;color:var(--text);letter-spacing:-0.01em}
  .room-card-mod-meta{font-size:11px;color:var(--text-secondary);margin-top:3px}
  .room-card-mod-actions{display:flex;gap:4px;flex-shrink:0}
  .room-card-mod-actions .btn{padding:5px 9px;min-height:26px;font-size:11px}
  .room-card-mod-body{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--text-secondary);margin-bottom:10px}
  .room-card-mod-body span{display:inline-flex;align-items:center;gap:4px}
  .room-card-mod-body i{font-size:10px;opacity:.7}
  .room-card-mod-flags{display:flex;gap:6px;flex-wrap:wrap}
  .room-flag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em}
  .room-flag.bookable{background:var(--success-soft);color:var(--success-text)}
  .room-flag.hidden{background:var(--surface-active);color:var(--text-muted)}
  .room-flag.weekend{background:var(--info-soft);color:var(--info-text)}
  .room-card-mod-facilities{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
  .facility-pill{padding:2px 8px;background:var(--bg-subtle);color:var(--text-secondary);border-radius:4px;font-size:10px;font-weight:500}

  .bld-table-modal{width:100%;font-size:13px;border-collapse:collapse}
  .bld-table-modal th{font-size:11px;text-align:left;padding:8px 10px;color:var(--text-secondary);font-weight:600;text-transform:uppercase;letter-spacing:0.04em;border-bottom:1px solid var(--border)}
  .bld-table-modal td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
  .bld-table-modal tr:last-child td{border-bottom:none}
</style>
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-door-open"></i> Rooms & Buildings</h1>
      <p class="page-subtitle">Manage campus blocks, floors, and rooms in one place.</p>
    </div>
    <div class="row">
      <button class="btn" id="manageBuildingsBtn"><i class="fas fa-building"></i> Manage buildings</button>
      <button class="btn" id="exportBtn"><i class="fas fa-download"></i> Export</button>
      <button class="btn btn-primary" id="addRoomBtn"><i class="fas fa-plus"></i> Add room</button>
    </div>
  </div>

  <div class="admin-tabs">
    <a href="admin-rooms.html" class="admin-tab active"><i class="fas fa-door-open"></i> Rooms</a>
    <a href="admin-timetable.html" class="admin-tab"><i class="fas fa-table"></i> Timetable</a>
    <a href="admin-import.html" class="admin-tab"><i class="fas fa-file-import"></i> Import</a>
    <a href="admin-bookings.html" class="admin-tab"><i class="fas fa-calendar-check"></i> Bookings</a>
    <a href="admin-faculty.html" class="admin-tab"><i class="fas fa-users"></i> Users</a>
    <a href="admin-slots.html" class="admin-tab"><i class="fas fa-clock"></i> Time slots</a>
    <a href="admin-calendar.html" class="admin-tab"><i class="fas fa-calendar-days"></i> Calendar</a>
    <a href="admin-settings.html" class="admin-tab"><i class="fas fa-gear"></i> Settings</a>
  </div>

  <div class="rm-stats" id="stats"></div>

  <div class="row" style="margin-bottom:16px;gap:12px">
    <div class="chips" id="buildingChips"></div>
    <div class="search-wrap" style="margin-left:auto;max-width:340px">
      <i class="fas fa-search search-icon"></i>
      <input class="input" id="search" placeholder="Search room, type, facilities…">
    </div>
  </div>

  <div id="roomsContainer">
    <div class="card" style="padding:32px"><div class="empty"><i class="fas fa-spinner fa-spin"></i>Loading…</div></div>
  </div>
</div>

<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, toast, todayISO } from './js/core.js';

(async () => {
  const auth = await requireRole(['admin']);
  if (!auth) return;
  renderNav(auth.profile);
  const $ = id => document.getElementById(id);

  let rooms = [], buildings = [], floors = [], types = [];
  let selectedBuilding = 'all';
  let search = '';

  async function load() {
    const [rRes, bRes, fRes, tRes] = await Promise.all([
      supabase.from('rooms').select('*').order('room_id'),
      supabase.from('buildings').select('*').order('sort_order').order('id'),
      supabase.from('building_floors').select('*').order('floor'),
      supabase.from('room_types').select('*').order('sort_order'),
    ]);
    rooms = rRes.data ?? [];
    buildings = bRes.data ?? [];
    floors = fRes.data ?? [];
    types = tRes.data ?? [];
    render();
  }

  function renderStats() {
    const bookable = rooms.filter(r => r.bookable).length;
    const totalCap = rooms.reduce((s, r) => s + (r.capacity || 0), 0);
    $('stats').innerHTML = `
      <div class="rm-stat"><div class="rm-stat-val">${buildings.length}</div><div class="rm-stat-lbl">Buildings</div></div>
      <div class="rm-stat"><div class="rm-stat-val">${rooms.length}</div><div class="rm-stat-lbl">Rooms</div></div>
      <div class="rm-stat"><div class="rm-stat-val" style="color:var(--success)">${bookable}</div><div class="rm-stat-lbl">Bookable</div></div>
      <div class="rm-stat"><div class="rm-stat-val">${totalCap}</div><div class="rm-stat-lbl">Total seats</div></div>`;
  }

  function renderBuildingChips() {
    const el = $('buildingChips');
    el.innerHTML = `
      <button class="chip ${selectedBuilding === 'all' ? 'on' : ''}" data-b="all">
        <i class="fas fa-layer-group"></i> All blocks
      </button>
      ${buildings.map(b => `
        <button class="chip ${selectedBuilding === b.id ? 'on' : ''}" data-b="${escapeHtml(b.id)}">
          <i class="fas fa-building"></i> ${escapeHtml(b.name || b.id)}
        </button>
      `).join('')}`;
    el.querySelectorAll('[data-b]').forEach(btn => {
      btn.onclick = () => { selectedBuilding = btn.dataset.b; render(); };
    });
  }

  function renderRooms() {
    let filtered = rooms;
    if (selectedBuilding !== 'all') filtered = filtered.filter(r => r.building === selectedBuilding);
    if (search) {
      const q = search.toLowerCase();
      filtered = filtered.filter(r =>
        r.display_name.toLowerCase().includes(q) ||
        r.room_id.toLowerCase().includes(q) ||
        (r.type || '').toLowerCase().includes(q) ||
        (r.facilities || []).some(f => f.toLowerCase().includes(q))
      );
    }

    if (!filtered.length) {
      $('roomsContainer').innerHTML = `<div class="card"><div class="empty-action">
        <div class="empty-action-icon"><i class="fas fa-door-closed"></i></div>
        <div class="empty-action-title">No rooms ${selectedBuilding !== 'all' ? 'in this block' : 'match your search'}</div>
        <div class="empty-action-sub">${selectedBuilding !== 'all' ? 'Add a room to this building.' : 'Try clearing filters.'}</div>
      </div></div>`;
      return;
    }

    const typeMap = new Map(types.map(t => [t.id, t.label]));
    const buildingGroups = new Map();
    filtered.forEach(r => {
      if (!buildingGroups.has(r.building)) buildingGroups.set(r.building, new Map());
      const floorMap = buildingGroups.get(r.building);
      if (!floorMap.has(r.floor)) floorMap.set(r.floor, []);
      floorMap.get(r.floor).push(r);
    });

    const buildingIds = [...buildingGroups.keys()].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

    $('roomsContainer').innerHTML = buildingIds.map(bldId => {
      const bld = buildings.find(b => b.id === bldId);
      const floorMap = buildingGroups.get(bldId);
      const floorNums = [...floorMap.keys()].sort((a, b) => a - b);
      const roomCount = [...floorMap.values()].reduce((s, arr) => s + arr.length, 0);
      const totalCap = [...floorMap.values()].flat().reduce((s, r) => s + (r.capacity || 0), 0);

      return `
        <div class="bld-section">
          <div class="bld-section-head">
            <div>
              <div class="bld-section-title">
                <i class="fas fa-building"></i> ${escapeHtml(bld?.name || bldId)}
                <span class="dim" style="font-weight:400;font-size:12px">· ID ${escapeHtml(bldId)}</span>
              </div>
              <div class="bld-section-meta" style="margin-top:6px">
                <span><strong>${floorNums.length}</strong> floor${floorNums.length === 1 ? '' : 's'}</span>
                <span><strong>${roomCount}</strong> room${roomCount === 1 ? '' : 's'}</span>
                <span><strong>${totalCap}</strong> seats</span>
                ${bld?.is_active === false ? '<span class="badge badge-rejected">inactive</span>' : ''}
              </div>
            </div>
            <button class="btn btn-sm" data-add-room-bld="${escapeHtml(bldId)}"><i class="fas fa-plus"></i> Add room here</button>
          </div>

          ${floorNums.map(floorNum => {
            const floorRooms = floorMap.get(floorNum).sort((a, b) =>
              a.display_name.localeCompare(b.display_name, undefined, { numeric: true }));
            return `
              <div class="floor-section">
                <div class="floor-head">
                  <div class="floor-head-title">Floor ${floorNum}</div>
                  <div class="floor-head-count">${floorRooms.length} room${floorRooms.length === 1 ? '' : 's'}</div>
                </div>
                <div class="room-grid-modern">
                  ${floorRooms.map(r => renderRoomCard(r, typeMap)).join('')}
                </div>
              </div>`;
          }).join('')}
        </div>`;
    }).join('');

    document.querySelectorAll('[data-edit-room]').forEach(b => b.onclick = () => editRoom(b.dataset.editRoom));
    document.querySelectorAll('[data-del-room]').forEach(b => b.onclick = () => delRoom(b.dataset.delRoom));
    document.querySelectorAll('[data-add-room-bld]').forEach(b => b.onclick = () => addRoom(b.dataset.addRoomBld));
  }

  function renderRoomCard(r, typeMap) {
    const facilities = r.facilities || [];
    return `
      <div class="room-card-mod">
        <div class="room-card-mod-head">
          <div>
            <div class="room-card-mod-name">${escapeHtml(r.display_name)}</div>
            <div class="room-card-mod-meta">Block ${r.building} · Floor ${r.floor}</div>
          </div>
          <div class="room-card-mod-actions">
            <button class="btn btn-sm" data-edit-room="${escapeHtml(r.room_id)}" title="Edit"><i class="fas fa-pen"></i></button>
            <button class="btn btn-sm btn-danger" data-del-room="${escapeHtml(r.room_id)}" title="Delete"><i class="fas fa-trash"></i></button>
          </div>
        </div>
        <div class="room-card-mod-body">
          <span><i class="fas fa-tag"></i> ${escapeHtml(typeMap.get(r.type) || r.type)}</span>
          ${r.capacity ? `<span><i class="fas fa-users"></i> ${r.capacity} seats</span>` : ''}
        </div>
        <div class="room-card-mod-flags">
          ${r.bookable
            ? '<span class="room-flag bookable"><i class="fas fa-check"></i> Bookable</span>'
            : '<span class="room-flag hidden"><i class="fas fa-eye-slash"></i> Hidden</span>'}
          ${r.weekend_open ? '<span class="room-flag weekend"><i class="fas fa-calendar-week"></i> Weekend</span>' : ''}
        </div>
        ${facilities.length ? `
          <div class="room-card-mod-facilities">
            ${facilities.map(f => `<span class="facility-pill">${escapeHtml(f)}</span>`).join('')}
          </div>` : ''}
      </div>`;
  }

  function addRoom(preselectBuilding = null) {
    editRoom(null, preselectBuilding);
  }

  function editRoom(id, preselectBuilding = null) {
    const r = id ? rooms.find(x => x.room_id === id) : null;
    if (!buildings.length) return toast('Create a building first', 'error');
    if (!types.length) return toast('No room types available', 'error');

    const initialBuilding = r?.building || preselectBuilding || buildings[0].id;
    const buildingFloors = floors.filter(f => f.building_id === initialBuilding).map(f => f.floor).sort((a, b) => a - b);
    const initialFloor = r?.floor || (buildingFloors[0] || 1);

    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog';
    dialog.innerHTML = `
      <div class="modal-content modal-wide">
        <div class="modal-header">
          <div>
            <div class="modal-title">${r ? 'Edit ' + escapeHtml(r.display_name) : 'Add room'}</div>
            <div class="modal-sub">${r ? 'Update room details and availability.' : 'Create a new room in an existing building.'}</div>
          </div>
          <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
        </div>
        <div class="modal-body">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px">
            <label class="field"><span>Building *</span>
              <select class="input" data-field="building" id="rmBuilding">
                ${buildings.map(b => `<option value="${escapeHtml(b.id)}" ${initialBuilding === b.id ? 'selected' : ''}>${escapeHtml(b.name || b.id)}</option>`).join('')}
              </select>
            </label>
            <label class="field"><span>Floor *</span>
              <input class="input" type="number" data-field="floor" id="rmFloor" min="1" max="20" value="${initialFloor}">
            </label>
            <label class="field"><span>Room number *</span>
              <input class="input" data-field="room_number" value="${escapeHtml(r?.room_number || '01')}" placeholder="07">
            </label>
            <label class="field"><span>Suffix</span>
              <input class="input" data-field="suffix" value="${escapeHtml(r?.suffix || '')}" placeholder="A">
            </label>
            <label class="field"><span>Type *</span>
              <select class="input" data-field="type">
                ${types.map(t => `<option value="${escapeHtml(t.id)}" ${r?.type === t.id ? 'selected' : ''}>${escapeHtml(t.label)}</option>`).join('')}
              </select>
            </label>
            <label class="field"><span>Capacity</span>
              <input class="input" type="number" data-field="capacity" value="${r?.capacity ?? 60}">
            </label>
          </div>
          <label class="field" style="margin-top:8px"><span>Facilities (comma separated)</span>
            <input class="input" data-field="facilities" value="${escapeHtml((r?.facilities || []).join(', '))}" placeholder="projector, ac, computers">
          </label>
          <div style="display:flex;gap:20px;flex-wrap:wrap;margin-top:12px">
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">
              <input type="checkbox" data-field="bookable" ${r?.bookable !== false ? 'checked' : ''}> Bookable
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">
              <input type="checkbox" data-field="weekend_open" ${r?.weekend_open ? 'checked' : ''}> Open on weekends
            </label>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn" data-close>Cancel</button>
          <button class="btn btn-primary" data-save>${r ? 'Save changes' : 'Create room'}</button>
        </div>
      </div>`;
    document.body.appendChild(dialog);
    dialog.showModal();

    dialog.querySelector('[data-save]').onclick = async () => {
      const get = f => dialog.querySelector(`[data-field="${f}"]`).value.trim();
      const getCb = f => dialog.querySelector(`[data-field="${f}"]`).checked;

      const bld = get('building'), floor = parseInt(get('floor')) || 1;
      const rn = get('room_number').padStart(2, '0');
      const sfx = get('suffix').toUpperCase();
      const facilities = get('facilities').split(',').map(x => x.trim()).filter(Boolean);

      if (!bld || !rn) return toast('Building and room number are required', 'error');

      const rid = `${bld}-${floor}${rn}${sfx}`;
      const payload = {
        room_id: rid,
        display_name: `${bld}-${floor}${rn}${sfx ? ' ' + sfx : ''}`,
        building: bld, floor,
        floor_digit: String(floor),
        room_number: rn, suffix: sfx,
        type: get('type'),
        capacity: parseInt(get('capacity')) || null,
        bookable: getCb('bookable'),
        weekend_open: getCb('weekend_open'),
        facilities,
      };

      const res = r
        ? await supabase.from('rooms').update(payload).eq('room_id', r.room_id)
        : await supabase.from('rooms').insert(payload);

      if (res.error) return toast(res.error.message, 'error');
      toast(r ? 'Room updated' : 'Room created', 'success');
      dialog.close(); dialog.remove();
      await load();
    };

    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  async function delRoom(id) {
    if (!confirm(`Delete room ${id}?\n\nThis will also remove any timetable rows and bookings for this room.`)) return;
    const { error } = await supabase.from('rooms').delete().eq('room_id', id);
    if (error) return toast(error.message, 'error');
    toast('Room deleted', 'success');
    await load();
  }

  $('manageBuildingsBtn').onclick = () => openBuildingsModal();

  function openBuildingsModal() {
    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog';
    dialog.innerHTML = `
      <div class="modal-content modal-wide">
        <div class="modal-header">
          <div>
            <div class="modal-title">Buildings & Floors</div>
            <div class="modal-sub">Manage campus blocks and their floors.</div>
          </div>
          <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
        </div>
        <div class="modal-body">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap">
            <div style="font-size:13px;color:var(--text-secondary)">
              <strong id="mbCount">${buildings.length}</strong> building${buildings.length === 1 ? '' : 's'} total
            </div>
            <button class="btn btn-primary btn-sm" id="mbAddBtn"><i class="fas fa-plus"></i> Add building</button>
          </div>
          <div id="mbList"></div>
        </div>
        <div class="modal-footer">
          <button class="btn" data-close>Close</button>
        </div>
      </div>`;
    document.body.appendChild(dialog);
    dialog.showModal();

    renderBuildingsList();

    dialog.querySelector('#mbAddBtn').onclick = () => editBuilding(null);

    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) { dialog.remove(); load(); } });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  function renderBuildingsList() {
    const el = document.getElementById('mbList');
    if (!el) return;
    if (!buildings.length) {
      el.innerHTML = `<div class="empty" style="padding:24px"><i class="fas fa-building"></i>No buildings yet — click "Add building"</div>`;
      return;
    }
    const floorCounts = new Map();
    const roomCounts = new Map();
    floors.forEach(f => floorCounts.set(f.building_id, (floorCounts.get(f.building_id) || 0) + 1));
    rooms.forEach(r => roomCounts.set(r.building, (roomCounts.get(r.building) || 0) + 1));

    el.innerHTML = `<table class="bld-table-modal">
      <thead>
        <tr>
          <th>Building</th>
          <th>ID</th>
          <th>Floors</th>
          <th>Rooms</th>
          <th>Status</th>
          <th style="text-align:right">Actions</th>
        </tr>
      </thead>
      <tbody>
        ${buildings.map(b => `
          <tr>
            <td><strong style="color:var(--text)">${escapeHtml(b.name || b.id)}</strong>${b.address ? `<div style="font-size:11px;color:var(--text-secondary);margin-top:2px">${escapeHtml(b.address)}</div>` : ''}</td>
            <td class="mono">${escapeHtml(b.id)}</td>
            <td>${floorCounts.get(b.id) || 0}</td>
            <td>${roomCounts.get(b.id) || 0}</td>
            <td>${b.is_active !== false ? '<span class="badge badge-approved">active</span>' : '<span class="badge badge-rejected">inactive</span>'}</td>
            <td style="text-align:right;white-space:nowrap">
              <button class="btn btn-sm" data-floors="${escapeHtml(b.id)}" title="Manage floors"><i class="fas fa-layer-group"></i></button>
              <button class="btn btn-sm" data-edit-bld="${escapeHtml(b.id)}" title="Edit building"><i class="fas fa-pen"></i></button>
              <button class="btn btn-sm ${b.is_active !== false ? 'btn-danger' : 'btn-success'}" data-toggle-bld="${escapeHtml(b.id)}" data-active="${b.is_active !== false}" title="${b.is_active !== false ? 'Deactivate' : 'Activate'}">
                <i class="fas fa-${b.is_active !== false ? 'eye-slash' : 'eye'}"></i>
              </button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>`;

    el.querySelectorAll('[data-edit-bld]').forEach(btn => btn.onclick = () => editBuilding(btn.dataset.editBld));
    el.querySelectorAll('[data-floors]').forEach(btn => btn.onclick = () => openFloorsModal(btn.dataset.floors));
    el.querySelectorAll('[data-toggle-bld]').forEach(btn => btn.onclick = async () => {
      const next = btn.dataset.active !== 'true';
      const { error } = await supabase.from('buildings').update({ is_active: next }).eq('id', btn.dataset.toggleBld);
      if (error) return toast(error.message, 'error');
      toast(next ? 'Building activated' : 'Building deactivated', 'success');
      await load();
      renderBuildingsList();
    });
  }

  function editBuilding(id) {
    const b = id ? buildings.find(x => x.id === id) : null;
    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog';
    dialog.innerHTML = `
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title">${b ? 'Edit ' + escapeHtml(b.id) : 'Add building'}</div>
          <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
        </div>
        <div class="modal-body">
          <label class="field"><span>Building ID *</span>
            <input class="input" data-field="id" value="${escapeHtml(b?.id || '')}" ${b ? 'disabled' : ''} placeholder="34">
          </label>
          <label class="field"><span>Display name *</span>
            <input class="input" data-field="name" value="${escapeHtml(b?.name || '')}" placeholder="Block 34">
          </label>
          <label class="field"><span>Address</span>
            <input class="input" data-field="address" value="${escapeHtml(b?.address || '')}" placeholder="Near Gate 3">
          </label>
          <label class="field"><span>Sort order</span>
            <input class="input" type="number" data-field="sort_order" value="${b?.sort_order ?? 0}">
          </label>
        </div>
        <div class="modal-footer">
          <button class="btn" data-close>Cancel</button>
          <button class="btn btn-primary" data-save>${b ? 'Save' : 'Create building'}</button>
        </div>
      </div>`;
    document.body.appendChild(dialog);
    dialog.showModal();

    dialog.querySelector('[data-save]').onclick = async () => {
      const get = f => dialog.querySelector(`[data-field="${f}"]`).value.trim();
      if (!get('id') || !get('name')) return toast('ID and name required', 'error');
      const payload = {
        id: b?.id || get('id'),
        name: get('name'),
        address: get('address') || null,
        sort_order: parseInt(get('sort_order')) || 0,
      };
      const res = b
        ? await supabase.from('buildings').update(payload).eq('id', b.id)
        : await supabase.from('buildings').insert(payload);
      if (res.error) return toast(res.error.message, 'error');
      toast(b ? 'Building updated' : 'Building created', 'success');
      dialog.close(); dialog.remove();
      await load();
      renderBuildingsList();
    };

    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  function openFloorsModal(buildingId) {
    const bld = buildings.find(x => x.id === buildingId);
    if (!bld) return;

    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog';
    dialog.innerHTML = `
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <div class="modal-title">Floors · ${escapeHtml(bld.name || bld.id)}</div>
            <div class="modal-sub">Add or remove floors in this building.</div>
          </div>
          <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
        </div>
        <div class="modal-body">
          <div style="display:flex;gap:8px;margin-bottom:16px">
            <input class="input" type="number" id="newFloor" min="1" max="20" placeholder="Floor number" style="flex:1">
            <button class="btn btn-primary" id="addFloorBtn"><i class="fas fa-plus"></i> Add</button>
          </div>
          <div id="floorsList"></div>
        </div>
        <div class="modal-footer">
          <button class="btn" data-close>Close</button>
        </div>
      </div>`;
    document.body.appendChild(dialog);
    dialog.showModal();

    function renderFloors() {
      const list = dialog.querySelector('#floorsList');
      const current = floors.filter(f => f.building_id === buildingId).sort((a, b) => a.floor - b.floor);
      if (!current.length) {
        list.innerHTML = `<div class="empty" style="padding:20px;font-size:13px"><i class="fas fa-layer-group"></i>No floors yet</div>`;
        return;
      }
      list.innerHTML = current.map(f => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--surface-hover);border-radius:8px;margin-bottom:6px">
          <div style="font-weight:500;font-size:13px">Floor ${f.floor}</div>
          <button class="btn btn-sm btn-danger" data-del-floor="${f.floor}"><i class="fas fa-trash"></i></button>
        </div>`).join('');
      list.querySelectorAll('[data-del-floor]').forEach(btn => btn.onclick = async () => {
        const fl = parseInt(btn.dataset.delFloor);
        if (!confirm(`Remove floor ${fl} from this building?`)) return;
        const { error } = await supabase.from('building_floors').delete().eq('building_id', buildingId).eq('floor', fl);
        if (error) return toast(error.message, 'error');
        toast(`Floor ${fl} removed`, 'success');
        await load();
        renderFloors();
      });
    }
    renderFloors();

    dialog.querySelector('#addFloorBtn').onclick = async () => {
      const input = dialog.querySelector('#newFloor');
      const fl = parseInt(input.value);
      if (!fl || fl < 1 || fl > 20) return toast('Floor must be 1–20', 'error');
      const { error } = await supabase.from('building_floors').insert({ building_id: buildingId, floor: fl });
      if (error) return toast(error.message, 'error');
      toast(`Floor ${fl} added`, 'success');
      input.value = '';
      await load();
      renderFloors();
    };

    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) { dialog.remove(); renderBuildingsList(); } });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  $('addRoomBtn').onclick = () => addRoom(selectedBuilding !== 'all' ? selectedBuilding : null);
  $('search').oninput = e => { search = e.target.value.trim(); render(); };

  $('exportBtn').onclick = () => {
    const rows = [['room_id','display_name','building','floor','type','capacity','bookable','weekend_open','facilities']];
    rooms.forEach(r => rows.push([
      r.room_id, r.display_name, r.building, r.floor, r.type,
      r.capacity ?? '', r.bookable ?? '', r.weekend_open ?? '',
      (r.facilities || []).join('|'),
    ]));
    const csv = rows.map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `rooms-${todayISO()}.csv`;
    a.click();
    toast('Exported', 'success');
  };

  function render() {
    renderStats();
    renderBuildingChips();
    renderRooms();
  }

  await load();
})();
</script>
<!-- Centralized site banner -->
<script type="module" src="js/banner.js"></script>
</body>
