<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rooms · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-header">
    <div><h1 class="page-title"><i class="fas fa-door-open"></i> Rooms</h1><p class="page-subtitle">Manage rooms and view weekly schedules.</p></div>
    <div class="row">
      <button class="btn" id="exportBtn"><i class="fas fa-download"></i> Export</button>
      <button class="btn btn-primary" id="addBtn"><i class="fas fa-plus"></i> Add room</button>
    </div>
  </div>
  <div class="admin-tabs">
    <a href="admin-faculty.html" class="admin-tab"><i class="fas fa-chalkboard-user"></i> Faculty</a>
    <a href="admin-timetable.html" class="admin-tab"><i class="fas fa-table"></i> Timetable</a>
    <a href="admin-bookings.html" class="admin-tab"><i class="fas fa-calendar-check"></i> Bookings</a>
    <a href="admin-rooms.html" class="admin-tab active"><i class="fas fa-door-open"></i> Rooms</a>
    <a href="admin-buildings.html" class="admin-tab"><i class="fas fa-building"></i> Buildings</a>
    <a href="admin-slots.html" class="admin-tab"><i class="fas fa-clock"></i> Time slots</a>
    <a href="admin-calendar.html" class="admin-tab"><i class="fas fa-calendar-days"></i> Calendar</a>
    <a href="admin-users.html" class="admin-tab"><i class="fas fa-users"></i> Users</a>
    <a href="admin-settings.html" class="admin-tab"><i class="fas fa-gear"></i> Settings</a>
  </div>
  <div class="row" style="margin-bottom:16px;gap:8px">
    <select class="input" id="bldFilter" style="max-width:200px"><option value="">All blocks</option></select>
    <div class="search-wrap" style="margin-left:auto;max-width:360px"><i class="fas fa-search search-icon"></i><input class="input" id="search" placeholder="Search room…"></div>
  </div>
  <div class="table-wrap"><table><thead><tr><th>Room</th><th>Type</th><th>Capacity</th><th>Weekly classes</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead><tbody id="body"></tbody></table></div>
</div>
<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, toast, todayISO } from './js/core.js';
(async () => {
  const auth = await requireRole(['admin']); if (!auth) return;
  renderNav(auth.profile);
  const $ = id => document.getElementById(id);
  let rooms = [], tt = [], types = [], buildings = [], bld = '', search = '';

  async function load() {
    const [{ data: r }, { data: t }, { data: ty }, { data: b }] = await Promise.all([
      supabase.from('rooms').select('*').order('room_id'),
      supabase.from('timetable').select('room_id').eq('is_active', true),
      supabase.from('room_types').select('*'),
      supabase.from('buildings').select('*').order('sort_order'),
    ]);
    rooms = r ?? []; tt = t ?? []; types = ty ?? []; buildings = b ?? [];
    $('bldFilter').innerHTML = `<option value="">All blocks</option>${buildings.map(x => `<option value="${escapeHtml(x.id)}" ${bld === x.id ? 'selected' : ''}>${escapeHtml(x.name || x.id)}</option>`).join('')}`;
    render();
  }

  function render() {
    let list = rooms;
    if (bld) list = list.filter(r => r.building === bld);
    if (search) { const q = search.toLowerCase(); list = list.filter(r => r.display_name.toLowerCase().includes(q) || r.room_id.toLowerCase().includes(q)); }
    const typeMap = new Map(types.map(t => [t.id, t.label]));
    const weekCount = new Map(); tt.forEach(t => weekCount.set(t.room_id, (weekCount.get(t.room_id) || 0) + 1));
    if (!list.length) { $('body').innerHTML = '<tr><td colspan="6" class="empty"><i class="fas fa-door-closed"></i>No rooms match</td></tr>'; return; }
    $('body').innerHTML = list.map(r => `<tr>
      <td><div class="mono" style="font-weight:500;color:var(--text)">${escapeHtml(r.display_name)}</div><div style="font-size:11px;color:var(--text-secondary)">Block ${r.building} · Floor ${r.floor}</div></td>
      <td>${escapeHtml(typeMap.get(r.type) || r.type)}</td>
      <td>${r.capacity ?? '—'}</td>
      <td>${weekCount.get(r.room_id) || 0}</td>
      <td>${r.bookable ? '<span class="badge badge-approved">bookable</span>' : '<span class="badge badge-gray">hidden</span>'}${r.weekend_open ? ' <span class="badge badge-student">W</span>' : ''}</td>
      <td style="text-align:right;white-space:nowrap"><button class="btn btn-sm" data-edit="${escapeHtml(r.room_id)}"><i class="fas fa-pen"></i></button><button class="btn btn-sm btn-danger" data-del="${escapeHtml(r.room_id)}"><i class="fas fa-trash"></i></button></td>
    </tr>`).join('');
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => edit(b.dataset.edit));
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => del(b.dataset.del));
  }

  function edit(id) {
    const r = id ? rooms.find(x => x.room_id === id) : null;
    if (!buildings.length) return toast('Create a building first', 'error');
    if (!types.length) return toast('No room types', 'error');
    const dialog = document.createElement('dialog'); dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content modal-wide"><div class="modal-header"><div class="modal-title">${r ? 'Edit ' + escapeHtml(r.display_name) : 'Add room'}</div><button class="modal-close" data-close><i class="fas fa-xmark"></i></button></div><div class="modal-body"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px"><label class="field"><span>Building</span><select class="input" data-field="building">${buildings.map(b => `<option value="${escapeHtml(b.id)}" ${r?.building === b.id ? 'selected' : ''}>${escapeHtml(b.name || b.id)}</option>`).join('')}</select></label><label class="field"><span>Floor</span><input class="input" type="number" data-field="floor" value="${r?.floor || 1}"></label><label class="field"><span>Room number</span><input class="input" data-field="room_number" value="${escapeHtml(r?.room_number || '01')}"></label><label class="field"><span>Suffix</span><input class="input" data-field="suffix" value="${escapeHtml(r?.suffix || '')}"></label><label class="field"><span>Type</span><select class="input" data-field="type">${types.map(t => `<option value="${escapeHtml(t.id)}" ${r?.type === t.id ? 'selected' : ''}>${escapeHtml(t.label)}</option>`).join('')}</select></label><label class="field"><span>Capacity</span><input class="input" type="number" data-field="capacity" value="${r?.capacity ?? 60}"></label></div><div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:12px"><label style="display:flex;align-items:center;gap:8px;font-size:13px"><input type="checkbox" data-field="bookable" ${r?.bookable !== false ? 'checked' : ''}> Bookable</label><label style="display:flex;align-items:center;gap:8px;font-size:13px"><input type="checkbox" data-field="weekend_open" ${r?.weekend_open ? 'checked' : ''}> Open weekends</label></div></div><div class="modal-footer"><button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-save>Save</button></div></div>`;
    document.body.appendChild(dialog); dialog.showModal();
    dialog.querySelector('[data-save]').onclick = async () => {
      const get = f => dialog.querySelector(`[data-field="${f}"]`).value.trim();
      const getCb = f => dialog.querySelector(`[data-field="${f}"]`).checked;
      const bld = get('building'), floor = parseInt(get('floor')) || 1, rn = get('room_number').padStart(2, '0'), sfx = get('suffix').toUpperCase();
      const rid = `${bld}-${floor}${rn}${sfx}`;
      const payload = { room_id: rid, display_name: `${bld}-${floor}${rn}${sfx ? ' ' + sfx : ''}`, building: bld, floor, floor_digit: String(floor), room_number: rn, suffix: sfx, type: get('type'), capacity: parseInt(get('capacity')) || null, bookable: getCb('bookable'), weekend_open: getCb('weekend_open') };
      const res = r ? await supabase.from('rooms').update(payload).eq('room_id', r.room_id) : await supabase.from('rooms').insert(payload);
      if (res.error) return toast(res.error.message, 'error');
      toast(r ? 'Updated' : 'Added', 'success'); dialog.close(); dialog.remove(); await load();
    };
    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  async function del(id) {
    if (!confirm(`Delete room ${id}?`)) return;
    const { error } = await supabase.from('rooms').delete().eq('room_id', id);
    if (error) return toast(error.message, 'error');
    toast('Deleted', 'success'); await load();
  }

  $('bldFilter').onchange = e => { bld = e.target.value; render(); };
  $('search').oninput = e => { search = e.target.value.trim(); render(); };
  $('addBtn').onclick = () => edit();
  $('exportBtn').onclick = () => {
    const csv = ['room_id,display_name,building,floor,type,capacity,bookable'].concat(rooms.map(r => [r.room_id, r.display_name, r.building, r.floor, r.type, r.capacity ?? '', r.bookable].join(','))).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `rooms-${todayISO()}.csv`; a.click();
    toast('Exported', 'success');
  };
  await load();
})();
</script>
</body>
</html>
