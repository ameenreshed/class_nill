<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-users"></i> Users</h1>
      <p class="page-subtitle">Manage roles, sections, and access.</p>
    </div>
  </div>

  <div class="stats" id="stats" style="margin-bottom:20px"></div>

  <div class="row" style="gap:8px;margin-bottom:16px">
    <div class="chips" id="filterChips">
      <button class="chip on" data-filter="all">All</button>
      <button class="chip" data-filter="admin">Admins</button>
      <button class="chip" data-filter="faculty">Faculty</button>
      <button class="chip" data-filter="student">Students</button>
      <button class="chip" data-filter="suspended">Suspended</button>
    </div>
    <div class="search-wrap" style="margin-left:auto;max-width:320px">
      <i class="fas fa-search search-icon"></i>
      <input class="input" id="searchInput" placeholder="Search name or email…">
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>User</th>
          <th>Role</th>
          <th>Section</th>
          <th>Department</th>
          <th>Status</th>
          <th>Last active</th>
          <th style="text-align:right">Actions</th>
        </tr>
      </thead>
      <tbody id="body"><tr><td colspan="7" class="empty"><i class="fas fa-spinner fa-spin"></i>Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, toast, formatRelativeTime } from './js/core.js';

(async () => {
  const auth = await requireRole(['admin']);
  if (!auth) return;
  renderNav(auth.profile);

  const $ = id => document.getElementById(id);
  let users = [], sections = [];
  let filter = 'all', search = '';

  async function load() {
    const [{ data: profs }, { data: secs }] = await Promise.all([
      supabase.from('profiles').select('*').order('created_at', { ascending: false }),
      supabase.from('sections').select('*').order('section_id'),
    ]);
    users = profs ?? [];
    sections = secs ?? [];
    renderStats();
    render();
  }

  function renderStats() {
    const total = users.length;
    const admins = users.filter(u => u.role === 'admin').length;
    const fac = users.filter(u => u.role === 'faculty').length;
    const stu = users.filter(u => u.role === 'student').length;
    const susp = users.filter(u => u.is_active === false).length;
    $('stats').innerHTML = `
      <div class="stat"><i class="fas fa-users stat-icon"></i><div class="stat-value">${total}</div><div class="stat-label">Total</div></div>
      <div class="stat"><i class="fas fa-shield-halved stat-icon"></i><div class="stat-value">${admins}</div><div class="stat-label">Admins</div></div>
      <div class="stat"><i class="fas fa-chalkboard-user stat-icon"></i><div class="stat-value">${fac}</div><div class="stat-label">Faculty</div></div>
      <div class="stat"><i class="fas fa-graduation-cap stat-icon"></i><div class="stat-value">${stu}</div><div class="stat-label">Students</div></div>
      <div class="stat"><i class="fas fa-ban stat-icon"></i><div class="stat-value">${susp}</div><div class="stat-label">Suspended</div></div>`;
  }

  function filtered() {
    let list = users;
    if (filter === 'admin' || filter === 'faculty' || filter === 'student') list = list.filter(u => u.role === filter);
    else if (filter === 'suspended') list = list.filter(u => u.is_active === false);
    if (search) {
      const q = search.toLowerCase();
      list = list.filter(u => (u.email || '').toLowerCase().includes(q) || (u.full_name || '').toLowerCase().includes(q));
    }
    return list;
  }

  function render() {
    const list = filtered();
    if (!list.length) {
      $('body').innerHTML = '<tr><td colspan="7" class="empty"><i class="fas fa-user-slash"></i>No users match</td></tr>';
      return;
    }
    $('body').innerHTML = list.map(u => {
      const initial = ((u.full_name || u.email || '?').trim()[0] || '?').toUpperCase();
      const roleIcon = u.role === 'admin' ? 'shield-halved' : u.role === 'faculty' ? 'chalkboard-user' : 'graduation-cap';
      const susp = u.is_active === false;
      return `
        <tr>
          <td>
            <div style="display:flex;align-items:center;gap:10px">
              <span class="avatar-sm">${escapeHtml(initial)}</span>
              <div style="min-width:0">
                <div style="color:var(--text);font-weight:500">${escapeHtml(u.full_name || u.email)}</div>
                <div style="font-size:11px;color:var(--text-muted)">${escapeHtml(u.email)}</div>
              </div>
            </div>
          </td>
          <td><span class="badge badge-${u.role}"><i class="fas fa-${roleIcon}"></i>${u.role}</span></td>
          <td class="mono dim" style="font-size:11px">${escapeHtml(u.section_id || '—')}</td>
          <td class="dim">${escapeHtml(u.department || '—')}</td>
          <td>${susp ? '<span class="badge badge-rejected"><i class="fas fa-ban"></i>suspended</span>' : '<span class="badge badge-approved"><i class="fas fa-check"></i>active</span>'}</td>
          <td class="dim" style="font-size:11px">${formatRelativeTime(u.last_active_at) || '—'}</td>
          <td style="text-align:right;white-space:nowrap">
            <button class="btn btn-sm" data-edit="${u.id}" title="Edit"><i class="fas fa-pen"></i></button>
            <button class="btn btn-sm ${susp ? 'btn-success' : 'btn-danger'}" data-toggle="${u.id}" data-active="${u.is_active !== false}" title="${susp ? 'Activate' : 'Suspend'}"><i class="fas fa-${susp ? 'play' : 'ban'}"></i></button>
            <button class="btn btn-sm" data-reset="${u.id}" title="Send password reset"><i class="fas fa-key"></i></button>
          </td>
        </tr>`;
    }).join('');

    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEdit(b.dataset.edit));
    document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => toggle(b.dataset.toggle, b.dataset.active === 'true'));
    document.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => resetPwd(b.dataset.reset));
  }

  async function openEdit(id) {
    const u = users.find(x => x.id === id);
    if (!u) return;
    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog';
    dialog.innerHTML = `
      <div class="modal-content">
        <div class="modal-header">
          <div><div class="modal-title">Edit ${escapeHtml(u.email)}</div></div>
          <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
        </div>
        <div class="modal-body">
          <label class="field"><span>Full name</span><input class="input" data-field="full_name" value="${escapeHtml(u.full_name || '')}"></label>
          <label class="field"><span>Department</span><input class="input" data-field="department" value="${escapeHtml(u.department || '')}"></label>
          <label class="field"><span>Phone</span><input class="input" data-field="phone" value="${escapeHtml(u.phone || '')}"></label>
          <label class="field"><span>Role</span>
            <select class="input" data-field="role">
              <option value="student" ${u.role === 'student' ? 'selected' : ''}>student</option>
              <option value="faculty" ${u.role === 'faculty' ? 'selected' : ''}>faculty</option>
              <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>admin</option>
            </select>
          </label>
          <label class="field"><span>Section (for students)</span>
            <select class="input" data-field="section_id">
              <option value="">— none —</option>
              ${sections.map(s => `<option value="${escapeHtml(s.section_id)}" ${u.section_id === s.section_id ? 'selected' : ''}>${escapeHtml(s.name || s.section_id)}</option>`).join('')}
            </select>
          </label>
        </div>
        <div class="modal-footer">
          <button class="btn" data-close>Cancel</button>
          <button class="btn btn-primary" data-save>Save</button>
        </div>
      </div>`;
    document.body.appendChild(dialog);
    dialog.showModal();

    dialog.querySelector('[data-save]').onclick = async () => {
      const get = f => dialog.querySelector(`[data-field="${f}"]`).value.trim();
      const patch = {
        full_name: get('full_name') || null,
        department: get('department') || null,
        phone: get('phone') || null,
        role: get('role'),
        section_id: get('section_id') || null,
      };
      if (id === auth.profile.id && patch.role !== 'admin') return toast('You cannot demote yourself', 'error');
      const { error } = await supabase.from('profiles').update(patch).eq('id', id);
      if (error) return toast(error.message, 'error');
      toast('User updated', 'success');
      dialog.close(); dialog.remove();
      await load();
    };

    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  async function toggle(id, currentlyActive) {
    if (id === auth.profile.id) return toast('You cannot suspend yourself', 'error');
    const { error } = await supabase.from('profiles').update({
      is_active: !currentlyActive,
      suspended_at: currentlyActive ? new Date().toISOString() : null,
      suspended_reason: currentlyActive ? 'Suspended by admin' : null,
    }).eq('id', id);
    if (error) return toast(error.message, 'error');
    toast(currentlyActive ? 'Suspended' : 'Reactivated', 'success');
    await load();
  }

  async function resetPwd(id) {
    const u = users.find(x => x.id === id);
    if (!u) return;
    const { error } = await supabase.auth.resetPasswordForEmail(u.email, { redirectTo: `${location.origin}/reset-password.html` });
    if (error) return toast(error.message, 'error');
    toast('Reset email sent', 'success');
  }

  document.querySelectorAll('[data-filter]').forEach(btn => {
    btn.onclick = () => {
      filter = btn.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach(b => b.classList.toggle('on', b === btn));
      render();
    };
  });
  $('searchInput').oninput = (e) => { search = e.target.value.trim(); render(); };

  await load();
})();
</script>
</body>
</html>
