<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-header">
    <div><h1 class="page-title"><i class="fas fa-users"></i> Users</h1><p class="page-subtitle">Manage roles, sections, and access for all accounts.</p></div>
  </div>
  <div class="admin-tabs">
    <a href="admin-faculty.html" class="admin-tab"><i class="fas fa-chalkboard-user"></i> Faculty</a>
    <a href="admin-batches.html" class="admin-tab"><i class="fas fa-users-rectangle"></i> Batches</a>
    <a href="admin-courses.html" class="admin-tab"><i class="fas fa-book"></i> Courses</a>
    <a href="admin-timetable.html" class="admin-tab"><i class="fas fa-table"></i> Timetable</a>
    <a href="admin-bookings.html" class="admin-tab"><i class="fas fa-calendar-check"></i> Bookings</a>
    <a href="admin-rooms.html" class="admin-tab"><i class="fas fa-door-open"></i> Rooms</a>
    <a href="admin-buildings.html" class="admin-tab"><i class="fas fa-building"></i> Buildings</a>
    <a href="admin-slots.html" class="admin-tab"><i class="fas fa-clock"></i> Time slots</a>
    <a href="admin-calendar.html" class="admin-tab"><i class="fas fa-calendar-days"></i> Calendar</a>
    <a href="admin-users.html" class="admin-tab active"><i class="fas fa-users"></i> Users</a>
  </div>
  <div class="stats" id="stats"></div>
  <div class="row" style="margin-bottom:16px">
    <div class="chips" id="filters">
      <button class="chip on" data-f="all">All</button>
      <button class="chip" data-f="admin">Admins</button>
      <button class="chip" data-f="faculty">Faculty</button>
      <button class="chip" data-f="student">Students</button>
      <button class="chip" data-f="suspended">Suspended</button>
    </div>
    <div class="search-wrap" style="margin-left:auto;max-width:360px"><i class="fas fa-search search-icon"></i><input class="input" id="search" placeholder="Search name or email…"></div>
  </div>
  <div class="table-wrap"><table><thead><tr><th>User</th><th>Role</th><th>Section</th><th>Department</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead><tbody id="body"></tbody></table></div>
</div>
<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, toast } from './js/core.js';
(async () => {
  const auth = await requireRole(['admin']); if (!auth) return;
  renderNav(auth.profile);
  const $ = id => document.getElementById(id);
  let users = [], sections = [], filter = 'all', search = '';

  async function load() {
    const [{ data: u }, { data: s }] = await Promise.all([
      supabase.from('profiles').select('*').order('created_at', { ascending: false }),
      supabase.from('sections').select('*').order('section_id'),
    ]);
    users = u ?? []; sections = s ?? [];
    renderStats(); render();
  }

  function renderStats() {
    const admins = users.filter(u => u.role === 'admin').length;
    const fac = users.filter(u => u.role === 'faculty').length;
    const stu = users.filter(u => u.role === 'student').length;
    const susp = users.filter(u => u.is_active === false).length;
    $('stats').innerHTML = `<div class="stat"><i class="fas fa-users stat-icon"></i><div class="stat-value">${users.length}</div><div class="stat-label">Total</div></div><div class="stat"><i class="fas fa-shield-halved stat-icon"></i><div class="stat-value">${admins}</div><div class="stat-label">Admins</div></div><div class="stat"><i class="fas fa-chalkboard-user stat-icon"></i><div class="stat-value">${fac}</div><div class="stat-label">Faculty</div></div><div class="stat"><i class="fas fa-graduation-cap stat-icon"></i><div class="stat-value">${stu}</div><div class="stat-label">Students</div></div><div class="stat"><i class="fas fa-ban stat-icon"></i><div class="stat-value">${susp}</div><div class="stat-label">Suspended</div></div>`;
  }

  function render() {
    let list = users;
    if (filter === 'admin' || filter === 'faculty' || filter === 'student') list = list.filter(u => u.role === filter);
    else if (filter === 'suspended') list = list.filter(u => u.is_active === false);
    if (search) { const q = search.toLowerCase(); list = list.filter(u => (u.email || '').toLowerCase().includes(q) || (u.full_name || '').toLowerCase().includes(q)); }
    if (!list.length) { $('body').innerHTML = '<tr><td colspan="6" class="empty"><i class="fas fa-user-slash"></i>No users match</td></tr>'; return; }
    $('body').innerHTML = list.map(u => {
      const init = ((u.full_name || u.email || '?').trim()[0] || '?').toUpperCase();
      const roleIcon = u.role === 'admin' ? 'shield-halved' : u.role === 'faculty' ? 'chalkboard-user' : 'graduation-cap';
      const susp = u.is_active === false;
      return `<tr>
        <td><div style="display:flex;align-items:center;gap:10px"><span class="avatar-sm">${escapeHtml(init)}</span><div><div style="color:var(--text);font-weight:500">${escapeHtml(u.full_name || u.email)}</div><div style="font-size:11px;color:var(--text-muted)">${escapeHtml(u.email)}</div></div></div></td>
        <td><span class="badge badge-${u.role}"><i class="fas fa-${roleIcon}"></i>${u.role}</span></td>
        <td class="mono" style="font-size:11px">${escapeHtml(u.section_id || '—')}</td>
        <td class="dim">${escapeHtml(u.department || '—')}</td>
        <td>${susp ? '<span class="badge badge-rejected">suspended</span>' : '<span class="badge badge-approved">active</span>'}</td>
        <td style="text-align:right;white-space:nowrap"><button class="btn btn-sm" data-edit="${u.id}"><i class="fas fa-pen"></i></button><button class="btn btn-sm ${susp ? 'btn-success' : 'btn-danger'}" data-toggle="${u.id}" data-active="${!susp}"><i class="fas fa-${susp ? 'play' : 'ban'}"></i></button></td>
      </tr>`;
    }).join('');
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => edit(b.dataset.edit));
    document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => toggle(b.dataset.toggle, b.dataset.active === 'true'));
  }

  function edit(id) {
    const u = users.find(x => x.id === id); if (!u) return;
    const dialog = document.createElement('dialog'); dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content"><div class="modal-header"><div class="modal-title">Edit ${escapeHtml(u.email)}</div><button class="modal-close" data-close><i class="fas fa-xmark"></i></button></div><div class="modal-body"><label class="field"><span>Full name</span><input class="input" data-field="full_name" value="${escapeHtml(u.full_name || '')}"></label><label class="field"><span>Department</span><input class="input" data-field="department" value="${escapeHtml(u.department || '')}"></label><label class="field"><span>Phone</span><input class="input" data-field="phone" value="${escapeHtml(u.phone || '')}"></label><label class="field"><span>Role</span><select class="input" data-field="role"><option value="student" ${u.role === 'student' ? 'selected' : ''}>student</option><option value="faculty" ${u.role === 'faculty' ? 'selected' : ''}>faculty</option><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>admin</option></select></label><label class="field"><span>Batch / Section</span><select class="input" data-field="section_id"><option value="">— none —</option>${sections.map(s => `<option value="${escapeHtml(s.section_id)}" ${u.section_id === s.section_id ? 'selected' : ''}>${escapeHtml(s.section_id)} — ${escapeHtml(s.name)}</option>`).join('')}</select></label></div><div class="modal-footer"><button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-save>Save</button></div></div>`;
    document.body.appendChild(dialog); dialog.showModal();
    dialog.querySelector('[data-save]').onclick = async () => {
      const get = f => dialog.querySelector(`[data-field="${f}"]`).value.trim();
      if (id === auth.profile.id && get('role') !== 'admin') return toast('You cannot demote yourself', 'error');
      const { error } = await supabase.from('profiles').update({ full_name: get('full_name') || null, department: get('department') || null, phone: get('phone') || null, role: get('role'), section_id: get('section_id') || null }).eq('id', id);
      if (error) return toast(error.message, 'error');
      toast('Saved', 'success'); dialog.close(); dialog.remove(); await load();
    };
    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  async function toggle(id, active) {
    if (id === auth.profile.id) return toast('You cannot suspend yourself', 'error');
    const { error } = await supabase.from('profiles').update({ is_active: !active, suspended_at: active ? new Date().toISOString() : null, suspended_reason: active ? 'Suspended by admin' : null }).eq('id', id);
    if (error) return toast(error.message, 'error');
    toast(active ? 'Suspended' : 'Reactivated', 'success'); await load();
  }

  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; document.querySelectorAll('[data-f]').forEach(x => x.classList.toggle('on', x === b)); render(); });
  $('search').oninput = e => { search = e.target.value.trim(); render(); };
  await load();
})();
</script>
</body>
</html>
