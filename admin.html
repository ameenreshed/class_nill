<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<meta name="theme-color" content="#EA580C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-gauge-high"></i> Admin dashboard</h1>
      <p class="page-subtitle">
        Welcome back, <strong id="welcomeName" style="color:var(--text)">…</strong>
        · <span id="lastUpdated">just now</span>
      </p>
    </div>
    <button class="btn btn-primary" id="refreshBtn"><i class="fas fa-rotate-right"></i> Refresh</button>
  </div>

  <div class="stats" id="stats">
    <div class="stat"><div class="skeleton" style="height:32px;width:40%;margin-bottom:12px"></div><div class="skeleton" style="height:12px;width:60%"></div></div>
    <div class="stat"><div class="skeleton" style="height:32px;width:40%;margin-bottom:12px"></div><div class="skeleton" style="height:12px;width:60%"></div></div>
    <div class="stat"><div class="skeleton" style="height:32px;width:40%;margin-bottom:12px"></div><div class="skeleton" style="height:12px;width:60%"></div></div>
    <div class="stat"><div class="skeleton" style="height:32px;width:40%;margin-bottom:12px"></div><div class="skeleton" style="height:12px;width:60%"></div></div>
  </div>

  <div class="grid-auto mt-6" style="grid-template-columns:1fr">
    <div class="card">
      <div class="card-title"><i class="fas fa-clock-rotate-left"></i> Recent activity</div>
      <div class="timeline" id="timeline">
        <div class="empty" style="padding:20px"><i class="fas fa-spinner fa-spin"></i></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, todayISO, formatRelativeTime } from './js/core.js';

(async () => {
  const auth = await requireRole(['admin']);
  if (!auth) return;
  renderNav(auth.profile);

  const $ = id => document.getElementById(id);
  const displayName = auth.profile.full_name || auth.profile.email || 'Admin';
  $('welcomeName').textContent = displayName;

  async function load() {
    const today = todayISO();

    const [rooms, users, pending, todayBookings] = await Promise.all([
      supabase.from('rooms').select('room_id', { count: 'exact', head: true }),
      supabase.from('profiles').select('id', { count: 'exact', head: true }),
      supabase.from('bookings').select('id', { count: 'exact', head: true }).eq('status', 'pending'),
      supabase.from('bookings').select('id', { count: 'exact', head: true }).eq('book_date', today),
    ]);

    $('stats').innerHTML = `
      <div class="stat">
        <i class="fas fa-door-open stat-icon"></i>
        <div class="stat-value">${rooms.count ?? 0}</div>
        <div class="stat-label">Total rooms</div>
      </div>
      <div class="stat">
        <i class="fas fa-users stat-icon"></i>
        <div class="stat-value">${users.count ?? 0}</div>
        <div class="stat-label">Total users</div>
      </div>
      <div class="stat">
        <i class="fas fa-hourglass-half stat-icon" style="color:var(--warning)"></i>
        <div class="stat-value" style="color:var(--warning)">${pending.count ?? 0}</div>
        <div class="stat-label">Pending bookings</div>
      </div>
      <div class="stat">
        <i class="fas fa-calendar-day stat-icon" style="color:var(--success)"></i>
        <div class="stat-value" style="color:var(--success)">${todayBookings.count ?? 0}</div>
        <div class="stat-label">Today's bookings</div>
      </div>
    `;

    const { data: logs } = await supabase
      .from('activity_log')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(8);

    if (!logs?.length) {
      $('timeline').innerHTML = `
        <div class="empty" style="padding:32px 16px">
          <i class="fas fa-inbox"></i>
          No activity yet
        </div>`;
    } else {
      $('timeline').innerHTML = logs.map(l => {
        const icon =
          l.action === 'auth.login' ? 'fa-right-to-bracket' :
          l.action?.startsWith('user.') ? 'fa-user-pen' :
          l.action?.startsWith('room.') ? 'fa-door-open' :
          l.action?.startsWith('booking.') ? 'fa-calendar-check' : 'fa-circle';
        const email = l.user_email || 'system';
        return `
          <div class="timeline-item">
            <div class="timeline-marker"><i class="fas ${icon}"></i></div>
            <div class="timeline-content">
              <div class="timeline-title">
                ${escapeHtml(l.action)}
                ${l.entity_id ? `<span class="mono" style="color:var(--text-muted);margin-left:4px">${escapeHtml(l.entity_id)}</span>` : ''}
              </div>
              <div class="timeline-meta">${escapeHtml(email)} · ${formatRelativeTime(l.created_at)}</div>
            </div>
          </div>`;
      }).join('');
    }

    $('lastUpdated').textContent = 'updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  $('refreshBtn').onclick = async () => {
    const btn = $('refreshBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Refreshing…';
    await load();
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-rotate-right"></i> Refresh';
  };

  await load();
  setInterval(() => { if (!document.hidden) load(); }, 60_000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
