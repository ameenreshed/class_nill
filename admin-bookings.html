<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookings · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-header">
    <div><h1 class="page-title"><i class="fas fa-calendar-check"></i> Bookings</h1><p class="page-subtitle">Approve or reject makeup requests from all batches.</p></div>
    <button class="btn" id="refreshBtn"><i class="fas fa-rotate-right"></i> Refresh</button>
  </div>
  <div class="admin-tabs">
    <a href="admin-faculty.html" class="admin-tab"><i class="fas fa-chalkboard-user"></i> Faculty</a>
    <a href="admin-batches.html" class="admin-tab"><i class="fas fa-users-rectangle"></i> Batches</a>
    <a href="admin-courses.html" class="admin-tab"><i class="fas fa-book"></i> Courses</a>
    <a href="admin-timetable.html" class="admin-tab"><i class="fas fa-table"></i> Timetable</a>
    <a href="admin-bookings.html" class="admin-tab active"><i class="fas fa-calendar-check"></i> Bookings</a>
    <a href="admin-rooms.html" class="admin-tab"><i class="fas fa-door-open"></i> Rooms</a>
    <a href="admin-buildings.html" class="admin-tab"><i class="fas fa-building"></i> Buildings</a>
    <a href="admin-slots.html" class="admin-tab"><i class="fas fa-clock"></i> Time slots</a>
    <a href="admin-calendar.html" class="admin-tab"><i class="fas fa-calendar-days"></i> Calendar</a>
    <a href="admin-users.html" class="admin-tab"><i class="fas fa-users"></i> Users</a>
  </div>
  <div class="row" style="margin-bottom:16px">
    <div class="chips" id="filters">
      <button class="chip on" data-f="pending">Pending</button>
      <button class="chip" data-f="approved">Approved</button>
      <button class="chip" data-f="rejected">Rejected</button>
      <button class="chip" data-f="all">All</button>
    </div>
    <div class="search-wrap" style="margin-left:auto;max-width:360px"><i class="fas fa-search search-icon"></i><input class="input" id="search" placeholder="Search…"></div>
  </div>
  <div class="table-wrap"><table><thead><tr><th>Room · Slot</th><th>Batch · Course</th><th>Faculty</th><th>Date</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead><tbody id="body"></tbody></table></div>
</div>
<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, toast, humanDate } from './js/core.js';
(async () => {
  const auth = await requireRole(['admin']); if (!auth) return;
  renderNav(auth.profile);
  const $ = id => document.getElementById(id);
  let bookings = [], rooms = [], slots = [], users = [], filter = 'pending', search = '';

  async function load() {
    const [{ data: b }, { data: r }, { data: s }, { data: u }] = await Promise.all([
      supabase.from('bookings').select('*').order('book_date', { ascending: false }).limit(300),
      supabase.from('rooms').select('room_id,display_name'),
      supabase.from('time_slots').select('*'),
      supabase.from('profiles').select('id,full_name,email'),
    ]);
    bookings = b ?? []; rooms = r ?? []; slots = s ?? []; users = u ?? [];
    render();
  }

  function render() {
    let list = bookings;
    if (filter !== 'all') list = list.filter(b => b.status === filter);
    if (search) { const q = search.toLowerCase(); list = list.filter(b => { const r = rooms.find(x => x.room_id === b.room_id); const f = users.find(x => x.id === b.faculty_id); return (r?.display_name || '').toLowerCase().includes(q) || (b.section_id || '').toLowerCase().includes(q) || (b.course_code || '').toLowerCase().includes(q) || (f?.full_name || '').toLowerCase().includes(q); }); }
    const roomMap = new Map(rooms.map(r => [r.room_id, r.display_name]));
    const slotMap = new Map(slots.map(s => [s.slot_id, s]));
    const userMap = new Map(users.map(u => [u.id, u]));
    if (!list.length) { $('body').innerHTML = '<tr><td colspan="6" class="empty"><i class="fas fa-inbox"></i>No bookings match</td></tr>'; return; }
    $('body').innerHTML = list.map(b => {
      const slot = slotMap.get(b.slot_id);
      const fac = userMap.get(b.faculty_id);
      const badge = b.status === 'approved' ? 'approved' : b.status === 'rejected' ? 'rejected' : 'pending';
      const icon = b.status === 'approved' ? 'check' : b.status === 'rejected' ? 'xmark' : 'clock';
      return `<tr>
        <td><div class="mono" style="font-weight:500;color:var(--text)">${escapeHtml(roomMap.get(b.room_id) || b.room_id)}</div><div style="font-size:11px;color:var(--text-muted)">${escapeHtml(slot?.label || b.slot_id)} · ${slot?.start_time.slice(0,5)}–${slot?.end_time.slice(0,5)}</div></td>
        <td><div style="font-size:13px;font-weight:500">${escapeHtml(b.section_id || '—')}</div><div style="font-size:11px;color:var(--text-muted)">${escapeHtml(b.course_code || b.type)}</div></td>
        <td class="dim" style="font-size:12px">${escapeHtml(fac?.full_name || fac?.email || '—')}</td>
        <td style="font-weight:500">${humanDate(b.book_date)}</td>
        <td><span class="badge badge-${badge}"><i class="fas fa-${icon}"></i>${b.status}</span></td>
        <td style="text-align:right;white-space:nowrap">
          ${b.status === 'pending' ? `<button class="btn btn-sm btn-success" data-a="${b.id}"><i class="fas fa-check"></i></button><button class="btn btn-sm btn-danger" data-r="${b.id}"><i class="fas fa-xmark"></i></button>` : ''}
        </td>
      </tr>`;
    }).join('');
    document.querySelectorAll('[data-a]').forEach(x => x.onclick = () => action(x.dataset.a, 'approved'));
    document.querySelectorAll('[data-r]').forEach(x => x.onclick = () => action(x.dataset.r, 'rejected'));
  }

  async function action(id, status) {
    const { error } = await supabase.from('bookings').update({ status, approved_by: auth.session.user.id }).eq('id', id);
    if (error) return toast(error.message, 'error');
    toast(`Booking ${status}`, 'success'); await load();
  }

  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; document.querySelectorAll('[data-f]').forEach(x => x.classList.toggle('on', x === b)); render(); });
  $('search').oninput = e => { search = e.target.value.trim(); render(); };
  $('refreshBtn').onclick = load;
  await load();
})();
</script>
</body>
</html>
