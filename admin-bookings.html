<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookings · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-header">
    <div><h1 class="page-title"><i class="fas fa-calendar-check"></i> Bookings</h1><p class="page-subtitle">Approve or reject bookings from faculty.</p></div>
    <div class="row">
      <button class="btn" id="blockBtn"><i class="fas fa-lock"></i> Block room</button>
      <button class="btn" id="refreshBtn"><i class="fas fa-rotate-right"></i> Refresh</button>
    </div>
  </div>
  <div class="admin-tabs">
    <a href="admin-faculty.html" class="admin-tab"><i class="fas fa-chalkboard-user"></i> Faculty</a>
    <a href="admin-timetable.html" class="admin-tab"><i class="fas fa-table"></i> Timetable</a>
    <a href="admin-bookings.html" class="admin-tab active"><i class="fas fa-calendar-check"></i> Bookings</a>
    <a href="admin-rooms.html" class="admin-tab"><i class="fas fa-door-open"></i> Rooms</a>
    <a href="admin-buildings.html" class="admin-tab"><i class="fas fa-building"></i> Buildings</a>
    <a href="admin-slots.html" class="admin-tab"><i class="fas fa-clock"></i> Time slots</a>
    <a href="admin-calendar.html" class="admin-tab"><i class="fas fa-calendar-days"></i> Calendar</a>
    <a href="admin-users.html" class="admin-tab"><i class="fas fa-users"></i> Users</a>
    <a href="admin-settings.html" class="admin-tab"><i class="fas fa-gear"></i> Settings</a>
  </div>
  <div class="row" style="margin-bottom:16px;gap:12px">
    <div class="chips" id="statusFilters">
      <button class="chip on" data-f="pending">Pending</button>
      <button class="chip" data-f="approved">Approved</button>
      <button class="chip" data-f="rejected">Rejected</button>
      <button class="chip" data-f="cancelled">Cancelled</button>
      <button class="chip" data-f="all">All</button>
    </div>
    <select class="input" id="typeFilter" style="max-width:180px">
      <option value="">All types</option>
      <option value="makeup">Makeup</option>
      <option value="exam">Exam</option>
      <option value="event">Event</option>
      <option value="maintenance">Maintenance</option>
    </select>
    <div class="search-wrap" style="margin-left:auto;max-width:340px"><i class="fas fa-search search-icon"></i><input class="input" id="search" placeholder="Search…"></div>
  </div>
  <div class="table-wrap"><table><thead><tr>
    <th>Room · Slot</th><th>Type</th><th>Faculty</th><th>Date</th><th>Status</th><th style="text-align:right">Actions</th>
  </tr></thead><tbody id="body"></tbody></table></div>
</div>
<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, toast, humanDate, todayISO, loadBaseData } from './js/core.js';
(async () => {
  const auth = await requireRole(['admin']); if (!auth) return;
  renderNav(auth.profile);
  const $ = id => document.getElementById(id);
  let bookings = [], rooms = [], slots = [], users = [], statusFilter = 'pending', typeFilter = '', search = '';
  let base = { rooms: [], slots: [] };

  async function load() {
    base = await loadBaseData();
    const [{ data: b }, { data: r }, { data: s }, { data: u }] = await Promise.all([
      supabase.from('bookings').select('*').order('book_date', { ascending: false }).limit(300),
      supabase.from('rooms').select('room_id,display_name'),
      supabase.from('time_slots').select('*'),
      supabase.from('profiles').select('id,full_name,email'),
    ]);
    bookings = b ?? []; rooms = r ?? []; slots = s ?? []; users = u ?? [];
    render();
  }

  function render() {
    let list = bookings;
    if (statusFilter !== 'all') list = list.filter(b => b.status === statusFilter);
    if (typeFilter) list = list.filter(b => b.type === typeFilter);
    if (search) {
      const q = search.toLowerCase();
      list = list.filter(b => {
        const r = rooms.find(x => x.room_id === b.room_id);
        const f = users.find(x => x.id === b.faculty_id);
        return (r?.display_name || '').toLowerCase().includes(q)
          || (b.course_code || '').toLowerCase().includes(q)
          || (f?.full_name || '').toLowerCase().includes(q);
      });
    }
    const roomMap = new Map(rooms.map(r => [r.room_id, r.display_name]));
    const slotMap = new Map(slots.map(s => [s.slot_id, s]));
    const userMap = new Map(users.map(u => [u.id, u]));

    if (!list.length) {
      $('body').innerHTML = '<tr><td colspan="6" class="empty"><i class="fas fa-inbox"></i>No bookings match</td></tr>';
      return;
    }

    const typeBadge = { makeup:'pending', exam:'rejected', event:'admin', maintenance:'gray', regular:'faculty' };
    const statusBadge = { approved:'approved', rejected:'rejected', cancelled:'gray', pending:'pending' };
    const statusIcon = { approved:'check', rejected:'xmark', cancelled:'ban', pending:'clock' };

    $('body').innerHTML = list.map(b => {
      const slot = slotMap.get(b.slot_id);
      const fac = userMap.get(b.faculty_id);
      return `<tr>
        <td><div class="mono" style="font-weight:500;color:var(--text)">${escapeHtml(roomMap.get(b.room_id) || b.room_id)}</div>
          <div style="font-size:11px;color:var(--text-muted)">${escapeHtml(slot?.label || b.slot_id)} · ${slot?.start_time.slice(0,5)}–${slot?.end_time.slice(0,5)}</div></td>
        <td><span class="badge badge-${typeBadge[b.type] || 'gray'}">${escapeHtml(b.type || '—')}</span>
          ${b.course_code ? `<div style="font-size:11px;color:var(--text-muted);margin-top:3px">${escapeHtml(b.course_code)}</div>` : ''}</td>
        <td class="dim" style="font-size:12px">${escapeHtml(fac?.full_name || fac?.email || '—')}</td>
        <td style="font-weight:500">${humanDate(b.book_date)}</td>
        <td><span class="badge badge-${statusBadge[b.status] || 'gray'}"><i class="fas fa-${statusIcon[b.status] || 'circle'}"></i>${b.status}</span></td>
        <td style="text-align:right;white-space:nowrap">
          ${b.status === 'pending' ? `
            <button class="btn btn-sm btn-success" data-a="${b.id}" title="Approve"><i class="fas fa-check"></i></button>
            <button class="btn btn-sm btn-danger" data-r="${b.id}" title="Reject"><i class="fas fa-xmark"></i></button>
          ` : ''}
          ${b.reason ? `<button class="btn btn-sm" data-v="${b.id}" title="View reason"><i class="fas fa-eye"></i></button>` : ''}
        </td>
      </tr>`;
    }).join('');

    document.querySelectorAll('[data-a]').forEach(x => x.onclick = () => action(x.dataset.a, 'approved'));
    document.querySelectorAll('[data-r]').forEach(x => x.onclick = () => action(x.dataset.r, 'rejected'));
    document.querySelectorAll('[data-v]').forEach(x => x.onclick = () => {
      const b = bookings.find(v => v.id === x.dataset.v);
      if (b?.reason) alert(`Reason: ${b.reason}`);
    });
  }

  async function action(id, status) {
    const { error } = await supabase.from('bookings').update({ status, approved_by: auth.session.user.id }).eq('id', id);
    if (error) return toast(error.message, 'error');
    toast(`Booking ${status}`, 'success'); await load();
  }

  $('blockBtn').onclick = () => {
    if (!base.rooms.length || !base.slots.length) return toast('Rooms and slots not configured', 'error');
    const slotOpts = base.slots.map(s => `<option value="${escapeHtml(s.slot_id)}">${escapeHtml(s.label || s.slot_id)} (${s.start_time.slice(0,5)}–${s.end_time.slice(0,5)})</option>`).join('');
    const roomOpts = base.rooms.map(r => `<option value="${escapeHtml(r.room_id)}">${escapeHtml(r.display_name)}</option>`).join('');
    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content">
      <div class="modal-header">
        <div>
          <div class="modal-title">Block room for maintenance</div>
          <div class="modal-sub">Room will show as Maint on the grid — nobody can book it.</div>
        </div>
        <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <label class="field"><span>Room *</span><select class="input" id="blRoom">${roomOpts}</select></label>
        <label class="field"><span>Date *</span><input class="input" type="date" id="blDate" value="${todayISO()}" min="${todayISO()}"></label>
        <label class="field"><span>Period *</span><select class="input" id="blSlot">${slotOpts}</select></label>
        <label class="field"><span>Reason</span><input class="input" id="blReason" placeholder="e.g. AC replacement, deep clean"></label>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close>Cancel</button>
        <button class="btn btn-primary" id="blSubmit"><i class="fas fa-check"></i> Block</button>
      </div>
    </div>`;
    document.body.appendChild(dialog); dialog.showModal();
    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
    dialog.querySelector('#blSubmit').onclick = async () => {
      const room = dialog.querySelector('#blRoom').value;
      const date = dialog.querySelector('#blDate').value;
      const slot = dialog.querySelector('#blSlot').value;
      const reason = dialog.querySelector('#blReason').value.trim();
      if (!room || !date || !slot) return toast('Fill all fields', 'error');
      const btn = dialog.querySelector('#blSubmit');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      const { error } = await supabase.from('bookings').insert({
        room_id: room, book_date: date, slot_id: slot,
        type: 'maintenance', status: 'approved',
        created_by: auth.session.user.id, reason: reason || 'Maintenance block',
      });
      btn.disabled = false;
      if (error) { toast(error.message, 'error'); btn.innerHTML = '<i class="fas fa-check"></i> Block'; return; }
      toast('Room blocked', 'success'); close(); await load();
    };
  };

  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
    statusFilter = b.dataset.f;
    document.querySelectorAll('[data-f]').forEach(x => x.classList.toggle('on', x === b));
    render();
  });
  $('typeFilter').onchange = e => { typeFilter = e.target.value; render(); };
  $('search').oninput = e => { search = e.target.value.trim(); render(); };
  $('refreshBtn').onclick = load;
  await load();
})();
</script>
</body>
</html>
