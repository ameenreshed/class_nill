<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LPU Scheduler">
<title>Assignments · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mobile-app.css">
<style>
  .asn-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .asn-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;transition:all 160ms ease;cursor:pointer;display:flex;flex-direction:column;gap:10px}
  .asn-card:hover{border-color:var(--brand);box-shadow:var(--shadow-md);transform:translateY(-2px)}
  .asn-title{font-size:15px;font-weight:600;color:var(--text);line-height:1.35}
  .asn-meta{font-size:12px;color:var(--text-secondary);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .asn-meta .badge{font-size:10px}
  .asn-actions{display:flex;gap:6px;margin-top:auto;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap}
  .asn-actions .btn{flex:1;min-width:0;font-size:12px;padding:7px 10px;min-height:32px}
  .link-box{display:flex;gap:8px;align-items:center;background:var(--bg-subtle);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:6px}
  .link-box input{flex:1;border:none;background:transparent;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);min-width:0;padding:0}
  .link-box input:focus{outline:none}
  .link-box .btn{flex-shrink:0;min-height:30px;padding:5px 10px;font-size:11.5px}
  .sub-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  .sub-table th,.sub-table td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left}
  .sub-table th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:600;background:var(--bg-subtle)}
  .sub-table td .mono{font-size:12px}
  .sub-table tr:last-child td{border-bottom:none}
  .deadline-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:600}
  .deadline-pill.ok{background:var(--success-soft);color:var(--success-text)}
  .deadline-pill.warn{background:var(--warning-soft);color:var(--warning-text)}
  .deadline-pill.expired{background:var(--danger-soft);color:var(--danger-text)}
  .deadline-pill.none{background:var(--surface-active);color:var(--text-muted)}
  @media (max-width:640px){
    .asn-grid{grid-template-columns:1fr}
    .sub-table th,.sub-table td{padding:8px 8px;font-size:12px}
  }
</style>
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-file-pen"></i> Assignments</h1>
      <p class="page-subtitle">Create assignment collections, share links, and manage submissions.</p>
    </div>
    <button class="btn btn-primary" id="createBtn"><i class="fas fa-plus"></i> New assignment</button>
  </div>

  <div class="asn-grid" id="list"></div>
</div>

<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, toast, BASE } from './js/core.js';

(async () => {
  const auth = await requireRole(['faculty','admin']); if (!auth) return;
  renderNav(auth.profile);
  const $ = id => document.getElementById(id);
  let assignments = [];
  let subCounts = {};

  async function load() {
    const { data: a, error: aErr } = await supabase.from('assignments')
      .select('*').order('created_at', { ascending: false });
    if (aErr) { toast(aErr.message, 'error'); return; }
    assignments = a ?? [];

    if (assignments.length) {
      const ids = assignments.map(x => x.id);
      const { data: s } = await supabase.from('submissions')
        .select('assignment_id').in('assignment_id', ids);
      subCounts = {};
      (s ?? []).forEach(x => {
        subCounts[x.assignment_id] = (subCounts[x.assignment_id] || 0) + 1;
      });
    } else subCounts = {};

    render();
  }

  function deadlinePill(d) {
    if (!d) return `<span class="deadline-pill none"><i class="fas fa-infinity"></i> No deadline</span>`;
    const diff = new Date(d).getTime() - Date.now();
    const days = Math.ceil(diff / 86400000);
    if (diff < 0) return `<span class="deadline-pill expired"><i class="fas fa-circle-xmark"></i> Closed ${new Date(d).toLocaleDateString()}</span>`;
    if (days <= 1) return `<span class="deadline-pill warn"><i class="fas fa-clock"></i> Due ${new Date(d).toLocaleString()}</span>`;
    return `<span class="deadline-pill ok"><i class="fas fa-check"></i> Due ${new Date(d).toLocaleDateString()}</span>`;
  }

  function render() {
    if (!assignments.length) {
      $('list').innerHTML = `<div class="card" style="grid-column:1/-1;text-align:center;padding:48px 24px">
        <i class="fas fa-file-pen" style="font-size:32px;color:var(--text-muted);opacity:.4;margin-bottom:12px;display:block"></i>
        <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px">No assignments yet</div>
        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px">Create your first assignment collection to start receiving submissions.</div>
        <button class="btn btn-primary" onclick="document.getElementById('createBtn').click()"><i class="fas fa-plus"></i> Create assignment</button>
      </div>`;
      return;
    }
    $('list').innerHTML = assignments.map(a => {
      const shareUrl = `${BASE}submit.html?token=${a.share_token}`;
      const cnt = subCounts[a.id] || 0;
      return `<div class="asn-card" data-id="${a.id}">
        <div class="asn-title">${escapeHtml(a.title)}</div>
        <div class="asn-meta">
          ${a.course_code ? `<span class="badge badge-admin">${escapeHtml(a.course_code)}</span>` : ''}
          <span class="badge badge-gray"><i class="fas fa-users"></i>${escapeHtml(a.batch)}</span>
          ${!a.is_active ? '<span class="badge badge-rejected"><i class="fas fa-ban"></i>Revoked</span>' : ''}
        </div>
        <div class="asn-meta">${deadlinePill(a.deadline)}</div>
        <div class="asn-meta" style="font-family:'JetBrains Mono',monospace;font-size:11.5px">
          <i class="fas fa-inbox"></i> ${cnt} submission${cnt===1?'':'s'} ·
          <i class="fas fa-cloud-arrow-up"></i> max ${a.max_size_mb} MB ·
          ${a.allowed_types.length} type${a.allowed_types.length===1?'':'s'}
        </div>
        <div class="link-box">
          <input readonly value="${escapeHtml(shareUrl)}" onclick="this.select()">
          <button class="btn btn-sm" data-copy="${escapeHtml(shareUrl)}" title="Copy share link"><i class="fas fa-copy"></i> Copy</button>
        </div>
        <div class="asn-actions">
          <button class="btn btn-sm" data-view="${a.id}"><i class="fas fa-list"></i> Submissions</button>
          <button class="btn btn-sm" data-edit="${a.id}"><i class="fas fa-pen"></i> Edit</button>
          <button class="btn btn-sm btn-danger" data-del="${a.id}"><i class="fas fa-trash"></i></button>
        </div>
      </div>`;
    }).join('');

    document.querySelectorAll('[data-copy]').forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      navigator.clipboard.writeText(b.dataset.copy).then(() => toast('Link copied', 'success'));
    });
    document.querySelectorAll('[data-view]').forEach(b => b.onclick = (e) => {
      e.stopPropagation(); viewSubmissions(b.dataset.view);
    });
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = (e) => {
      e.stopPropagation(); openForm(b.dataset.edit);
    });
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = (e) => {
      e.stopPropagation(); deleteAssignment(b.dataset.del);
    });
    document.querySelectorAll('.asn-card').forEach(c => c.onclick = () => viewSubmissions(c.dataset.id));
  }

  $('createBtn').onclick = () => openForm();

  function openForm(id) {
    const existing = id ? assignments.find(x => x.id === id) : null;
    const isEdit = !!existing;
    const a = existing || {
      title: '', description: '', course_code: '', batch: '',
      drive_link: '', deadline: '', allowed_types: ['pdf','docx','pptx','ppt','zip','txt'],
      max_size_mb: 25,
    };

    const dl = a.deadline ? new Date(a.deadline) : null;
    const dlLocal = dl ? new Date(dl.getTime() - dl.getTimezoneOffset()*60000).toISOString().slice(0,16) : '';

    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content modal-wide">
      <div class="modal-header">
        <div>
          <div class="modal-title"><i class="fas fa-file-pen"></i> ${isEdit?'Edit':'New'} assignment</div>
          <div class="modal-sub">Students will use the share link to upload their work.</div>
        </div>
        <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <label class="field"><span>Title *</span><input class="input" data-field="title" value="${escapeHtml(a.title)}" placeholder="e.g. Unit 3 — Data Structures Report"></label>
        <label class="field"><span>Description</span><textarea class="input" data-field="description" rows="3" placeholder="Instructions for students…">${escapeHtml(a.description || '')}</textarea></label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <label class="field" style="margin-bottom:0"><span>Batch *</span><input class="input" data-field="batch" value="${escapeHtml(a.batch)}" placeholder="e.g. CSE 2024 A"></label>
          <label class="field" style="margin-bottom:0"><span>Course code</span><input class="input" data-field="course_code" value="${escapeHtml(a.course_code || '')}" placeholder="CSE201"></label>
        </div>
        <label class="field" style="margin-top:14px"><span>Google Drive link (reference material)</span><input class="input" data-field="drive_link" value="${escapeHtml(a.drive_link || '')}" placeholder="https://drive.google.com/..."></label>
        <label class="field"><span>Deadline</span><input class="input" type="datetime-local" data-field="deadline" value="${dlLocal}"></label>
        <div class="field">
          <span>Allowed file types</span>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            ${['pdf','doc','docx','ppt','pptx','txt','zip','png','jpg'].map(t =>
              `<label style="display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:${a.allowed_types.includes(t)?'var(--brand-soft)':'var(--surface)'}">
                <input type="checkbox" data-type="${t}" ${a.allowed_types.includes(t)?'checked':''}>
                <span style="font-family:monospace;font-size:12px">.${t}</span>
              </label>`).join('')}
          </div>
        </div>
        <label class="field"><span>Max file size (MB)</span><input class="input" type="number" min="1" max="50" data-field="max_size_mb" value="${a.max_size_mb}"></label>
        ${isEdit ? `<label class="field" style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg-subtle);border-radius:10px">
          <input type="checkbox" data-field="is_active" ${a.is_active?'checked':''}>
          <span style="font-weight:500">Active (uncheck to revoke share link)</span>
        </label>` : ''}
        ${isEdit ? `<div style="margin-top:8px">
          <div class="label-small" style="margin-bottom:6px">Share link</div>
          <div class="link-box">
            <input readonly value="${escapeHtml(`${BASE}submit.html?token=${a.share_token}`)}" onclick="this.select()">
            <button class="btn btn-sm" type="button" data-copy-share="${escapeHtml(`${BASE}submit.html?token=${a.share_token}`)}"><i class="fas fa-copy"></i></button>
          </div>
        </div>` : ''}
      </div>
      <div class="modal-footer">
        <button class="btn" data-close>Cancel</button>
        <button class="btn btn-primary" data-save><i class="fas fa-check"></i> ${isEdit?'Save':'Create'}</button>
      </div>
    </div>`;

    document.body.appendChild(dialog); dialog.showModal();
    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };

    dialog.querySelectorAll('[data-type]').forEach(cb => {
      cb.onchange = () => {
        const label = cb.closest('label');
        if (label) label.style.background = cb.checked ? 'var(--brand-soft)' : 'var(--surface)';
      };
    });
    dialog.querySelectorAll('[data-copy-share]').forEach(b => {
      b.onclick = () => navigator.clipboard.writeText(b.dataset.copyShare).then(() => toast('Link copied', 'success'));
    });

    dialog.querySelector('[data-save]').onclick = async () => {
      const get = f => dialog.querySelector(`[data-field="${f}"]`);
      const title = get('title').value.trim();
      const batch = get('batch').value.trim();
      if (!title) return toast('Title required', 'error');
      if (!batch) return toast('Batch required', 'error');
      const types = [...dialog.querySelectorAll('[data-type]:checked')].map(x => x.dataset.type);
      if (!types.length) return toast('Select at least one file type', 'error');
      const maxSize = parseInt(get('max_size_mb').value) || 25;
      const deadlineVal = get('deadline').value;
      const payload = {
        title, description: get('description').value.trim() || null,
        course_code: get('course_code').value.trim() || null,
        batch, drive_link: get('drive_link').value.trim() || null,
        deadline: deadlineVal ? new Date(deadlineVal).toISOString() : null,
        allowed_types: types, max_size_mb: maxSize,
      };
      if (isEdit) payload.is_active = get('is_active').checked;

      const btn = dialog.querySelector('[data-save]');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      const { error } = isEdit
        ? await supabase.from('assignments').update(payload).eq('id', id)
        : await supabase.from('assignments').insert({ ...payload, faculty_id: auth.profile.id });
      btn.disabled = false; btn.innerHTML = `<i class="fas fa-check"></i> ${isEdit?'Save':'Create'}`;
      if (error) return toast(error.message, 'error');
      toast(isEdit ? 'Saved' : 'Assignment created — copy the share link to send to students', 'success');
      close(); await load();
    };
  }

  async function deleteAssignment(id) {
    const a = assignments.find(x => x.id === id);
    if (!a) return;
    if (!confirm(`Delete "${a.title}"?\n\nThis will also delete all ${subCounts[a.id]||0} submission(s) and their files.`)) return;
    const { error } = await supabase.from('assignments').delete().eq('id', id);
    if (error) return toast(error.message, 'error');
    toast('Assignment deleted', 'success');
    await load();
  }

  async function viewSubmissions(id) {
    const a = assignments.find(x => x.id === id);
    if (!a) return;
    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content modal-wide">
      <div class="modal-header">
        <div>
          <div class="modal-title">${escapeHtml(a.title)}</div>
          <div class="modal-sub">${escapeHtml(a.batch)} · ${a.course_code ? escapeHtml(a.course_code)+' · ' : ''}${subCounts[a.id]||0} submission(s)</div>
        </div>
        <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body" id="subBody">
        <div style="text-align:center;padding:32px;color:var(--text-muted)"><i class="fas fa-spinner fa-spin"></i> Loading…</div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close>Close</button>
      </div>
    </div>`;
    document.body.appendChild(dialog); dialog.showModal();
    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };

    const body = dialog.querySelector('#subBody');
    const { data: subs, error } = await supabase.from('submissions')
      .select('*').eq('assignment_id', id).order('submitted_at', { ascending: false });
    if (error) { body.innerHTML = `<div class="empty"><i class="fas fa-triangle-exclamation"></i>${escapeHtml(error.message)}</div>`; return; }

    if (!subs?.length) {
      body.innerHTML = `<div class="empty" style="padding:32px"><i class="fas fa-inbox"></i><div style="margin-top:8px;font-weight:600">No submissions yet</div><div style="font-size:12px;margin-top:4px">Share the link with students to start receiving files.</div></div>`;
      return;
    }

    body.innerHTML = `<table class="sub-table">
      <thead><tr><th>Student ID</th><th>Name</th><th>File</th><th>Submitted</th><th></th></tr></thead>
      <tbody>
        ${subs.map(s => `<tr>
          <td><span class="mono">${escapeHtml(s.student_id)}</span></td>
          <td>${escapeHtml(s.student_name || '—')}</td>
          <td>${escapeHtml(s.file_name)}<div style="font-size:10.5px;color:var(--text-muted)">${s.file_size?(s.file_size/1024/1024).toFixed(2)+' MB':''}</div></td>
          <td style="white-space:nowrap">${new Date(s.submitted_at).toLocaleString()}</td>
          <td style="text-align:right;white-space:nowrap">
            <button class="btn btn-sm" data-dl="${s.id}"><i class="fas fa-download"></i></button>
            <button class="btn btn-sm btn-danger" data-delsub="${s.id}"><i class="fas fa-trash"></i></button>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>`;

    body.querySelectorAll('[data-dl]').forEach(b => b.onclick = async () => {
      const s = subs.find(x => x.id === b.dataset.dl);
      if (!s) return;
      b.disabled = true; b.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      const { data, error } = await supabase.storage.from('assignment-submissions').createSignedUrl(s.file_path, 3600);
      b.disabled = false; b.innerHTML = '<i class="fas fa-download"></i>';
      if (error) return toast(error.message, 'error');
      window.open(data.signedUrl, '_blank');
    });

    body.querySelectorAll('[data-delsub]').forEach(b => b.onclick = async () => {
      const s = subs.find(x => x.id === b.dataset.delsub);
      if (!s) return;
      if (!confirm(`Delete submission from ${s.student_id}? They will be able to submit again.`)) return;
      await supabase.storage.from('assignment-submissions').remove([s.file_path]);
      const { error } = await supabase.from('submissions').delete().eq('id', s.id);
      if (error) return toast(error.message, 'error');
      toast('Submission deleted', 'success');
      dialog.close(); dialog.remove();
      await load(); viewSubmissions(id);
    });
  }

  await load();
})();
</script>
<script type="module" src="js/banner.js"></script>
</body>
</html>
