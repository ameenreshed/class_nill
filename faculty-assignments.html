<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LPU Scheduler">
<title>Assignments · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mobile-app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  .asn-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
  .asn-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;transition:all 160ms ease;display:flex;flex-direction:column;gap:10px}
  .asn-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
  .asn-title{font-size:15px;font-weight:600;color:var(--text);line-height:1.35}
  .asn-meta{font-size:12px;color:var(--text-secondary);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .asn-meta .badge{font-size:10px}
  .asn-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;background:var(--bg-subtle);border-radius:10px;margin-top:4px}
  .asn-stat{text-align:center}
  .asn-stat-val{font-size:17px;font-weight:700;color:var(--text);line-height:1}
  .asn-stat-lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:600;margin-top:4px}
  .asn-actions{display:flex;gap:6px;margin-top:auto;padding-top:12px;border-top:1px solid var(--border);flex-wrap:wrap}
  .asn-actions .btn{flex:1;min-width:0;font-size:12px;padding:8px 10px;min-height:34px}
  .link-box{display:flex;gap:8px;align-items:center;background:var(--bg-subtle);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-top:4px}
  .link-box input{flex:1;border:none;background:transparent;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text);min-width:0;padding:0}
  .link-box input:focus{outline:none}
  .link-box .btn{flex-shrink:0;min-height:28px;padding:4px 9px;font-size:11px}
  .deadline-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:600}
  .deadline-pill.ok{background:var(--success-soft);color:var(--success-text)}
  .deadline-pill.warn{background:var(--warning-soft);color:var(--warning-text)}
  .deadline-pill.expired{background:var(--danger-soft);color:var(--danger-text)}
  .deadline-pill.none{background:var(--surface-active);color:var(--text-muted)}
  .policy-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;background:var(--brand-soft);color:var(--brand-text)}
  .policy-badge.single{background:var(--info-soft);color:var(--info-text)}
  .zip-progress{display:none;margin-top:8px;padding:10px 12px;background:var(--info-soft);border:1px solid var(--info-soft-border);border-radius:8px;font-size:12px;color:var(--info-text)}
  .zip-progress.show{display:block}
  .zip-progress-bar{height:4px;background:var(--surface-active);border-radius:999px;overflow:hidden;margin-top:6px}
  .zip-progress-bar > div{height:100%;background:var(--info);width:0;transition:width 200ms ease}

  /* ── Submissions viewer ── */
  .subs-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .subs-toolbar .search-wrap{flex:1;min-width:200px;max-width:none}
  .subs-list{display:flex;flex-direction:column;gap:12px}
  .subs-student{background:var(--bg-subtle);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .subs-student-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .subs-student-avatar{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
  .subs-student-info{flex:1;min-width:0}
  .subs-student-name{font-size:14px;font-weight:600;color:var(--text);line-height:1.3}
  .subs-student-id{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-secondary);margin-top:2px}
  .subs-student-id .no-name{color:var(--text-muted);font-family:'Inter',sans-serif;font-style:italic;font-weight:400}
  .subs-file-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  .subs-file{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px}
  .subs-file i.file-ico{color:var(--text-muted);font-size:14px;flex-shrink:0}
  .subs-file-body{flex:1;min-width:0}
  .subs-file-name{font-size:12.5px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .subs-file-size{font-size:10.5px;color:var(--text-muted);margin-top:1px}
  .subs-file-actions{display:flex;gap:4px;flex-shrink:0}
  .subs-file-actions .btn{padding:5px 8px;min-height:28px;font-size:11px}
  .subs-delete-all{padding:6px 12px;background:var(--danger-soft);border:1px solid var(--danger-soft-border);color:var(--danger-text);border-radius:8px;font-size:11.5px;font-weight:600;cursor:pointer;transition:all 140ms ease}
  .subs-delete-all:hover{background:var(--danger);color:#fff;border-color:var(--danger)}

  @media (max-width:640px){
    .asn-grid{grid-template-columns:1fr}
    .asn-stats{padding:10px}
    .asn-stat-val{font-size:15px}
    .subs-file{flex-wrap:wrap}
  }
</style>
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-file-pen"></i> Assignments</h1>
      <p class="page-subtitle">Create assignment collections, view/delete submissions, and download all as a ZIP.</p>
    </div>
    <button class="btn btn-primary" id="createBtn"><i class="fas fa-plus"></i> New assignment</button>
  </div>

  <div class="asn-grid" id="list"></div>
</div>

<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, toast, BASE, todayISO } from './js/core.js';

(async () => {
  const auth = await requireRole(['faculty','admin']); if (!auth) return;
  renderNav(auth.profile);
  const $ = id => document.getElementById(id);
  let assignments = [];
  let stats = {};

  async function load() {
    const { data, error } = await supabase
      .from('assignments')
      .select('*')
      .order('created_at', { ascending: false });
    if (error) { toast(error.message, 'error'); return; }
    assignments = data ?? [];

    stats = {};
    if (assignments.length) {
      const ids = assignments.map(a => a.id);
      const { data: subs } = await supabase
        .from('submissions')
        .select('assignment_id, student_id, file_size, is_superseded')
        .in('assignment_id', ids);
      (subs ?? []).forEach(s => {
        if (!stats[s.assignment_id]) stats[s.assignment_id] = { students: new Set(), files: 0, bytes: 0, superseded: 0 };
        const st = stats[s.assignment_id];
        if (s.is_superseded) { st.superseded++; return; }
        st.students.add(s.student_id);
        st.files++;
        st.bytes += Number(s.file_size || 0);
      });
    }
    render();
  }

  function fmtSize(b) {
    if (!b) return '0 B';
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
    return (b/1048576).toFixed(2) + ' MB';
  }

  function deadlinePill(d) {
    if (!d) return `<span class="deadline-pill none"><i class="fas fa-infinity"></i> No deadline</span>`;
    const diff = new Date(d).getTime() - Date.now();
    if (diff < 0) return `<span class="deadline-pill expired"><i class="fas fa-circle-xmark"></i> Closed ${new Date(d).toLocaleDateString()}</span>`;
    if (diff < 86400000) return `<span class="deadline-pill warn"><i class="fas fa-clock"></i> Due ${new Date(d).toLocaleString()}</span>`;
    return `<span class="deadline-pill ok"><i class="fas fa-check"></i> Due ${new Date(d).toLocaleDateString()}</span>`;
  }

  function render() {
    if (!assignments.length) {
      $('list').innerHTML = `<div class="card" style="grid-column:1/-1;text-align:center;padding:48px 24px">
        <i class="fas fa-file-pen" style="font-size:32px;color:var(--text-muted);opacity:.4;margin-bottom:12px;display:block"></i>
        <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px">No assignments yet</div>
        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px">Create your first assignment collection to start receiving submissions.</div>
        <button class="btn btn-primary" onclick="document.getElementById('createBtn').click()"><i class="fas fa-plus"></i> Create assignment</button>
      </div>`;
      return;
    }
    $('list').innerHTML = assignments.map(a => {
      const st = stats[a.id] || { students: new Set(), files: 0, bytes: 0, superseded: 0 };
      const shareUrl = `${BASE}submit.html?token=${a.share_token}`;
      const sCount = st.students.size;
      const fCount = st.files;
      const totalSize = st.bytes;
      const hasSuperseded = st.superseded > 0;
      return `<div class="asn-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div class="asn-title">${escapeHtml(a.title)}</div>
          ${!a.is_active ? '<span class="badge badge-rejected" style="flex-shrink:0"><i class="fas fa-ban"></i>Revoked</span>' : ''}
        </div>
        <div class="asn-meta">
          ${a.course_code ? `<span class="badge badge-admin">${escapeHtml(a.course_code)}</span>` : ''}
          <span class="badge badge-gray"><i class="fas fa-users"></i>${escapeHtml(a.batch)}</span>
          <span class="policy-badge ${a.submission_policy === 'single' ? 'single' : ''}">
            <i class="fas fa-${a.submission_policy === 'single' ? 'lock' : 'rotate'}"></i>
            ${a.submission_policy === 'single' ? 'One-time' : 'Resubmit OK'}
          </span>
        </div>
        <div class="asn-meta">${deadlinePill(a.deadline)}</div>

        <div class="asn-stats">
          <div class="asn-stat"><div class="asn-stat-val">${sCount}</div><div class="asn-stat-lbl">Students</div></div>
          <div class="asn-stat"><div class="asn-stat-val">${fCount}</div><div class="asn-stat-lbl">Files</div></div>
          <div class="asn-stat"><div class="asn-stat-val">${fmtSize(totalSize)}</div><div class="asn-stat-lbl">Size</div></div>
        </div>

        <div class="link-box">
          <input readonly value="${escapeHtml(shareUrl)}" onclick="this.select()">
          <button class="btn btn-sm" data-copy="${escapeHtml(shareUrl)}" title="Copy share link"><i class="fas fa-copy"></i></button>
        </div>

        <div class="asn-actions">
          <button class="btn btn-sm btn-primary" data-view="${a.id}" ${fCount === 0 ? 'disabled' : ''}>
            <i class="fas fa-eye"></i> View
          </button>
          <button class="btn btn-sm" data-zip="${a.id}" ${fCount === 0 ? 'disabled' : ''}>
            <i class="fas fa-file-zipper"></i> ZIP
          </button>
          <button class="btn btn-sm" data-edit="${a.id}" title="Edit"><i class="fas fa-pen"></i></button>
          ${hasSuperseded ? `<button class="btn btn-sm" data-clean="${a.id}" title="Delete old superseded files"><i class="fas fa-broom"></i></button>` : ''}
          <button class="btn btn-sm btn-danger" data-del="${a.id}" title="Delete assignment and all files"><i class="fas fa-trash"></i></button>
        </div>
      </div>`;
    }).join('');

    document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () =>
      navigator.clipboard.writeText(b.dataset.copy).then(() => toast('Link copied', 'success')));
    document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => openSubmissions(b.dataset.view));
    document.querySelectorAll('[data-zip]').forEach(b => b.onclick = () => downloadZip(b.dataset.zip, b));
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openForm(b.dataset.edit));
    document.querySelectorAll('[data-clean]').forEach(b => b.onclick = () => cleanupSuperseded(b.dataset.clean));
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteAssignment(b.dataset.del));
  }

  $('createBtn').onclick = () => openForm();

  /* ════════════════════════════════════════════════════════
     CREATE / EDIT FORM
     ════════════════════════════════════════════════════════ */
  function openForm(id) {
    const existing = id ? assignments.find(x => x.id === id) : null;
    const isEdit = !!existing;
    const a = existing || {
      title: '', description: '', course_code: '', batch: '',
      drive_link: '', deadline: null,
      submission_policy: 'single', name_required: true,
      max_files: 1, max_size_mb: 25,
      allowed_types: ['pdf','doc','docx','ppt','pptx','txt','zip'],
      is_active: true,
    };
    const dlLocal = a.deadline
      ? new Date(new Date(a.deadline).getTime() - new Date(a.deadline).getTimezoneOffset()*60000).toISOString().slice(0,16)
      : '';

    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content modal-wide">
      <div class="modal-header">
        <div>
          <div class="modal-title"><i class="fas fa-file-pen"></i> ${isEdit?'Edit':'New'} assignment</div>
          <div class="modal-sub">Students will use the share link to upload files.</div>
        </div>
        <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <label class="field"><span>Title *</span>
          <input class="input" data-field="title" value="${escapeHtml(a.title)}" placeholder="e.g. Unit 3 — Data Structures Report"></label>
        <label class="field"><span>Description</span>
          <textarea class="input" data-field="description" rows="2" placeholder="Instructions for students…">${escapeHtml(a.description || '')}</textarea></label>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <label class="field" style="margin-bottom:0"><span>Batch *</span>
            <input class="input" data-field="batch" value="${escapeHtml(a.batch)}" placeholder="e.g. CSE 2024 A"></label>
          <label class="field" style="margin-bottom:0"><span>Course code</span>
            <input class="input" data-field="course_code" value="${escapeHtml(a.course_code || '')}" placeholder="CSE201"></label>
        </div>

        <label class="field" style="margin-top:14px"><span>Reference material link (optional)</span>
          <input class="input" data-field="drive_link" value="${escapeHtml(a.drive_link || '')}" placeholder="Google Drive / OneDrive / any URL">
          <div style="font-size:11px;color:var(--text-secondary);margin-top:4px">Shown to students as a "reference material" button.</div>
        </label>

        <label class="field"><span>Deadline</span>
          <input class="input" type="datetime-local" data-field="deadline" value="${dlLocal}"></label>

        <div class="field">
          <span>Submission policy</span>
          <div style="display:flex;flex-direction:column;gap:8px">
            <label style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;background:${a.submission_policy==='single'?'var(--brand-soft)':'var(--surface)'}" data-pol="single">
              <input type="radio" name="policy" value="single" ${a.submission_policy==='single'?'checked':''} style="margin-top:3px">
              <div><div style="font-weight:600;font-size:13px">One-time submission</div>
                <div style="font-size:11.5px;color:var(--text-secondary);margin-top:2px;line-height:1.4">Student can submit once. Cannot re-upload. Good for final exams.</div></div>
            </label>
            <label style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;background:${a.submission_policy==='overwrite'?'var(--brand-soft)':'var(--surface)'}" data-pol="overwrite">
              <input type="radio" name="policy" value="overwrite" ${a.submission_policy==='overwrite'?'checked':''} style="margin-top:3px">
              <div><div style="font-weight:600;font-size:13px">Re-submit until deadline</div>
                <div style="font-size:11.5px;color:var(--text-secondary);margin-top:2px;line-height:1.4">Student can replace their submission as many times as they want, until the deadline. Only the latest version counts.</div></div>
            </label>
          </div>
        </div>

        <label class="field" style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg-subtle);border-radius:10px;cursor:pointer">
          <input type="checkbox" data-field="name_required" ${a.name_required?'checked':''}>
          <div style="flex:1">
            <div style="font-weight:600;font-size:13px">Require student name</div>
            <div style="font-size:11.5px;color:var(--text-secondary);margin-top:2px;line-height:1.4">If unchecked, students can submit with just their ID. Their name will show as "(not provided)" in your submissions view.</div>
          </div>
        </label>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">
          <label class="field" style="margin-bottom:0"><span>Max files per student</span>
            <input class="input" type="number" min="1" max="20" data-field="max_files" value="${a.max_files}"></label>
          <label class="field" style="margin-bottom:0"><span>Max size per file (MB)</span>
            <input class="input" type="number" min="1" max="100" data-field="max_size_mb" value="${a.max_size_mb}"></label>
        </div>

        <div class="field" style="margin-top:14px">
          <span>Allowed file types</span>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${['pdf','doc','docx','ppt','pptx','txt','zip','png','jpg','jpeg','csv','xlsx'].map(t =>
              `<label style="display:flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--border);border-radius:7px;cursor:pointer;background:${a.allowed_types.includes(t)?'var(--brand-soft)':'var(--surface)'}">
                <input type="checkbox" data-type="${t}" ${a.allowed_types.includes(t)?'checked':''}>
                <span style="font-family:monospace;font-size:11.5px">.${t}</span>
              </label>`).join('')}
          </div>
        </div>

        ${isEdit ? `<label class="field" style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg-subtle);border-radius:10px;margin-top:14px">
          <input type="checkbox" data-field="is_active" ${a.is_active?'checked':''}>
          <span style="font-weight:500">Active (uncheck to revoke the share link)</span>
        </label>` : ''}
      </div>
      <div class="modal-footer">
        <button class="btn" data-close>Cancel</button>
        <button class="btn btn-primary" data-save><i class="fas fa-check"></i> ${isEdit?'Save':'Create'}</button>
      </div>
    </div>`;

    document.body.appendChild(dialog); dialog.showModal();
    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };

    dialog.querySelectorAll('[data-type]').forEach(cb => {
      cb.onchange = () => {
        cb.closest('label').style.background = cb.checked ? 'var(--brand-soft)' : 'var(--surface)';
      };
    });
    dialog.querySelectorAll('[data-pol]').forEach(lbl => {
      lbl.onclick = (e) => {
        if (e.target.tagName === 'INPUT') return;
        lbl.querySelector('input').checked = true;
        dialog.querySelectorAll('[data-pol]').forEach(l => l.style.background = 'var(--surface)');
        lbl.style.background = 'var(--brand-soft)';
      };
      lbl.querySelector('input').onchange = () => {
        dialog.querySelectorAll('[data-pol]').forEach(l => l.style.background = 'var(--surface)');
        lbl.style.background = 'var(--brand-soft)';
      };
    });

    dialog.querySelector('[data-save]').onclick = async () => {
      const get = f => dialog.querySelector(`[data-field="${f}"]`);
      const title = get('title').value.trim();
      const batch = get('batch').value.trim();
      const policy = dialog.querySelector('input[name="policy"]:checked').value;
      const maxFiles = Math.max(1, Math.min(20, parseInt(get('max_files').value) || 1));
      const maxSize = Math.max(1, Math.min(100, parseInt(get('max_size_mb').value) || 25));
      const types = [...dialog.querySelectorAll('[data-type]:checked')].map(x => x.dataset.type);
      const dlVal = get('deadline').value;
      const nameReq = get('name_required').checked;

      if (!title) return toast('Title required', 'error');
      if (!batch) return toast('Batch required', 'error');
      if (!types.length) return toast('Select at least one file type', 'error');
      if (policy === 'overwrite' && !dlVal) {
        if (!confirm('You chose "Re-submit until deadline" but left the deadline empty.\n\nStudents will be able to re-submit forever. Continue anyway?')) return;
      }

      const payload = {
        title, batch, description: get('description').value.trim() || null,
        course_code: get('course_code').value.trim() || null,
        drive_link: get('drive_link').value.trim() || null,
        deadline: dlVal ? new Date(dlVal).toISOString() : null,
        submission_policy: policy,
        name_required: nameReq,
        max_files: maxFiles, max_size_mb: maxSize,
        allowed_types: types,
      };
      if (isEdit) payload.is_active = get('is_active').checked;

      const btn = dialog.querySelector('[data-save]');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      const { error } = isEdit
        ? await supabase.from('assignments').update(payload).eq('id', id)
        : await supabase.from('assignments').insert({ ...payload, faculty_id: auth.profile.id });
      btn.disabled = false; btn.innerHTML = `<i class="fas fa-check"></i> ${isEdit?'Save':'Create'}`;
      if (error) return toast(error.message, 'error');
      toast(isEdit ? 'Saved' : 'Assignment created', 'success');
      close(); await load();
    };
  }

  /* ════════════════════════════════════════════════════════
     DELETE ASSIGNMENT
     ════════════════════════════════════════════════════════ */
  async function deleteAssignment(id) {
    const a = assignments.find(x => x.id === id);
    if (!a) return;
    const st = stats[a.id] || { files: 0, students: new Set() };
    if (!confirm(`Delete "${a.title}"?\n\nThis will PERMANENTLY delete:\n• The assignment record\n• All ${st.files} file(s) from storage\n• All submission records\n\nThis cannot be undone.`)) return;

    const { data: all } = await supabase.from('submissions')
      .select('file_path').eq('assignment_id', id);
    const paths = (all ?? []).map(s => s.file_path);

    if (paths.length) {
      const { error: stErr } = await supabase.storage.from('assignment-submissions').remove(paths);
      if (stErr) {
        if (!confirm(`Could not delete all files (${stErr.message}).\n\nDelete the assignment anyway? Orphaned files will need manual cleanup.`)) return;
      }
    }

    const { error } = await supabase.from('assignments').delete().eq('id', id);
    if (error) return toast(error.message, 'error');
    toast('Assignment and all files deleted', 'success');
    await load();
  }

  async function cleanupSuperseded(id) {
    const a = assignments.find(x => x.id === id);
    if (!a) return;
    const { data: sup } = await supabase.from('submissions')
      .select('file_path').eq('assignment_id', id).eq('is_superseded', true);
    const paths = (sup ?? []).map(s => s.file_path);
    if (!paths.length) return toast('Nothing to clean up', 'info');
    if (!confirm(`Delete ${paths.length} old (superseded) file(s)?\n\nThe current submissions will remain untouched.`)) return;

    const { error: stErr } = await supabase.storage.from('assignment-submissions').remove(paths);
    if (stErr) toast('Some files could not be deleted: ' + stErr.message, 'warning');
    await supabase.from('submissions').delete().eq('assignment_id', id).eq('is_superseded', true);
    toast(`Cleaned up ${paths.length} old file(s)`, 'success');
    await load();
  }

  /* ════════════════════════════════════════════════════════
     VIEW SUBMISSIONS (per-student, with individual download/delete)
     ════════════════════════════════════════════════════════ */
  async function openSubmissions(id) {
    const a = assignments.find(x => x.id === id);
    if (!a) return;

    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content modal-wide">
      <div class="modal-header">
        <div>
          <div class="modal-title"><i class="fas fa-inbox"></i> Submissions</div>
          <div class="modal-sub">${escapeHtml(a.title)} · ${escapeHtml(a.batch)}${a.course_code ? ' · ' + escapeHtml(a.course_code) : ''}</div>
        </div>
        <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="subs-toolbar">
          <div class="search-wrap">
            <i class="fas fa-search search-icon"></i>
            <input class="input" id="subsSearch" placeholder="Search by student ID or name…">
          </div>
          <button class="btn btn-sm" id="subsRefresh" title="Refresh"><i class="fas fa-rotate-right"></i></button>
        </div>
        <div id="subsContent"><div style="text-align:center;padding:32px;color:var(--text-muted)"><i class="fas fa-spinner fa-spin"></i> Loading…</div></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="subsZip" style="margin-right:auto"><i class="fas fa-file-zipper"></i> Download all as ZIP</button>
        <button class="btn" data-close>Close</button>
      </div>
    </div>`;

    document.body.appendChild(dialog); dialog.showModal();
    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };

    let allSubs = [];
    let searchTerm = '';

    async function fetchSubs() {
      const { data, error } = await supabase.from('submissions')
        .select('*').eq('assignment_id', id)
        .eq('is_superseded', false)
        .order('student_id', { ascending: true })
        .order('submitted_at', { ascending: true });
      if (error) {
        dialog.querySelector('#subsContent').innerHTML = `<div class="empty"><i class="fas fa-triangle-exclamation"></i>${escapeHtml(error.message)}</div>`;
        return;
      }
      allSubs = data ?? [];
      renderSubs();
    }

    function renderSubs() {
      const content = dialog.querySelector('#subsContent');
      if (!allSubs.length) {
        content.innerHTML = `<div class="empty" style="padding:32px"><i class="fas fa-inbox"></i><div style="margin-top:8px;font-weight:600">No submissions yet</div><div style="font-size:12px;margin-top:4px">Share the link with students to start receiving files.</div></div>`;
        return;
      }

      // Group by student_id
      const byStudent = new Map();
      allSubs.forEach(s => {
        if (!byStudent.has(s.student_id)) byStudent.set(s.student_id, { name: s.student_name, files: [] });
        byStudent.get(s.student_id).files.push(s);
        if (s.student_name) byStudent.get(s.student_id).name = s.student_name;
      });

      // Filter by search
      let entries = [...byStudent.entries()];
      if (searchTerm) {
        const q = searchTerm.toLowerCase();
        entries = entries.filter(([sid, info]) =>
          sid.toLowerCase().includes(q) || (info.name || '').toLowerCase().includes(q)
        );
      }

      if (!entries.length) {
        content.innerHTML = `<div class="empty" style="padding:32px"><i class="fas fa-search"></i><div style="margin-top:8px">No students match "${escapeHtml(searchTerm)}"</div></div>`;
        return;
      }

      content.innerHTML = `<div class="subs-list">
        ${entries.map(([sid, info]) => {
          const initial = (info.name || sid).trim()[0]?.toUpperCase() || '?';
          const filesHtml = info.files.map(s => `
            <div class="subs-file">
              <i class="fas fa-file file-ico"></i>
              <div class="subs-file-body">
                <div class="subs-file-name" title="${escapeHtml(s.file_name)}">${escapeHtml(s.file_name)}</div>
                <div class="subs-file-size">${fmtSize(Number(s.file_size)||0)} · ${new Date(s.submitted_at).toLocaleString()}</div>
              </div>
              <div class="subs-file-actions">
                <button class="btn btn-sm" data-dl="${s.id}" title="Download"><i class="fas fa-download"></i></button>
                <button class="btn btn-sm btn-danger" data-delfile="${s.id}" title="Delete this file"><i class="fas fa-trash"></i></button>
              </div>
            </div>
          `).join('');

          return `<div class="subs-student" data-student="${escapeHtml(sid)}">
            <div class="subs-student-head">
              <div class="subs-student-avatar">${escapeHtml(initial)}</div>
              <div class="subs-student-info">
                <div class="subs-student-name">${info.name ? escapeHtml(info.name) : '<span style="color:var(--text-muted);font-style:italic">(not provided)</span>'}</div>
                <div class="subs-student-id">${escapeHtml(sid)} · ${info.files.length} file${info.files.length===1?'':'s'}</div>
              </div>
              <button class="subs-delete-all" data-delstudent="${escapeHtml(sid)}" title="Delete all files from this student">
                <i class="fas fa-trash-can"></i> Delete all
              </button>
            </div>
            <div class="subs-file-list">${filesHtml}</div>
          </div>`;
        }).join('')}
      </div>`;

      // Wire up download buttons
      content.querySelectorAll('[data-dl]').forEach(b => b.onclick = async () => {
        const subId = b.dataset.dl;
        const s = allSubs.find(x => x.id === subId);
        if (!s) return;
        b.disabled = true; b.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        const { data, error } = await supabase.storage
          .from('assignment-submissions')
          .createSignedUrl(s.file_path, 3600, { download: s.file_name });
        b.disabled = false; b.innerHTML = '<i class="fas fa-download"></i>';
        if (error) return toast(error.message, 'error');
        const link = document.createElement('a');
        link.href = data.signedUrl;
        link.download = s.file_name;
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
      });

      // Delete single file
      content.querySelectorAll('[data-delfile]').forEach(b => b.onclick = async () => {
        const subId = b.dataset.delfile;
        const s = allSubs.find(x => x.id === subId);
        if (!s) return;
        if (!confirm(`Delete "${s.file_name}" from ${s.student_id}?\n\nThis cannot be undone.`)) return;
        b.disabled = true; b.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

        const { error: stErr } = await supabase.storage
          .from('assignment-submissions').remove([s.file_path]);
        if (stErr) toast('Storage: ' + stErr.message, 'warning');

        const { error } = await supabase.from('submissions').delete().eq('id', subId);
        if (error) { b.disabled = false; b.innerHTML = '<i class="fas fa-trash"></i>'; return toast(error.message, 'error'); }
        toast('File deleted', 'success');
        await fetchSubs();
        await load();  // refresh card stats
      });

      // Delete all files for one student
      content.querySelectorAll('[data-delstudent]').forEach(b => b.onclick = async () => {
        const sid = b.dataset.delstudent;
        const info = byStudent.get(sid);
        if (!info) return;
        if (!confirm(`Delete ALL ${info.files.length} file(s) from student ${sid}?\n\nThis cannot be undone. The student will be able to submit again.`)) return;
        b.disabled = true; b.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

        const paths = info.files.map(f => f.file_path);
        const { error: stErr } = await supabase.storage
          .from('assignment-submissions').remove(paths);
        if (stErr) toast('Storage: ' + stErr.message, 'warning');

        const { error } = await supabase.from('submissions')
          .delete().eq('assignment_id', id).eq('student_id', sid).eq('is_superseded', false);
        if (error) { b.disabled = false; b.innerHTML = '<i class="fas fa-trash-can"></i> Delete all'; return toast(error.message, 'error'); }
        toast(`Deleted submission from ${sid}`, 'success');
        await fetchSubs();
        await load();
      });
    }

    dialog.querySelector('#subsSearch').oninput = e => {
      searchTerm = e.target.value.trim();
      renderSubs();
    };
    dialog.querySelector('#subsRefresh').onclick = fetchSubs;
    dialog.querySelector('#subsZip').onclick = () => downloadZip(id, null, dialog.querySelector('#subsZip'));

    await fetchSubs();
  }

  /* ════════════════════════════════════════════════════════
     ZIP DOWNLOAD
     ════════════════════════════════════════════════════════ */
  async function downloadZip(id, btn, btnEl = null) {
    const a = assignments.find(x => x.id === id);
    if (!a) return;
    const button = btnEl || btn;
    if (button) {
      button.disabled = true;
      button.dataset.original = button.innerHTML;
      button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Preparing…';
    }

    let progressEl = document.querySelector('.zip-progress');
    if (!progressEl) {
      progressEl = document.createElement('div');
      progressEl.className = 'zip-progress show';
      progressEl.innerHTML = `
        <div style="display:flex;justify-content:space-between;gap:8px">
          <span id="zipStatus">Fetching file list…</span>
          <span id="zipCount">0/0</span>
        </div>
        <div class="zip-progress-bar"><div id="zipBar"></div></div>`;
      document.querySelector('.container').appendChild(progressEl);
    }
    progressEl.classList.add('show');
    const statusEl = progressEl.querySelector('#zipStatus');
    const countEl = progressEl.querySelector('#zipCount');
    const barEl = progressEl.querySelector('#zipBar');

    try {
      const { data: subs, error } = await supabase.from('submissions')
        .select('student_id, student_name, file_path, file_name')
        .eq('assignment_id', id)
        .eq('is_superseded', false)
        .order('student_id');
      if (error) throw error;
      if (!subs || !subs.length) {
        toast('No files to download', 'info');
        progressEl.remove();
        if (button) { button.disabled = false; button.innerHTML = button.dataset.original || '<i class="fas fa-file-zipper"></i> ZIP'; }
        return;
      }

      const total = subs.length;
      countEl.textContent = `0/${total}`;
      statusEl.textContent = 'Creating signed URLs…';

      const paths = subs.map(s => s.file_path);
      const { data: urls, error: urlErr } = await supabase.storage
        .from('assignment-submissions')
        .createSignedUrls(paths, 3600);
      if (urlErr) throw urlErr;

      const urlMap = new Map();
      (urls ?? []).forEach(u => { if (u.signedUrl) urlMap.set(u.path, u.signedUrl); });

      const zip = new JSZip();
      let done = 0;
      for (const s of subs) {
        const signedUrl = urlMap.get(s.file_path);
        statusEl.textContent = `Downloading ${done + 1}/${total}: ${s.file_name}`;
        if (!signedUrl) { done++; countEl.textContent = `${done}/${total}`; barEl.style.width = `${(done/total)*100}%`; continue; }
        try {
          const res = await fetch(signedUrl);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const blob = await res.blob();
          const safeName = (s.file_name || 'file').replace(/[\\/:*?"<>|]/g, '_');
          const studentFolder = (s.student_id || 'unknown').replace(/[\\/:*?"<>|]/g, '_');
          zip.file(`${studentFolder}/${safeName}`, blob);
        } catch (e) {
          console.warn('Failed to fetch', s.file_path, e);
        }
        done++;
        countEl.textContent = `${done}/${total}`;
        barEl.style.width = `${(done/total)*100}%`;
      }

      statusEl.textContent = 'Generating ZIP…';
      const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });

      const safeTitle = (a.title || 'assignment').replace(/[\\/:*?"<>|]/g, '_');
      const filename = `${safeTitle}_${todayISO()}.zip`;
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = filename;
      document.body.appendChild(link); link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 5000);

      statusEl.textContent = `Done — ${(blob.size/1048576).toFixed(2)} MB`;
      setTimeout(() => progressEl.remove(), 2000);
      toast('ZIP downloaded', 'success');
    } catch (e) {
      toast(e.message || 'Download failed', 'error');
      progressEl.remove();
    }
    if (button) {
      button.disabled = false;
      button.innerHTML = button.dataset.original || '<i class="fas fa-file-zipper"></i> ZIP';
    }
  }

  await load();
})();
</script>
