<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LPU Scheduler">
<meta name="mobile-web-app-capable" content="yes">
<title>Profile · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mobile-app.css">
<style>
.profile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.profile-panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}
.profile-panel-title{font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;margin-bottom:16px}
.profile-panel-title i{color:var(--brand);font-size:14px}
.info-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.info-row:last-child{border-bottom:none}
.info-label{color:var(--text-secondary);flex-shrink:0}
.info-value{color:var(--text);font-weight:500;text-align:right;word-break:break-word}
.info-value.mono{font-family:'JetBrains Mono',monospace;font-size:12.5px}
.stat-inline{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.badge-role{padding:4px 10px;border-radius:6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.badge-role.admin{background:var(--brand-soft);color:var(--brand-text)}
.badge-role.faculty{background:var(--success-soft);color:var(--success-text)}
.badge-role.student{background:var(--info-soft);color:var(--info-text)}
</style>
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-user"></i> My profile</h1>
      <p class="page-subtitle">Account details and preferences.</p>
    </div>
  </div>

  <div class="profile-header" style="margin-bottom:16px">
    <div class="avatar-lg" id="avatar">?</div>
    <div class="profile-info">
      <div class="profile-name" id="fullName">…</div>
      <div class="profile-email" id="email">…</div>
      <div class="profile-badges" id="badges"></div>
    </div>
  </div>

  <div class="profile-grid">
    <div class="profile-panel">
      <div class="profile-panel-title"><i class="fas fa-id-card"></i> Account information</div>
      <div id="accountInfo"></div>
    </div>

    <div class="profile-panel">
      <div class="profile-panel-title"><i class="fas fa-shield-halved"></i> Change password</div>
      <form id="pwdForm">
        <label class="field"><span>New password</span>
          <div class="pwd-wrap">
            <input class="input" type="password" id="newPwd" minlength="8" placeholder="At least 8 characters" required>
            <button type="button" class="pwd-toggle" data-toggle="newPwd" aria-label="Show password"><i class="fas fa-eye"></i></button>
          </div>
        </label>
        <label class="field"><span>Confirm new password</span>
          <div class="pwd-wrap">
            <input class="input" type="password" id="confirmPwd" minlength="8" placeholder="Re-enter password" required>
            <button type="button" class="pwd-toggle" data-toggle="confirmPwd" aria-label="Show password"><i class="fas fa-eye"></i></button>
          </div>
        </label>
        <div id="pwdErr" style="display:none;margin-bottom:10px;padding:10px 12px;background:var(--danger-soft);border:1px solid var(--danger-soft-border);border-radius:8px;color:var(--danger-text);font-size:12.5px"></div>
        <button class="btn btn-primary btn-block" type="submit" id="pwdBtn"><i class="fas fa-key"></i> Update password</button>
      </form>
    </div>

    <div class="profile-panel">
      <div class="profile-panel-title"><i class="fas fa-palette"></i> Preferences</div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
        <div>
          <div style="font-size:13px;font-weight:600;color:var(--text)">Dark mode</div>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:2px">Switch between light and dark theme</div>
        </div>
        <button class="btn" id="themeBtn" style="min-width:90px;justify-content:center"></button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0">
        <div>
          <div style="font-size:13px;font-weight:600;color:var(--text)">Install app</div>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:2px">Add LPU Scheduler to your home screen</div>
        </div>
        <button class="btn install-app-item" id="installBtn" style="min-width:90px;justify-content:center"><i class="fas fa-download"></i> Install</button>
      </div>
    </div>
  </div>

  <div style="margin-top:20px;padding:16px 18px;background:var(--surface);border:1px solid var(--border);border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <div>
      <div style="font-size:13px;font-weight:600;color:var(--text)">Sign out everywhere</div>
      <div style="font-size:12px;color:var(--text-secondary);margin-top:2px">End your session on this device</div>
    </div>
    <button class="btn btn-danger" id="signOutBtn"><i class="fas fa-right-from-bracket"></i> Sign out</button>
  </div>
</div>

<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, toast, getCurrentTheme, setTheme, getCurrentTheme as getTheme, signOut } from './js/core.js';

(async () => {
  const auth = await requireRole(['admin', 'faculty', 'student']);
  if (!auth) return;
  renderNav(auth.profile);
  const $ = id => document.getElementById(id);
  const me = auth.profile;

  const initial = ((me.full_name || me.email || '?').trim()[0] || '?').toUpperCase();
  $('avatar').textContent = initial;
  $('fullName').textContent = me.full_name || '—';
  $('email').textContent = me.email || '—';

  const badges = [
    `<span class="badge-role ${me.role}"><i class="fas fa-${me.role === 'admin' ? 'shield-halved' : me.role === 'student' ? 'user-graduate' : 'chalkboard-user'}"></i> ${me.role}</span>`,
  ];
  if (me.is_active === false) {
    badges.push(`<span class="badge badge-rejected" style="padding:4px 10px"><i class="fas fa-ban"></i> Suspended</span>`);
  }
  $('badges').innerHTML = badges.join('');

  // Account info rows (role-aware)
  const rows = [];
  rows.push(`<div class="info-row"><span class="info-label">Full name</span><span class="info-value">${escapeHtml(me.full_name || '—')}</span></div>`);
  rows.push(`<div class="info-row"><span class="info-label">Email</span><span class="info-value mono">${escapeHtml(me.email)}</span></div>`);
  rows.push(`<div class="info-row"><span class="info-label">Role</span><span class="info-value" style="text-transform:capitalize">${escapeHtml(me.role)}</span></div>`);

  if (me.role === 'student') {
    if (me.roll_number) rows.push(`<div class="info-row"><span class="info-label">Roll number</span><span class="info-value mono">${escapeHtml(me.roll_number)}</span></div>`);
    if (me.batch) rows.push(`<div class="info-row"><span class="info-label">Batch</span><span class="info-value">${escapeHtml(me.batch)}</span></div>`);
  }

  if (me.created_at) {
    const d = new Date(me.created_at);
    rows.push(`<div class="info-row"><span class="info-label">Joined</span><span class="info-value">${d.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' })}</span></div>`);
  }
  rows.push(`<div class="info-row"><span class="info-label">Status</span><span class="info-value">${me.is_active === false ? '<span style="color:var(--danger)">Suspended</span>' : '<span style="color:var(--success)">Active</span>'}</span></div>`);

  $('accountInfo').innerHTML = rows.join('');

  // Password toggle buttons
  document.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.onclick = () => {
      const input = $(btn.dataset.toggle);
      const isPwd = input.type === 'password';
      input.type = isPwd ? 'text' : 'password';
      btn.innerHTML = isPwd ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
    };
  });

  // Password change
  const pwdForm = $('pwdForm');
  const pwdErr = $('pwdErr');
  pwdForm.onsubmit = async (e) => {
    e.preventDefault();
    pwdErr.style.display = 'none';
    const p1 = $('newPwd').value;
    const p2 = $('confirmPwd').value;
    if (p1.length < 8) { pwdErr.textContent = 'Password must be at least 8 characters.'; pwdErr.style.display = 'block'; return; }
    if (p1 !== p2) { pwdErr.textContent = 'Passwords do not match.'; pwdErr.style.display = 'block'; return; }

    const btn = $('pwdBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating…';

    const { error } = await supabase.auth.updateUser({ password: p1 });
    if (error) {
      pwdErr.textContent = error.message;
      pwdErr.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-key"></i> Update password';
      return;
    }
    toast('Password updated', 'success');
    pwdForm.reset();
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-key"></i> Update password';
  };

  // Theme toggle
  const themeBtn = $('themeBtn');
  function refreshThemeBtn() {
    const dark = getCurrentTheme() === 'dark';
    themeBtn.innerHTML = dark ? '<i class="fas fa-sun"></i> Light' : '<i class="fas fa-moon"></i> Dark';
  }
  refreshThemeBtn();
  themeBtn.onclick = () => {
    const next = getCurrentTheme() === 'dark' ? 'light' : 'dark';
    setTheme(next);
    refreshThemeBtn();
  };

  // Install
  const installBtn = $('installBtn');
  function refreshInstall() {
    if (window.deferredInstallPrompt) installBtn.classList.add('available');
    else installBtn.classList.remove('available');
  }
  refreshInstall();
  window.addEventListener('pwainstallready', refreshInstall);
  installBtn.onclick = async () => {
    if (!window.deferredInstallPrompt) return toast('Install not available on this browser', 'error');
    window.deferredInstallPrompt.prompt();
    const { outcome } = await window.deferredInstallPrompt.userChoice;
    if (outcome === 'accepted') {
      installBtn.classList.remove('available');
      toast('App installed', 'success');
    }
    window.deferredInstallPrompt = null;
  };

  // Sign out
  $('signOutBtn').onclick = async () => {
    if (!confirm('Sign out of your account?')) return;
    await signOut();
  };
})();
</script>
<script type="module" src="js/banner.js"></script>
</body>
</html>
