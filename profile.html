<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LPU Scheduler">
<meta name="mobile-web-app-capable" content="yes">
<title>Profile · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mobile-app.css">
<style>
  .first-banner{display:none;padding:20px 24px;background:linear-gradient(135deg,var(--brand-soft) 0%,var(--warning-soft) 100%);border:1px solid var(--brand-soft-border);border-radius:14px;margin-bottom:24px;align-items:flex-start;gap:14px;box-shadow:var(--shadow-md)}
  .first-banner.show{display:flex}
  .first-banner-icon{width:44px;height:44px;border-radius:12px;background:var(--brand);color:white;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:0 4px 12px rgba(234,88,12,.3)}
  .first-banner-body{flex:1;min-width:0}
  .first-banner-title{font-size:15px;font-weight:700;color:var(--brand-text);margin-bottom:4px}
  .first-banner-text{font-size:13px;color:var(--text-secondary);line-height:1.55}
  @media(max-width:640px){.first-banner{padding:16px;gap:10px}.first-banner-icon{width:36px;height:36px;font-size:16px}}
</style>
</head>
<body>
<div id="nav"></div>
<div class="container" style="max-width:1000px">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-user-circle"></i> Profile</h1>
      <p class="page-subtitle">Manage your account and security.</p>
    </div>
  </div>

  <div class="first-banner" id="firstBanner">
    <div class="first-banner-icon"><i class="fas fa-shield-halved"></i></div>
    <div class="first-banner-body">
      <div class="first-banner-title">Welcome — please change your password</div>
      <div class="first-banner-text">Your account is still using the temporary password set by the administrator. Set a new password below to continue.</div>
    </div>
  </div>

  <div class="profile-header">
    <div class="avatar-lg" id="avatar">?</div>
    <div class="profile-info">
      <div class="profile-name" id="displayName">Loading…</div>
      <div class="profile-email" id="displayEmail"></div>
      <div class="profile-badges" id="profileBadges"></div>
    </div>
  </div>

  <div class="grid-auto mt-6">
    <div class="card">
      <div class="card-title"><i class="fas fa-id-card"></i> Account</div>
      <form id="accountForm">
        <label class="field"><span>Full name</span><input class="input" id="fullNameInput"></label>
        <label class="field"><span>Email</span><input class="input" id="emailDisplay" disabled><div class="dim" style="font-size:11px;margin-top:4px">Contact admin to change</div></label>
        <label class="field"><span>Department</span><input class="input" id="departmentDisplay" disabled></label>
        <label class="field"><span>Phone</span><input class="input" id="phoneInput" type="tel"></label>
        <button class="btn btn-primary" type="submit" id="saveBtn"><i class="fas fa-check"></i> Save changes</button>
      </form>
    </div>
    <div class="card" id="passwordCard">
      <div class="card-title"><i class="fas fa-lock"></i> Security</div>
      <form id="passwordForm">
        <label class="field"><span>Current password</span>
          <div class="pwd-wrap"><input class="input" id="currentPwd" type="password" autocomplete="current-password">
            <button type="button" class="pwd-toggle" data-for="currentPwd"><i class="fas fa-eye"></i></button>
          </div>
        </label>
        <label class="field"><span>New password (min 8 chars)</span>
          <div class="pwd-wrap"><input class="input" id="newPwd" type="password" minlength="8">
            <button type="button" class="pwd-toggle" data-for="newPwd"><i class="fas fa-eye"></i></button>
          </div>
        </label>
        <label class="field"><span>Confirm new password</span>
          <div class="pwd-wrap"><input class="input" id="confirmPwd" type="password" minlength="8">
            <button type="button" class="pwd-toggle" data-for="confirmPwd"><i class="fas fa-eye"></i></button>
          </div>
        </label>
        <button class="btn btn-primary" type="submit" id="pwdBtn"><i class="fas fa-key"></i> Change password</button>
      </form>
    </div>
  </div>

  <div class="card mt-6">
    <div class="card-title"><i class="fas fa-clock"></i> Session info</div>
    <div class="grid-auto">
      <div><div class="label-small">Member since</div><div id="createdAt" style="font-weight:500;font-size:14px">—</div></div>
      <div><div class="label-small">Last active</div><div id="lastActive" style="font-weight:500;font-size:14px">—</div></div>
      <div><div class="label-small">Password changed</div><div id="pwdChanged" style="font-weight:500;font-size:14px">Never</div></div>
    </div>
  </div>
</div>

<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, toast, formatDateTime, formatRelativeTime } from './js/core.js';

(async () => {
  const auth = await requireRole(['admin', 'faculty']);
  if (!auth) return;
  renderNav(auth.profile);
  const $ = id => document.getElementById(id);
  const p = auth.profile;
  const hadFirstParam = new URLSearchParams(location.search).get('first') === '1';
  const isFirstLogin = p.password_changed_at === null;

  const initial = ((p.full_name || p.email || '?').trim()[0] || '?').toUpperCase();
  $('avatar').textContent = initial;
  $('displayName').textContent = p.full_name || p.email;
  $('displayEmail').textContent = p.email;
  $('fullNameInput').value = p.full_name || '';
  $('emailDisplay').value = p.email;
  $('departmentDisplay').value = p.department || '—';
  $('phoneInput').value = p.phone || '';
  $('createdAt').textContent = formatDateTime(p.created_at);
  $('lastActive').textContent = formatRelativeTime(p.last_active_at) || formatDateTime(p.last_active_at);
  $('pwdChanged').textContent = p.password_changed_at ? formatDateTime(p.password_changed_at) : 'Never';

  function paintBadges() {
    const roleIcon = p.role === 'admin' ? 'shield-halved' : 'chalkboard-user';
    const isFirst = p.password_changed_at === null;
    $('profileBadges').innerHTML = `
      <span class="badge badge-${p.role}"><i class="fas fa-${roleIcon}"></i>${p.role}</span>
      <span class="badge badge-approved"><i class="fas fa-check"></i>active</span>
      ${isFirst ? '<span class="badge badge-pending"><i class="fas fa-key"></i>first login</span>' : ''}
    `;
    $('firstBanner').classList.toggle('show', isFirst);
  }
  paintBadges();

  if (isFirstLogin) {
    setTimeout(() => {
      $('passwordCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
      $('currentPwd').focus();
    }, 300);
  }

  document.querySelectorAll('.pwd-toggle[data-for]').forEach(btn => {
    btn.onclick = () => {
      const input = $(btn.dataset.for);
      const isPwd = input.type === 'password';
      input.type = isPwd ? 'text' : 'password';
      btn.innerHTML = isPwd ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
    };
  });

  $('accountForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = $('saveBtn');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…';
    const { error } = await supabase.from('profiles').update({
      full_name: $('fullNameInput').value.trim() || null,
      phone: $('phoneInput').value.trim() || null,
    }).eq('id', p.id);
    btn.disabled = false; btn.innerHTML = '<i class="fas fa-check"></i> Save changes';
    if (error) return toast(error.message, 'error');
    $('displayName').textContent = $('fullNameInput').value.trim() || p.email;
    toast('Profile updated', 'success');
  };

  $('passwordForm').onsubmit = async (e) => {
    e.preventDefault();
    const current = $('currentPwd').value, next = $('newPwd').value, confirm = $('confirmPwd').value;
    if (!current || !next || !confirm) return toast('Fill all fields', 'error');
    if (next.length < 8) return toast('Password must be 8+ characters', 'error');
    if (next !== confirm) return toast('Passwords do not match', 'error');
    if (next === current) return toast('New password must differ from current', 'error');

    const btn = $('pwdBtn');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating…';

    const { error: verifyErr } = await supabase.auth.signInWithPassword({ email: p.email, password: current });
    if (verifyErr) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-key"></i> Change password'; return toast('Current password is incorrect', 'error'); }

    const { error: updErr } = await supabase.auth.updateUser({ password: next });
    if (updErr) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-key"></i> Change password'; return toast(updErr.message, 'error'); }

    let marked = false;
    const { error: rpcErr } = await supabase.rpc('mark_password_changed');
    if (!rpcErr) marked = true;
    else {
      const { error: directErr } = await supabase.from('profiles').update({ password_changed_at: new Date().toISOString() }).eq('id', p.id);
      marked = !directErr;
    }

    p.password_changed_at = new Date().toISOString();
    $('pwdChanged').textContent = formatDateTime(p.password_changed_at);
    $('firstBanner').classList.remove('show');
    paintBadges();
    $('currentPwd').value = ''; $('newPwd').value = ''; $('confirmPwd').value = '';

    btn.disabled = false; btn.innerHTML = '<i class="fas fa-key"></i> Change password';

    if (!marked) { toast('Password updated — refresh if you see a warning', 'info'); return; }

    toast('Password updated successfully', 'success');
    history.replaceState({}, '', 'profile.html');
    setTimeout(() => {
      const home = p.role === 'admin' ? 'admin.html' : 'faculty.html';
      location.replace('./' + home);
    }, 900);
  };

  if (hadFirstParam && p.password_changed_at !== null) {
    history.replaceState({}, '', 'profile.html');
  }
})();
</script>
<!-- Centralized site banner -->
<script type="module" src="js/banner.js"></script>
</body>
</html>
