<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free rooms · amnrd.scheduler</title>
<script>
(function(){
  try {
    var stored = localStorage.getItem('theme');
    var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', stored || (systemDark ? 'dark' : 'light'));
  } catch (e) {}
})();
</script>
<meta name="theme-color" content="#EA580C">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-building"></i> Free rooms</h1>
      <p class="page-subtitle">Live availability across campus. Updates automatically.</p>
    </div>
    <div class="row">
      <input class="input" type="date" id="dateInput" style="width:auto">
      <button class="btn btn-primary" id="loadBtn"><i class="fas fa-arrow-right"></i> Go</button>
    </div>
  </div>

  <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap">
    <div style="min-width:180px">
      <div class="label-small"><i class="fas fa-signal" style="color:var(--success)"></i> Live now</div>
      <div id="liveClock" class="mono" style="font-size:28px;font-weight:600;color:var(--text);letter-spacing:-0.02em;margin-top:2px">--:--:--</div>
      <div id="liveInfo" style="font-size:var(--text-sm);color:var(--text-muted);margin-top:4px">—</div>
    </div>
    <div style="text-align:right">
      <div class="label-small">Free right now</div>
      <div id="freeNowCount" style="font-size:40px;font-weight:600;color:var(--success);line-height:1;letter-spacing:-0.03em;margin-top:4px">—</div>
    </div>
  </div>

  <div id="freeNowList" class="mt-4"></div>

  <div class="grid-toolbar" id="buildingTabs"></div>

  <div id="gridContainer">
    <div class="card" style="padding:32px">
      <div class="empty"><i class="fas fa-spinner fa-spin"></i>Loading rooms…</div>
    </div>
  </div>
</div>

<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, nowDate, formatTime, parseTimeOnDate, todayISO } from './js/core.js';

(async () => {
  const auth = await requireRole(['student', 'faculty', 'admin']);
  if (!auth) return;
  renderNav(auth.profile);

  const $ = id => document.getElementById(id);
  const dateInput = $('dateInput');
  dateInput.value = todayISO();

  let rooms = [], slots = [], bookings = [], building = 'all';
  let currentSlotId = null;

  const [{ data: roomData }, { data: slotData }] = await Promise.all([
    supabase.from('rooms').select('*').eq('bookable', true).order('building').order('floor'),
    supabase.from('time_slots').select('*').eq('is_active', true).order('sort_order').order('start_time'),
  ]);
  rooms = roomData ?? [];
  slots = slotData ?? [];

  async function loadBookings() {
    const { data } = await supabase
      .from('bookings')
      .select('room_id,slot_id')
      .eq('book_date', dateInput.value)
      .in('status', ['pending', 'approved']);
    bookings = data ?? [];
    render();
  }

  $('loadBtn').onclick = loadBookings;
  dateInput.onchange = loadBookings;

  function getCurrentSlot() {
    const now = nowDate();
    if (dateInput.value !== todayISO()) return null;
    const nowStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:00`;
    return slots.find(s => nowStr >= s.start_time && nowStr < s.end_time) || null;
  }

  function slotStatus(slot, viewDate) {
    const today = todayISO();
    if (viewDate < today) return 'past-day';
    if (viewDate > today) return 'future-day';
    const now = nowDate();
    const start = parseTimeOnDate(viewDate, slot.start_time);
    const end = parseTimeOnDate(viewDate, slot.end_time);
    if (now >= end) return 'ended';
    if (now >= start && now < end) return 'current';
    return 'upcoming';
  }

  function renderTabs() {
    const el = $('buildingTabs');
    const buildings = Array.from(new Set(rooms.map(r => r.building))).sort();
    el.innerHTML = `
      <button class="chip ${building === 'all' ? 'on' : ''}" data-b="all">
        <i class="fas fa-layer-group"></i> All blocks
      </button>
      ${buildings.map(b => `
        <button class="chip ${building === b ? 'on' : ''}" data-b="${b}">
          <i class="fas fa-building"></i> Block ${b}
        </button>
      `).join('')}
    `;
    el.querySelectorAll('button[data-b]').forEach(btn => {
      btn.onclick = () => { building = btn.dataset.b; render(); };
    });
  }

  function renderLiveNow() {
    const cur = getCurrentSlot();
    const info = $('liveInfo');
    const countEl = $('freeNowCount');
    const listEl = $('freeNowList');

    if (!cur) {
      info.textContent = dateInput.value === todayISO() ? 'No active period' : 'Not viewing today';
      countEl.textContent = '—';
      listEl.innerHTML = '';
      return;
    }

    const taken = new Set(bookings.filter(b => b.slot_id === cur.slot_id).map(b => b.room_id));
    const freeRooms = rooms.filter(r => !taken.has(r.room_id));

    info.innerHTML = `<i class="fas fa-clock" style="margin-right:4px"></i>${escapeHtml(cur.label || cur.slot_id)} · ${cur.start_time.slice(0,5)}–${cur.end_time.slice(0,5)}`;
    countEl.textContent = freeRooms.length;

    if (!freeRooms.length) {
      listEl.innerHTML = '<div class="card"><div class="empty"><i class="fas fa-door-closed"></i>All rooms are booked right now</div></div>';
      return;
    }

    const byBuilding = new Map();
    freeRooms.forEach(r => {
      if (!byBuilding.has(r.building)) byBuilding.set(r.building, []);
      byBuilding.get(r.building).push(r);
    });

    listEl.innerHTML = `
      <div class="card">
        <div class="card-title"><i class="fas fa-door-open"></i> Available now</div>
        ${Array.from(byBuilding.entries()).sort((a,b) => a[0].localeCompare(b[0])).map(([b, rs]) => `
          <div style="margin-bottom:14px">
            <div class="label-small" style="margin-bottom:6px"><i class="fas fa-building"></i> Block ${escapeHtml(b)}</div>
            <div class="chips">
              ${rs.sort((x,y) => x.display_name.localeCompare(y.display_name)).map(r => `
                <span class="chip" style="cursor:default">
                  <i class="fas fa-door-open" style="color:var(--success)"></i>
                  ${escapeHtml(r.display_name)}
                </span>
              `).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function render() {
    renderTabs();
    renderLiveNow();

    const taken = new Set(bookings.map(b => `${b.room_id}|${b.slot_id}`));
    const filtered = building === 'all' ? rooms : rooms.filter(r => r.building === building);

    if (!filtered.length) {
      $('gridContainer').innerHTML = '<div class="card"><div class="empty"><i class="fas fa-door-closed"></i>No rooms in this block yet.</div></div>';
      return;
    }

    const byFloor = new Map();
    filtered.forEach(r => {
      if (!byFloor.has(r.floor)) byFloor.set(r.floor, []);
      byFloor.get(r.floor).push(r);
    });
    byFloor.forEach(arr => arr.sort((a, b) =>
      (a.room_number + a.suffix).localeCompare(b.room_number + b.suffix, undefined, { numeric: true })));
    const floors = Array.from(byFloor.entries()).sort((a, b) => a[0] - b[0]);

    const html = `
      <div class="grid-wrap">
        <table class="vacancy-table">
          <thead>
            <tr>
              <th class="room-col">Room</th>
              ${slots.map(s => {
                const status = slotStatus(s, dateInput.value);
                const cls = status === 'current' ? 'slot-current' : '';
                return `
                  <th class="${cls}">
                    <div>${escapeHtml(s.label ?? s.slot_id)}</div>
                    <div style="font-size:10px;color:var(--text-muted);font-weight:400;margin-top:2px">${s.start_time.slice(0,5)}–${s.end_time.slice(0,5)}</div>
                  </th>`;
              }).join('')}
            </tr>
          </thead>
          <tbody>
            ${floors.map(([floor, rows]) => `
              <tr class="floor-row"><td colspan="${slots.length + 1}"><i class="fas fa-layer-group"></i>Floor ${floor}</td></tr>
              ${rows.map(r => `
                <tr>
                  <td class="room-cell">
                    <div class="mono">${escapeHtml(r.display_name)}</div>
                    <div class="meta">${escapeHtml(r.type)}${r.capacity ? ' · ' + r.capacity + ' seats' : ''}${r.weekend_open ? ' · weekend' : ''}</div>
                  </td>
                  ${slots.map(s => {
                    const busy = taken.has(`${r.room_id}|${s.slot_id}`);
                    const status = slotStatus(s, dateInput.value);
                    const isPast = status === 'ended' || status === 'past-day';
                    const isCurrent = status === 'current';
                    return `<td class="slot-cell ${isCurrent ? 'cell-current-col' : ''}">
                      <div class="${busy ? 'cell-busy' : 'cell-free'}${isPast ? ' cell-past' : ''}">${busy ? '·' : 'free'}</div>
                    </td>`;
                  }).join('')}
                </tr>
              `).join('')}
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
    $('gridContainer').innerHTML = html;
  }

  function tickClock() {
    $('liveClock').textContent = formatTime(nowDate());
    const cur = getCurrentSlot();
    const newId = cur ? cur.slot_id : null;
    if (newId !== currentSlotId) {
      currentSlotId = newId;
      render();
    }
  }
  setInterval(tickClock, 1000);
  tickClock();

  setInterval(() => { if (!document.hidden) loadBookings(); }, 60_000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) loadBookings();
  });

  await loadBookings();
})();
</script>
</body>
</html>
