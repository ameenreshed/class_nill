<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free rooms · amnrd.scheduler</title>
<script>
(function(){
  try {
    var t = localStorage.getItem('theme');
    if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-building" style="color:var(--orange);margin-right:6px"></i>Free rooms</h1>
      <p class="page-subtitle">Green = free to use. Red = already booked.</p>
    </div>
    <div class="row">
      <input class="input" type="date" id="dateInput" style="width:auto">
      <button class="btn btn-primary" id="loadBtn"><i class="fas fa-arrow-right"></i> Go</button>
    </div>
  </div>

  <div class="grid-toolbar" id="buildingTabs"></div>
  <div id="gridContainer"></div>
</div>

<script type="module">
import { requireRole, renderNav, supabase, todayISO, escapeHtml } from './js/core.js';

(async () => {
  const auth = await requireRole(['student', 'faculty', 'admin']);
  if (!auth) return;
  renderNav(auth.profile);

  const dateInput = document.getElementById('dateInput');
  dateInput.value = todayISO();

  let rooms = [], slots = [], bookings = [], building = 'all';

  const [{ data: roomData }, { data: slotData }] = await Promise.all([
    supabase.from('rooms').select('*').eq('bookable', true).order('building').order('floor'),
    supabase.from('time_slots').select('*').order('start_time'),
  ]);
  rooms = roomData ?? [];
  slots = slotData ?? [];

  async function loadBookings() {
    const { data } = await supabase
      .from('bookings')
      .select('room_id,slot_id')
      .eq('book_date', dateInput.value)
      .in('status', ['pending', 'approved']);
    bookings = data ?? [];
    render();
  }

  document.getElementById('loadBtn').onclick = loadBookings;
  dateInput.onchange = loadBookings;

  function renderTabs() {
    const el = document.getElementById('buildingTabs');
    const buildings = Array.from(new Set(rooms.map(r => r.building))).sort();
    el.innerHTML = `
      <button class="btn ${building === 'all' ? 'active' : ''}" data-b="all">
        <i class="fas fa-layer-group"></i> All blocks
      </button>
      ${buildings.map(b => `
        <button class="btn ${building === b ? 'active' : ''}" data-b="${b}">
          <i class="fas fa-building"></i> Block ${b}
        </button>
      `).join('')}
    `;
    el.querySelectorAll('button').forEach(btn => {
      btn.onclick = () => { building = btn.dataset.b; render(); };
    });
  }

  function render() {
    renderTabs();
    const taken = new Set(bookings.map(b => `${b.room_id}|${b.slot_id}`));
    const filtered = building === 'all' ? rooms : rooms.filter(r => r.building === building);

    if (!filtered.length) {
      document.getElementById('gridContainer').innerHTML =
        '<div class="empty"><i class="fas fa-door-closed"></i>No rooms in this block yet.</div>';
      return;
    }

    const byFloor = new Map();
    filtered.forEach(r => {
      if (!byFloor.has(r.floor)) byFloor.set(r.floor, []);
      byFloor.get(r.floor).push(r);
    });
    byFloor.forEach(arr => arr.sort((a, b) =>
      (a.room_number + a.suffix).localeCompare(b.room_number + b.suffix, undefined, { numeric: true })
    ));
    const floors = Array.from(byFloor.entries()).sort((a, b) => a[0] - b[0]);

    const html = `
      <div class="grid-wrap">
        <table class="vacancy-table">
          <thead>
            <tr>
              <th class="room-col">Room</th>
              ${slots.map(s => `
                <th>
                  <div>${escapeHtml(s.label ?? s.slot_id)}</div>
                  <div style="font-size:10px;color:var(--dim);font-weight:400">
                    ${s.start_time.slice(0,5)}–${s.end_time.slice(0,5)}
                  </div>
                </th>
              `).join('')}
            </tr>
          </thead>
          <tbody>
            ${floors.map(([floor, rows]) => `
              <tr class="floor-row">
                <td colspan="${slots.length + 1}"><i class="fas fa-layer-group"></i>Floor ${floor}</td>
              </tr>
              ${rows.map(r => `
                <tr>
                  <td class="room-cell">
                    <div class="mono">${escapeHtml(r.display_name)}</div>
                    <div class="meta">
                      ${escapeHtml(r.type)}${r.capacity ? ' · ' + r.capacity + ' seats' : ''}
                      ${r.weekend_open ? ' · weekend' : ''}
                    </div>
                  </td>
                  ${slots.map(s => {
                    const busy = taken.has(`${r.room_id}|${s.slot_id}`);
                    return `<td class="slot-cell"><div class="${busy ? 'cell-busy' : 'cell-free'}">${busy ? '·' : 'free'}</div></td>`;
                  }).join('')}
                </tr>
              `).join('')}
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
    document.getElementById('gridContainer').innerHTML = html;
  }

  await loadBookings();
})();
</script>
</body>
</html>
