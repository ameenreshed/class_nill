<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<meta name="theme-color" content="#EA580C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-building"></i> Student dashboard</h1>
      <p class="page-subtitle">Welcome back, <strong id="welcomeName" style="color:var(--text)">…</strong></p>
    </div>
    <div class="row">
      <input class="input" type="date" id="dateInput" style="width:auto">
      <button class="btn btn-primary" id="loadBtn"><i class="fas fa-rotate-right"></i> Refresh</button>
    </div>
  </div>

  <div class="stats" id="stats">
    <div class="stat"><div class="skeleton" style="height:32px;width:40%;margin-bottom:12px"></div><div class="skeleton" style="height:12px;width:60%"></div></div>
    <div class="stat"><div class="skeleton" style="height:32px;width:40%;margin-bottom:12px"></div><div class="skeleton" style="height:12px;width:60%"></div></div>
    <div class="stat"><div class="skeleton" style="height:32px;width:40%;margin-bottom:12px"></div><div class="skeleton" style="height:12px;width:60%"></div></div>
  </div>

  <h2 class="card-title mt-8" style="margin-bottom:16px"><i class="fas fa-door-open"></i> Free rooms right now</h2>
  <div id="freeRooms"><div class="card" style="padding:32px"><div class="empty"><i class="fas fa-spinner fa-spin"></i>Loading…</div></div></div>
</div>

<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, todayISO, nowDate } from './js/core.js';

(async () => {
  const auth = await requireRole(['student', 'faculty', 'admin']);
  if (!auth) return;
  renderNav(auth.profile);

  const $ = id => document.getElementById(id);
  const dateInput = $('dateInput');
  dateInput.value = todayISO();

  const displayName = auth.profile.full_name || auth.profile.email || 'Student';
  $('welcomeName').textContent = displayName;

  let rooms = [], slots = [], bookings = [];

  async function loadMeta() {
    const [{ data: r }, { data: s }] = await Promise.all([
      supabase.from('rooms').select('*').eq('bookable', true).order('building').order('floor'),
      supabase.from('time_slots').select('*').eq('is_active', true).order('sort_order').order('start_time'),
    ]);
    rooms = r ?? [];
    slots = s ?? [];
  }

  async function loadBookings() {
    const { data } = await supabase.from('bookings')
      .select('room_id,slot_id,type,status')
      .eq('book_date', dateInput.value)
      .in('status', ['pending', 'approved']);
    bookings = data ?? [];
  }

  function currentSlot() {
    if (dateInput.value !== todayISO()) return null;
    const now = nowDate();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    const nowStr = `${hh}:${mm}:00`;
    return slots.find(s => nowStr >= s.start_time && nowStr < s.end_time) || null;
  }

  function render() {
    const slot = currentSlot();
    const bookedSet = new Set(bookings.map(b => `${b.room_id}|${b.slot_id}`));

    const totalRooms = rooms.length;
    const freeNow = slot ? rooms.filter(r => !bookedSet.has(`${r.room_id}|${slot.slot_id}`)).length : null;
    const bookedNow = slot ? rooms.length - freeNow : null;

    $('stats').innerHTML = `
      <div class="stat">
        <i class="fas fa-door-open stat-icon"></i>
        <div class="stat-value">${totalRooms}</div>
        <div class="stat-label">Total rooms</div>
      </div>
      <div class="stat">
        <i class="fas fa-circle-check stat-icon" style="color:var(--success)"></i>
        <div class="stat-value" style="color:var(--success)">${freeNow ?? '—'}</div>
        <div class="stat-label">Free right now</div>
      </div>
      <div class="stat">
        <i class="fas fa-lock stat-icon" style="color:var(--warning)"></i>
        <div class="stat-value" style="color:var(--warning)">${bookedNow ?? '—'}</div>
        <div class="stat-label">Booked right now</div>
      </div>
    `;

    if (!slot) {
      $('freeRooms').innerHTML = `<div class="card"><div class="empty"><i class="fas fa-clock"></i>No active period right now. Check back during class hours.</div></div>`;
      return;
    }

    const free = rooms.filter(r => !bookedSet.has(`${r.room_id}|${slot.slot_id}`));
    if (!free.length) {
      $('freeRooms').innerHTML = `<div class="card"><div class="empty"><i class="fas fa-door-closed"></i>All rooms are booked during this period.</div></div>`;
      return;
    }

    const byBuilding = new Map();
    free.forEach(r => {
      if (!byBuilding.has(r.building)) byBuilding.set(r.building, []);
      byBuilding.get(r.building).push(r);
    });

    const list = [...byBuilding.entries()].sort((a, b) => a[0].localeCompare(b[0]));
    $('freeRooms').innerHTML = `
      <div class="card">
        <div class="card-title" style="margin-bottom:12px">
          <i class="fas fa-clock"></i>
          ${escapeHtml(slot.label || slot.slot_id)} · ${slot.start_time.slice(0,5)}–${slot.end_time.slice(0,5)}
          <span class="badge badge-approved" style="margin-left:auto">${free.length} free</span>
        </div>
        ${list.map(([b, rs]) => `
          <div style="margin-bottom:16px">
            <div class="label-small" style="margin-bottom:8px"><i class="fas fa-building"></i> Block ${escapeHtml(b)}</div>
            <div class="chips">
              ${rs.sort((x,y) => x.display_name.localeCompare(y.display_name)).map(r =>
                `<span class="chip" style="cursor:default">
                  <i class="fas fa-door-open" style="color:var(--success)"></i>
                  ${escapeHtml(r.display_name)}
                  ${r.capacity ? `<span class="dim" style="font-size:10px;margin-left:4px">${r.capacity} seats</span>` : ''}
                </span>`
              ).join('')}
            </div>
          </div>
        `).join('')}
      </div>`;
  }

  async function reload() {
    await Promise.all([loadMeta(), loadBookings()]);
    render();
  }

  $('loadBtn').onclick = reload;
  dateInput.onchange = async () => { await loadBookings(); render(); };

  await reload();
  setInterval(() => { if (!document.hidden) reload(); }, 60_000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) reload(); });
})();
</script>
</body>
</html>
