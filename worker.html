<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maintenance · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .call-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:10px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;transition:all 160ms ease}
  .call-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
  .call-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .call-icon.open{background:var(--warning-soft);color:var(--warning)}
  .call-icon.assigned{background:var(--info-soft);color:var(--info)}
  .call-icon.in_progress{background:var(--brand-soft);color:var(--brand)}
  .call-icon.resolved{background:var(--success-soft);color:var(--success)}
  .call-icon.cancelled{background:var(--surface-active);color:var(--text-secondary)}
  .call-body{flex:1;min-width:200px}
  .call-title{font-size:14px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .call-meta{font-size:12px;color:var(--text-secondary);display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}
  .call-meta span{display:inline-flex;align-items:center;gap:5px}
  .call-issue{font-size:13px;color:var(--text);margin-top:8px;padding:8px 10px;background:var(--surface-hover);border-radius:6px;border-left:3px solid var(--border-strong);line-height:1.5}
  .call-resolution{font-size:13px;color:var(--text);margin-top:6px;padding:8px 10px;background:var(--success-soft);border-radius:6px;border-left:3px solid var(--success);line-height:1.5}
  .call-actions{display:flex;gap:6px;flex-direction:column;flex-shrink:0;flex-wrap:wrap}
</style>
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-screwdriver-wrench"></i> Maintenance queue</h1>
      <p class="page-subtitle">Issues reported by faculty. Take, work, resolve. Block rooms for long repairs.</p>
    </div>
    <div class="row">
      <button class="btn" id="blockRoomBtn"><i class="fas fa-door-open"></i> Block room</button>
      <button class="btn" id="refreshBtn"><i class="fas fa-rotate-right"></i> Refresh</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="row" style="margin-bottom:16px">
    <div class="chips" id="filterChips">
      <button class="chip on" data-f="active">Active</button>
      <button class="chip" data-f="mine">Assigned to me</button>
      <button class="chip" data-f="open">Open</button>
      <button class="chip" data-f="in_progress">In progress</button>
      <button class="chip" data-f="resolved">Resolved</button>
      <button class="chip" data-f="all">All</button>
    </div>
    <div class="search-wrap" style="margin-left:auto;max-width:360px">
      <i class="fas fa-search search-icon"></i>
      <input class="input" id="search" placeholder="Search issue, room…">
    </div>
  </div>

  <div id="callsList"></div>
</div>

<script type="module">
import {
  requireRole, renderNav, supabase, escapeHtml, toast, formatRelativeTime,
  todayISO, loadBaseData
} from './js/core.js';

(async () => {
  const auth = await requireRole(['worker', 'admin']);
  if (!auth) return;
  renderNav(auth.profile);
  const $ = id => document.getElementById(id);
  const myId = auth.session.user.id;
  const isAdmin = auth.profile.role === 'admin';

  let base = { rooms: [], slots: [] };
  let allCalls = [], workers = [];
  let filter = 'active', search = '';

  async function loadAll() {
    base = await loadBaseData();
    const [{ data: calls }, { data: ws }] = await Promise.all([
      supabase.from('worker_calls').select('*').order('created_at', { ascending: false }).limit(200),
      supabase.from('profiles').select('id, full_name, email').eq('role', 'worker'),
    ]);
    allCalls = calls ?? [];
    workers = ws ?? [];
    renderStats();
    render();
  }

  function renderStats() {
    const active = allCalls.filter(c => ['open','assigned','in_progress'].includes(c.status));
    const mine = allCalls.filter(c => c.assigned_to === myId && ['assigned','in_progress'].includes(c.status));
    const inProg = allCalls.filter(c => c.status === 'in_progress');
    const today = todayISO();
    const resolvedToday = allCalls.filter(c =>
      c.status === 'resolved' && c.resolved_at && c.resolved_at.slice(0,10) === today);
    $('stats').innerHTML = `
      <div class="stat"><i class="fas fa-inbox stat-icon"></i><div class="stat-value">${active.length}</div><div class="stat-label">Active</div></div>
      <div class="stat"><i class="fas fa-user-check stat-icon" style="color:var(--info)"></i><div class="stat-value" style="color:var(--info)">${mine.length}</div><div class="stat-label">Assigned to me</div></div>
      <div class="stat"><i class="fas fa-spinner stat-icon" style="color:var(--warning)"></i><div class="stat-value" style="color:var(--warning)">${inProg.length}</div><div class="stat-label">In progress</div></div>
      <div class="stat"><i class="fas fa-circle-check stat-icon" style="color:var(--success)"></i><div class="stat-value" style="color:var(--success)">${resolvedToday.length}</div><div class="stat-label">Resolved today</div></div>`;
  }

  function filtered() {
    let list = allCalls;
    if (filter === 'active') list = list.filter(c => ['open','assigned','in_progress'].includes(c.status));
    else if (filter === 'mine') list = list.filter(c => c.assigned_to === myId && ['assigned','in_progress'].includes(c.status));
    else if (filter === 'open') list = list.filter(c => c.status === 'open');
    else if (filter === 'in_progress') list = list.filter(c => c.status === 'in_progress');
    else if (filter === 'resolved') list = list.filter(c => c.status === 'resolved');
    if (search) {
      const q = search.toLowerCase();
      list = list.filter(c =>
        (c.issue || '').toLowerCase().includes(q) ||
        (c.room_id || '').toLowerCase().includes(q));
    }
    return list;
  }

  function render() {
    const list = filtered();
    const roomById = new Map(base.rooms.map(r => [r.room_id, r]));
    const workerById = new Map(workers.map(w => [w.id, w]));

    if (!list.length) {
      $('callsList').innerHTML = `<div class="card"><div class="empty-action">
        <div class="empty-action-icon"><i class="fas fa-check-circle"></i></div>
        <div class="empty-action-title">Nothing here</div>
        <div class="empty-action-sub">No calls match this filter.</div>
      </div></div>`;
      return;
    }

    const statusBadge = { open:'pending', assigned:'admin', in_progress:'pending', resolved:'approved', cancelled:'gray' };

    $('callsList').innerHTML = list.map(c => {
      const room = roomById.get(c.room_id);
      const assigned = workerById.get(c.assigned_to);
      const prioClass = c.priority === 'urgent' ? 'rejected'
                      : c.priority === 'high' ? 'pending'
                      : c.priority === 'low' ? 'gray'
                      : 'admin';

      const actions = [];
      if (c.status === 'open') {
        actions.push(`<button class="btn btn-sm btn-primary" data-take="${c.id}"><i class="fas fa-hand"></i> Take</button>`);
      }
      if (c.status === 'assigned' && c.assigned_to === myId) {
        actions.push(`<button class="btn btn-sm btn-success" data-start="${c.id}"><i class="fas fa-play"></i> Start</button>`);
        actions.push(`<button class="btn btn-sm" data-release="${c.id}"><i class="fas fa-times"></i> Release</button>`);
      }
      if (c.status === 'in_progress' && c.assigned_to === myId) {
        actions.push(`<button class="btn btn-sm btn-success" data-resolve="${c.id}"><i class="fas fa-check"></i> Resolve</button>`);
      }
      if (c.status === 'open' && isAdmin) {
        actions.push(`<button class="btn btn-sm btn-danger" data-cancel="${c.id}"><i class="fas fa-ban"></i> Cancel</button>`);
      }

      return `<div class="call-card">
        <div class="call-icon ${c.status}">
          <i class="fas ${c.status === 'resolved' ? 'fa-circle-check' : c.status === 'in_progress' ? 'fa-spinner' : c.status === 'assigned' ? 'fa-user-check' : c.status === 'cancelled' ? 'fa-ban' : 'fa-inbox'}"></i>
        </div>
        <div class="call-body">
          <div class="call-title">
            ${escapeHtml(room?.display_name || c.room_id || '—')}
            <span class="badge badge-${prioClass}">${escapeHtml(c.priority)}</span>
            <span class="badge badge-${statusBadge[c.status] || 'gray'}">${c.status.replace('_',' ')}</span>
          </div>
          <div class="call-meta">
            <span><i class="fas fa-clock"></i> ${formatRelativeTime(c.created_at)}</span>
            ${assigned
              ? `<span><i class="fas fa-user"></i> ${escapeHtml(assigned.full_name || assigned.email)}</span>`
              : `<span><i class="fas fa-user"></i> Unassigned</span>`}
            ${c.resolved_at ? `<span><i class="fas fa-check"></i> Resolved ${formatRelativeTime(c.resolved_at)}</span>` : ''}
          </div>
          <div class="call-issue">${escapeHtml(c.issue)}</div>
          ${c.resolution ? `<div class="call-resolution"><strong>Resolution:</strong> ${escapeHtml(c.resolution)}</div>` : ''}
        </div>
        ${actions.length ? `<div class="call-actions">${actions.join('')}</div>` : ''}
      </div>`;
    }).join('');

    document.querySelectorAll('[data-take]').forEach(btn =>
      btn.onclick = () => updateCall(btn.dataset.take, { status: 'assigned', assigned_to: myId }, 'Call taken'));
    document.querySelectorAll('[data-start]').forEach(btn =>
      btn.onclick = () => updateCall(btn.dataset.start, { status: 'in_progress' }, 'Work started'));
    document.querySelectorAll('[data-release]').forEach(btn =>
      btn.onclick = () => updateCall(btn.dataset.release, { status: 'open', assigned_to: null }, 'Released'));
    document.querySelectorAll('[data-cancel]').forEach(btn => btn.onclick = async () => {
      if (!confirm('Cancel this call?')) return;
      await updateCall(btn.dataset.cancel, { status: 'cancelled' }, 'Cancelled');
    });
    document.querySelectorAll('[data-resolve]').forEach(btn =>
      btn.onclick = () => openResolve(btn.dataset.resolve));
  }

  async function updateCall(id, patch, msg) {
    const { error } = await supabase.from('worker_calls').update(patch).eq('id', id);
    if (error) return toast(error.message, 'error');
    toast(msg, 'success');
    await loadAll();
  }

  function openResolve(id) {
    const call = allCalls.find(c => c.id === id);
    if (!call) return;
    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content">
      <div class="modal-header">
        <div>
          <div class="modal-title">Resolve call</div>
          <div class="modal-sub">${escapeHtml(call.issue.slice(0, 80))}${call.issue.length > 80 ? '…' : ''}</div>
        </div>
        <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <label class="field"><span>Resolution notes *</span>
          <textarea class="input" id="resNotes" rows="4" placeholder="What did you do? Parts replaced? Follow-up needed?"></textarea>
        </label>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close>Cancel</button>
        <button class="btn btn-success" id="resSubmit"><i class="fas fa-check"></i> Mark resolved</button>
      </div>
    </div>`;
    document.body.appendChild(dialog); dialog.showModal();
    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
    dialog.querySelector('#resSubmit').onclick = async () => {
      const notes = dialog.querySelector('#resNotes').value.trim();
      if (!notes) return toast('Add resolution notes', 'error');
      const btn = dialog.querySelector('#resSubmit');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      const { error } = await supabase.from('worker_calls').update({
        status: 'resolved',
        resolution: notes,
        resolved_at: new Date().toISOString(),
      }).eq('id', id);
      btn.disabled = false;
      if (error) {
        toast(error.message, 'error');
        btn.innerHTML = '<i class="fas fa-check"></i> Mark resolved';
        return;
      }
      toast('Resolved', 'success');
      close();
      await loadAll();
    };
  }

  /* ============ BLOCK ROOM FOR MAINTENANCE ============ */
  $('blockRoomBtn').onclick = () => {
    if (!base.rooms.length || !base.slots.length) return toast('Admin must configure rooms and slots first', 'error');
    const slotOpts = base.slots.map(s =>
      `<option value="${escapeHtml(s.slot_id)}">${escapeHtml(s.label || s.slot_id)} (${s.start_time.slice(0,5)}–${s.end_time.slice(0,5)})</option>`).join('');
    const roomOpts = base.rooms.map(r =>
      `<option value="${escapeHtml(r.room_id)}">${escapeHtml(r.display_name)}</option>`).join('');

    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content">
      <div class="modal-header">
        <div>
          <div class="modal-title">Block room for maintenance</div>
          <div class="modal-sub">Room will show as Maint on the grid — faculty can't book it.</div>
        </div>
        <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <label class="field"><span>Room *</span><select class="input" id="blRoom">${roomOpts}</select></label>
        <label class="field"><span>Date *</span><input class="input" type="date" id="blDate" value="${todayISO()}" min="${todayISO()}"></label>
        <label class="field"><span>Period *</span><select class="input" id="blSlot">${slotOpts}</select></label>
        <label class="field"><span>Reason</span><input class="input" id="blReason" placeholder="e.g. AC replacement, deep clean"></label>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close>Cancel</button>
        <button class="btn btn-primary" id="blSubmit"><i class="fas fa-check"></i> Block</button>
      </div>
    </div>`;
    document.body.appendChild(dialog); dialog.showModal();
    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };

    dialog.querySelector('#blSubmit').onclick = async () => {
      const room = dialog.querySelector('#blRoom').value;
      const date = dialog.querySelector('#blDate').value;
      const slot = dialog.querySelector('#blSlot').value;
      const reason = dialog.querySelector('#blReason').value.trim();
      if (!room || !date || !slot) return toast('Fill all fields', 'error');
      const btn = dialog.querySelector('#blSubmit');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      const { error } = await supabase.from('bookings').insert({
        room_id: room, book_date: date, slot_id: slot,
        type: 'maintenance', status: 'approved',
        created_by: myId, reason: reason || 'Maintenance block',
      });
      btn.disabled = false;
      if (error) {
        toast(error.message, 'error');
        btn.innerHTML = '<i class="fas fa-check"></i> Block';
        return;
      }
      toast('Room blocked', 'success');
      close();
    };
  };

  document.querySelectorAll('[data-f]').forEach(btn => btn.onclick = () => {
    filter = btn.dataset.f;
    document.querySelectorAll('[data-f]').forEach(b => b.classList.toggle('on', b === btn));
    render();
  });
  $('search').oninput = e => { search = e.target.value.trim(); render(); };
  $('refreshBtn').onclick = loadAll;

  await loadAll();
  setInterval(() => { if (!document.hidden) loadAll(); }, 30_000);
})();
</script>
</body>
</html>
