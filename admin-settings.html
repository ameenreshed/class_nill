<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · amnrd.scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<meta name="theme-color" content="#EA580C">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-gear"></i> Settings</h1>
      <p class="page-subtitle">Buildings, floors, room types, time slots, activity.</p>
    </div>
  </div>

  <div class="grid-toolbar" id="tabs" style="margin-top:20px">
    <button class="chip on" data-tab="buildings"><i class="fas fa-building"></i> Buildings &amp; floors</button>
    <button class="chip" data-tab="types"><i class="fas fa-shapes"></i> Room types</button>
    <button class="chip" data-tab="slots"><i class="fas fa-clock"></i> Time slots</button>
    <button class="chip" data-tab="activity"><i class="fas fa-list-check"></i> Activity log</button>
  </div>

  <div id="tabContent" class="mt-6">
    <div class="card" style="padding:32px"><div class="empty"><i class="fas fa-spinner fa-spin"></i>Loading…</div></div>
  </div>
</div>

<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, toast, formatRelativeTime,
         openModal, openFormModal, confirmDialog } from './js/core.js';

(async () => {
  const auth = await requireRole(['admin']);
  if (!auth) return;
  renderNav(auth.profile, [
    { label: 'Add building', icon: 'fa-building-circle-arrow-right', keywords: 'new block', action: () => { switchTab('buildings'); setTimeout(() => addBuilding(), 300); } },
    { label: 'Add room type', icon: 'fa-shapes', keywords: 'new category', action: () => { switchTab('types'); setTimeout(() => addType(), 300); } },
    { label: 'Add time slot', icon: 'fa-clock', keywords: 'new period', action: () => { switchTab('slots'); setTimeout(() => addSlot(), 300); } },
  ]);

  const $ = id => document.getElementById(id);
  let currentTab = 'buildings';

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    render();
  }

  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.onclick = () => switchTab(btn.dataset.tab);
  });

  const ICON_OPTIONS = [
    'fa-door-open', 'fa-chalkboard-user', 'fa-flask', 'fa-users-rectangle', 'fa-book',
    'fa-user-tie', 'fa-crown', 'fa-briefcase', 'fa-box', 'fa-restroom', 'fa-ellipsis',
    'fa-computer', 'fa-microscope', 'fa-music', 'fa-palette', 'fa-dumbbell', 'fa-utensils',
    'fa-graduation-cap', 'fa-tv', 'fa-desktop', 'fa-warehouse', 'fa-people-group',
  ];

  // ============================================================
  // BUILDINGS & FLOORS
  // ============================================================
  async function renderBuildings() {
    const [{ data: buildings }, { data: floors }, { data: rooms }] = await Promise.all([
      supabase.from('buildings').select('*').order('sort_order').order('id'),
      supabase.from('building_floors').select('*').order('floor'),
      supabase.from('rooms').select('building,floor'),
    ]);

    const roomCount = new Map();
    (rooms ?? []).forEach(r => {
      const k = `${r.building}|${r.floor}`;
      roomCount.set(k, (roomCount.get(k) || 0) + 1);
    });

    const floorsByBuilding = new Map();
    (floors ?? []).forEach(f => {
      if (!floorsByBuilding.has(f.building_id)) floorsByBuilding.set(f.building_id, []);
      floorsByBuilding.get(f.building_id).push(f);
    });

    $('tabContent').innerHTML = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px">
          <div>
            <h2 style="font-size:16px;font-weight:600;color:var(--text)">Buildings</h2>
            <p class="dim" style="font-size:12px;margin-top:2px">${(buildings ?? []).length} building${(buildings ?? []).length === 1 ? '' : 's'}</p>
          </div>
          <button class="btn btn-primary btn-sm" id="addBuildingBtn"><i class="fas fa-plus"></i> Add building</button>
        </div>

        <div id="buildingsList">
          ${(buildings ?? []).map(b => {
            const bFloors = floorsByBuilding.get(b.id) || [];
            return `
              <div class="card" style="margin-bottom:12px;padding:16px">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px">
                  <div style="min-width:0">
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                      <i class="fas fa-building" style="color:var(--brand)"></i>
                      <span style="font-weight:600;color:var(--text)">${escapeHtml(b.name || b.id)}</span>
                      <span class="badge badge-gray">${escapeHtml(b.id)}</span>
                      ${b.is_active ? '' : '<span class="badge badge-rejected"><i class="fas fa-ban"></i>inactive</span>'}
                    </div>
                    <div class="dim" style="font-size:12px;margin-top:4px">
                      ${bFloors.length} floor${bFloors.length === 1 ? '' : 's'} · ${b.address || 'No address'}
                    </div>
                  </div>
                  <div class="chips" style="flex-shrink:0">
                    <button class="btn btn-sm" data-edit-b="${escapeHtml(b.id)}" title="Edit"><i class="fas fa-pen"></i></button>
                    <button class="btn btn-sm ${b.is_active ? 'btn-danger' : 'btn-success'}" data-toggle-b="${escapeHtml(b.id)}" data-active="${b.is_active}" title="${b.is_active ? 'Deactivate' : 'Activate'}">
                      <i class="fas fa-${b.is_active ? 'eye-slash' : 'eye'}"></i>
                    </button>
                  </div>
                </div>
                <div class="label-small" style="margin-bottom:8px">Floors</div>
                <div class="chips">
                  ${bFloors.map(f => {
                    const cnt = roomCount.get(`${b.id}|${f.floor}`) || 0;
                    return `
                      <span class="chip" style="cursor:default">
                        <i class="fas fa-layer-group"></i> Floor ${f.floor}
                        <span class="dim" style="font-size:10px;margin-left:4px">${cnt} room${cnt === 1 ? '' : 's'}</span>
                        <button data-del-floor="${escapeHtml(f.id)}" style="background:none;border:none;color:var(--danger);cursor:pointer;padding:0 0 0 6px;font-size:11px" title="Remove floor">
                          <i class="fas fa-xmark"></i>
                        </button>
                      </span>`;
                  }).join('') || '<span class="dim" style="font-size:12px">No floors yet</span>'}
                  <button class="chip" data-add-floor="${escapeHtml(b.id)}">
                    <i class="fas fa-plus"></i> Add floor
                  </button>
                </div>
              </div>
            `;
          }).join('') || '<div class="empty"><i class="fas fa-building"></i>No buildings yet</div>'}
        </div>
      </div>
    `;

    $('addBuildingBtn').onclick = addBuilding;

    document.querySelectorAll('[data-edit-b]').forEach(btn => {
      btn.onclick = () => editBuilding((buildings ?? []).find(x => x.id === btn.dataset.editB));
    });
    document.querySelectorAll('[data-toggle-b]').forEach(btn => {
      btn.onclick = async () => {
        const active = btn.dataset.active === 'true';
        const { error } = await supabase.from('buildings').update({ is_active: !active }).eq('id', btn.dataset.toggleB);
        if (error) { toast(error.message, 'error'); return; }
        toast(`Building ${!active ? 'activated' : 'deactivated'}`, 'success');
        render();
      };
    });
    document.querySelectorAll('[data-add-floor]').forEach(btn => {
      btn.onclick = () => addFloor(btn.dataset.addFloor);
    });
    document.querySelectorAll('[data-del-floor]').forEach(btn => {
      btn.onclick = async () => {
        const ok = await confirmDialog({
          title: 'Remove floor?',
          message: 'Only allowed if no rooms exist on this floor.',
          confirmText: 'Remove',
          danger: true,
        });
        if (!ok) return;
        const { error } = await supabase.from('building_floors').delete().eq('id', btn.dataset.delFloor);
        if (error) { toast('Cannot remove: rooms exist on this floor', 'error'); return; }
        toast('Floor removed', 'success');
        render();
      };
    });
  }

  async function addBuilding() {
    const data = await openFormModal({
      title: 'Add building',
      saveText: 'Add building',
      fields: `
        <label class="field"><span>ID (e.g. 29)</span>
          <input class="input" data-field="id" placeholder="29">
        </label>
        <label class="field"><span>Name</span>
          <input class="input" data-field="name" placeholder="Block 29">
        </label>
        <label class="field"><span>Address (optional)</span>
          <input class="input" data-field="address">
        </label>
        <label class="field"><span>Sort order</span>
          <input class="input" data-field="sort_order" type="number" value="0">
        </label>
      `,
    });
    if (!data) return;
    if (!data.id.trim() || !data.name.trim()) { toast('ID and name required', 'error'); return; }
    const { error } = await supabase.from('buildings').insert({
      id: data.id.trim(),
      name: data.name.trim(),
      address: data.address.trim() || null,
      sort_order: parseInt(data.sort_order, 10) || 0,
    });
    if (error) { toast(error.message, 'error'); return; }
    toast('Building added', 'success');
    render();
  }

  async function editBuilding(b) {
    if (!b) return;
    const data = await openFormModal({
      title: `Edit ${b.id}`,
      saveText: 'Save',
      fields: `
        <label class="field"><span>Name</span>
          <input class="input" data-field="name" value="${escapeHtml(b.name || '')}">
        </label>
        <label class="field"><span>Address</span>
          <input class="input" data-field="address" value="${escapeHtml(b.address || '')}">
        </label>
        <label class="field"><span>Sort order</span>
          <input class="input" data-field="sort_order" type="number" value="${b.sort_order || 0}">
        </label>
      `,
    });
    if (!data) return;
    const { error } = await supabase.from('buildings').update({
      name: data.name.trim(),
      address: data.address.trim() || null,
      sort_order: parseInt(data.sort_order, 10) || 0,
    }).eq('id', b.id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Updated', 'success');
    render();
  }

  async function addFloor(buildingId) {
    const data = await openFormModal({
      title: `Add floor to Block ${buildingId}`,
      saveText: 'Add floor',
      fields: `
        <label class="field"><span>Floor number (1, 2, 3…)</span>
          <input class="input" data-field="floor" type="number" min="1" max="20" value="1">
        </label>
      `,
    });
    if (!data) return;
    const floor = parseInt(data.floor, 10);
    if (!floor || floor < 1) { toast('Floor must be ≥ 1', 'error'); return; }
    const { error } = await supabase.from('building_floors').insert({ building_id: buildingId, floor });
    if (error) { toast(error.message, 'error'); return; }
    toast(`Floor ${floor} added`, 'success');
    render();
  }

  // ============================================================
  // ROOM TYPES
  // ============================================================
  async function renderTypes() {
    const [{ data: types }, { data: rooms }] = await Promise.all([
      supabase.from('room_types').select('*').order('sort_order').order('id'),
      supabase.from('rooms').select('type'),
    ]);
    const countByType = new Map();
    (rooms ?? []).forEach(r => countByType.set(r.type, (countByType.get(r.type) || 0) + 1));

    $('tabContent').innerHTML = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px">
          <div>
            <h2 style="font-size:16px;font-weight:600;color:var(--text)">Room types</h2>
            <p class="dim" style="font-size:12px;margin-top:2px">${(types ?? []).length} type${(types ?? []).length === 1 ? '' : 's'}</p>
          </div>
          <button class="btn btn-primary btn-sm" id="addTypeBtn"><i class="fas fa-plus"></i> Add type</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Icon</th><th>Label</th><th>ID</th><th>Rooms</th>
                <th>Bookable</th><th>Status</th>
                <th style="text-align:right">Actions</th>
              </tr>
            </thead>
            <tbody>
              ${(types ?? []).map(t => `
                <tr>
                  <td style="font-size:18px;color:var(--brand)"><i class="fas ${escapeHtml(t.icon || 'fa-door-open')}"></i></td>
                  <td style="color:var(--text);font-weight:500">${escapeHtml(t.label)}</td>
                  <td class="mono dim">${escapeHtml(t.id)}</td>
                  <td class="dim">${countByType.get(t.id) || 0}</td>
                  <td>${t.bookable ? '<span class="badge badge-approved"><i class="fas fa-check"></i>yes</span>' : '<span class="badge badge-gray">no</span>'}</td>
                  <td>${t.is_active ? '<span class="badge badge-approved">active</span>' : '<span class="badge badge-rejected">hidden</span>'}</td>
                  <td style="text-align:right;white-space:nowrap">
                    <button class="btn btn-sm" data-edit-t="${escapeHtml(t.id)}" title="Edit"><i class="fas fa-pen"></i></button>
                    <button class="btn btn-sm ${t.is_active ? 'btn-danger' : 'btn-success'}" data-toggle-t="${escapeHtml(t.id)}" data-active="${t.is_active}" title="${t.is_active ? 'Deactivate' : 'Activate'}">
                      <i class="fas fa-${t.is_active ? 'eye-slash' : 'eye'}"></i>
                    </button>
                  </td>
                </tr>
              `).join('') || '<tr><td colspan="7" class="empty"><i class="fas fa-shapes"></i>No types configured</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `;

    $('addTypeBtn').onclick = addType;
    document.querySelectorAll('[data-edit-t]').forEach(btn => {
      btn.onclick = () => editType((types ?? []).find(x => x.id === btn.dataset.editT));
    });
    document.querySelectorAll('[data-toggle-t]').forEach(btn => {
      btn.onclick = async () => {
        const active = btn.dataset.active === 'true';
        const { error } = await supabase.from('room_types').update({ is_active: !active }).eq('id', btn.dataset.toggleT);
        if (error) { toast(error.message, 'error'); return; }
        toast('Updated', 'success');
        render();
      };
    });
  }

  async function addType() {
    const iconOpts = ICON_OPTIONS.map(i => `<option value="${i}">${i.replace('fa-', '')}</option>`).join('');
    const data = await openFormModal({
      title: 'Add room type',
      saveText: 'Add type',
      fields: `
        <label class="field"><span>Label</span>
          <input class="input" data-field="label" placeholder="Auditorium" id="typeLabel">
        </label>
        <label class="field"><span>ID (slug)</span>
          <input class="input" data-field="id" placeholder="auditorium" id="typeId">
        </label>
        <label class="field"><span>Icon</span>
          <select class="input" data-field="icon">${iconOpts}</select>
        </label>
        <label class="field"><span>Sort order</span>
          <input class="input" data-field="sort_order" type="number" value="0">
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary)">
          <input type="checkbox" data-field="bookable" checked> Bookable
        </label>
      `,
    });
    if (!data) return;
    if (!data.id.trim() || !data.label.trim()) { toast('ID and label required', 'error'); return; }
    const { error } = await supabase.from('room_types').insert({
      id: data.id.trim(),
      label: data.label.trim(),
      icon: data.icon,
      bookable: !!data.bookable,
      sort_order: parseInt(data.sort_order, 10) || 0,
    });
    if (error) { toast(error.message, 'error'); return; }
    toast('Type added', 'success');
    render();
  }

  async function editType(t) {
    if (!t) return;
    const iconOpts = ICON_OPTIONS.map(i => `<option value="${i}" ${t.icon === i ? 'selected' : ''}>${i.replace('fa-', '')}</option>`).join('');
    const data = await openFormModal({
      title: `Edit ${t.id}`,
      saveText: 'Save',
      fields: `
        <label class="field"><span>Label</span>
          <input class="input" data-field="label" value="${escapeHtml(t.label)}">
        </label>
        <label class="field"><span>Icon</span>
          <select class="input" data-field="icon">${iconOpts}</select>
        </label>
        <label class="field"><span>Sort order</span>
          <input class="input" data-field="sort_order" type="number" value="${t.sort_order || 0}">
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary)">
          <input type="checkbox" data-field="bookable" ${t.bookable ? 'checked' : ''}> Bookable
        </label>
      `,
    });
    if (!data) return;
    const { error } = await supabase.from('room_types').update({
      label: data.label.trim(),
      icon: data.icon,
      bookable: !!data.bookable,
      sort_order: parseInt(data.sort_order, 10) || 0,
    }).eq('id', t.id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Updated', 'success');
    render();
  }

  // ============================================================
  // TIME SLOTS
  // ============================================================
  async function renderSlots() {
    const [{ data: slots }, { data: bookings }] = await Promise.all([
      supabase.from('time_slots').select('*').order('sort_order').order('start_time'),
      supabase.from('bookings').select('slot_id'),
    ]);
    const countBySlot = new Map();
    (bookings ?? []).forEach(b => countBySlot.set(b.slot_id, (countBySlot.get(b.slot_id) || 0) + 1));

    $('tabContent').innerHTML = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px">
          <div>
            <h2 style="font-size:16px;font-weight:600;color:var(--text)">Time slots</h2>
            <p class="dim" style="font-size:12px;margin-top:2px">${(slots ?? []).length} slot${(slots ?? []).length === 1 ? '' : 's'}</p>
          </div>
          <button class="btn btn-primary btn-sm" id="addSlotBtn"><i class="fas fa-plus"></i> Add slot</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th><th>Label</th><th>Start</th><th>End</th>
                <th>Bookings</th><th>Status</th>
                <th style="text-align:right">Actions</th>
              </tr>
            </thead>
            <tbody>
              ${(slots ?? []).map(s => `
                <tr>
                  <td class="mono dim">${escapeHtml(s.slot_id)}</td>
                  <td style="color:var(--text);font-weight:500">${escapeHtml(s.label || '—')}</td>
                  <td class="mono">${String(s.start_time).slice(0, 5)}</td>
                  <td class="mono">${String(s.end_time).slice(0, 5)}</td>
                  <td class="dim">${countBySlot.get(s.slot_id) || 0}</td>
                  <td>${s.is_active !== false ? '<span class="badge badge-approved">active</span>' : '<span class="badge badge-rejected">hidden</span>'}</td>
                  <td style="text-align:right;white-space:nowrap">
                    <button class="btn btn-sm" data-edit-s="${escapeHtml(s.slot_id)}" title="Edit"><i class="fas fa-pen"></i></button>
                    <button class="btn btn-sm btn-danger" data-del-s="${escapeHtml(s.slot_id)}" title="Delete"><i class="fas fa-trash"></i></button>
                  </td>
                </tr>
              `).join('') || '<tr><td colspan="7" class="empty"><i class="fas fa-clock"></i>No slots configured</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `;

    $('addSlotBtn').onclick = addSlot;
    document.querySelectorAll('[data-edit-s]').forEach(btn => {
      btn.onclick = () => editSlot((slots ?? []).find(x => x.slot_id === btn.dataset.editS));
    });
    document.querySelectorAll('[data-del-s]').forEach(btn => {
      btn.onclick = async () => {
        const ok = await confirmDialog({
          title: 'Delete this slot?',
          message: 'Only allowed if no bookings reference it.',
          confirmText: 'Delete',
          danger: true,
        });
        if (!ok) return;
        const { error } = await supabase.from('time_slots').delete().eq('slot_id', btn.dataset.delS);
        if (error) { toast('Cannot delete: bookings exist', 'error'); return; }
        toast('Deleted', 'success');
        render();
      };
    });
  }

  async function addSlot() {
    const data = await openFormModal({
      title: 'Add time slot',
      saveText: 'Add slot',
      fields: `
        <label class="field"><span>Slot ID</span>
          <input class="input" data-field="slot_id" placeholder="P8">
        </label>
        <label class="field"><span>Label</span>
          <input class="input" data-field="label" placeholder="8th period">
        </label>
        <label class="field"><span>Start time</span>
          <input class="input" data-field="start_time" type="time" value="16:00">
        </label>
        <label class="field"><span>End time</span>
          <input class="input" data-field="end_time" type="time" value="16:50">
        </label>
        <label class="field"><span>Sort order</span>
          <input class="input" data-field="sort_order" type="number" value="0">
        </label>
      `,
    });
    if (!data) return;
    if (!data.slot_id.trim() || !data.start_time || !data.end_time) { toast('All fields required', 'error'); return; }
    if (data.start_time >= data.end_time) { toast('End must be after start', 'error'); return; }
    const { error } = await supabase.from('time_slots').insert({
      slot_id: data.slot_id.trim(),
      label: data.label.trim() || null,
      start_time: data.start_time + ':00',
      end_time: data.end_time + ':00',
      sort_order: parseInt(data.sort_order, 10) || 0,
    });
    if (error) { toast(error.message, 'error'); return; }
    toast('Slot added', 'success');
    render();
  }

  async function editSlot(s) {
    if (!s) return;
    const data = await openFormModal({
      title: `Edit ${s.slot_id}`,
      saveText: 'Save',
      fields: `
        <label class="field"><span>Label</span>
          <input class="input" data-field="label" value="${escapeHtml(s.label || '')}">
        </label>
        <label class="field"><span>Start time</span>
          <input class="input" data-field="start_time" type="time" value="${String(s.start_time).slice(0, 5)}">
        </label>
        <label class="field"><span>End time</span>
          <input class="input" data-field="end_time" type="time" value="${String(s.end_time).slice(0, 5)}">
        </label>
        <label class="field"><span>Sort order</span>
          <input class="input" data-field="sort_order" type="number" value="${s.sort_order || 0}">
        </label>
      `,
    });
    if (!data) return;
    const { error } = await supabase.from('time_slots').update({
      label: data.label.trim() || null,
      start_time: data.start_time + ':00',
      end_time: data.end_time + ':00',
      sort_order: parseInt(data.sort_order, 10) || 0,
    }).eq('slot_id', s.slot_id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Updated', 'success');
    render();
  }

  // ============================================================
  // ACTIVITY LOG
  // ============================================================
  async function renderActivity() {
    const { data: logs } = await supabase
      .from('activity_log')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(100);

    $('tabContent').innerHTML = `
      <div class="card">
        <div style="margin-bottom:20px">
          <h2 style="font-size:16px;font-weight:600;color:var(--text)">Recent activity</h2>
          <p class="dim" style="font-size:12px;margin-top:2px">Last 100 actions across the system</p>
        </div>
        <div class="timeline">
          ${(logs ?? []).map(l => `
            <div class="timeline-item">
              <div class="timeline-marker">
                <i class="fas ${
                  l.action === 'auth.login' ? 'fa-right-to-bracket' :
                  l.action?.startsWith('user.') ? 'fa-user-pen' :
                  l.action?.startsWith('room.') ? 'fa-door-open' :
                  l.action?.startsWith('booking.') ? 'fa-calendar-check' :
                  'fa-circle'
                }"></i>
              </div>
              <div class="timeline-content">
                <div class="timeline-title">
                  <span class="mono" style="font-weight:500">${escapeHtml(l.action)}</span>
                  ${l.entity_id ? `<span class="dim" style="margin-left:8px">${escapeHtml(l.entity_id)}</span>` : ''}
                </div>
                <div class="timeline-meta">${escapeHtml(l.user_email || 'system')} · ${formatRelativeTime(l.created_at)}</div>
              </div>
            </div>
          `).join('') || '<div class="empty"><i class="fas fa-list-check"></i>No activity yet</div>'}
        </div>
      </div>
    `;
  }

  // ============================================================
  // ROUTER
  // ============================================================
  async function render() {
    if (currentTab === 'buildings') await renderBuildings();
    else if (currentTab === 'types') await renderTypes();
    else if (currentTab === 'slots') await renderSlots();
    else if (currentTab === 'activity') await renderActivity();
  }

  await render();
})();
</script>
</body>
</html>
