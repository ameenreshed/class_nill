<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-gear"></i> Settings</h1>
      <p class="page-subtitle">Buildings · Sections · Time slots · Academic calendar</p>
    </div>
  </div>

  <div class="grid-toolbar" id="tabs">
    <button class="chip on" data-tab="buildings"><i class="fas fa-building"></i> Buildings</button>
    <button class="chip" data-tab="sections"><i class="fas fa-users-rectangle"></i> Sections</button>
    <button class="chip" data-tab="slots"><i class="fas fa-clock"></i> Time slots</button>
    <button class="chip" data-tab="calendar"><i class="fas fa-calendar-days"></i> Calendar</button>
  </div>

  <div id="panel" class="mt-4"><div class="card" style="padding:32px"><div class="empty"><i class="fas fa-spinner fa-spin"></i>Loading…</div></div></div>
</div>

<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, toast } from './js/core.js';

(async () => {
  const auth = await requireRole(['admin']);
  if (!auth) return;
  renderNav(auth.profile);

  const $ = id => document.getElementById(id);
  let currentTab = 'buildings';

  /* ==== modal helper ==== */
  function openModal({ title, fields, onSave }) {
    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog';
    dialog.innerHTML = `
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title">${escapeHtml(title)}</div>
          <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
        </div>
        <div class="modal-body">${fields}</div>
        <div class="modal-footer">
          <button class="btn" data-close>Cancel</button>
          <button class="btn btn-primary" data-save>Save</button>
        </div>
      </div>`;
    document.body.appendChild(dialog);
    dialog.showModal();
    const get = f => dialog.querySelector(`[data-field="${f}"]`)?.value ?? '';
    dialog.querySelector('[data-save]').onclick = async () => {
      const ok = await onSave(get);
      if (ok) { dialog.close(); dialog.remove(); render(); }
    };
    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  /* ==== BUILDINGS ==== */
  async function renderBuildings() {
    const [{ data: b }, { data: r }] = await Promise.all([
      supabase.from('buildings').select('*').order('sort_order').order('id'),
      supabase.from('rooms').select('building'),
    ]);
    const counts = new Map();
    (r ?? []).forEach(x => counts.set(x.building, (counts.get(x.building) || 0) + 1));

    $('panel').innerHTML = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <div><h2 style="font-size:16px;font-weight:600">Buildings</h2><p class="dim" style="font-size:12px">${(b ?? []).length} total</p></div>
          <button class="btn btn-primary btn-sm" id="addB"><i class="fas fa-plus"></i> Add building</button>
        </div>
        <table style="width:100%">
          <thead><tr><th>ID</th><th>Name</th><th>Address</th><th>Rooms</th><th>Active</th><th style="text-align:right">Actions</th></tr></thead>
          <tbody>
            ${(b ?? []).map(x => `
              <tr>
                <td class="mono">${escapeHtml(x.id)}</td>
                <td>${escapeHtml(x.name)}</td>
                <td class="dim">${escapeHtml(x.address || '—')}</td>
                <td>${counts.get(x.id) || 0}</td>
                <td>${x.is_active ? '<span class="badge badge-approved">yes</span>' : '<span class="badge badge-rejected">no</span>'}</td>
                <td style="text-align:right;white-space:nowrap">
                  <button class="btn btn-sm" data-edit="${escapeHtml(x.id)}"><i class="fas fa-pen"></i></button>
                  <button class="btn btn-sm ${x.is_active ? 'btn-danger' : 'btn-success'}" data-toggle="${escapeHtml(x.id)}" data-active="${x.is_active}"><i class="fas fa-${x.is_active ? 'eye-slash' : 'eye'}"></i></button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;

    $('addB').onclick = () => openModal({
      title: 'Add building',
      fields: `
        <label class="field"><span>ID</span><input class="input" data-field="id" placeholder="34"></label>
        <label class="field"><span>Name</span><input class="input" data-field="name" placeholder="Block 34"></label>
        <label class="field"><span>Address</span><input class="input" data-field="address"></label>
        <label class="field"><span>Sort order</span><input class="input" type="number" data-field="sort_order" value="0"></label>`,
      onSave: async (get) => {
        const id = get('id').trim(), name = get('name').trim();
        if (!id || !name) { toast('ID and name required', 'error'); return false; }
        const { error } = await supabase.from('buildings').insert({ id, name, address: get('address').trim() || null, sort_order: parseInt(get('sort_order')) || 0 });
        if (error) { toast(error.message, 'error'); return false; }
        toast('Added', 'success'); return true;
      },
    });

    document.querySelectorAll('[data-edit]').forEach(bn => bn.onclick = () => {
      const x = (b ?? []).find(v => v.id === bn.dataset.edit);
      if (!x) return;
      openModal({
        title: `Edit ${x.id}`,
        fields: `
          <label class="field"><span>Name</span><input class="input" data-field="name" value="${escapeHtml(x.name)}"></label>
          <label class="field"><span>Address</span><input class="input" data-field="address" value="${escapeHtml(x.address || '')}"></label>
          <label class="field"><span>Sort</span><input class="input" type="number" data-field="sort_order" value="${x.sort_order || 0}"></label>`,
        onSave: async (get) => {
          const { error } = await supabase.from('buildings').update({ name: get('name').trim(), address: get('address').trim() || null, sort_order: parseInt(get('sort_order')) || 0 }).eq('id', x.id);
          if (error) { toast(error.message, 'error'); return false; }
          toast('Updated', 'success'); return true;
        },
      });
    });

    document.querySelectorAll('[data-toggle]').forEach(bn => bn.onclick = async () => {
      const { error } = await supabase.from('buildings').update({ is_active: bn.dataset.active !== 'true' }).eq('id', bn.dataset.toggle);
      if (error) return toast(error.message, 'error');
      toast('Updated', 'success'); render();
    });
  }

  /* ==== SECTIONS ==== */
  async function renderSections() {
    const [{ data: s }, { data: p }] = await Promise.all([
      supabase.from('sections').select('*').order('section_id'),
      supabase.from('profiles').select('section_id').eq('role', 'student'),
    ]);
    const counts = new Map();
    (p ?? []).forEach(x => { if (x.section_id) counts.set(x.section_id, (counts.get(x.section_id) || 0) + 1); });

    $('panel').innerHTML = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <div><h2 style="font-size:16px;font-weight:600">Sections / Batches</h2><p class="dim" style="font-size:12px">${(s ?? []).length} total</p></div>
          <button class="btn btn-primary btn-sm" id="addS"><i class="fas fa-plus"></i> Add section</button>
        </div>
        <table style="width:100%">
          <thead><tr><th>ID</th><th>Name</th><th>Strength</th><th>Dept</th><th>Students</th><th style="text-align:right">Actions</th></tr></thead>
          <tbody>
            ${(s ?? []).map(x => `
              <tr>
                <td class="mono">${escapeHtml(x.section_id)}</td>
                <td>${escapeHtml(x.name)}</td>
                <td>${x.strength || '—'}</td>
                <td class="dim">${escapeHtml(x.department || '—')}</td>
                <td>${counts.get(x.section_id) || 0}</td>
                <td style="text-align:right;white-space:nowrap">
                  <button class="btn btn-sm" data-edit="${escapeHtml(x.section_id)}"><i class="fas fa-pen"></i></button>
                  <button class="btn btn-sm btn-danger" data-del="${escapeHtml(x.section_id)}"><i class="fas fa-trash"></i></button>
                </td>
              </tr>`).join('') || '<tr><td colspan="6" class="empty">No sections</td></tr>'}
          </tbody>
        </table>
      </div>`;

    $('addS').onclick = () => openModal({
      title: 'Add section',
      fields: `
        <label class="field"><span>ID</span><input class="input" data-field="section_id" placeholder="CSE-4A"></label>
        <label class="field"><span>Name</span><input class="input" data-field="name" placeholder="CSE 4th Year A"></label>
        <label class="field"><span>Strength</span><input class="input" type="number" data-field="strength" value="60"></label>
        <label class="field"><span>Department</span><input class="input" data-field="department" placeholder="CSE"></label>`,
      onSave: async (get) => {
        const id = get('section_id').trim(), name = get('name').trim();
        if (!id || !name) { toast('ID and name required', 'error'); return false; }
        const { error } = await supabase.from('sections').insert({ section_id: id, name, strength: parseInt(get('strength')) || 60, department: get('department').trim() || null });
        if (error) { toast(error.message, 'error'); return false; }
        toast('Added', 'success'); return true;
      },
    });

    document.querySelectorAll('[data-edit]').forEach(bn => bn.onclick = () => {
      const x = (s ?? []).find(v => v.section_id === bn.dataset.edit);
      if (!x) return;
      openModal({
        title: `Edit ${x.section_id}`,
        fields: `
          <label class="field"><span>Name</span><input class="input" data-field="name" value="${escapeHtml(x.name)}"></label>
          <label class="field"><span>Strength</span><input class="input" type="number" data-field="strength" value="${x.strength || 60}"></label>
          <label class="field"><span>Department</span><input class="input" data-field="department" value="${escapeHtml(x.department || '')}"></label>`,
        onSave: async (get) => {
          const { error } = await supabase.from('sections').update({ name: get('name').trim(), strength: parseInt(get('strength')) || 60, department: get('department').trim() || null }).eq('section_id', x.section_id);
          if (error) { toast(error.message, 'error'); return false; }
          toast('Updated', 'success'); return true;
        },
      });
    });

    document.querySelectorAll('[data-del]').forEach(bn => bn.onclick = async () => {
      if (!confirm('Delete section? This cannot be undone.')) return;
      const { error } = await supabase.from('sections').delete().eq('section_id', bn.dataset.del);
      if (error) return toast(error.message, 'error');
      toast('Deleted', 'success'); render();
    });
  }

  /* ==== SLOTS ==== */
  async function renderSlots() {
    const { data: slots } = await supabase.from('time_slots').select('*').order('sort_order').order('start_time');
    $('panel').innerHTML = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <div><h2 style="font-size:16px;font-weight:600">Time slots</h2><p class="dim" style="font-size:12px">${(slots ?? []).length} total</p></div>
          <button class="btn btn-primary btn-sm" id="addSl"><i class="fas fa-plus"></i> Add slot</button>
        </div>
        <table style="width:100%">
          <thead><tr><th>ID</th><th>Label</th><th>Start</th><th>End</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead>
          <tbody>
            ${(slots ?? []).map(x => `
              <tr>
                <td class="mono">${escapeHtml(x.slot_id)}</td>
                <td>${escapeHtml(x.label || '—')}</td>
                <td class="mono">${x.start_time.slice(0,5)}</td>
                <td class="mono">${x.end_time.slice(0,5)}</td>
                <td>${x.is_active !== false ? '<span class="badge badge-approved">active</span>' : '<span class="badge badge-rejected">hidden</span>'}</td>
                <td style="text-align:right;white-space:nowrap">
                  <button class="btn btn-sm" data-edit="${escapeHtml(x.slot_id)}"><i class="fas fa-pen"></i></button>
                  <button class="btn btn-sm btn-danger" data-del="${escapeHtml(x.slot_id)}"><i class="fas fa-trash"></i></button>
                </td>
              </tr>`).join('') || '<tr><td colspan="6" class="empty">No slots</td></tr>'}
          </tbody>
        </table>
      </div>`;

    $('addSl').onclick = () => openModal({
      title: 'Add time slot',
      fields: `
        <label class="field"><span>Slot ID</span><input class="input" data-field="slot_id" placeholder="P8"></label>
        <label class="field"><span>Label</span><input class="input" data-field="label" placeholder="8th period"></label>
        <label class="field"><span>Start</span><input class="input" type="time" data-field="start_time" value="16:00"></label>
        <label class="field"><span>End</span><input class="input" type="time" data-field="end_time" value="16:50"></label>
        <label class="field"><span>Sort order</span><input class="input" type="number" data-field="sort_order" value="0"></label>`,
      onSave: async (get) => {
        const id = get('slot_id').trim();
        if (!id) { toast('ID required', 'error'); return false; }
        if (get('start_time') >= get('end_time')) { toast('End must be after start', 'error'); return false; }
        const { error } = await supabase.from('time_slots').insert({
          slot_id: id, label: get('label').trim() || null,
          start_time: get('start_time') + ':00', end_time: get('end_time') + ':00',
          sort_order: parseInt(get('sort_order')) || 0,
        });
        if (error) { toast(error.message, 'error'); return false; }
        toast('Added', 'success'); return true;
      },
    });

    document.querySelectorAll('[data-edit]').forEach(bn => bn.onclick = () => {
      const x = (slots ?? []).find(v => v.slot_id === bn.dataset.edit);
      if (!x) return;
      openModal({
        title: `Edit ${x.slot_id}`,
        fields: `
          <label class="field"><span>Label</span><input class="input" data-field="label" value="${escapeHtml(x.label || '')}"></label>
          <label class="field"><span>Start</span><input class="input" type="time" data-field="start_time" value="${x.start_time.slice(0,5)}"></label>
          <label class="field"><span>End</span><input class="input" type="time" data-field="end_time" value="${x.end_time.slice(0,5)}"></label>`,
        onSave: async (get) => {
          const { error } = await supabase.from('time_slots').update({ label: get('label').trim() || null, start_time: get('start_time') + ':00', end_time: get('end_time') + ':00' }).eq('slot_id', x.slot_id);
          if (error) { toast(error.message, 'error'); return false; }
          toast('Updated', 'success'); return true;
        },
      });
    });

    document.querySelectorAll('[data-del]').forEach(bn => bn.onclick = async () => {
      if (!confirm('Delete slot?')) return;
      const { error } = await supabase.from('time_slots').delete().eq('slot_id', bn.dataset.del);
      if (error) return toast('Cannot delete: bookings exist', 'error');
      toast('Deleted', 'success'); render();
    });
  }

  /* ==== CALENDAR ==== */
  async function renderCalendar() {
    const { data: entries } = await supabase.from('academic_calendar').select('*').order('date', { ascending: false }).limit(90);
    $('panel').innerHTML = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <div><h2 style="font-size:16px;font-weight:600">Academic calendar</h2><p class="dim" style="font-size:12px">Holidays, working Saturdays, exam weeks</p></div>
          <button class="btn btn-primary btn-sm" id="addC"><i class="fas fa-plus"></i> Add entry</button>
        </div>
        <table style="width:100%">
          <thead><tr><th>Date</th><th>Kind</th><th>Label</th><th style="text-align:right">Actions</th></tr></thead>
          <tbody>
            ${(entries ?? []).map(x => `
              <tr>
                <td class="mono">${x.date}</td>
                <td><span class="badge badge-${x.kind === 'holiday' ? 'rejected' : x.kind === 'working_saturday' ? 'approved' : 'admin'}">${x.kind}</span></td>
                <td>${escapeHtml(x.label || '—')}</td>
                <td style="text-align:right"><button class="btn btn-sm btn-danger" data-del="${x.date}"><i class="fas fa-trash"></i></button></td>
              </tr>`).join('') || '<tr><td colspan="4" class="empty">No calendar entries</td></tr>'}
          </tbody>
        </table>
      </div>`;

    $('addC').onclick = () => openModal({
      title: 'Add calendar entry',
      fields: `
        <label class="field"><span>Date</span><input class="input" type="date" data-field="date" value="${new Date().toISOString().slice(0,10)}"></label>
        <label class="field"><span>Kind</span>
          <select class="input" data-field="kind">
            <option value="holiday">Holiday</option>
            <option value="working_saturday">Working Saturday</option>
            <option value="exam_week">Exam week</option>
            <option value="event">Event</option>
            <option value="special">Special</option>
          </select>
        </label>
        <label class="field"><span>Label</span><input class="input" data-field="label" placeholder="e.g. Diwali / Mid-terms"></label>`,
      onSave: async (get) => {
        if (!get('date')) { toast('Date required', 'error'); return false; }
        const { error } = await supabase.from('academic_calendar').upsert({ date: get('date'), kind: get('kind'), label: get('label').trim() || null });
        if (error) { toast(error.message, 'error'); return false; }
        toast('Saved', 'success'); return true;
      },
    });

    document.querySelectorAll('[data-del]').forEach(bn => bn.onclick = async () => {
      if (!confirm('Delete entry?')) return;
      const { error } = await supabase.from('academic_calendar').delete().eq('date', bn.dataset.del);
      if (error) return toast(error.message, 'error');
      toast('Deleted', 'success'); render();
    });
  }

  /* ==== TABS ==== */
  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.onclick = () => {
      currentTab = btn.dataset.tab;
      document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b === btn));
      render();
    };
  });

  function render() {
    if (currentTab === 'buildings') return renderBuildings();
    if (currentTab === 'sections') return renderSections();
    if (currentTab === 'slots') return renderSlots();
    if (currentTab === 'calendar') return renderCalendar();
  }

  await render();
})();
</script>
</body>
</html>
