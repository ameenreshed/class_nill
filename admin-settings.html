<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · amnrd.scheduler</title>
<script>
(function(){
  try {
    var t = localStorage.getItem('theme');
    if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  } catch (e) {}
})();
</script>
<meta name="theme-color" content="#F97316">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="container">
  <h1 class="page-title"><i class="fas fa-gear" style="color:var(--orange);margin-right:6px"></i>Settings</h1>
  <p class="page-subtitle">Buildings, floors, room types, time slots, activity log.</p>

  <div class="grid-toolbar" id="tabs" style="margin-top:20px">
    <button class="btn active" data-tab="buildings"><i class="fas fa-building"></i> Buildings &amp; floors</button>
    <button class="btn" data-tab="types"><i class="fas fa-shapes"></i> Room types</button>
    <button class="btn" data-tab="slots"><i class="fas fa-clock"></i> Time slots</button>
    <button class="btn" data-tab="activity"><i class="fas fa-list-check"></i> Activity log</button>
  </div>

  <div id="tabContent" class="mt-4"></div>
</div>

<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, toast } from './js/core.js';

(async () => {
  const auth = await requireRole(['admin']);
  if (!auth) return;
  renderNav(auth.profile);

  let currentTab = 'buildings';

  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.onclick = () => {
      currentTab = btn.dataset.tab;
      document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active', b === btn));
      render();
    };
  });

  // ============================================================
  // BUILDINGS & FLOORS
  // ============================================================
  async function renderBuildings() {
    const [{ data: buildings }, { data: floors }, { data: rooms }] = await Promise.all([
      supabase.from('buildings').select('*').order('sort_order').order('id'),
      supabase.from('building_floors').select('*').order('floor'),
      supabase.from('rooms').select('building,floor'),
    ]);

    const roomCountByBF = new Map();
    (rooms ?? []).forEach(r => {
      const key = `${r.building}|${r.floor}`;
      roomCountByBF.set(key, (roomCountByBF.get(key) || 0) + 1);
    });

    const floorsByBuilding = new Map();
    (floors ?? []).forEach(f => {
      if (!floorsByBuilding.has(f.building_id)) floorsByBuilding.set(f.building_id, []);
      floorsByBuilding.get(f.building_id).push(f);
    });

    document.getElementById('tabContent').innerHTML = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h2 style="font-size:14px">Buildings</h2>
          <button class="btn btn-primary btn-sm" id="addBuildingBtn"><i class="fas fa-plus"></i> Add building</button>
        </div>
        <div id="addBuildingForm" style="display:none;padding:16px;border:1px dashed var(--border-strong);border-radius:8px;margin-bottom:16px">
          <div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
            <label class="field" style="margin:0"><span>ID (e.g. 29)</span>
              <input class="input" id="bId" placeholder="29">
            </label>
            <label class="field" style="margin:0"><span>Name</span>
              <input class="input" id="bName" placeholder="Block 29">
            </label>
            <label class="field" style="margin:0"><span>Address (optional)</span>
              <input class="input" id="bAddr">
            </label>
            <label class="field" style="margin:0"><span>Sort order</span>
              <input class="input" id="bSort" type="number" value="0">
            </label>
          </div>
          <div class="row mt-2">
            <button class="btn btn-success btn-sm" id="saveBuildingBtn"><i class="fas fa-check"></i> Save</button>
            <button class="btn btn-ghost btn-sm" id="cancelBuildingBtn">Cancel</button>
          </div>
        </div>

        <div id="buildingsList">
          ${(buildings ?? []).map(b => {
            const bFloors = floorsByBuilding.get(b.id) || [];
            return `
              <div class="card" style="margin-bottom:8px;padding:16px">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
                  <div>
                    <div style="font-weight:500">${escapeHtml(b.name)} <span class="dim" style="font-size:12px">(${escapeHtml(b.id)})</span></div>
                    <div style="font-size:11px;color:var(--dim);margin-top:2px">
                      ${bFloors.length} floor${bFloors.length === 1 ? '' : 's'}
                      ${b.is_active ? '' : ' · <span style="color:var(--red)">inactive</span>'}
                    </div>
                  </div>
                  <div style="display:flex;gap:6px">
                    <button class="btn btn-sm" data-edit-b="${escapeHtml(b.id)}"><i class="fas fa-pen"></i></button>
                    <button class="btn btn-sm ${b.is_active ? 'btn-danger' : 'btn-success'}" data-toggle-b="${escapeHtml(b.id)}" data-active="${b.is_active}">
                      <i class="fas fa-${b.is_active ? 'eye-slash' : 'eye'}"></i>
                    </button>
                  </div>
                </div>
                <div class="mt-4">
                  <div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;margin-bottom:8px">Floors</div>
                  <div class="chips">
                    ${bFloors.map(f => {
                      const cnt = roomCountByBF.get(`${b.id}|${f.floor}`) || 0;
                      return `
                        <span class="chip" style="cursor:default">
                          <i class="fas fa-layer-group"></i> Floor ${f.floor}
                          <span class="dim" style="font-size:10px;margin-left:4px">${cnt} room${cnt === 1 ? '' : 's'}</span>
                          <button data-del-floor="${f.id}" style="background:none;border:none;color:var(--red);cursor:pointer;padding:0 0 0 6px;font-size:11px" title="Remove floor">
                            <i class="fas fa-xmark"></i>
                          </button>
                        </span>`;
                    }).join('') || '<span class="dim" style="font-size:12px">No floors yet</span>'}
                    <button class="chip" data-add-floor="${escapeHtml(b.id)}"><i class="fas fa-plus"></i> Add floor</button>
                  </div>
                </div>
              </div>
            `;
          }).join('') || '<div class="empty"><i class="fas fa-building"></i>No buildings yet</div>'}
        </div>
      </div>
    `;

    document.getElementById('addBuildingBtn').onclick = () => {
      document.getElementById('addBuildingForm').style.display = 'block';
    };
    document.getElementById('cancelBuildingBtn').onclick = () => {
      document.getElementById('addBuildingForm').style.display = 'none';
    };
    document.getElementById('saveBuildingBtn').onclick = async () => {
      const id = document.getElementById('bId').value.trim();
      const name = document.getElementById('bName').value.trim();
      if (!id || !name) { toast('ID and name required', 'error'); return; }
      const { error } = await supabase.from('buildings').insert({
        id, name,
        address: document.getElementById('bAddr').value.trim() || null,
        sort_order: parseInt(document.getElementById('bSort').value, 10) || 0,
      });
      if (error) { toast(error.message, 'error'); return; }
      toast('Building added', 'success');
      render();
    };

    document.querySelectorAll('[data-toggle-b]').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.toggleB;
        const active = btn.dataset.active === 'true';
        const { error } = await supabase.from('buildings').update({ is_active: !active }).eq('id', id);
        if (error) { toast(error.message, 'error'); return; }
        toast(`Building ${!active ? 'activated' : 'deactivated'}`, 'success');
        render();
      };
    });

    document.querySelectorAll('[data-edit-b]').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.editB;
        const b = (buildings ?? []).find(x => x.id === id);
        if (!b) return;
        const name = prompt('Building name', b.name);
        if (!name) return;
        const { error } = await supabase.from('buildings').update({ name }).eq('id', id);
        if (error) { toast(error.message, 'error'); return; }
        toast('Updated', 'success');
        render();
      };
    });

    document.querySelectorAll('[data-add-floor]').forEach(btn => {
      btn.onclick = async () => {
        const bId = btn.dataset.addFloor;
        const input = prompt('Floor number (1, 2, 3, ...)');
        if (!input) return;
        const floor = parseInt(input, 10);
        if (!floor || floor < 1) { toast('Floor must be ≥ 1', 'error'); return; }
        const { error } = await supabase.from('building_floors').insert({ building_id: bId, floor });
        if (error) { toast(error.message, 'error'); return; }
        toast(`Floor ${floor} added`, 'success');
        render();
      };
    });

    document.querySelectorAll('[data-del-floor]').forEach(btn => {
      btn.onclick = async () => {
        if (!confirm('Remove this floor? Only allowed if no rooms exist on it.')) return;
        const id = btn.dataset.delFloor;
        const { error } = await supabase.from('building_floors').delete().eq('id', id);
        if (error) { toast('Cannot remove: rooms exist on this floor', 'error'); return; }
        toast('Floor removed', 'success');
        render();
      };
    });
  }

  // ============================================================
  // ROOM TYPES
  // ============================================================
  const ICON_OPTIONS = [
    'fa-door-open','fa-chalkboard-user','fa-flask','fa-users-rectangle','fa-book',
    'fa-user-tie','fa-crown','fa-briefcase','fa-box','fa-restroom','fa-ellipsis',
    'fa-computer','fa-microscope','fa-music','fa-palette','fa-dumbbell','fa-utensils',
    'fa-graduation-cap','fa-tv','fa-desktop','fa-warehouse','fa-people-group'
  ];

  async function renderTypes() {
    const { data: types } = await supabase.from('room_types').select('*').order('sort_order').order('id');
    const { data: rooms } = await supabase.from('rooms').select('type');
    const countByType = new Map();
    (rooms ?? []).forEach(r => countByType.set(r.type, (countByType.get(r.type) || 0) + 1));

    document.getElementById('tabContent').innerHTML = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h2 style="font-size:14px">Room types</h2>
          <button class="btn btn-primary btn-sm" id="addTypeBtn"><i class="fas fa-plus"></i> Add type</button>
        </div>
        <div id="addTypeForm" style="display:none;padding:16px;border:1px dashed var(--border-strong);border-radius:8px;margin-bottom:16px">
          <div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
            <label class="field" style="margin:0"><span>ID (slug)</span>
              <input class="input" id="tId" placeholder="auditorium">
            </label>
            <label class="field" style="margin:0"><span>Label</span>
              <input class="input" id="tLabel" placeholder="Auditorium">
            </label>
            <label class="field" style="margin:0"><span>Icon</span>
              <select class="input" id="tIcon">
                ${ICON_OPTIONS.map(i => `<option value="${i}">${i.replace('fa-','')}</option>`).join('')}
              </select>
            </label>
            <label class="field" style="margin:0"><span>Sort order</span>
              <input class="input" id="tSort" type="number" value="0">
            </label>
          </div>
          <div class="row mt-2">
            <label style="display:flex;align-items:center;gap:6px;font-size:13px">
              <input type="checkbox" id="tBookable" checked> Bookable
            </label>
            <button class="btn btn-success btn-sm" id="saveTypeBtn"><i class="fas fa-check"></i> Save</button>
            <button class="btn btn-ghost btn-sm" id="cancelTypeBtn">Cancel</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Icon</th><th>Label</th><th>ID</th><th>Rooms</th><th>Bookable</th><th>Status</th>
                <th style="text-align:right">Actions</th>
              </tr>
            </thead>
            <tbody>
              ${(types ?? []).map(t => `
                <tr>
                  <td style="font-size:18px;color:var(--orange)"><i class="fas ${escapeHtml(t.icon)}"></i></td>
                  <td style="color:var(--text)">${escapeHtml(t.label)}</td>
                  <td class="mono">${escapeHtml(t.id)}</td>
                  <td class="dim">${countByType.get(t.id) || 0}</td>
                  <td>${t.bookable ? '<span class="badge badge-approved">yes</span>' : '<span class="badge badge-gray">no</span>'}</td>
                  <td>${t.is_active ? '<span class="badge badge-approved">active</span>' : '<span class="badge badge-rejected">hidden</span>'}</td>
                  <td style="text-align:right">
                    <button class="btn btn-sm" data-edit-t="${escapeHtml(t.id)}"><i class="fas fa-pen"></i></button>
                    <button class="btn btn-sm ${t.is_active ? 'btn-danger' : 'btn-success'}" data-toggle-t="${escapeHtml(t.id)}" data-active="${t.is_active}">
                      <i class="fas fa-${t.is_active ? 'eye-slash' : 'eye'}"></i>
                    </button>
                  </td>
                </tr>
              `).join('') || '<tr><td colspan="7" class="empty"><i class="fas fa-shapes"></i>No types</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `;

    document.getElementById('addTypeBtn').onclick = () => {
      document.getElementById('addTypeForm').style.display = 'block';
      document.getElementById('tId').value = '';
      document.getElementById('tLabel').value = '';
      document.getElementById('tSort').value = '0';
      document.getElementById('tBookable').checked = true;
    };
    document.getElementById('tLabel').addEventListener('input', e => {
      if (!document.getElementById('tId').value || document.getElementById('tId').dataset.auto === 'true') {
        const slug = e.target.value.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        document.getElementById('tId').value = slug;
        document.getElementById('tId').dataset.auto = 'true';
      }
    });
    document.getElementById('cancelTypeBtn').onclick = () => {
      document.getElementById('addTypeForm').style.display = 'none';
    };
    document.getElementById('saveTypeBtn').onclick = async () => {
      const id = document.getElementById('tId').value.trim();
      const label = document.getElementById('tLabel').value.trim();
      if (!id || !label) { toast('ID and label required', 'error'); return; }
      const { error } = await supabase.from('room_types').insert({
        id, label,
        icon: document.getElementById('tIcon').value,
        bookable: document.getElementById('tBookable').checked,
        sort_order: parseInt(document.getElementById('tSort').value, 10) || 0,
      });
      if (error) { toast(error.message, 'error'); return; }
      toast('Type added', 'success');
      render();
    };

    document.querySelectorAll('[data-toggle-t]').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.toggleT;
        const active = btn.dataset.active === 'true';
        const { error } = await supabase.from('room_types').update({ is_active: !active }).eq('id', id);
        if (error) { toast(error.message, 'error'); return; }
        toast('Updated', 'success');
        render();
      };
    });

    document.querySelectorAll('[data-edit-t]').forEach(btn => {
      btn.onclick = () => {
        const t = (types ?? []).find(x => x.id === btn.dataset.editT);
        if (!t) return;
        const label = prompt('Label', t.label);
        if (!label) return;
        const icon = prompt('Icon class (e.g. fa-book)', t.icon);
        if (!icon) return;
        supabase.from('room_types').update({ label, icon }).eq('id', t.id).then(({ error }) => {
          if (error) { toast(error.message, 'error'); return; }
          toast('Updated', 'success');
          render();
        });
      };
    });
  }

  // ============================================================
  // TIME SLOTS
  // ============================================================
  async function renderSlots() {
    const { data: slots } = await supabase.from('time_slots').select('*').order('sort_order').order('start_time');
    const { data: bookings } = await supabase.from('bookings').select('slot_id');
    const countBySlot = new Map();
    (bookings ?? []).forEach(b => countBySlot.set(b.slot_id, (countBySlot.get(b.slot_id) || 0) + 1));

    document.getElementById('tabContent').innerHTML = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h2 style="font-size:14px">Time slots</h2>
          <button class="btn btn-primary btn-sm" id="addSlotBtn"><i class="fas fa-plus"></i> Add slot</button>
        </div>
        <div id="addSlotForm" style="display:none;padding:16px;border:1px dashed var(--border-strong);border-radius:8px;margin-bottom:16px">
          <div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
            <label class="field" style="margin:0"><span>Slot ID</span>
              <input class="input" id="sId" placeholder="P8">
            </label>
            <label class="field" style="margin:0"><span>Label</span>
              <input class="input" id="sLabel" placeholder="8th period">
            </label>
            <label class="field" style="margin:0"><span>Start time</span>
              <input class="input" id="sStart" type="time" value="16:00">
            </label>
            <label class="field" style="margin:0"><span>End time</span>
              <input class="input" id="sEnd" type="time" value="16:50">
            </label>
            <label class="field" style="margin:0"><span>Sort order</span>
              <input class="input" id="sSort" type="number" value="0">
            </label>
          </div>
          <div class="row mt-2">
            <button class="btn btn-success btn-sm" id="saveSlotBtn"><i class="fas fa-check"></i> Save</button>
            <button class="btn btn-ghost btn-sm" id="cancelSlotBtn">Cancel</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th><th>Label</th><th>Start</th><th>End</th><th>Bookings</th>
                <th style="text-align:right">Actions</th>
              </tr>
            </thead>
            <tbody>
              ${(slots ?? []).map(s => `
                <tr>
                  <td class="mono">${escapeHtml(s.slot_id)}</td>
                  <td style="color:var(--text)">${escapeHtml(s.label || '—')}</td>
                  <td class="mono">${String(s.start_time).slice(0,5)}</td>
                  <td class="mono">${String(s.end_time).slice(0,5)}</td>
                  <td class="dim">${countBySlot.get(s.slot_id) || 0}</td>
                  <td style="text-align:right">
                    <button class="btn btn-sm" data-edit-s="${escapeHtml(s.slot_id)}"><i class="fas fa-pen"></i></button>
                    <button class="btn btn-sm btn-danger" data-del-s="${escapeHtml(s.slot_id)}"><i class="fas fa-trash"></i></button>
                  </td>
                </tr>
              `).join('') || '<tr><td colspan="6" class="empty"><i class="fas fa-clock"></i>No slots</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `;

    document.getElementById('addSlotBtn').onclick = () => {
      document.getElementById('addSlotForm').style.display = 'block';
    };
    document.getElementById('cancelSlotBtn').onclick = () => {
      document.getElementById('addSlotForm').style.display = 'none';
    };
    document.getElementById('saveSlotBtn').onclick = async () => {
      const slot_id = document.getElementById('sId').value.trim();
      const start = document.getElementById('sStart').value;
      const end = document.getElementById('sEnd').value;
      if (!slot_id || !start || !end) { toast('All fields required', 'error'); return; }
      if (start >= end) { toast('End must be after start', 'error'); return; }
      const { error } = await supabase.from('time_slots').insert({
        slot_id,
        label: document.getElementById('sLabel').value.trim() || null,
        start_time: start + ':00',
        end_time: end + ':00',
        sort_order: parseInt(document.getElementById('sSort').value, 10) || 0,
      });
      if (error) { toast(error.message, 'error'); return; }
      toast('Slot added', 'success');
      render();
    };

    document.querySelectorAll('[data-del-s]').forEach(btn => {
      btn.onclick = async () => {
        if (!confirm('Delete this slot? Only if no bookings exist.')) return;
        const { error } = await supabase.from('time_slots').delete().eq('slot_id', btn.dataset.delS);
        if (error) { toast('Cannot delete: bookings exist', 'error'); return; }
        toast('Deleted', 'success');
        render();
      };
    });

    document.querySelectorAll('[data-edit-s]').forEach(btn => {
      btn.onclick = async () => {
        const s = (slots ?? []).find(x => x.slot_id === btn.dataset.editS);
        if (!s) return;
        const label = prompt('Label', s.label || '');
        if (label === null) return;
        const start = prompt('Start (HH:MM)', String(s.start_time).slice(0,5));
        if (!start) return;
        const end = prompt('End (HH:MM)', String(s.end_time).slice(0,5));
        if (!end) return;
        const { error } = await supabase.from('time_slots')
          .update({ label, start_time: start + ':00', end_time: end + ':00' })
          .eq('slot_id', s.slot_id);
        if (error) { toast(error.message, 'error'); return; }
        toast('Updated', 'success');
        render();
      };
    });
  }

  // ============================================================
  // ACTIVITY LOG
  // ============================================================
  async function renderActivity() {
    const { data: logs } = await supabase
      .from('activity_log')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(100);

    document.getElementById('tabContent').innerHTML = `
      <div class="card">
        <h2 style="font-size:14px;margin-bottom:16px">Recent activity (last 100)</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>When</th><th>User</th><th>Action</th><th>Entity</th><th>ID</th>
              </tr>
            </thead>
            <tbody>
              ${(logs ?? []).map(l => `
                <tr>
                  <td class="dim" style="font-size:11px">${new Date(l.created_at).toLocaleString()}</td>
                  <td style="font-size:12px">${escapeHtml(l.user_email || '—')}</td>
                  <td class="mono">${escapeHtml(l.action)}</td>
                  <td class="dim">${escapeHtml(l.entity || '—')}</td>
                  <td class="mono">${escapeHtml(l.entity_id || '—')}</td>
                </tr>
              `).join('') || '<tr><td colspan="5" class="empty"><i class="fas fa-list-check"></i>No activity yet</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  // ============================================================
  // TAB ROUTER
  // ============================================================
  async function render() {
    if (currentTab === 'buildings') await renderBuildings();
    else if (currentTab === 'types') await renderTypes();
    else if (currentTab === 'slots') await renderSlots();
    else if (currentTab === 'activity') await renderActivity();
  }

  await render();
})();
</script>
</body>
</html>
