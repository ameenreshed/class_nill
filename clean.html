<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cleaning up…</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f8fafc; color: #0f172a; padding: 20px; }
  .box { max-width: 520px; width: 100%; padding: 36px; background: white; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
  h1 { margin: 0 0 8px; font-size: 20px; }
  p { margin: 6px 0 16px; color: #64748b; font-size: 13px; line-height: 1.6; }
  .status { padding: 14px 16px; background: #f1f5f9; border-radius: 10px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; line-height: 1.8; }
  .ok { color: #16a34a; }
  .err { color: #dc2626; }
  .warn { color: #d97706; }
  .done { color: #0284c7; font-weight: 600; }
</style>
</head>
<body>
  <div class="box">
    <h1>🧹 Cleaning up service worker</h1>
    <p>This removes the stale cache that was serving old files. You only need to visit this page <strong>once</strong>.</p>
    <div class="status" id="status"></div>
  </div>

  <script>
  (async () => {
    const status = document.getElementById('status');
    const log = (msg, cls = '') => {
      const d = document.createElement('div');
      if (cls) d.className = cls;
      d.textContent = msg;
      status.appendChild(d);
    };

    // 1. Unregister all service workers
    if ('serviceWorker' in navigator) {
      try {
        const regs = await navigator.serviceWorker.getRegistrations();
        if (regs.length === 0) {
          log('✓ No service workers registered', 'ok');
        } else {
          for (const reg of regs) {
            const ok = await reg.unregister();
            log(`✓ Unregistered SW (${ok ? 'ok' : 'failed'}): ${reg.scope}`, ok ? 'ok' : 'err');
          }
        }
      } catch (e) {
        log('✗ SW unregister failed: ' + e.message, 'err');
      }
    } else {
      log('✓ Service workers not supported', 'ok');
    }

    // 2. Clear all caches
    if ('caches' in window) {
      try {
        const keys = await caches.keys();
        if (keys.length === 0) {
          log('✓ No caches to clear', 'ok');
        } else {
          for (const key of keys) {
            await caches.delete(key);
            log('✓ Cleared cache: ' + key, 'ok');
          }
        }
      } catch (e) {
        log('✗ Cache clear failed: ' + e.message, 'err');
      }
    }

    // 3. Redirect to app with cache-busting query
    log('→ Redirecting to app…', 'done');
    setTimeout(() => {
      location.replace('/?clean=' + Date.now());
    }, 1200);
  })();
  </script>
</body>
</html>
