<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LPU Scheduler">
<meta name="mobile-web-app-capable" content="yes">
<title>Student accounts · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/mobile-app.css">
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-user-graduate"></i> Student accounts</h1>
      <p class="page-subtitle">Create and manage student login accounts. Link to the directory by roll number.</p>
    </div>
    <div class="row">
      <button class="btn" id="bulkBtn"><i class="fas fa-users-cog"></i> Bulk from directory</button>
      <button class="btn btn-primary" id="addBtn"><i class="fas fa-plus"></i> Create student</button>
    </div>
  </div>

  <div class="admin-tabs">
    <a href="admin-rooms.html" class="admin-tab"><i class="fas fa-door-open"></i> Rooms</a>
    <a href="admin-timetable.html" class="admin-tab"><i class="fas fa-table"></i> Timetable</a>
    <a href="admin-import.html" class="admin-tab"><i class="fas fa-file-import"></i> Import</a>
    <a href="admin-bookings.html" class="admin-tab"><i class="fas fa-calendar-check"></i> Bookings</a>
    <a href="admin-assignments.html" class="admin-tab"><i class="fas fa-file-pen"></i> Assignments</a>
    <a href="admin-faculty.html" class="admin-tab"><i class="fas fa-users"></i> Users</a>
    <a href="admin-students.html" class="admin-tab"><i class="fas fa-users-rectangle"></i> Directory</a>
    <a href="admin-student-accounts.html" class="admin-tab active"><i class="fas fa-user-graduate"></i> Students</a>
    <a href="admin-slots.html" class="admin-tab"><i class="fas fa-clock"></i> Time slots</a>
    <a href="admin-calendar.html" class="admin-tab"><i class="fas fa-calendar-days"></i> Calendar</a>
    <a href="admin-settings.html" class="admin-tab"><i class="fas fa-gear"></i> Settings</a>
  </div>

  <div class="stats" id="stats"></div>

  <div class="row" style="margin-bottom:16px;gap:8px">
    <div class="search-wrap" style="flex:1;max-width:360px">
      <i class="fas fa-search search-icon"></i>
      <input class="input" id="search" placeholder="Search by name, email, roll…">
    </div>
    <select class="input" id="batchFilter" style="max-width:200px"><option value="">All batches</option></select>
    <button class="btn" id="refreshBtn"><i class="fas fa-rotate-right"></i></button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Name</th><th>Email</th><th>Roll #</th><th>Batch</th><th>Status</th>
          <th style="text-align:right">Actions</th>
        </tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</div>

<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, toast } from './js/core.js';

(async () => {
  const auth = await requireRole(['admin']);
  if (!auth) return;
  renderNav(auth.profile);
  const $ = id => document.getElementById(id);
  let students = [];
  let directory = [];
  let search = '';
  let batchFilter = '';

  async function load() {
    const { data, error } = await supabase
      .from('profiles')
      .select('*')
      .eq('role', 'student')
      .order('full_name', { ascending: true });
    if (error) { toast(error.message, 'error'); return; }
    students = data ?? [];

    const { data: dir } = await supabase.from('students').select('*');
    directory = dir ?? [];

    renderStats();
    renderBatches();
    render();
  }

  function renderStats() {
    const total = students.length;
    const active = students.filter(s => s.is_active !== false).length;
    const withRoll = students.filter(s => s.roll_number).length;
    const unlinked = directory.filter(d => !students.some(s => s.roll_number === d.id)).length;
    $('stats').innerHTML = `
      <div class="stat"><i class="fas fa-user-graduate stat-icon"></i><div class="stat-value">${total}</div><div class="stat-label">Student accounts</div></div>
      <div class="stat"><i class="fas fa-check-circle stat-icon" style="color:var(--success)"></i><div class="stat-value" style="color:var(--success)">${active}</div><div class="stat-label">Active</div></div>
      <div class="stat"><i class="fas fa-id-card stat-icon"></i><div class="stat-value">${withRoll}</div><div class="stat-label">With roll number</div></div>
      <div class="stat"><i class="fas fa-users-rectangle stat-icon" style="color:var(--warning)"></i><div class="stat-value" style="color:var(--warning)">${unlinked}</div><div class="stat-label">Directory without account</div></div>`;
  }

  function renderBatches() {
    const sel = $('batchFilter');
    const cur = sel.value;
    const batches = [...new Set(students.map(s => s.batch).filter(Boolean))].sort();
    sel.innerHTML = '<option value="">All batches</option>' +
      batches.map(b => `<option value="${escapeHtml(b)}" ${cur === b ? 'selected' : ''}>${escapeHtml(b)}</option>`).join('');
  }

  function render() {
    let list = students;
    if (search) {
      const q = search.toLowerCase();
      list = list.filter(s =>
        (s.full_name || '').toLowerCase().includes(q)
        || (s.email || '').toLowerCase().includes(q)
        || (s.roll_number || '').toLowerCase().includes(q));
    }
    if (batchFilter) list = list.filter(s => s.batch === batchFilter);

    if (!list.length) {
      $('body').innerHTML = '<tr><td colspan="6" class="empty"><i class="fas fa-users-slash"></i>No student accounts</td></tr>';
      return;
    }
    $('body').innerHTML = list.map(s => `
      <tr>
        <td style="font-weight:500">${escapeHtml(s.full_name || '—')}</td>
        <td class="mono" style="font-size:12px">${escapeHtml(s.email)}</td>
        <td>${s.roll_number ? `<span class="badge badge-admin">${escapeHtml(s.roll_number)}</span>` : '<span class="dim">—</span>'}</td>
        <td>${s.batch ? `<span class="badge badge-gray">${escapeHtml(s.batch)}</span>` : '<span class="dim">—</span>'}</td>
        <td>${s.is_active !== false ? '<span class="badge badge-approved">active</span>' : '<span class="badge badge-rejected">suspended</span>'}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn btn-sm" data-edit="${s.id}" title="Edit"><i class="fas fa-pen"></i></button>
          <button class="btn btn-sm" data-reset="${s.id}" title="Reset password"><i class="fas fa-key"></i></button>
          <button class="btn btn-sm" data-toggle="${s.id}" title="${s.is_active !== false ? 'Suspend' : 'Activate'}"><i class="fas fa-${s.is_active !== false ? 'pause' : 'play'}"></i></button>
          <button class="btn btn-sm btn-danger" data-del="${s.id}" title="Delete"><i class="fas fa-trash"></i></button>
        </td>
      </tr>`).join('');

    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editStudent(students.find(s => s.id === b.dataset.edit)));
    document.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => resetPassword(students.find(s => s.id === b.dataset.reset)));
    document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => toggleActive(students.find(s => s.id === b.dataset.toggle)));
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteStudent(students.find(s => s.id === b.dataset.del)));
  }

  $('addBtn').onclick = () => editStudent(null);

  function editStudent(s) {
    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">${s ? 'Edit student' : 'Create student account'}</div>
        <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        ${!s ? `
          <label class="field"><span>Email *</span><input class="input" id="fEmail" type="email" placeholder="student@lpu.co.in" required></label>
          <label class="field"><span>Password *</span><input class="input" id="fPassword" type="password" placeholder="Min 8 characters" minlength="8" required></label>
        ` : `<label class="field"><span>Email</span><input class="input" value="${escapeHtml(s.email)}" disabled></label>`}
        <label class="field"><span>Full name *</span><input class="input" id="fName" value="${escapeHtml(s?.full_name || '')}" required></label>
        <label class="field"><span>Roll number *</span><input class="input" id="fRoll" value="${escapeHtml(s?.roll_number || '')}" placeholder="12345" required></label>
        <label class="field"><span>Batch *</span>
          <input class="input" id="fBatch" value="${escapeHtml(s?.batch || '')}" placeholder="B1" list="batchList" required>
          <datalist id="batchList">${[...new Set(directory.map(d => d.batch))].map(b => `<option value="${escapeHtml(b)}">`).join('')}</datalist>
        </label>
        <div id="errBox" style="display:none;padding:10px 12px;background:var(--danger-soft);border:1px solid var(--danger-soft-border);border-radius:8px;color:var(--danger-text);font-size:12.5px"></div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close>Cancel</button>
        <button class="btn btn-primary" id="saveBtn">${s ? 'Save changes' : 'Create'}</button>
      </div>
    </div>`;
    document.body.appendChild(dialog);
    dialog.showModal();

    const errBox = dialog.querySelector('#errBox');

    dialog.querySelector('#saveBtn').onclick = async () => {
      const btn = dialog.querySelector('#saveBtn');
      btn.disabled = true;
      const original = btn.textContent;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…';
      errBox.style.display = 'none';
      try {
        if (s) {
          const { data, error } = await supabase.rpc('admin_update_student', {
            p_user_id: s.id,
            p_full_name: dialog.querySelector('#fName').value.trim(),
            p_roll_number: dialog.querySelector('#fRoll').value.trim(),
            p_batch: dialog.querySelector('#fBatch').value.trim(),
            p_is_active: s.is_active !== false,
          });
          if (error) throw new Error(error.message);
          if (data?.error) throw new Error(data.error);
          toast('Updated', 'success');
        } else {
          const email = dialog.querySelector('#fEmail').value.trim();
          const password = dialog.querySelector('#fPassword').value;
          const fullName = dialog.querySelector('#fName').value.trim();
          const roll = dialog.querySelector('#fRoll').value.trim();
          const batch = dialog.querySelector('#fBatch').value.trim();
          if (!email || !password || password.length < 8) throw new Error('Email and password (≥ 8 chars) required');
          if (!fullName || !roll || !batch) throw new Error('Name, roll, and batch required');
          const { data, error } = await supabase.rpc('admin_create_student', {
            p_email: email, p_password: password,
            p_full_name: fullName, p_roll_number: roll, p_batch: batch,
          });
          if (error) throw new Error(error.message);
          if (data?.error) throw new Error(data.error);
          toast('Student created', 'success');
        }
        dialog.close(); dialog.remove();
        await load();
      } catch (err) {
        errBox.textContent = err.message || String(err);
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = original;
      }
    };

    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  function resetPassword(s) {
    const pw = prompt(`New password for ${s.full_name || s.email} (min 8 chars):`);
    if (!pw) return;
    if (pw.length < 8) return toast('Password must be at least 8 characters', 'error');
    supabase.rpc('admin_reset_password', { p_user_id: s.id, p_new_password: pw }).then(({ error, data }) => {
      if (error) return toast(error.message, 'error');
      if (data?.error) return toast(data.error, 'error');
      toast('Password reset', 'success');
    });
  }

  async function toggleActive(s) {
    const newState = s.is_active === false;
    const { error } = await supabase.rpc('admin_update_student', {
      p_user_id: s.id, p_full_name: null, p_roll_number: null, p_batch: null,
      p_is_active: newState,
    });
    if (error) return toast(error.message, 'error');
    toast(newState ? 'Activated' : 'Suspended', 'success');
    await load();
  }

  async function deleteStudent(s) {
    if (!confirm(`Delete student account "${s.full_name || s.email}"?\n\nThis removes their login. Their directory record (if any) is unaffected.`)) return;
    const { error } = await supabase.rpc('admin_delete_user', { p_user_id: s.id });
    if (error) return toast(error.message, 'error');
    toast('Deleted', 'success');
    await load();
  }

  $('bulkBtn').onclick = () => openBulkDialog();

  function openBulkDialog() {
    const unlinked = directory.filter(d => !students.some(s => s.roll_number === d.id));
    if (!unlinked.length) return toast('All directory students already have accounts', 'success');

    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Bulk-create student accounts</div>
        <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div style="padding:12px 14px;background:var(--info-soft);border:1px solid var(--info-soft-border);border-radius:10px;font-size:12.5px;color:var(--info-text);line-height:1.55;margin-bottom:14px">
          <i class="fas fa-info-circle"></i>
          ${unlinked.length} directory student${unlinked.length === 1 ? '' : 's'} without an account. Each will get login email <strong>roll@lpu.co.in</strong> with the password below.
        </div>
        <label class="field"><span>Default password (min 8 chars) *</span><input class="input" id="bulkPw" type="password" placeholder="Min 8 characters" minlength="8"></label>
        <div id="bulkErr" style="display:none;padding:10px 12px;background:var(--danger-soft);border:1px solid var(--danger-soft-border);border-radius:8px;color:var(--danger-text);font-size:12.5px;margin-bottom:10px"></div>
        <div id="bulkProgress" style="display:none">
          <div style="height:6px;background:var(--surface-active);border-radius:999px;overflow:hidden;margin-bottom:8px"><div id="bulkFill" style="height:100%;background:var(--brand);width:0%;transition:width 200ms"></div></div>
          <div id="bulkLabel" style="font-size:12px;color:var(--text-secondary)"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close>Cancel</button>
        <button class="btn btn-primary" id="bulkGo"><i class="fas fa-users-cog"></i> Create all</button>
      </div>
    </div>`;
    document.body.appendChild(dialog);
    dialog.showModal();

    const errBox = dialog.querySelector('#bulkErr');
    const prog = dialog.querySelector('#bulkProgress');
    const fill = dialog.querySelector('#bulkFill');
    const label = dialog.querySelector('#bulkLabel');
    const goBtn = dialog.querySelector('#bulkGo');

    goBtn.onclick = async () => {
      const pw = dialog.querySelector('#bulkPw').value;
      if (!pw || pw.length < 8) { errBox.textContent = 'Password must be at least 8 characters'; errBox.style.display = 'block'; return; }
      goBtn.disabled = true;
      goBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Working…';
      prog.style.display = 'block';

      let ok = 0, fail = 0;
      const errors = [];
      for (let i = 0; i < unlinked.length; i++) {
        const d = unlinked[i];
        label.textContent = `Creating ${i + 1} / ${unlinked.length} · ${d.id}`;
        fill.style.width = `${Math.round(((i + 1) / unlinked.length) * 100)}%`;
        const { data, error } = await supabase.rpc('admin_create_student', {
          p_email: `${d.id}@lpu.co.in`, p_password: pw,
          p_full_name: d.full_name, p_roll_number: d.id, p_batch: d.batch,
        });
        if (error || data?.error) { fail++; errors.push(`${d.id}: ${error?.message || data?.error}`); }
        else ok++;
      }

      if (fail) {
        errBox.innerHTML = `<strong>${ok} created, ${fail} failed</strong><br>${errors.slice(0, 5).join('<br>')}${errors.length > 5 ? '<br>…' : ''}`;
        errBox.style.display = 'block';
        goBtn.disabled = false;
        goBtn.innerHTML = '<i class="fas fa-users-cog"></i> Retry';
        await load();
      } else {
        toast(`Created ${ok} student accounts`, 'success');
        dialog.close(); dialog.remove();
        await load();
      }
    };

    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  let timer;
  $('search').oninput = e => { clearTimeout(timer); timer = setTimeout(() => { search = e.target.value.trim(); render(); }, 250); };
  $('batchFilter').onchange = e => { batchFilter = e.target.value; render(); };
  $('refreshBtn').onclick = () => { load(); toast('Refreshed', 'success'); };

  await load();
})();
</script>
<script type="module" src="js/banner.js"></script>
</body>
</html>
