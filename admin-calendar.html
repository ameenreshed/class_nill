<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-header">
    <div><h1 class="page-title"><i class="fas fa-calendar-days"></i> Academic calendar</h1><p class="page-subtitle">Holidays, working Saturdays, exam weeks, events.</p></div>
    <button class="btn btn-primary" id="addBtn"><i class="fas fa-plus"></i> Add entry</button>
  </div>
  <div class="admin-tabs">
    <a href="admin-faculty.html" class="admin-tab"><i class="fas fa-chalkboard-user"></i> Faculty</a>
    <a href="admin-timetable.html" class="admin-tab"><i class="fas fa-table"></i> Timetable</a>
    <a href="admin-bookings.html" class="admin-tab"><i class="fas fa-calendar-check"></i> Bookings</a>
    <a href="admin-rooms.html" class="admin-tab"><i class="fas fa-door-open"></i> Rooms</a>
    <a href="admin-buildings.html" class="admin-tab"><i class="fas fa-building"></i> Buildings</a>
    <a href="admin-slots.html" class="admin-tab"><i class="fas fa-clock"></i> Time slots</a>
    <a href="admin-calendar.html" class="admin-tab active"><i class="fas fa-calendar-days"></i> Calendar</a>
    <a href="admin-users.html" class="admin-tab"><i class="fas fa-users"></i> Users</a>
    <a href="admin-settings.html" class="admin-tab"><i class="fas fa-gear"></i> Settings</a>
  </div>
  <div class="table-wrap"><table><thead><tr><th>Date</th><th>Kind</th><th>Label</th><th style="text-align:right">Actions</th></tr></thead><tbody id="body"></tbody></table></div>
</div>
<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, toast, todayISO } from './js/core.js';
(async () => {
  const auth = await requireRole(['admin']); if (!auth) return;
  renderNav(auth.profile);
  const $ = id => document.getElementById(id);
  let entries = [];
  async function load() {
    const { data } = await supabase.from('academic_calendar').select('*').order('date', { ascending: false }).limit(200);
    entries = data ?? []; render();
  }
  function render() {
    if (!entries.length) { $('body').innerHTML = '<tr><td colspan="4" class="empty"><i class="fas fa-calendar-days"></i>No calendar entries</td></tr>'; return; }
    $('body').innerHTML = entries.map(c => {
      const b = c.kind === 'holiday' ? 'rejected' : c.kind === 'working_saturday' ? 'approved' : c.kind === 'exam_week' ? 'pending' : 'admin';
      return `<tr><td class="mono">${c.date}</td><td><span class="badge badge-${b}">${escapeHtml(c.kind.replace('_', ' '))}</span></td><td>${escapeHtml(c.label || '—')}</td><td style="text-align:right"><button class="btn btn-sm btn-danger" data-del="${c.date}"><i class="fas fa-trash"></i></button></td></tr>`;
    }).join('');
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      if (!confirm('Delete entry?')) return;
      const { error } = await supabase.from('academic_calendar').delete().eq('date', b.dataset.del);
      if (error) return toast(error.message, 'error');
      toast('Deleted', 'success'); await load();
    });
  }
  $('addBtn').onclick = () => {
    const dialog = document.createElement('dialog'); dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content"><div class="modal-header"><div class="modal-title">Add calendar entry</div><button class="modal-close" data-close><i class="fas fa-xmark"></i></button></div><div class="modal-body"><label class="field"><span>Date *</span><input class="input" type="date" data-field="date" value="${todayISO()}"></label><label class="field"><span>Kind</span><select class="input" data-field="kind"><option value="holiday">Holiday</option><option value="working_saturday">Working Saturday</option><option value="exam_week">Exam week</option><option value="event">Event</option><option value="special">Special</option></select></label><label class="field"><span>Label</span><input class="input" data-field="label" placeholder="e.g. Diwali"></label></div><div class="modal-footer"><button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-save>Save</button></div></div>`;
    document.body.appendChild(dialog); dialog.showModal();
    dialog.querySelector('[data-save]').onclick = async () => {
      const get = f => dialog.querySelector(`[data-field="${f}"]`).value.trim();
      if (!get('date')) return toast('Date required', 'error');
      const { error } = await supabase.from('academic_calendar').upsert({ date: get('date'), kind: get('kind'), label: get('label') || null });
      if (error) return toast(error.message, 'error');
      toast('Saved', 'success'); dialog.close(); dialog.remove(); await load();
    };
    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  };
  await load();
})();
</script>
</body>
</html>
