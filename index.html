<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px">
  <div>
    <div style="width:56px;height:56px;border-radius:14px;background:var(--brand);color:var(--brand-contrast);display:inline-flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:20px">
      <i class="fas fa-calendar-check"></i>
    </div>
    <h1 style="font-size:24px;font-weight:600">LPU<span style="color:var(--brand)">.</span>Scheduler</h1>
    <p style="color:var(--text-muted);font-size:14px"><i class="fas fa-spinner fa-spin"></i> Loading…</p>
  </div>
</div>
<script type="module">
import { supabase, waitForSession } from './js/core.js';
(async () => {
  const session = await waitForSession(2000);
  if (!session) return location.replace('./login.html');
  const { data: profile } = await supabase.from('profiles').select('role, is_active').eq('id', session.user.id).single();
  if (!profile || profile.is_active === false) { await supabase.auth.signOut(); return location.replace('./login.html'); }
  if (profile.role === 'admin') return location.replace('./admin.html');
  if (profile.role === 'faculty') return location.replace('./faculty.html');
  await supabase.auth.signOut();
  location.replace('./login.html');
})();
</script>
</body>
</html>
