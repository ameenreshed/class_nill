<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>amnrd.scheduler</title>
<script>
(function(){
  try {
    var t = localStorage.getItem('theme');
    if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  } catch (e) {}
})();
</script>
<meta name="theme-color" content="#F97316">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card" style="text-align:center">
    <h1>amnrd<span style="color:var(--orange)">.</span>scheduler</h1>
    <p class="sub"><i class="fas fa-spinner fa-spin"></i> Loading…</p>
  </div>
</div>
<script type="module">
import { supabase, BASE, bootPWA } from './js/core.js';
bootPWA();

(async () => {
  await new Promise(r => setTimeout(r, 150));
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { location.href = `${BASE}login.html`; return; }
  const { data: profile } = await supabase.from('profiles').select('role').eq('id', session.user.id).single();
  location.href = `${BASE}${profile?.role ?? 'student'}.html`;
})();
</script>
</body>
</html>
