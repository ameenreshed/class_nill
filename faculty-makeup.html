<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makeup class · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<meta name="theme-color" content="#EA580C">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>

<div class="container" style="max-width:840px">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-chalkboard-user"></i> Schedule makeup class</h1>
      <p class="page-subtitle">3 quick steps. Free rooms update live.</p>
    </div>
    <div class="row">
      <span id="offlineBanner" class="badge badge-pending" style="display:none"><i class="fas fa-plug-circle-xmark"></i> Offline — queued</span>
      <span id="pendingBanner" class="badge badge-admin" style="display:none"></span>
    </div>
  </div>

  <div class="stepper">
    <div class="step active" data-step="1"><span class="step-num">1</span><span class="step-label">When</span></div>
    <div class="step-divider"></div>
    <div class="step" data-step="2"><span class="step-num">2</span><span class="step-label">Room</span></div>
    <div class="step-divider"></div>
    <div class="step" data-step="3"><span class="step-num">3</span><span class="step-label">Confirm</span></div>
  </div>

  <div class="card" data-panel="1">
    <div class="card-title"><i class="fas fa-calendar-days"></i> When is the makeup?</div>
    <div class="row">
      <label class="field" style="flex:1;min-width:180px">
        <span>Date</span>
        <input class="input" type="date" id="dateInput">
      </label>
      <label class="field" style="flex:1;min-width:180px">
        <span>Period</span>
        <select class="input" id="slotSelect"></select>
      </label>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="btn btn-primary" id="nextStep1"><i class="fas fa-arrow-right"></i> Continue</button>
    </div>
  </div>

  <div class="card" data-panel="2" style="display:none">
    <div class="card-title"><i class="fas fa-door-open"></i> Pick a room</div>
    <p class="dim" style="font-size:13px;margin-bottom:12px">
      <span id="freeCount">0</span> free · <span id="busyCount">0</span> booked at this time
    </p>
    <div class="room-grid" id="freeGrid"></div>
    <div class="row" style="justify-content:space-between;margin-top:16px">
      <button class="btn btn-ghost" id="backStep2"><i class="fas fa-arrow-left"></i> Back</button>
      <button class="btn btn-primary" id="nextStep2" disabled><i class="fas fa-arrow-right"></i> Continue</button>
    </div>
  </div>

  <div class="card" data-panel="3" style="display:none">
    <div class="card-title"><i class="fas fa-circle-check"></i> Confirm booking</div>
    <div style="background:var(--surface-hover);border-radius:var(--radius-md);padding:20px">
      <div style="display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
        <div><div class="label-small">Date</div><div id="sumDate" style="font-weight:500">—</div></div>
        <div><div class="label-small">Period</div><div id="sumSlot" style="font-weight:500">—</div></div>
        <div><div class="label-small">Room</div><div id="sumRoom" class="mono" style="font-weight:500">—</div></div>
      </div>
    </div>
    <p class="dim" style="font-size:13px;margin-top:16px">
      <i class="fas fa-info-circle"></i> Your booking will be marked <strong>pending</strong> until an admin approves it.
    </p>
    <div class="row" style="justify-content:space-between;margin-top:16px">
      <button class="btn btn-ghost" id="backStep3"><i class="fas fa-arrow-left"></i> Back</button>
      <button class="btn btn-primary" id="confirmBtn"><i class="fas fa-check"></i> Confirm booking</button>
    </div>
  </div>
</div>

<script type="module">
import { requireRole, renderNav, supabase, todayISO, toast, escapeHtml,
         isOnline, onNetworkChange, queueBooking, getPendingBookings, syncPendingBookings } from './js/core.js';

(async () => {
  const auth = await requireRole(['faculty', 'admin']);
  if (!auth) return;
  renderNav(auth.profile);

  const $ = id => document.getElementById(id);
  let selectedRoom = null;

  const dateInput = $('dateInput');
  const slotSelect = $('slotSelect');
  dateInput.value = todayISO();

  const [{ data: slotData }, { data: roomData }] = await Promise.all([
    supabase.from('time_slots').select('*').eq('is_active', true).order('sort_order').order('start_time'),
    supabase.from('rooms').select('*').eq('bookable', true).order('building').order('floor'),
  ]);
  const slots = slotData ?? [];
  const rooms = roomData ?? [];

  slotSelect.innerHTML = slots.map(s =>
    `<option value="${s.slot_id}">${escapeHtml(s.label || s.slot_id)} (${s.start_time.slice(0,5)}–${s.end_time.slice(0,5)})</option>`
  ).join('');

  if (isOnline()) {
    const pending = getPendingBookings();
    if (pending.length) {
      try {
        const r = await syncPendingBookings();
        if (r.synced > 0) toast(`Synced ${r.synced} pending booking(s)`, 'success');
      } catch {}
    }
  }

  function setStep(n) {
    document.querySelectorAll('[data-panel]').forEach(el => {
      el.style.display = parseInt(el.dataset.panel, 10) === n ? 'block' : 'none';
    });
    document.querySelectorAll('.step').forEach(el => {
      const s = parseInt(el.dataset.step, 10);
      el.classList.toggle('active', s === n);
      el.classList.toggle('done', s < n);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function loadRooms() {
    const { data: busy } = await supabase
      .from('bookings')
      .select('room_id')
      .eq('book_date', dateInput.value)
      .eq('slot_id', slotSelect.value)
      .in('status', ['pending', 'approved']);
    const busySet = new Set((busy ?? []).map(b => b.room_id));
    getPendingBookings().forEach(b => {
      if (b.book_date === dateInput.value && b.slot_id === slotSelect.value) busySet.add(b.room_id);
    });
    const free = rooms.filter(r => !busySet.has(r.room_id));
    const busyRooms = rooms.filter(r => busySet.has(r.room_id));

    $('freeCount').textContent = free.length;
    $('busyCount').textContent = busyRooms.length;

    $('freeGrid').innerHTML = free.length
      ? free.map(r => `
        <button class="room-card" data-room="${escapeHtml(r.room_id)}" data-name="${escapeHtml(r.display_name)}">
          <div class="rc-name"><i class="fas fa-door-open"></i>${escapeHtml(r.display_name)}</div>
          <div class="rc-meta">Block ${r.building} · Floor ${r.floor} · ${escapeHtml(r.type)}${r.capacity ? ' · ' + r.capacity + ' seats' : ''}</div>
        </button>
      `).join('')
      : '<div class="empty" style="grid-column:1/-1"><i class="fas fa-door-closed"></i>No free rooms at this time</div>';

    document.querySelectorAll('[data-room]').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('[data-room]').forEach(b => { b.style.outline = ''; b.style.outlineOffset = ''; });
        btn.style.outline = '2px solid var(--brand)';
        btn.style.outlineOffset = '2px';
        selectedRoom = { room_id: btn.dataset.room, name: btn.dataset.name };
        $('nextStep2').disabled = false;
      };
    });
  }

  $('nextStep1').onclick = async () => {
    if (!dateInput.value || !slotSelect.value) { toast('Pick date and period', 'error'); return; }
    await loadRooms();
    setStep(2);
  };

  $('backStep2').onclick = () => setStep(1);

  $('nextStep2').onclick = () => {
    if (!selectedRoom) return;
    const slot = slots.find(s => s.slot_id === slotSelect.value);
    $('sumDate').textContent = dateInput.value;
    $('sumSlot').textContent = slot ? `${slot.label || slot.slot_id} · ${slot.start_time.slice(0,5)}–${slot.end_time.slice(0,5)}` : slotSelect.value;
    $('sumRoom').textContent = selectedRoom.name;
    setStep(3);
  };

  $('backStep3').onclick = () => setStep(2);

  $('confirmBtn').onclick = async () => {
    if (!selectedRoom) return;
    const booking = {
      room_id: selectedRoom.room_id,
      book_date: dateInput.value,
      slot_id: slotSelect.value,
      type: 'makeup',
      status: 'pending',
      faculty_id: auth.session.user.id,
      created_by: auth.session.user.id,
    };
    const btn = $('confirmBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Booking…';

    if (!isOnline()) {
      queueBooking({ ...booking, _pending: true, _createdAt: new Date().toISOString() });
      updatePendingBanner();
      toast(`Queued ${selectedRoom.name} (offline)`, 'success');
      setStep(1);
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-check"></i> Confirm booking';
      selectedRoom = null;
      return;
    }

    const { error } = await supabase.from('bookings').insert(booking);
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-check"></i> Confirm booking';

    if (error) {
      if (!isOnline() || error.message?.toLowerCase().includes('fetch')) {
        queueBooking({ ...booking, _pending: true, _createdAt: new Date().toISOString() });
        updatePendingBanner();
        toast(`Network error — queued ${selectedRoom.name}`, 'info');
      } else {
        toast(error.message, 'error');
      }
      return;
    }

    toast(`${selectedRoom.name} booked — pending approval`, 'success');
    setStep(1);
    selectedRoom = null;
    dateInput.value = todayISO();
    document.querySelectorAll('[data-room]').forEach(b => { b.style.outline = ''; });
    $('nextStep2').disabled = true;
  };

  function updatePendingBanner() {
    const n = getPendingBookings().length;
    const el = $('pendingBanner');
    if (n > 0) { el.style.display = 'inline-flex'; el.innerHTML = `<i class="fas fa-clock"></i> ${n} queued`; }
    else el.style.display = 'none';
  }
  function updateOnlineStatus() { $('offlineBanner').style.display = isOnline() ? 'none' : 'inline-flex'; }
  onNetworkChange(updateOnlineStatus);
  updateOnlineStatus();
  updatePendingBanner();
})();
</script>
</body>
</html>
