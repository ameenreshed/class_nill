<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courses · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-header">
    <div><h1 class="page-title"><i class="fas fa-book"></i> Courses</h1><p class="page-subtitle">Course catalog — code, name, department, credits.</p></div>
    <button class="btn btn-primary" id="addBtn"><i class="fas fa-plus"></i> Add course</button>
  </div>
  <div class="admin-tabs">
    <a href="admin-faculty.html" class="admin-tab"><i class="fas fa-chalkboard-user"></i> Faculty</a>
    <a href="admin-batches.html" class="admin-tab"><i class="fas fa-users-rectangle"></i> Batches</a>
    <a href="admin-courses.html" class="admin-tab active"><i class="fas fa-book"></i> Courses</a>
    <a href="admin-timetable.html" class="admin-tab"><i class="fas fa-table"></i> Timetable</a>
    <a href="admin-bookings.html" class="admin-tab"><i class="fas fa-calendar-check"></i> Bookings</a>
    <a href="admin-rooms.html" class="admin-tab"><i class="fas fa-door-open"></i> Rooms</a>
    <a href="admin-buildings.html" class="admin-tab"><i class="fas fa-building"></i> Buildings</a>
    <a href="admin-slots.html" class="admin-tab"><i class="fas fa-clock"></i> Time slots</a>
    <a href="admin-calendar.html" class="admin-tab"><i class="fas fa-calendar-days"></i> Calendar</a>
    <a href="admin-users.html" class="admin-tab"><i class="fas fa-users"></i> Users</a>
  </div>
  <div class="row" style="margin-bottom:16px"><div class="search-wrap" style="max-width:360px"><i class="fas fa-search search-icon"></i><input class="input" id="search" placeholder="Search code or name…"></div></div>
  <div class="grid-auto" id="grid"></div>
</div>
<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, toast } from './js/core.js';
(async () => {
  const auth = await requireRole(['admin']); if (!auth) return;
  renderNav(auth.profile);
  const $ = id => document.getElementById(id);
  let courses = [], tt = [], search = '';

  async function load() {
    const [{ data: c }, { data: t }] = await Promise.all([
      supabase.from('courses').select('*').order('course_id'),
      supabase.from('timetable').select('course_code,section_id,faculty_id').eq('is_active', true),
    ]);
    courses = c ?? []; tt = t ?? [];
    render();
  }

  function render() {
    let list = courses;
    if (search) { const q = search.toLowerCase(); list = list.filter(c => c.course_id.toLowerCase().includes(q) || c.name.toLowerCase().includes(q) || (c.department || '').toLowerCase().includes(q)); }
    if (!list.length) { $('grid').innerHTML = `<div class="card" style="grid-column:1/-1"><div class="empty-action"><div class="empty-action-icon"><i class="fas fa-book"></i></div><div class="empty-action-title">No courses yet</div><div class="empty-action-sub">Click "Add course" to create the first one.</div></div></div>`; return; }
    $('grid').innerHTML = list.map(c => {
      const classes = tt.filter(t => t.course_code === c.course_id);
      const batches = new Set(classes.map(x => x.section_id)).size;
      const faculty = new Set(classes.map(x => x.faculty_id).filter(Boolean)).size;
      return `<div class="card card-hover">
        <div style="margin-bottom:12px"><div style="font-weight:700;color:var(--text);font-size:15px;display:flex;align-items:center;gap:8px"><i class="fas fa-book" style="color:var(--brand);font-size:12px"></i>${escapeHtml(c.course_id)}</div><div style="font-size:12px;color:var(--text-muted);margin-top:2px">${escapeHtml(c.name)}</div></div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--text-muted);margin-bottom:12px">
          <span><i class="fas fa-building-columns"></i> ${escapeHtml(c.department || '—')}</span>
          <span><i class="fas fa-star"></i> ${c.credits} credits</span>
          <span><i class="fas fa-users-rectangle"></i> ${batches} batch${batches === 1 ? '' : 'es'}</span>
          <span><i class="fas fa-chalkboard-user"></i> ${faculty} faculty</span>
        </div>
        <div class="chips" style="gap:6px">
          <button class="btn btn-sm" data-edit="${escapeHtml(c.course_id)}"><i class="fas fa-pen"></i> Edit</button>
          <button class="btn btn-sm btn-danger" data-del="${escapeHtml(c.course_id)}"><i class="fas fa-trash"></i></button>
        </div>
      </div>`;
    }).join('');
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => edit(b.dataset.edit));
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => del(b.dataset.del));
  }

  function edit(id) {
    const c = id ? courses.find(x => x.course_id === id) : null;
    const dialog = document.createElement('dialog'); dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content"><div class="modal-header"><div class="modal-title">${c ? 'Edit ' + escapeHtml(c.course_id) : 'Add course'}</div><button class="modal-close" data-close><i class="fas fa-xmark"></i></button></div><div class="modal-body"><label class="field"><span>Course code *</span><input class="input" data-field="course_id" value="${escapeHtml(c?.course_id || '')}" ${c ? 'disabled' : ''} placeholder="CS401"></label><label class="field"><span>Course name *</span><input class="input" data-field="name" value="${escapeHtml(c?.name || '')}"></label><label class="field"><span>Department</span><input class="input" data-field="department" value="${escapeHtml(c?.department || '')}"></label><label class="field"><span>Credits</span><input class="input" type="number" data-field="credits" value="${c?.credits || 3}"></label></div><div class="modal-footer"><button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-save>Save</button></div></div>`;
    document.body.appendChild(dialog); dialog.showModal();
    dialog.querySelector('[data-save]').onclick = async () => {
      const get = f => dialog.querySelector(`[data-field="${f}"]`).value.trim();
      if (!get('course_id') || !get('name')) return toast('Code and name required', 'error');
      const payload = { course_id: c?.course_id || get('course_id').toUpperCase(), name: get('name'), department: get('department') || null, credits: parseInt(get('credits')) || 3, is_active: true };
      const r = c ? await supabase.from('courses').update(payload).eq('course_id', c.course_id) : await supabase.from('courses').insert(payload);
      if (r.error) return toast(r.error.message, 'error');
      toast(c ? 'Updated' : 'Created', 'success'); dialog.close(); dialog.remove(); await load();
    };
    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  async function del(id) {
    const used = tt.filter(t => t.course_code === id).length;
    if (used > 0) return toast(`Cannot delete: ${used} class${used === 1 ? '' : 'es'} use this course`, 'error');
    if (!confirm(`Delete ${id}?`)) return;
    const { error } = await supabase.from('courses').delete().eq('course_id', id);
    if (error) return toast(error.message, 'error');
    toast('Deleted', 'success'); await load();
  }

  $('addBtn').onclick = () => edit();
  $('search').oninput = e => { search = e.target.value.trim(); render(); };
  await load();
})();
</script>
</body>
</html>
