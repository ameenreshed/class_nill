<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password · amnrd.scheduler</title>
<script>
window.__hadRecoveryHash = (function() {
  try {
    const h = location.hash.toLowerCase();
    const q = location.search.toLowerCase();
    return h.includes('type=recovery') || q.includes('type=recovery');
  } catch { return false; }
})();
window.__hadRecoveryError = (function() {
  try {
    const h = location.hash.toLowerCase();
    const q = location.search.toLowerCase();
    return h.includes('error=') || q.includes('error=') ||
           h.includes('otp_expired') || q.includes('otp_expired');
  } catch { return false; }
})();
</script>
<script>
(function(){
  try {
    var t = localStorage.getItem('theme');
    if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  } catch (e) {}
})();
</script>
<meta name="theme-color" content="#F97316">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>amnrd<span style="color:var(--orange)">.</span>scheduler</h1>

    <div id="loadingMode">
      <p class="sub"><i class="fas fa-spinner fa-spin"></i> Verifying link…</p>
    </div>

    <div id="forgotMode" style="display:none">
      <p class="sub">Enter your email and we'll send a reset link.</p>
      <form id="forgotForm" style="margin-top:24px">
        <label class="field">
          <span>Email</span>
          <input class="input" type="email" id="forgotEmail" placeholder="you@amnrd.com" autocomplete="email" required>
        </label>
        <button class="btn btn-primary btn-block" type="submit" id="forgotBtn" style="padding:12px">
          <i class="fas fa-paper-plane"></i> Send reset link
        </button>
      </form>
      <div id="forgotSent" style="display:none" class="login-success"></div>
      <div id="forgotError" class="login-error"></div>
      <p class="login-hint" style="margin-top:20px">
        <a href="login.html"><i class="fas fa-arrow-left" style="margin-right:4px"></i> Back to sign in</a>
      </p>
    </div>

    <div id="resetMode" style="display:none">
      <p class="sub">Choose a new password for your account.</p>
      <form id="resetForm" style="margin-top:24px">
        <label class="field">
          <span>New password</span>
          <div class="pwd-wrap">
            <input class="input" type="password" id="newPwd" placeholder="Min 8 characters" minlength="8" autocomplete="new-password" required>
            <button type="button" class="pwd-toggle" data-for="newPwd"><i class="fas fa-eye"></i></button>
          </div>
        </label>
        <label class="field">
          <span>Confirm new password</span>
          <div class="pwd-wrap">
            <input class="input" type="password" id="confirmPwd" placeholder="Re-enter password" minlength="8" autocomplete="new-password" required>
            <button type="button" class="pwd-toggle" data-for="confirmPwd"><i class="fas fa-eye"></i></button>
          </div>
        </label>
        <div id="strengthHint" style="font-size:11px;color:var(--dim);margin-top:-8px;margin-bottom:12px"></div>
        <button class="btn btn-primary btn-block" type="submit" id="resetBtn" style="padding:12px">
          <i class="fas fa-key"></i> Update password
        </button>
      </form>
      <div id="resetError" class="login-error"></div>
      <div id="resetSuccess" style="display:none" class="login-success">
        <i class="fas fa-circle-check"></i> Password updated! Redirecting to sign in…
      </div>
    </div>

    <div id="errorMode" style="display:none">
      <p class="sub">This reset link is invalid or has expired.</p>
      <a href="reset-password.html" class="btn btn-primary btn-block" style="margin-top:24px;padding:12px">
        <i class="fas fa-redo"></i> Request a new link
      </a>
      <p class="login-hint" style="margin-top:20px">
        <a href="login.html"><i class="fas fa-arrow-left" style="margin-right:4px"></i> Back to sign in</a>
      </p>
    </div>

  </div>
</div>

<script type="module">
import { supabase, escapeHtml } from './js/core.js';

const $ = id => document.getElementById(id);
let currentMode = 'loading';

function showForgot() {
  currentMode = 'forgot';
  $('loadingMode').style.display = 'none';
  $('forgotMode').style.display = 'block';
  $('resetMode').style.display = 'none';
  $('errorMode').style.display = 'none';
}

function showReset() {
  currentMode = 'reset';
  $('loadingMode').style.display = 'none';
  $('forgotMode').style.display = 'none';
  $('resetMode').style.display = 'block';
  $('errorMode').style.display = 'none';
  setTimeout(() => $('newPwd').focus(), 100);
}

function showError() {
  currentMode = 'error';
  $('loadingMode').style.display = 'none';
  $('forgotMode').style.display = 'none';
  $('resetMode').style.display = 'none';
  $('errorMode').style.display = 'block';
}

supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY' && session) {
    showReset();
  }
});

(async () => {
  await new Promise(r => setTimeout(r, 800));
  if (currentMode === 'reset') return;

  const { data: { session } } = await supabase.auth.getSession();

  if (session && window.__hadRecoveryHash) {
    showReset();
  } else if (window.__hadRecoveryError) {
    showError();
  } else if (session) {
    location.href = 'profile.html';
  } else {
    showForgot();
  }
})();

document.querySelectorAll('.pwd-toggle[data-for]').forEach(btn => {
  btn.onclick = () => {
    const input = $(btn.dataset.for);
    input.type = input.type === 'password' ? 'text' : 'password';
    btn.innerHTML = input.type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
  };
});

$('newPwd').addEventListener('input', e => {
  const v = e.target.value;
  const hint = $('strengthHint');
  if (!v) { hint.textContent = ''; return; }
  let score = 0;
  if (v.length >= 8) score++;
  if (v.length >= 12) score++;
  if (/[a-z]/.test(v) && /[A-Z]/.test(v)) score++;
  if (/\d/.test(v)) score++;
  if (/[^A-Za-z0-9]/.test(v)) score++;
  const labels = ['Very weak', 'Weak', 'Fair', 'Good', 'Strong', 'Very strong'];
  const colors = ['var(--red)', 'var(--red)', 'var(--amber)', 'var(--amber)', 'var(--green)', 'var(--green)'];
  hint.innerHTML = `Strength: <strong style="color:${colors[score]}">${labels[score]}</strong>`;
});

$('forgotForm').onsubmit = async (e) => {
  e.preventDefault();
  const email = $('forgotEmail').value.trim();
  const errEl = $('forgotError');
  errEl.style.display = 'none';

  if (!email) {
    errEl.innerHTML = '<i class="fas fa-circle-exclamation"></i> Enter your email';
    errEl.style.display = 'block';
    return;
  }

  const btn = $('forgotBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending…';

  const { error } = await supabase.auth.resetPasswordForEmail(email, {
    redirectTo: `${location.origin}/reset-password.html`,
  });

  btn.disabled = false;
  btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send reset link';

  if (error) {
    errEl.innerHTML = `<i class="fas fa-circle-exclamation"></i> ${error.message}`;
    errEl.style.display = 'block';
    return;
  }

  $('forgotForm').style.display = 'none';
  $('forgotSent').style.display = 'block';
  $('forgotSent').innerHTML = `<i class="fas fa-circle-check"></i> Reset link sent to <strong>${escapeHtml(email)}</strong>. Check your inbox and spam folder.`;
};

$('resetForm').onsubmit = async (e) => {
  e.preventDefault();
  const newPwd = $('newPwd').value;
  const confirmPwd = $('confirmPwd').value;
  const errEl = $('resetError');
  errEl.style.display = 'none';

  if (newPwd.length < 8) {
    errEl.innerHTML = '<i class="fas fa-circle-exclamation"></i> Password must be at least 8 characters';
    errEl.style.display = 'block';
    return;
  }
  if (newPwd !== confirmPwd) {
    errEl.innerHTML = '<i class="fas fa-circle-exclamation"></i> Passwords do not match';
    errEl.style.display = 'block';
    return;
  }

  const btn = $('resetBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating…';

  const { error } = await supabase.auth.updateUser({ password: newPwd });

  if (error) {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-key"></i> Update password';
    const msg = error.message.toLowerCase();
    if (msg.includes('session') || msg.includes('expired') || msg.includes('missing')) {
      errEl.innerHTML = '<i class="fas fa-circle-exclamation"></i> Your reset link has expired. <a href="reset-password.html" style="color:inherit;text-decoration:underline;font-weight:600">Request a new one</a>';
    } else {
      errEl.innerHTML = `<i class="fas fa-circle-exclamation"></i> ${error.message}`;
    }
    errEl.style.display = 'block';
    return;
  }

  try { await supabase.rpc('mark_password_changed'); } catch {}
  try { await supabase.auth.signOut({ scope: 'global' }); } catch {}

  $('resetForm').style.display = 'none';
  $('resetSuccess').style.display = 'block';

  setTimeout(() => { location.href = 'login.html?reset=success'; }, 2000);
};
</script>
</body>
</html>
