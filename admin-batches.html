<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batches · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
<style>
  .batch-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    transition: all 160ms ease;
  }
  .batch-card:hover {
    border-color: var(--border-strong);
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
  }
  .batch-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 16px;
  }
  .batch-card-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: -0.01em;
  }
  .batch-card-title i {
    color: var(--brand);
    font-size: 13px;
    font-family: 'Inter', sans-serif;
  }
  .batch-card-name {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
    line-height: 1.4;
  }
  .batch-progress {
    margin-bottom: 16px;
  }
  .batch-progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .batch-progress-label strong { color: var(--text); font-weight: 600; }
  .batch-progress-bar {
    height: 6px;
    background: var(--surface-active);
    border-radius: 3px;
    overflow: hidden;
  }
  .batch-progress-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 220ms ease;
  }
  .batch-metrics {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 12px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .batch-metric {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .batch-metric i { font-size: 11px; opacity: 0.7; }
  .batch-metric strong { color: var(--text); font-weight: 600; }
  .batch-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .batch-actions .btn {
    padding: 8px 12px;
    min-height: 34px;
    font-size: 12px;
  }
  .batch-actions .btn-primary { flex: 1; }
  .batch-actions .btn-icon {
    padding: 8px 11px;
    flex-shrink: 0;
  }
  .batch-actions .btn-icon i { font-size: 12px; }

  .student-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    transition: background 120ms;
  }
  .student-row:hover { background: var(--surface-hover); }
  .student-row + .student-row { border-top: 1px solid var(--border); border-radius: 0; }
  .student-row-info { min-width: 0; flex: 1; }
  .student-row-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .student-row-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .student-row .btn {
    padding: 5px 10px;
    min-height: 28px;
    font-size: 11px;
    flex-shrink: 0;
  }

  .pane-wrap {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    max-height: 400px;
  }
  .pane-header {
    padding: 12px 14px;
    background: var(--bg-subtle);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .pane-header .pane-count {
    padding: 1px 8px;
    background: var(--surface);
    border-radius: 10px;
    font-size: 10px;
    color: var(--text);
    font-weight: 600;
  }
  .pane-body {
    overflow-y: auto;
    flex: 1;
    padding: 4px;
  }

  @media (max-width: 700px) {
    .modal-split { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-users-rectangle"></i> Batches</h1>
      <p class="page-subtitle">Sections, students, courses, and schedules.</p>
    </div>
    <button class="btn btn-primary" id="addBtn"><i class="fas fa-plus"></i> Add batch</button>
  </div>

  <div class="admin-tabs">
    <a href="admin-faculty.html" class="admin-tab"><i class="fas fa-chalkboard-user"></i> Faculty</a>
    <a href="admin-batches.html" class="admin-tab active"><i class="fas fa-users-rectangle"></i> Batches</a>
    <a href="admin-courses.html" class="admin-tab"><i class="fas fa-book"></i> Courses</a>
    <a href="admin-timetable.html" class="admin-tab"><i class="fas fa-table"></i> Timetable</a>
    <a href="admin-bookings.html" class="admin-tab"><i class="fas fa-calendar-check"></i> Bookings</a>
    <a href="admin-rooms.html" class="admin-tab"><i class="fas fa-door-open"></i> Rooms</a>
    <a href="admin-buildings.html" class="admin-tab"><i class="fas fa-building"></i> Buildings</a>
    <a href="admin-slots.html" class="admin-tab"><i class="fas fa-clock"></i> Time slots</a>
    <a href="admin-calendar.html" class="admin-tab"><i class="fas fa-calendar-days"></i> Calendar</a>
    <a href="admin-users.html" class="admin-tab"><i class="fas fa-users"></i> Users</a>
  </div>

  <div class="row">
    <div class="search-wrap">
      <i class="fas fa-search search-icon"></i>
      <input class="input" id="search" placeholder="Search batch ID, name, department…">
    </div>
  </div>

  <div class="grid-auto" id="grid"></div>
</div>

<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, toast } from './js/core.js';

(async () => {
  const auth = await requireRole(['admin']);
  if (!auth) return;
  renderNav(auth.profile);

  const $ = id => document.getElementById(id);
  let sections = [], tt = [], users = [], search = '';

  async function load() {
    const [{ data: s }, { data: t }, { data: u }] = await Promise.all([
      supabase.from('sections').select('*').order('section_id'),
      supabase.from('timetable').select('*').eq('is_active', true),
      supabase.from('profiles').select('*'),
    ]);
    sections = s ?? []; tt = t ?? []; users = u ?? [];
    render();
  }

  function studentsOf(sectionId) {
    return users.filter(u => u.role === 'student' && u.section_id === sectionId);
  }

  function render() {
    let list = sections;
    if (search) {
      const q = search.toLowerCase();
      list = list.filter(s =>
        s.section_id.toLowerCase().includes(q) ||
        s.name.toLowerCase().includes(q) ||
        (s.department || '').toLowerCase().includes(q)
      );
    }
    if (!list.length) {
      $('grid').innerHTML = `<div class="card" style="grid-column:1/-1"><div class="empty-action">
        <div class="empty-action-icon"><i class="fas fa-users-rectangle"></i></div>
        <div class="empty-action-title">No batches yet</div>
        <div class="empty-action-sub">Click "Add batch" to create the first one.</div>
      </div></div>`;
      return;
    }
    $('grid').innerHTML = list.map(s => {
      const classes = tt.filter(t => t.section_id === s.section_id);
      const courses = new Set(classes.map(c => c.course_code).filter(Boolean)).size;
      const enrolled = studentsOf(s.section_id).length;
      const capacity = s.strength || 0;
      const fillPct = capacity ? Math.min(Math.round((enrolled / capacity) * 100), 100) : 0;
      const fillColor = fillPct >= 100 ? 'var(--danger)' : fillPct >= 80 ? 'var(--warning)' : 'var(--success)';
      return `<div class="batch-card">
        <div class="batch-card-header">
          <div>
            <div class="batch-card-title"><i class="fas fa-users-rectangle"></i>${escapeHtml(s.section_id)}</div>
            <div class="batch-card-name">${escapeHtml(s.name)}</div>
          </div>
          ${s.department ? `<span class="badge badge-admin" style="font-size:10px">${escapeHtml(s.department)}</span>` : ''}
        </div>

        <div class="batch-progress">
          <div class="batch-progress-label">
            <span><i class="fas fa-users" style="margin-right:4px"></i><strong>${enrolled}</strong> / ${s.strength || '?'} students</span>
            <span style="color:${fillColor};font-weight:600">${fillPct}%</span>
          </div>
          <div class="batch-progress-bar">
            <div class="batch-progress-fill" style="width:${fillPct}%;background:${fillColor}"></div>
          </div>
        </div>

        <div class="batch-metrics">
          <div class="batch-metric"><i class="fas fa-book"></i><strong>${courses}</strong> course${courses === 1 ? '' : 's'}</div>
          <div class="batch-metric"><i class="fas fa-table"></i><strong>${classes.length}</strong> class${classes.length === 1 ? '' : 'es'}</div>
        </div>

        <div class="batch-actions">
          <button class="btn btn-sm btn-primary" data-students="${escapeHtml(s.section_id)}"><i class="fas fa-user-plus"></i> Manage students</button>
          <button class="btn btn-sm btn-icon" data-view="${escapeHtml(s.section_id)}" title="View schedule"><i class="fas fa-eye"></i></button>
          <button class="btn btn-sm btn-icon" data-edit="${escapeHtml(s.section_id)}" title="Edit batch"><i class="fas fa-pen"></i></button>
          <button class="btn btn-sm btn-icon btn-danger" data-del="${escapeHtml(s.section_id)}" title="Delete"><i class="fas fa-trash"></i></button>
        </div>
      </div>`;
    }).join('');

    document.querySelectorAll('[data-students]').forEach(b => b.onclick = () => manageStudents(b.dataset.students));
    document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => view(b.dataset.view));
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => edit(b.dataset.edit));
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => del(b.dataset.del));
  }

  /* ===== MANAGE STUDENTS ===== */
  function manageStudents(sectionId) {
    const sec = sections.find(s => s.section_id === sectionId);
    if (!sec) return;

    let currentAssigned = studentsOf(sectionId);
    const allStudents = users.filter(u => u.role === 'student');

    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content modal-wide">
      <div class="modal-header">
        <div>
          <div class="modal-title">Manage students · ${escapeHtml(sectionId)}</div>
          <div class="modal-sub">${escapeHtml(sec.name)} · Strength ${sec.strength || '?'}</div>
        </div>
        <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px" class="modal-split">
          <div>
            <div class="pane-wrap">
              <div class="pane-header">
                <span><i class="fas fa-users-rectangle"></i> In this batch</span>
                <span class="pane-count" id="assignedCount">${currentAssigned.length}</span>
              </div>
              <div class="pane-body" id="assignedPane"></div>
            </div>
          </div>
          <div>
            <div class="search-wrap" style="max-width:none;margin-bottom:12px">
              <i class="fas fa-search search-icon"></i>
              <input class="input" id="searchStudents" placeholder="Search students…">
            </div>
            <div class="pane-wrap">
              <div class="pane-header">
                <span><i class="fas fa-users"></i> Not in this batch</span>
                <span class="pane-count" id="unassignedCount">${allStudents.length - currentAssigned.length}</span>
              </div>
              <div class="pane-body" id="unassignedPane"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close>Done</button>
      </div>
    </div>`;
    document.body.appendChild(dialog);
    dialog.showModal();

    function renderPanes(filter = '') {
      const q = filter.toLowerCase();
      const assigned = currentAssigned.filter(s => !q || (s.full_name || '').toLowerCase().includes(q) || (s.email || '').toLowerCase().includes(q));
      const assignedIds = new Set(currentAssigned.map(s => s.id));
      const unassigned = allStudents.filter(s => !assignedIds.has(s.id) && (!q || (s.full_name || '').toLowerCase().includes(q) || (s.email || '').toLowerCase().includes(q)));

      dialog.querySelector('#assignedCount').textContent = currentAssigned.length;
      dialog.querySelector('#unassignedCount').textContent = allStudents.length - currentAssigned.length;

      dialog.querySelector('#assignedPane').innerHTML = assigned.length
        ? assigned.map(s => `<div class="student-row">
            <div class="student-row-info">
              <div class="student-row-name">${escapeHtml(s.full_name || s.email)}</div>
              <div class="student-row-meta">${escapeHtml(s.email)}</div>
            </div>
            <button class="btn btn-sm" data-remove="${s.id}" title="Remove"><i class="fas fa-minus"></i></button>
          </div>`).join('')
        : '<div class="empty" style="padding:24px;font-size:12px">No students in this batch</div>';

      dialog.querySelector('#unassignedPane').innerHTML = unassigned.length
        ? unassigned.map(s => `<div class="student-row">
            <div class="student-row-info">
              <div class="student-row-name">${escapeHtml(s.full_name || s.email)}${s.section_id ? ` <span class="badge badge-gray" style="font-size:9px;margin-left:4px">${escapeHtml(s.section_id)}</span>` : ''}</div>
              <div class="student-row-meta">${escapeHtml(s.email)}</div>
            </div>
            <button class="btn btn-sm btn-primary" data-add="${s.id}" title="Add"><i class="fas fa-plus"></i></button>
          </div>`).join('')
        : '<div class="empty" style="padding:24px;font-size:12px">No more students to add</div>';

      dialog.querySelectorAll('[data-remove]').forEach(b => b.onclick = async () => {
        const userId = b.dataset.remove;
        b.disabled = true; b.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        const { data, error } = await supabase.rpc('admin_remove_students', { p_user_ids: [userId] });
        if (error) { b.disabled = false; b.innerHTML = '<i class="fas fa-minus"></i>'; return toast(error.message, 'error'); }
        if (data?.error) { b.disabled = false; b.innerHTML = '<i class="fas fa-minus"></i>'; return toast(data.error, 'error'); }
        const student = users.find(u => u.id === userId);
        if (student) student.section_id = null;
        currentAssigned = currentAssigned.filter(s => s.id !== userId);
        toast('Removed from batch', 'success');
        renderPanes(dialog.querySelector('#searchStudents').value);
      });

      dialog.querySelectorAll('[data-add]').forEach(b => b.onclick = async () => {
        const userId = b.dataset.add;
        b.disabled = true; b.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        const { data, error } = await supabase.rpc('admin_assign_students', { p_section_id: sectionId, p_user_ids: [userId] });
        if (error) { b.disabled = false; b.innerHTML = '<i class="fas fa-plus"></i>'; return toast(error.message, 'error'); }
        if (data?.error) { b.disabled = false; b.innerHTML = '<i class="fas fa-plus"></i>'; return toast(data.error, 'error'); }
        const student = users.find(u => u.id === userId);
        if (student) student.section_id = sectionId;
        currentAssigned.push(student);
        toast('Added to batch', 'success');
        renderPanes(dialog.querySelector('#searchStudents').value);
      });
    }

    dialog.querySelector('#searchStudents').oninput = e => renderPanes(e.target.value);
    renderPanes();

    const close = () => { dialog.close(); dialog.remove(); load(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) { dialog.remove(); load(); } });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  /* ===== VIEW SCHEDULE ===== */
  function view(sectionId) {
    const s = sections.find(x => x.section_id === sectionId);
    if (!s) return;
    const classes = tt.filter(t => t.section_id === sectionId);
    const students = studentsOf(sectionId);
    const byDay = new Map();
    classes.forEach(c => { if (!byDay.has(c.day_of_week)) byDay.set(c.day_of_week, []); byDay.get(c.day_of_week).push(c); });
    const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const sched = [1,2,3,4,5,6,0].filter(d => byDay.has(d)).map(d => `<div style="margin-bottom:16px">
      <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px">${DOW[d]}</div>
      ${byDay.get(d).sort((a, b) => a.slot_id.localeCompare(b.slot_id)).map(c => `<div style="padding:10px 12px;background:var(--surface-hover);border-radius:8px;margin-bottom:6px;font-size:12px;display:flex;justify-content:space-between;align-items:center"><div><span style="font-family:monospace;font-weight:700;color:var(--brand)">${escapeHtml(c.course_code || '—')}</span> · ${escapeHtml(c.room_id)}</div><div style="font-family:monospace;color:var(--text-muted);font-size:11px">${escapeHtml(c.slot_id)}</div></div>`).join('')}
    </div>`).join('') || '<div class="empty" style="padding:24px"><i class="fas fa-inbox"></i><br>No classes scheduled</div>';

    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content modal-wide">
      <div class="modal-header">
        <div>
          <div class="modal-title">${escapeHtml(sectionId)} · ${escapeHtml(s.name)}</div>
          <div class="modal-sub">${students.length} / ${s.strength || '?'} students${s.department ? ' · ' + escapeHtml(s.department) : ''}</div>
        </div>
        <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div>
          <h3 style="font-size:14px;font-weight:600;color:var(--text);margin:0 0 12px"><i class="fas fa-users" style="color:var(--brand);margin-right:6px"></i>Students (${students.length})</h3>
          ${students.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px">${students.map(st => `<span style="display:inline-flex;padding:4px 10px;background:var(--surface-hover);border-radius:6px;font-size:11px;color:var(--text)">${escapeHtml(st.full_name || st.email)}</span>`).join('')}</div>` : '<span class="dim" style="font-size:12px">No students assigned yet</span>'}
        </div>
        <div>
          <h3 style="font-size:14px;font-weight:600;color:var(--text);margin:0 0 12px"><i class="fas fa-calendar-week" style="color:var(--brand);margin-right:6px"></i>Weekly schedule</h3>
          ${sched}
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close>Close</button>
        <button class="btn btn-primary" id="manageBtn"><i class="fas fa-user-plus"></i> Manage students</button>
      </div>
    </div>`;
    document.body.appendChild(dialog);
    dialog.showModal();

    dialog.querySelector('#manageBtn').onclick = () => { dialog.close(); dialog.remove(); manageStudents(sectionId); };
    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  /* ===== ADD / EDIT ===== */
  $('addBtn').onclick = () => edit();
  function edit(id) {
    const s = id ? sections.find(x => x.section_id === id) : null;
    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">${s ? 'Edit ' + escapeHtml(s.section_id) : 'Add batch'}</div>
        <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <label class="field"><span>Batch ID *</span><input class="input" data-field="section_id" value="${escapeHtml(s?.section_id || '')}" ${s ? 'disabled' : ''} placeholder="CSE-4A"></label>
        <label class="field"><span>Display name *</span><input class="input" data-field="name" value="${escapeHtml(s?.name || '')}" placeholder="CSE 4th Year A"></label>
        <label class="field"><span>Strength</span><input class="input" type="number" data-field="strength" value="${s?.strength || 60}"></label>
        <label class="field"><span>Department</span><input class="input" data-field="department" value="${escapeHtml(s?.department || '')}"></label>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close>Cancel</button>
        <button class="btn btn-primary" data-save>Save</button>
      </div>
    </div>`;
    document.body.appendChild(dialog);
    dialog.showModal();

    dialog.querySelector('[data-save]').onclick = async () => {
      const get = f => dialog.querySelector(`[data-field="${f}"]`).value.trim();
      if (!get('section_id') || !get('name')) return toast('ID and name required', 'error');
      const payload = {
        section_id: s?.section_id || get('section_id').trim(),
        name: get('name').trim(),
        strength: parseInt(get('strength')) || 60,
        department: get('department') || null,
      };
      const r = s ? await supabase.from('sections').update(payload).eq('section_id', s.section_id) : await supabase.from('sections').insert(payload);
      if (r.error) return toast(r.error.message, 'error');
      toast(s ? 'Updated' : 'Created', 'success');
      dialog.close(); dialog.remove();
      await load();
    };

    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  async function del(id) {
    const students = studentsOf(id).length;
    const classes = tt.filter(t => t.section_id === id).length;
    let msg = `Delete ${id}?`;
    if (students > 0) msg += `\n\n⚠️ ${students} student(s) will lose their batch.`;
    if (classes > 0) msg += `\n⚠️ ${classes} timetable row(s) will be removed.`;
    if (!confirm(msg)) return;
    const { error } = await supabase.from('sections').delete().eq('section_id', id);
    if (error) return toast(error.message, 'error');
    toast('Deleted', 'success');
    await load();
  }

  $('search').oninput = e => { search = e.target.value.trim(); render(); };
  await load();
})();
</script>
