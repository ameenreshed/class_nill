<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LPU Scheduler">
<meta name="mobile-web-app-capable" content="yes">
<title>Free rooms · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/mobile-app.css">
<style>
.fr-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:16px}
.fr-toolbar .search-wrap{flex:1;min-width:200px;max-width:320px}
.fr-toolbar select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:13px;font-family:inherit;max-width:200px}
.fr-toolbar select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.fr-date-group{display:flex;gap:6px;align-items:center;margin-left:auto}
.fr-date-group input[type=date]{padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:13px;font-family:inherit}
.fr-legend{padding:14px 18px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-top:16px}
.fr-legend-title{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.fr-legend-grid{display:flex;flex-wrap:wrap;gap:10px 20px;font-size:12px;color:var(--text-secondary)}
.fr-legend-item{display:inline-flex;align-items:center;gap:6px}
.fr-legend-swatch{width:14px;height:14px;border-radius:4px;border:1px solid}
.fr-legend-swatch.free{background:var(--success-soft);border-color:var(--success-soft-border)}
.fr-legend-swatch.class{background:var(--info-soft);border-color:var(--info-soft-border)}
.fr-legend-swatch.makeup{background:var(--warning-soft);border-color:var(--warning-soft-border)}
.fr-legend-swatch.exam{background:var(--danger-soft);border-color:var(--danger-soft-border)}
.fr-legend-swatch.maint{background:var(--surface-active);border-color:var(--border)}
.fr-legend-swatch.closed{background:var(--bg-subtle);border-color:var(--border)}
.fr-now-banner{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--brand-soft);border:1px solid var(--brand-soft-border);border-radius:12px;margin-bottom:16px;font-size:13px;color:var(--brand-text)}
.fr-now-banner i{font-size:16px;color:var(--brand)}
.fr-now-banner strong{font-weight:700}
.fr-toolbar .row{margin:0;gap:8px}
</style>
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-building"></i> Free rooms</h1>
      <p class="page-subtitle">Live availability across every building. Classes, makeups, exams, and maintenance are shown.</p>
    </div>
  </div>

  <div class="fr-now-banner" id="nowBanner" style="display:none"></div>

  <div class="fr-toolbar">
    <div class="search-wrap">
      <i class="fas fa-search search-icon"></i>
      <input class="input" id="search" placeholder="Search room or building…">
    </div>
    <select id="buildingFilter"><option value="">All buildings</option></select>
    <select id="floorFilter"><option value="">All floors</option></select>
    <div class="fr-date-group">
      <label style="font-size:12px;color:var(--text-secondary)">Date:</label>
      <input type="date" id="datePicker">
      <button class="btn" id="todayBtn" title="Jump to today"><i class="fas fa-calendar-day"></i></button>
      <button class="btn" id="refreshBtn" title="Refresh"><i class="fas fa-rotate-right"></i></button>
    </div>
  </div>

  <div class="grid-wrap">
    <table class="vacancy-table" id="grid">
      <thead id="gridHead"></thead>
      <tbody id="gridBody"></tbody>
    </table>
  </div>

  <div class="fr-legend">
    <div class="fr-legend-title">Legend</div>
    <div class="fr-legend-grid">
      <span class="fr-legend-item"><span class="fr-legend-swatch free"></span>Free</span>
      <span class="fr-legend-item"><span class="fr-legend-swatch class"></span>Class</span>
      <span class="fr-legend-item"><span class="fr-legend-swatch makeup"></span>Makeup</span>
      <span class="fr-legend-item"><span class="fr-legend-swatch exam"></span>Exam / Event</span>
      <span class="fr-legend-item"><span class="fr-legend-swatch maint"></span>Maintenance</span>
      <span class="fr-legend-item"><span class="fr-legend-swatch closed"></span>Closed / Holiday</span>
    </div>
  </div>
</div>

<script type="module">
import {
  requireRole, renderNav, supabase, escapeHtml, todayISO, humanDate,
  loadBaseData, loadDataForDate, classifyCell, currentSlot, nowDate, formatTime, toast
} from './js/core.js';

(async () => {
  const auth = await requireRole(['admin', 'faculty', 'student']);
  if (!auth) return;
  renderNav(auth.profile);
  const $ = id => document.getElementById(id);

  let base = { rooms: [], slots: [], buildings: [] };
  let data = { timetable: [], bookings: [], calendarEntry: null, unavailability: [] };
  let activeDate = todayISO();
  let filters = { search: '', building: '', floor: '' };

  async function load() {
    base = await loadBaseData();
    renderFilters();
    await loadDate();
  }

  async function loadDate() {
    data = await loadDataForDate(activeDate);
    renderHeader();
    renderGrid();
    renderNowBanner();
  }

  function renderFilters() {
    const sel = $('buildingFilter');
    const cur = sel.value;
    const buildings = [...new Set(base.rooms.map(r => r.building).filter(Boolean))].sort();
    sel.innerHTML = '<option value="">All buildings</option>' +
      buildings.map(b => `<option value="${escapeHtml(b)}" ${cur === b ? 'selected' : ''}>${escapeHtml(b)}</option>`).join('');

    const floorSel = $('floorFilter');
    const floorCur = floorSel.value;
    const floors = [...new Set(base.rooms.map(r => r.floor).filter(f => f != null))].sort((a, b) => a - b);
    floorSel.innerHTML = '<option value="">All floors</option>' +
      floors.map(f => `<option value="${f}" ${floorCur == f ? 'selected' : ''}>Floor ${f}</option>`).join('');
  }

  function renderHeader() {
    const head = $('gridHead');
    const nowSlot = currentSlot(base.slots, activeDate);
    head.innerHTML = `<tr>
      <th class="room-col">Room</th>
      ${base.slots.map(s => `<th class="${nowSlot?.slot_id === s.slot_id ? 'slot-current' : ''}">
        <div style="font-family:'JetBrains Mono',monospace;font-size:10.5px">${s.start_time.slice(0,5)}–${s.end_time.slice(0,5)}</div>
        <div style="font-size:9.5px;opacity:.75;margin-top:1px">${escapeHtml(s.label || s.slot_id)}</div>
      </th>`).join('')}
    </tr>`;
  }

  function renderGrid() {
    const body = $('gridBody');
    let rooms = base.rooms;
    if (filters.search) {
      const q = filters.search.toLowerCase();
      rooms = rooms.filter(r =>
        (r.room_id || '').toLowerCase().includes(q)
        || (r.display_name || '').toLowerCase().includes(q)
        || (r.building || '').toLowerCase().includes(q));
    }
    if (filters.building) rooms = rooms.filter(r => r.building === filters.building);
    if (filters.floor !== '') rooms = rooms.filter(r => String(r.floor) === String(filters.floor));

    if (!rooms.length) {
      body.innerHTML = `<tr><td colspan="${base.slots.length + 1}" class="empty" style="padding:40px;text-align:center">
        <i class="fas fa-door-closed"></i> No rooms match your filters
      </td></tr>`;
      return;
    }

    const grouped = new Map();
    rooms.forEach(r => {
      const key = `${r.building || '?'} · Floor ${r.floor ?? '?'}`;
      if (!grouped.has(key)) grouped.set(key, []);
      grouped.get(key).push(r);
    });

    const rows = [];
    for (const [groupLabel, groupRooms] of grouped) {
      rows.push(`<tr class="floor-row"><td colspan="${base.slots.length + 1}">
        <i class="fas fa-layer-group"></i>${escapeHtml(groupLabel)}
      </td></tr>`);
      groupRooms.sort((a, b) => a.room_id.localeCompare(b.room_id));
      for (const room of groupRooms) {
        const cells = base.slots.map(slot => {
          const cell = classifyCell({
            roomId: room.room_id, slotId: slot.slot_id, dateStr: activeDate,
            timetable: data.timetable, bookings: data.bookings,
            calendarEntry: data.calendarEntry, weekendOpen: room.weekend_open,
            unavailability: data.unavailability,
          });
          const stateClass = `cell-${cell.state === 'class' ? 'class'
            : cell.state === 'makeup' ? 'makeup'
            : cell.state === 'exam' ? 'exam'
            : cell.state === 'maint' ? 'maint'
            : cell.state === 'holiday' ? 'closed'
            : cell.state === 'closed' ? 'closed'
            : 'free'}`;
          const today = activeDate === todayISO();
          const past = today && slot.end_time <= formatTime(nowDate());
          const currentCol = currentSlot(base.slots, activeDate)?.slot_id === slot.slot_id;
          return `<td class="slot-cell ${currentCol ? 'cell-current-col' : ''}">
            <div class="${stateClass} ${past ? 'cell-past' : ''}" title="${escapeHtml(cell.reason || cell.label)}">
              ${cell.state === 'free' ? 'Free' : cell.label}
            </div>
          </td>`;
        }).join('');
        rows.push(`<tr>
          <td class="room-cell">
            <div class="mono">${escapeHtml(room.display_name || room.room_id)}</div>
            <div class="meta">${escapeHtml(room.type || '')}${room.capacity ? ' · ' + room.capacity + ' seats' : ''}</div>
          </td>
          ${cells}
        </tr>`);
      }
    }
    body.innerHTML = rows.join('');
  }

  function renderNowBanner() {
    const banner = $('nowBanner');
    const nowSlot = currentSlot(base.slots, activeDate);
    if (!nowSlot) { banner.style.display = 'none'; return; }
    const freeRooms = base.rooms.filter(r => {
      const cell = classifyCell({
        roomId: r.room_id, slotId: nowSlot.slot_id, dateStr: activeDate,
        timetable: data.timetable, bookings: data.bookings,
        calendarEntry: data.calendarEntry, weekendOpen: r.weekend_open,
        unavailability: data.unavailability,
      });
      return cell.state === 'free';
    });
    banner.style.display = 'flex';
    banner.innerHTML = `<i class="fas fa-broadcast-tower"></i>
      <span><strong>${nowSlot.label || nowSlot.slot_id}</strong> · ${nowSlot.start_time.slice(0,5)}–${nowSlot.end_time.slice(0,5)} right now —
      <strong>${freeRooms.length}</strong> of ${base.rooms.length} rooms are free</span>`;
  }

  let searchTimer;
  $('search').oninput = e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      filters.search = e.target.value.trim();
      renderGrid();
    }, 200);
  };
  $('buildingFilter').onchange = e => { filters.building = e.target.value; renderGrid(); };
  $('floorFilter').onchange = e => { filters.floor = e.target.value; renderGrid(); };

  $('datePicker').value = activeDate;
  $('datePicker').onchange = async e => {
    activeDate = e.target.value;
    await loadDate();
  };
  $('todayBtn').onclick = async () => {
    activeDate = todayISO();
    $('datePicker').value = activeDate;
    await loadDate();
  };
  $('refreshBtn').onclick = async () => {
    await loadDate();
    toast('Refreshed', 'success');
  };

  // Live tick: update "now" banner every 30s
  setInterval(() => {
    if (activeDate === todayISO()) {
      renderNowBanner();
      renderHeader();
    }
  }, 30000);

  await load();
})();
</script>
<script type="module" src="js/banner.js"></script>
</body>
</html>
