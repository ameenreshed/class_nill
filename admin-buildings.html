<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buildings · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-header">
    <div><h1 class="page-title"><i class="fas fa-building"></i> Buildings</h1><p class="page-subtitle">Campus blocks with floors and room counts.</p></div>
    <button class="btn btn-primary" id="addBtn"><i class="fas fa-plus"></i> Add building</button>
  </div>
  <div class="admin-tabs">
    <a href="admin-faculty.html" class="admin-tab"><i class="fas fa-chalkboard-user"></i> Faculty</a>
    <a href="admin-timetable.html" class="admin-tab"><i class="fas fa-table"></i> Timetable</a>
    <a href="admin-bookings.html" class="admin-tab"><i class="fas fa-calendar-check"></i> Bookings</a>
    <a href="worker.html" class="admin-tab"><i class="fas fa-screwdriver-wrench"></i> Maintenance</a>
    <a href="admin-rooms.html" class="admin-tab"><i class="fas fa-door-open"></i> Rooms</a>
    <a href="admin-buildings.html" class="admin-tab active"><i class="fas fa-building"></i> Buildings</a>
    <a href="admin-slots.html" class="admin-tab"><i class="fas fa-clock"></i> Time slots</a>
    <a href="admin-calendar.html" class="admin-tab"><i class="fas fa-calendar-days"></i> Calendar</a>
    <a href="admin-users.html" class="admin-tab"><i class="fas fa-users"></i> Users</a>
    <a href="admin-settings.html" class="admin-tab"><i class="fas fa-gear"></i> Settings</a>
  </div>
  <div class="grid-auto" id="grid"></div>
</div>
<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, toast } from './js/core.js';
(async () => {
  const auth = await requireRole(['admin']); if (!auth) return;
  renderNav(auth.profile);
  const $ = id => document.getElementById(id);
  let buildings = [], floors = [], rooms = [];

  async function load() {
    const [{ data: b }, { data: f }, { data: r }] = await Promise.all([
      supabase.from('buildings').select('*').order('sort_order').order('id'),
      supabase.from('building_floors').select('*').order('floor'),
      supabase.from('rooms').select('building,floor'),
    ]);
    buildings = b ?? []; floors = f ?? []; rooms = r ?? [];
    render();
  }

  function render() {
    if (!buildings.length) { $('grid').innerHTML = `<div class="card" style="grid-column:1/-1"><div class="empty-action"><div class="empty-action-icon"><i class="fas fa-building"></i></div><div class="empty-action-title">No buildings yet</div><div class="empty-action-sub">Click "Add building" to create the first one.</div></div></div>`; return; }
    const floorsByBld = new Map(); floors.forEach(f => { if (!floorsByBld.has(f.building_id)) floorsByBld.set(f.building_id, []); floorsByBld.get(f.building_id).push(f); });
    const roomCount = new Map(); rooms.forEach(r => { const k = `${r.building}|${r.floor}`; roomCount.set(k, (roomCount.get(k) || 0) + 1); });
    $('grid').innerHTML = buildings.map(b => {
      const fs = floorsByBld.get(b.id) || [];
      const total = fs.reduce((s, f) => s + (roomCount.get(`${b.id}|${f.floor}`) || 0), 0);
      return `<div class="card card-hover">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px">
          <div><div style="font-weight:600;color:var(--text);font-size:15px;display:flex;align-items:center;gap:8px"><i class="fas fa-building" style="color:var(--brand);font-size:12px"></i>${escapeHtml(b.name || b.id)}</div><div style="font-size:11px;color:var(--text-secondary);margin-top:2px">ID: ${escapeHtml(b.id)}</div></div>
          ${b.is_active ? '' : '<span class="badge badge-rejected">inactive</span>'}
        </div>
        <div style="display:flex;gap:10px;font-size:11px;color:var(--text-secondary);margin-bottom:10px">
          <span><i class="fas fa-layer-group"></i> ${fs.length} floor${fs.length === 1 ? '' : 's'}</span>
          <span><i class="fas fa-door-open"></i> ${total} room${total === 1 ? '' : 's'}</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px">
          ${fs.map(f => `<span class="badge badge-gray" style="font-size:10px">F${f.floor} · ${roomCount.get(`${b.id}|${f.floor}`) || 0}</span>`).join('')}
          <button class="btn btn-sm" data-addfloor="${escapeHtml(b.id)}" style="padding:2px 8px;min-height:22px;font-size:10px"><i class="fas fa-plus" style="font-size:9px"></i></button>
        </div>
        <div class="chips" style="gap:6px">
          <button class="btn btn-sm" data-edit="${escapeHtml(b.id)}"><i class="fas fa-pen"></i></button>
          <button class="btn btn-sm ${b.is_active ? 'btn-danger' : 'btn-success'}" data-toggle="${escapeHtml(b.id)}" data-active="${b.is_active}"><i class="fas fa-${b.is_active ? 'eye-slash' : 'eye'}"></i></button>
        </div>
      </div>`;
    }).join('');
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => edit(b.dataset.edit));
    document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
      const { error } = await supabase.from('buildings').update({ is_active: b.dataset.active !== 'true' }).eq('id', b.dataset.toggle);
      if (error) return toast(error.message, 'error'); await load();
    });
    document.querySelectorAll('[data-addfloor]').forEach(b => b.onclick = () => addFloor(b.dataset.addfloor));
  }

  function edit(id) {
    const b = id ? buildings.find(x => x.id === id) : null;
    const dialog = document.createElement('dialog'); dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content"><div class="modal-header"><div class="modal-title">${b ? 'Edit ' + escapeHtml(b.id) : 'Add building'}</div><button class="modal-close" data-close><i class="fas fa-xmark"></i></button></div><div class="modal-body"><label class="field"><span>ID *</span><input class="input" data-field="id" value="${escapeHtml(b?.id || '')}" ${b ? 'disabled' : ''} placeholder="34"></label><label class="field"><span>Name *</span><input class="input" data-field="name" value="${escapeHtml(b?.name || '')}"></label><label class="field"><span>Address</span><input class="input" data-field="address" value="${escapeHtml(b?.address || '')}"></label><label class="field"><span>Sort order</span><input class="input" type="number" data-field="sort_order" value="${b?.sort_order || 0}"></label></div><div class="modal-footer"><button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-save>Save</button></div></div>`;
    document.body.appendChild(dialog); dialog.showModal();
    dialog.querySelector('[data-save]').onclick = async () => {
      const get = f => dialog.querySelector(`[data-field="${f}"]`).value.trim();
      if (!get('id') || !get('name')) return toast('ID and name required', 'error');
      const payload = { id: b?.id || get('id'), name: get('name'), address: get('address') || null, sort_order: parseInt(get('sort_order')) || 0 };
      const r = b ? await supabase.from('buildings').update(payload).eq('id', b.id) : await supabase.from('buildings').insert(payload);
      if (r.error) return toast(r.error.message, 'error');
      toast(b ? 'Updated' : 'Added', 'success'); dialog.close(); dialog.remove(); await load();
    };
    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  function addFloor(bid) {
    const dialog = document.createElement('dialog'); dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content"><div class="modal-header"><div class="modal-title">Add floor to ${escapeHtml(bid)}</div><button class="modal-close" data-close><i class="fas fa-xmark"></i></button></div><div class="modal-body"><label class="field"><span>Floor number</span><input class="input" type="number" min="1" max="20" data-field="floor" value="1"></label></div><div class="modal-footer"><button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-save>Add</button></div></div>`;
    document.body.appendChild(dialog); dialog.showModal();
    dialog.querySelector('[data-save]').onclick = async () => {
      const f = parseInt(dialog.querySelector('[data-field="floor"]').value);
      if (!f || f < 1) return toast('Floor ≥ 1', 'error');
      const { error } = await supabase.from('building_floors').insert({ building_id: bid, floor: f });
      if (error) return toast(error.message, 'error');
      toast(`Floor ${f} added`, 'success'); dialog.close(); dialog.remove(); await load();
    };
    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  $('addBtn').onclick = () => edit();
  await load();
})();
</script>
</body>
</html>
