<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My timetable · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .day-block { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 12px; }
  .day-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .day-head-title { font-size: 15px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .day-head-title .today-pill { padding: 2px 8px; background: var(--brand); color: #fff; border-radius: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
  .period-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface-hover); border-radius: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .period-row.now { background: var(--brand-soft); border: 1.5px solid var(--brand); }
  .period-time { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; color: var(--brand); min-width: 100px; }
  .period-course { flex: 1; min-width: 180px; }
  .period-code { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; color: var(--text); }
  .period-name { font-size: 13px; color: var(--text); margin-top: 2px; }
  .period-meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .period-meta span { display: inline-flex; align-items: center; gap: 4px; }
</style>
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-table"></i> My timetable</h1>
      <p class="page-subtitle" id="subtitle">Loading…</p>
    </div>
    <div class="row">
      <span id="offlineBadge" class="badge badge-gray" style="display:none">No section assigned</span>
      <button class="btn btn-primary" id="refreshBtn"><i class="fas fa-rotate-right"></i> Refresh</button>
    </div>
  </div>

  <div id="noSectionCard" style="display:none">
    <div class="card"><div class="empty-action">
      <div class="empty-action-icon"><i class="fas fa-user-slash"></i></div>
      <div class="empty-action-title">No section assigned</div>
      <div class="empty-action-sub">Ask your administrator to assign a section to your account so you can see your timetable.</div>
    </div></div>
  </div>

  <div id="timetableView"><div class="card" style="padding:32px"><div class="empty"><i class="fas fa-spinner fa-spin"></i>Loading…</div></div></div>
</div>

<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, todayISO, dayOfWeekNum, nowDate, formatTime, formatRelativeTime } from './js/core.js';

(async () => {
  const auth = await requireRole(['student', 'faculty', 'admin']);
  if (!auth) return;
  renderNav(auth.profile);

  const $ = id => document.getElementById(id);
  const p = auth.profile;
  const sectionId = p.section_id;

  async function load() {
    if (!sectionId) {
      $('noSectionCard').style.display = 'block';
      $('timetableView').style.display = 'none';
      $('offlineBadge').style.display = 'inline-flex';
      $('subtitle').textContent = 'Your account has no section assigned.';
      return;
    }

    $('subtitle').innerHTML = `Section <strong style="color:var(--text)">${escapeHtml(sectionId)}</strong> · Live from the official timetable`;

    const [{ data: rows }, { data: slots }, { data: rooms }, { data: facultyProfiles }] = await Promise.all([
      supabase.from('timetable').select('*').eq('section_id', sectionId).eq('is_active', true),
      supabase.from('time_slots').select('*').eq('is_active', true).order('sort_order').order('start_time'),
      supabase.from('rooms').select('room_id,display_name,building,floor'),
      supabase.from('profiles').select('id,full_name,email,department').eq('role', 'faculty'),
    ]);

    const slotById = new Map((slots ?? []).map(s => [s.slot_id, s]));
    const roomById = new Map((rooms ?? []).map(r => [r.room_id, r]));
    const facById = new Map((facultyProfiles ?? []).map(f => [f.id, f]));

    const list = rows ?? [];
    if (!list.length) {
      $('timetableView').innerHTML = '<div class="card"><div class="empty"><i class="fas fa-inbox"></i>No classes scheduled for your section yet</div></div>';
      return;
    }

    const today = todayISO();
    const todayDow = dayOfWeekNum(today);
    const nowStr = formatTime(nowDate());
    const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

    // Group by day_of_week
    const byDay = new Map();
    list.forEach(r => {
      if (!byDay.has(r.day_of_week)) byDay.set(r.day_of_week, []);
      byDay.get(r.day_of_week).push(r);
    });

    const order = [1, 2, 3, 4, 5, 6, 0]; // Mon → Sun

    $('timetableView').innerHTML = order
      .filter(d => byDay.has(d))
      .map(dow => {
        const items = byDay.get(dow)
          .sort((a, b) => (slotById.get(a.slot_id)?.start_time || '').localeCompare(slotById.get(b.slot_id)?.start_time || ''));
        const isToday = dow === todayDow;

        return `
          <div class="day-block">
            <div class="day-head">
              <div class="day-head-title">
                ${dayNames[dow]}
                ${isToday ? '<span class="today-pill">today</span>' : ''}
              </div>
              <span class="dim" style="font-size:12px">${items.length} class${items.length === 1 ? '' : 'es'}</span>
            </div>
            ${items.map(r => {
              const slot = slotById.get(r.slot_id);
              const room = roomById.get(r.room_id);
              const fac = facById.get(r.faculty_id);
              const isNow = isToday && slot && nowStr >= slot.start_time && nowStr < slot.end_time;
              return `
                <div class="period-row ${isNow ? 'now' : ''}">
                  <div class="period-time">${slot?.start_time.slice(0,5)}–${slot?.end_time.slice(0,5)}</div>
                  <div class="period-course">
                    <div class="period-code">${escapeHtml(r.course_code || '—')}</div>
                    <div class="period-name">${escapeHtml(r.course_name || 'Untitled')}</div>
                  </div>
                  <div class="period-meta">
                    <span><i class="fas fa-door-open"></i>${escapeHtml(room?.display_name || r.room_id)}</span>
                    ${fac ? `<span><i class="fas fa-chalkboard-user"></i>${escapeHtml(fac.full_name || fac.email)}</span>` : ''}
                    ${isNow ? '<span style="color:var(--brand);font-weight:600"><i class="fas fa-circle" style="font-size:6px"></i>NOW</span>' : ''}
                  </div>
                </div>`;
            }).join('')}
          </div>`;
      }).join('');
  }

  $('refreshBtn').onclick = load;
  await load();
  setInterval(() => { if (!document.hidden) load(); }, 60_000);
})();
</script>
</body>
</html>
