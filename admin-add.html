<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick add · amnrd.scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<meta name="theme-color" content="#EA580C">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-bolt"></i> Quick add rooms</h1>
      <p class="page-subtitle">Fast entry while walking. Works offline — sync when back online.</p>
    </div>
    <div class="row">
      <span id="offlineBanner" class="badge badge-pending" style="display:none">
        <i class="fas fa-plug-circle-xmark"></i> Offline
      </span>
      <button class="btn btn-primary" id="syncBtn">
        <i class="fas fa-cloud-arrow-up"></i> Sync
        <span class="badge" id="pendingCount" style="background:rgba(255,255,255,.25);color:#fff;margin-left:2px">0</span>
      </button>
    </div>
  </div>

  <div class="card">
    <div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
      <div>
        <div class="label-small">Building</div>
        <div class="chips" id="buildingChips">
          <span class="dim" style="font-size:12px">Loading…</span>
        </div>
      </div>
      <div>
        <div class="label-small">Floor</div>
        <div class="chips" id="floorChips">
          <span class="dim" style="font-size:12px">Loading…</span>
        </div>
      </div>
    </div>

    <div class="mt-6">
      <div class="label-small">Room number</div>
      <div style="display:flex;gap:8px;align-items:stretch">
        <input class="input" id="roomInput" placeholder="07" autocomplete="off" autocapitalize="characters" autofocus style="font-size:18px;font-weight:500;text-align:center">
        <input class="input" id="suffixInput" placeholder="A" style="width:80px;text-align:center;font-size:18px">
        <button class="btn" id="autoNextBtn" title="Suggest next room" style="min-width:44px">
          <i class="fas fa-rotate-right"></i>
        </button>
      </div>
    </div>

    <div class="mt-6">
      <div class="label-small">Type</div>
      <div class="chips" id="typeChips">
        <span class="dim" style="font-size:12px">Loading…</span>
      </div>
    </div>

    <div class="mt-6" style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
      <div>
        <div class="label-small">Capacity</div>
        <input class="input" id="capacityInput" type="number" inputmode="numeric" placeholder="60">
      </div>
      <div>
        <div class="label-small">Options</div>
        <div style="display:flex;gap:16px;flex-wrap:wrap;padding-top:8px">
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);cursor:pointer">
            <input type="checkbox" id="bookableCb" checked> Bookable
          </label>
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);cursor:pointer">
            <input type="checkbox" id="weekendCb"> Weekend
          </label>
        </div>
      </div>
    </div>

    <div class="mt-6">
      <div class="label-small">Facilities</div>
      <div class="chips" id="facilityChips"></div>
    </div>

    <div class="mt-6" style="padding:12px 16px;border-radius:var(--radius-md);background:var(--surface-hover);font-size:13px;display:flex;align-items:center;gap:10px">
      <i class="fas fa-eye" style="color:var(--brand)"></i>
      <span class="dim">Preview:</span>
      <span class="mono" id="previewId" style="color:var(--text);font-weight:500">—</span>
    </div>

    <button class="btn btn-primary btn-block mt-6" id="saveBtn" style="padding:16px;font-size:15px;font-weight:600;min-height:52px">
      <i class="fas fa-check"></i> Save &amp; next room
      <kbd style="margin-left:8px;background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.3);color:#fff">⏎</kbd>
    </button>
  </div>

  <div class="mt-8">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px">
      <h2 class="card-title" style="margin:0"><i class="fas fa-clock"></i> Pending sync</h2>
      <span class="dim" id="pendingListCount" style="font-size:12px">0 rooms</span>
    </div>
    <div id="pendingList"></div>
  </div>
</div>

<script type="module">
import { requireRole, renderNav, deriveRoomId, escapeHtml, toast,
         queueRoom, getPendingRooms, removePendingRoom, syncPendingRooms,
         isOnline, onNetworkChange, supabase, confirmDialog } from './js/core.js';

(async () => {
  const auth = await requireRole(['admin']);
  if (!auth) return;
  renderNav(auth.profile, [
    { label: 'Sync pending rooms', icon: 'fa-cloud-arrow-up', keywords: 'upload push save', action: () => doSync() },
    { label: 'Go to Rooms', icon: 'fa-door-open', keywords: 'manage edit list', action: () => { location.href = 'admin-rooms.html'; } },
  ]);

  const $ = id => document.getElementById(id);
  const state = { building: null, floor: null, type: null, facilities: [], bookable: true, weekendOpen: false };

  const FACILITIES = ['projector', 'ac', 'fan', 'blackboard', 'whiteboard', 'computers', 'smartboard', 'wifi', 'lab_benches'];

  let buildings = [];
  let floorsByBuilding = new Map();
  let roomTypes = [];

  async function loadMetadata() {
    const [{ data: b }, { data: t }, { data: f }] = await Promise.all([
      supabase.from('buildings').select('*').eq('is_active', true).order('sort_order').order('id'),
      supabase.from('room_types').select('*').eq('is_active', true).order('sort_order').order('id'),
      supabase.from('building_floors').select('*').eq('is_active', true).order('floor'),
    ]);
    buildings = b ?? [];
    roomTypes = t ?? [];
    floorsByBuilding = new Map();
    (f ?? []).forEach(fl => {
      if (!floorsByBuilding.has(fl.building_id)) floorsByBuilding.set(fl.building_id, []);
      floorsByBuilding.get(fl.building_id).push(fl.floor);
    });

    if (buildings.length && !buildings.find(x => x.id === state.building)) {
      state.building = buildings[0].id;
    }
    const availFloors = floorsByBuilding.get(state.building) || [];
    if (availFloors.length && !availFloors.includes(state.floor)) {
      state.floor = availFloors[0];
    }
    if (roomTypes.length && !roomTypes.find(x => x.id === state.type)) {
      state.type = roomTypes[0].id;
      state.bookable = roomTypes[0].bookable;
      $('bookableCb').checked = state.bookable;
    }
  }

  function renderChipSet(el, items, isOn, onClick) {
    if (!items.length) {
      el.innerHTML = '<span class="dim" style="font-size:12px">Nothing configured — add in Settings</span>';
      return;
    }
    el.innerHTML = items.map(item => {
      const id = typeof item === 'string' ? item : item.id;
      const label = typeof item === 'string' ? item.replace('_', ' ') : item.label;
      const icon = (typeof item === 'object' && item.icon) || '';
      const iconHtml = icon ? `<i class="fas ${icon}"></i>` : '';
      return `<button class="chip ${isOn(id) ? 'on' : ''}" data-id="${escapeHtml(id)}">${iconHtml}${escapeHtml(label)}</button>`;
    }).join('');
    el.querySelectorAll('[data-id]').forEach(btn => {
      btn.onclick = () => onClick(btn.dataset.id);
    });
  }

  function renderBuilding() {
    renderChipSet($('buildingChips'),
      buildings.map(b => ({ id: b.id, label: b.name || b.id, icon: 'fa-building' })),
      id => state.building === id,
      id => {
        state.building = id;
        const availFloors = floorsByBuilding.get(id) || [];
        state.floor = availFloors[0] ?? null;
        renderBuilding(); renderFloor(); updatePreview();
      });
  }

  function renderFloor() {
    const availFloors = floorsByBuilding.get(state.building) || [];
    renderChipSet($('floorChips'),
      availFloors.map(f => ({ id: String(f), label: String(f), icon: 'fa-layer-group' })),
      id => String(state.floor) === id,
      id => { state.floor = parseInt(id, 10); renderFloor(); updatePreview(); });
  }

  function renderType() {
    renderChipSet($('typeChips'), roomTypes, id => state.type === id, id => {
      state.type = id;
      const t = roomTypes.find(x => x.id === id);
      if (t) { state.bookable = t.bookable; $('bookableCb').checked = t.bookable; }
      renderType();
    });
  }

  function renderFacilities() {
    renderChipSet($('facilityChips'), FACILITIES, id => state.facilities.includes(id), id => {
      if (state.facilities.includes(id)) state.facilities = state.facilities.filter(x => x !== id);
      else state.facilities.push(id);
      renderFacilities();
    });
  }

  function updatePreview() {
    if (!state.building || !state.floor) { $('previewId').textContent = '—'; return; }
    const rn = $('roomInput').value.trim() || '01';
    const sfx = $('suffixInput').value.trim();
    const { room_id, display_name } = deriveRoomId(state.building, state.floor, rn, sfx);
    $('previewId').textContent = `${room_id}  ·  ${display_name}`;
  }

  $('roomInput').addEventListener('input', updatePreview);
  $('suffixInput').addEventListener('input', updatePreview);
  $('roomInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); saveRoom(); }
  });

  $('autoNextBtn').onclick = () => {
    const cur = $('roomInput').value.trim() || '01';
    const sfx = $('suffixInput').value.trim();
    if (sfx && sfx < 'Z') {
      $('suffixInput').value = String.fromCharCode(sfx.charCodeAt(0) + 1);
    } else {
      $('suffixInput').value = '';
      $('roomInput').value = String((parseInt(cur, 10) || 0) + 1).padStart(2, '0');
    }
    updatePreview();
    $('roomInput').focus();
  };

  function saveRoom() {
    if (!state.building || !state.floor || !state.type) {
      toast('Pick building, floor, and type first', 'error'); return;
    }
    const rn = $('roomInput').value.trim();
    if (!rn) { toast('Enter room number', 'error'); $('roomInput').focus(); return; }
    const sfx = $('suffixInput').value.trim().toUpperCase();
    const cap = $('capacityInput').value.trim();
    const { room_id, display_name, floor_digit, room_number } =
      deriveRoomId(state.building, state.floor, rn, sfx);

    queueRoom({
      room_id, display_name,
      building: state.building, floor: state.floor,
      floor_digit, room_number,
      suffix: sfx, type: state.type,
      capacity: (state.bookable && cap) ? parseInt(cap, 10) : null,
      bookable: state.bookable,
      weekend_open: $('weekendCb').checked,
      facilities: [...state.facilities],
      notes: null,
      _pending: true, _createdAt: new Date().toISOString(),
    });

    toast(`✓ Queued ${display_name}`, 'success');
    $('autoNextBtn').click();
    $('capacityInput').value = '';
    refreshPendingList();
  }

  $('saveBtn').onclick = saveRoom;

  function refreshPendingList() {
    const pending = getPendingRooms();
    $('pendingCount').textContent = pending.length;
    $('pendingListCount').textContent = `${pending.length} room${pending.length === 1 ? '' : 's'}`;

    if (!pending.length) {
      $('pendingList').innerHTML = `
        <div class="card">
          <div class="empty-action">
            <div class="empty-action-icon"><i class="fas fa-check-circle"></i></div>
            <div class="empty-action-title">All synced</div>
            <div class="empty-action-sub">Rooms you add will queue here until you sync.</div>
          </div>
        </div>
      `;
      return;
    }

    $('pendingList').innerHTML = pending.slice().reverse().map(r => `
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;margin-bottom:8px">
        <div style="min-width:0">
          <div class="mono" style="color:var(--text);font-weight:500;font-size:13px">
            <i class="fas fa-door-open" style="color:var(--brand);font-size:11px;margin-right:6px"></i>
            ${escapeHtml(r.display_name)}
          </div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:3px">
            ${escapeHtml(r.type)}${r.capacity ? ' · ' + r.capacity + ' seats' : ''}${r.bookable ? '' : ' · hidden'}
            ${r.weekend_open ? ' · weekend' : ''}
          </div>
        </div>
        <button class="btn btn-sm btn-danger" data-remove="${escapeHtml(r.room_id)}" title="Remove">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    `).join('');

    $('pendingList').querySelectorAll('[data-remove]').forEach(btn => {
      btn.onclick = async () => {
        const ok = await confirmDialog({
          title: 'Remove from queue?',
          message: 'This room will not be added to the database.',
          confirmText: 'Remove',
          danger: true,
        });
        if (!ok) return;
        removePendingRoom(btn.dataset.remove);
        refreshPendingList();
        toast('Removed', 'success');
      };
    });
  }

  async function doSync() {
    if (!isOnline()) { toast('Offline. Sync when back online.', 'error'); return; }
    const pending = getPendingRooms();
    if (!pending.length) { toast('Nothing to sync', 'info'); return; }
    const btn = $('syncBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Syncing…';
    try {
      const result = await syncPendingRooms();
      toast(`✓ Synced ${result.synced} room${result.synced === 1 ? '' : 's'}`, 'success');
    } catch (e) {
      toast('Sync failed: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = `<i class="fas fa-cloud-arrow-up"></i> Sync <span class="badge" id="pendingCount" style="background:rgba(255,255,255,.25);color:#fff;margin-left:2px">0</span>`;
      refreshPendingList();
    }
  }

  $('syncBtn').onclick = doSync;

  function updateOnlineStatus() {
    $('offlineBanner').style.display = isOnline() ? 'none' : 'inline-flex';
  }
  onNetworkChange(updateOnlineStatus);
  updateOnlineStatus();

  await loadMetadata();
  if (isOnline() && getPendingRooms().length > 0) {
    try {
      const r = await syncPendingRooms();
      if (r.synced > 0) toast(`✓ Auto-synced ${r.synced} room(s)`, 'success');
    } catch {}
  }

  renderBuilding(); renderFloor(); renderType(); renderFacilities();
  updatePreview(); refreshPendingList();
})();
</script>
</body>
</html>
