<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LPU Scheduler">
<meta name="mobile-web-app-capable" content="yes">
<title>Users · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/mobile-app.css">

<style>
  .u-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
  .u-stat{padding:20px 22px;background:var(--surface);border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;gap:16px;transition:all 180ms ease}
  .u-stat:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
  .u-stat-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;background:var(--brand-soft);color:var(--brand)}
  .u-stat-icon.success{background:var(--success-soft);color:var(--success)}
  .u-stat-icon.warning{background:var(--warning-soft);color:var(--warning)}
  .u-stat-icon.danger{background:var(--danger-soft);color:var(--danger)}
  .u-stat-body{min-width:0;flex:1}
  .u-stat-value{font-size:26px;font-weight:700;color:var(--text);line-height:1;letter-spacing:-0.02em}
  .u-stat-label{font-size:11px;color:var(--text-secondary);margin-top:6px;text-transform:uppercase;letter-spacing:0.05em;font-weight:600}

  .u-fl-banner{display:none;align-items:center;gap:14px;padding:14px 20px;background:var(--warning-soft);border:1px solid var(--warning-soft-border);border-radius:12px;margin-bottom:20px;color:var(--warning-text);font-size:13px}
  .u-fl-banner.show{display:flex}
  .u-fl-banner-icon{width:36px;height:36px;border-radius:9px;background:var(--surface);border:1px solid var(--warning-soft-border);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;color:var(--warning)}
  .u-fl-banner-body{flex:1;min-width:0;line-height:1.5}
  .u-fl-banner-body strong{font-weight:600}

  .u-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .u-filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .u-search{position:relative;flex:1;min-width:200px;max-width:320px;margin-left:auto}
  .u-search .input{padding-left:38px;padding-right:14px;min-height:38px}
  .u-search .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:13px;pointer-events:none}

  .u-bulk-bar{display:none;align-items:center;gap:12px;padding:12px 18px;background:var(--brand);color:white;border-radius:12px;box-shadow:var(--shadow-lg);margin-bottom:16px;flex-wrap:wrap}
  .u-bulk-bar.show{display:flex}
  .u-bulk-bar-count{font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:8px}
  .u-bulk-bar-count i{font-size:14px;opacity:.9}
  .u-bulk-bar-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .u-bulk-bar .btn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.25);color:white;min-height:34px;font-size:12.5px;padding:7px 14px}
  .u-bulk-bar .btn:hover{background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.45)}

  .u-table-wrap{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow-xs)}
  .u-table{width:100%;border-collapse:collapse;font-size:13px}
  .u-table thead{background:var(--bg-subtle)}
  .u-table thead th{padding:13px 16px;text-align:left;font-size:10.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);white-space:nowrap}
  .u-table thead th.right{text-align:right}
  .u-table thead th.checkbox-col{width:48px;padding-left:20px;padding-right:8px}
  .u-table tbody td{padding:14px 16px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text)}
  .u-table tbody td.right{text-align:right}
  .u-table tbody td.checkbox-col{padding-left:20px;padding-right:8px;width:48px}
  .u-table tbody tr:last-child td{border-bottom:none}
  .u-table tbody tr{transition:background 120ms ease}
  .u-table tbody tr:hover td{background:var(--surface-hover)}

  .u-user-cell{display:flex;align-items:center;gap:12px;min-width:0}
  .u-user-avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--brand-contrast);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;text-transform:uppercase;flex-shrink:0}
  .u-user-info{min-width:0;flex:1}
  .u-user-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--text);font-weight:500;font-size:13px;line-height:1.35}
  .u-user-email{font-size:11.5px;color:var(--text-secondary);margin-top:3px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .u-user-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:600;text-transform:lowercase;letter-spacing:.01em;white-space:nowrap}
  .u-user-badge.admin{background:var(--brand-soft);color:var(--brand-text)}
  .u-user-badge.faculty{background:var(--success-soft);color:var(--success-text)}
  .u-user-badge.you{background:var(--surface-active);color:var(--text-secondary)}
  .u-user-badge i{font-size:8px}

  .u-uid{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--text);letter-spacing:.02em}
  .u-uid i{font-size:9px;opacity:.5}
  .u-uid-empty{color:var(--text-muted);font-size:12px}

  .u-pw{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;white-space:nowrap}
  .u-pw-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .u-pw.ok{color:var(--success-text)}
  .u-pw.ok .u-pw-dot{background:var(--success)}
  .u-pw.warn{color:var(--danger-text)}
  .u-pw.warn .u-pw-dot{background:var(--danger)}

  .u-login{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-secondary);white-space:nowrap}
  .u-login.active{color:var(--success);font-weight:600}
  .u-login-dot{width:6px;height:6px;border-radius:50%;background:var(--success);animation:pulseLogin 2s ease-in-out infinite}
  @keyframes pulseLogin{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}

  .u-status{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
  .u-status.active{background:var(--success-soft);color:var(--success-text)}
  .u-status.suspended{background:var(--danger-soft);color:var(--danger-text)}
  .u-status i{font-size:8px}

  .u-actions{display:inline-flex;align-items:center;gap:4px;justify-content:flex-end}
  .u-action-btn{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);cursor:pointer;transition:all 140ms ease;font-size:12px;flex-shrink:0}
  .u-action-btn:hover{background:var(--surface-hover);border-color:var(--border-strong);color:var(--text)}
  .u-action-btn.danger:hover{background:var(--danger-soft);border-color:var(--danger-soft-border);color:var(--danger)}
  .u-action-btn.success:hover{background:var(--success-soft);border-color:var(--success-soft-border);color:var(--success)}
  .u-action-btn.primary{background:var(--brand-soft);border-color:var(--brand-soft-border);color:var(--brand)}
  .u-action-btn.primary:hover{background:var(--brand);border-color:var(--brand);color:white}

  .u-checkbox{width:16px;height:16px;cursor:pointer;accent-color:var(--brand);vertical-align:middle}
  .u-checkbox:disabled{opacity:.4;cursor:not-allowed}

  .u-empty{padding:60px 24px;text-align:center;color:var(--text-muted)}
  .u-empty i{display:block;font-size:36px;opacity:.4;margin-bottom:14px}
  .u-empty-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
  .u-empty-sub{font-size:12.5px;color:var(--text-secondary)}

  .mgr-modal .modal-content{width:min(680px,calc(100vw - 32px))}
  .mgr-identity{padding:18px 20px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:12px;margin-bottom:16px}
  .mgr-section-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:13px;font-weight:700;color:var(--text)}
  .mgr-section-head i{width:26px;height:26px;border-radius:7px;background:var(--brand-soft);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
  .mgr-section-head .mgr-badge{margin-left:auto;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:600;background:var(--surface);color:var(--text-secondary);border:1px solid var(--border)}

  .mgr-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:560px){.mgr-grid{grid-template-columns:1fr}}

  .mgr-field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .mgr-field-label{font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
  .mgr-field-label .hint{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--text-muted);font-size:10.5px}
  .mgr-field input,.mgr-field select{padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:13.5px;font-family:inherit;transition:all 140ms ease;width:100%}
  .mgr-field input:focus,.mgr-field select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .mgr-field input:disabled{opacity:.55;cursor:not-allowed;background:var(--surface-hover)}
  .mgr-field input.mono{font-family:'JetBrains Mono',monospace;letter-spacing:.02em}
  .mgr-field input.invalid{border-color:var(--danger);background:var(--danger-soft)}
  .mgr-field-msg{font-size:11px;color:var(--text-secondary);line-height:1.4;min-height:15px}
  .mgr-field-msg.warn{color:var(--danger-text);font-weight:600}
  .mgr-field-msg.ok{color:var(--success-text)}

  .mgr-role-group{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
  .mgr-role-btn{padding:10px 12px;border:1.5px solid var(--border);background:var(--surface);border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:9px;text-align:left;font:inherit;color:var(--text);transition:all 140ms ease}
  .mgr-role-btn:hover{border-color:var(--border-strong);background:var(--surface-hover)}
  .mgr-role-btn.selected{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-text)}
  .mgr-role-btn i{font-size:14px;color:var(--text-secondary)}
  .mgr-role-btn.selected i{color:var(--brand)}
  .mgr-role-btn-body{flex:1;min-width:0}
  .mgr-role-btn-title{font-size:12.5px;font-weight:600}
  .mgr-role-btn-sub{font-size:10.5px;color:var(--text-secondary);margin-top:1px}

  .mgr-pw-section{padding:18px 20px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
  .mgr-pw-status{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:8px;font-size:12.5px;margin-bottom:16px}
  .mgr-pw-status i{color:var(--text-secondary)}
  .mgr-pw-status.ok{background:var(--success-soft);border-color:var(--success-soft-border);color:var(--success-text)}
  .mgr-pw-status.ok i{color:var(--success)}
  .mgr-pw-status.warn{background:var(--warning-soft);border-color:var(--warning-soft-border);color:var(--warning-text)}
  .mgr-pw-status.warn i{color:var(--warning)}
  .mgr-pw-status strong{font-weight:600}

  .mgr-pw-row{display:flex;gap:8px}
  .mgr-pw-row input{flex:1}
  .mgr-pw-btn{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);cursor:pointer;transition:all 140ms ease;flex-shrink:0;font-size:13px}
  .mgr-pw-btn:hover{background:var(--surface-hover);border-color:var(--border-strong);color:var(--text)}
  .mgr-pw-btn.primary{background:var(--brand-soft);border-color:var(--brand-soft-border);color:var(--brand)}
  .mgr-pw-btn.primary:hover{background:var(--brand);border-color:var(--brand);color:white}

  .mgr-pw-note{display:flex;align-items:flex-start;gap:8px;padding:10px 14px;background:var(--info-soft);border:1px solid var(--info-soft-border);border-radius:8px;font-size:11.5px;color:var(--info-text);line-height:1.5;margin-top:10px}
  .mgr-pw-note i{flex-shrink:0;margin-top:1px;font-size:12px}
  .mgr-pw-note.danger{background:var(--warning-soft);border-color:var(--warning-soft-border);color:var(--warning-text)}

  .mgr-selfid-warn{display:none;padding:12px 14px;background:var(--warning-soft);border:1px solid var(--warning-soft-border);border-radius:10px;font-size:12px;color:var(--warning-text);line-height:1.55;margin-top:14px}
  .mgr-selfid-warn.show{display:flex;gap:8px;align-items:flex-start}
  .mgr-selfid-warn i{flex-shrink:0;margin-top:1px;font-size:13px}
  .mgr-selfid-warn strong{font-weight:600}

  @media (max-width:900px){.u-hide-md{display:none}}
  @media (max-width:640px){
    .u-stats{grid-template-columns:repeat(2,1fr);gap:10px}
    .u-stat{padding:14px 16px;gap:12px}
    .u-stat-icon{width:36px;height:36px;font-size:15px}
    .u-stat-value{font-size:22px}
    .u-toolbar{flex-direction:column;align-items:stretch}
    .u-search{max-width:none;margin-left:0}
    .u-table thead th,.u-table tbody td{padding:11px 12px}
    .u-bulk-bar{flex-direction:column;align-items:stretch}
    .u-bulk-bar-actions{margin-left:0}
    .u-bulk-bar .btn{flex:1}
    .mgr-role-group{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-users"></i> Users</h1>
      <p class="page-subtitle">One place to manage faculty and admins — user IDs, passwords, roles, access.</p>
    </div>
    <button class="btn btn-primary" id="addBtn"><i class="fas fa-user-plus"></i> Add user</button>
  </div>

  <div class="admin-tabs">
    <a href="admin-rooms.html" class="admin-tab"><i class="fas fa-door-open"></i> Rooms</a>
    <a href="admin-timetable.html" class="admin-tab"><i class="fas fa-table"></i> Timetable</a>
    <a href="admin-import.html" class="admin-tab"><i class="fas fa-file-import"></i> Import</a>
    <a href="admin-bookings.html" class="admin-tab"><i class="fas fa-calendar-check"></i> Bookings</a>
    <a href="admin-faculty.html" class="admin-tab active"><i class="fas fa-users"></i> Users</a>
    <a href="admin-slots.html" class="admin-tab"><i class="fas fa-clock"></i> Time slots</a>
    <a href="admin-calendar.html" class="admin-tab"><i class="fas fa-calendar-days"></i> Calendar</a>
    <a href="admin-settings.html" class="admin-tab"><i class="fas fa-gear"></i> Settings</a>
  </div>

  <div class="u-stats" id="stats"></div>

  <div class="u-fl-banner" id="firstLoginBanner">
    <div class="u-fl-banner-icon"><i class="fas fa-shield-halved"></i></div>
    <div class="u-fl-banner-body"><strong id="flCount">0</strong> faculty still using the temporary password.</div>
    <button class="btn btn-sm" id="flFilterBtn">Show them</button>
  </div>

  <div class="u-toolbar">
    <div class="u-filters" id="roleFilter">
      <button class="chip on" data-r="all">All</button>
      <button class="chip" data-r="faculty">Faculty</button>
      <button class="chip" data-r="admin">Admins</button>
      <button class="chip" data-r="active">Active</button>
      <button class="chip" data-r="suspended">Suspended</button>
      <button class="chip" data-r="firstlogin">First login pending</button>
    </div>
    <div class="u-search">
      <i class="fas fa-search search-icon"></i>
      <input class="input" id="search" placeholder="Search name, email, user ID…">
    </div>
  </div>

  <div class="u-bulk-bar" id="bulkBar">
    <span class="u-bulk-bar-count"><i class="fas fa-check-circle"></i><span id="bulkCount">0 selected</span></span>
    <div class="u-bulk-bar-actions">
      <button class="btn btn-sm" data-bulk="ids"><i class="fas fa-id-card"></i> Change user IDs</button>
      <button class="btn btn-sm" data-bulk="reset"><i class="fas fa-key"></i> Reset passwords</button>
      <button class="btn btn-sm" data-bulk="clear"><i class="fas fa-xmark"></i> Clear</button>
    </div>
  </div>

  <div class="u-table-wrap">
    <table class="u-table">
      <thead>
        <tr>
          <th class="checkbox-col"><input type="checkbox" class="u-checkbox" id="selectAll"></th>
          <th>User</th>
          <th>User ID</th>
          <th class="u-hide-md">Department</th>
          <th>Password</th>
          <th class="u-hide-md">Last login</th>
          <th>Status</th>
          <th class="right">Actions</th>
        </tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</div>

<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, toast, formatRelativeTime, nowDate } from './js/core.js';

(async () => {
  const auth = await requireRole(['admin']);
  if (!auth) return;
  renderNav(auth.profile);

  const $ = id => document.getElementById(id);
  const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  let users = [], tt = [], roleFilter = 'all', search = '';
  let selected = new Set();

  async function load() {
    const [uRes, tRes] = await Promise.all([
      supabase.from('profiles').select('*').order('created_at', { ascending: false }),
      supabase.from('timetable').select('*').eq('is_active', true),
    ]);
    users = uRes.data ?? [];
    tt = tRes.data ?? [];
    selected.clear();
    renderStats();
    renderBanner();
    render();
    updateBulkBar();
  }

  function getUserId(u) {
    const local = (u.email || '').split('@')[0];
    return /^\d+$/.test(local) ? local : null;
  }

  function renderStats() {
    const admins = users.filter(u => u.role === 'admin').length;
    const faculty = users.filter(u => u.role === 'faculty').length;
    const suspended = users.filter(u => u.is_active === false).length;
    const firstLogin = users.filter(u => u.password_changed_at === null).length;
    $('stats').innerHTML = `
      <div class="u-stat"><div class="u-stat-icon"><i class="fas fa-users"></i></div><div class="u-stat-body"><div class="u-stat-value">${users.length}</div><div class="u-stat-label">Total users</div></div></div>
      <div class="u-stat"><div class="u-stat-icon success"><i class="fas fa-chalkboard-user"></i></div><div class="u-stat-body"><div class="u-stat-value">${faculty}</div><div class="u-stat-label">Faculty</div></div></div>
      <div class="u-stat"><div class="u-stat-icon"><i class="fas fa-shield-halved"></i></div><div class="u-stat-body"><div class="u-stat-value">${admins}</div><div class="u-stat-label">Admins</div></div></div>
      <div class="u-stat"><div class="u-stat-icon ${firstLogin ? 'warning' : ''}"><i class="fas fa-key"></i></div><div class="u-stat-body"><div class="u-stat-value" style="${firstLogin ? 'color:var(--warning)' : ''}">${firstLogin}</div><div class="u-stat-label">First login pending</div></div></div>
      <div class="u-stat"><div class="u-stat-icon ${suspended ? 'danger' : ''}"><i class="fas fa-ban"></i></div><div class="u-stat-body"><div class="u-stat-value" style="${suspended ? 'color:var(--danger)' : ''}">${suspended}</div><div class="u-stat-label">Suspended</div></div></div>`;
  }

  function renderBanner() {
    const count = users.filter(u => u.password_changed_at === null).length;
    $('flCount').textContent = count;
    $('firstLoginBanner').classList.toggle('show', count > 0);
  }

  function filtered() {
    let list = users;
    if (roleFilter === 'faculty') list = list.filter(u => u.role === 'faculty');
    else if (roleFilter === 'admin') list = list.filter(u => u.role === 'admin');
    else if (roleFilter === 'active') list = list.filter(u => u.is_active !== false);
    else if (roleFilter === 'suspended') list = list.filter(u => u.is_active === false);
    else if (roleFilter === 'firstlogin') list = list.filter(u => u.password_changed_at === null);
    if (search) {
      const q = search.toLowerCase();
      list = list.filter(u =>
        (u.full_name || '').toLowerCase().includes(q) ||
        (u.email || '').toLowerCase().includes(q) ||
        (u.department || '').toLowerCase().includes(q)
      );
    }
    return list;
  }

  function render() {
    const list = filtered();
    if (!list.length) {
      $('body').innerHTML = `<tr><td colspan="8"><div class="u-empty"><i class="fas fa-user-slash"></i><div class="u-empty-title">No users match</div><div class="u-empty-sub">Try changing the filter or search term.</div></div></td></tr>`;
      $('selectAll').checked = false;
      return;
    }
    $('body').innerHTML = list.map(u => renderRow(u)).join('');
    document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => viewSchedule(b.dataset.view));
    document.querySelectorAll('[data-manage]').forEach(b => b.onclick = () => openManager(b.dataset.manage));
    document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => toggleUser(b.dataset.toggle, b.dataset.active === 'true'));
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteUser(b.dataset.del));
    document.querySelectorAll('.row-select').forEach(cb => {
      cb.onchange = () => {
        if (cb.checked) selected.add(cb.dataset.id);
        else selected.delete(cb.dataset.id);
        updateBulkBar();
        syncSelectAllCheckbox(list);
      };
    });
    syncSelectAllCheckbox(list);
  }

  function renderRow(u) {
    const init = ((u.full_name || u.email || '?').trim()[0] || '?').toUpperCase();
    const roleIcon = u.role === 'admin' ? 'shield-halved' : 'chalkboard-user';
    const susp = u.is_active === false;
    const isMe = u.id === auth.profile.id;
    const userId = getUserId(u);
    const pwdNever = u.password_changed_at === null;
    const pwdDate = u.password_changed_at ? formatRelativeTime(u.password_changed_at) : null;
    let lastLoginHtml = '<span class="u-login">Never</span>';
    if (u.last_active_at) {
      const diff = nowDate().getTime() - new Date(u.last_active_at).getTime();
      if (diff < 5 * 60 * 1000) lastLoginHtml = '<span class="u-login active"><span class="u-login-dot"></span>Active now</span>';
      else lastLoginHtml = `<span class="u-login">${formatRelativeTime(u.last_active_at)}</span>`;
    }
    return `<tr>
      <td class="checkbox-col"><input type="checkbox" class="u-checkbox row-select" data-id="${u.id}" ${selected.has(u.id) ? 'checked' : ''} ${isMe ? 'disabled' : ''}></td>
      <td>
        <div class="u-user-cell">
          <span class="u-user-avatar">${escapeHtml(init)}</span>
          <div class="u-user-info">
            <div class="u-user-name">${escapeHtml(u.full_name || u.email)}<span class="u-user-badge ${u.role}"><i class="fas fa-${roleIcon}"></i>${u.role}</span>${isMe ? '<span class="u-user-badge you">you</span>' : ''}</div>
            <div class="u-user-email">${escapeHtml(u.email)}</div>
          </div>
        </div>
      </td>
      <td>${userId ? `<span class="u-uid"><i class="fas fa-hashtag"></i>${escapeHtml(userId)}</span>` : '<span class="u-uid-empty">—</span>'}</td>
      <td class="u-hide-md" style="color:var(--text-secondary);font-size:12px">${escapeHtml(u.department || '—')}</td>
      <td>${pwdNever ? '<span class="u-pw warn"><span class="u-pw-dot"></span>Never changed</span>' : `<span class="u-pw ok"><span class="u-pw-dot"></span>${escapeHtml(pwdDate)}</span>`}</td>
      <td class="u-hide-md">${lastLoginHtml}</td>
      <td>${susp ? '<span class="u-status suspended"><i class="fas fa-ban"></i>Suspended</span>' : '<span class="u-status active"><i class="fas fa-check"></i>Active</span>'}</td>
      <td class="right">
        <div class="u-actions">
          ${u.role === 'faculty' ? `<button class="u-action-btn" data-view="${u.id}" title="View schedule"><i class="fas fa-eye"></i></button>` : ''}
          <button class="u-action-btn primary" data-manage="${u.id}" title="Manage user"><i class="fas fa-sliders"></i></button>
          ${!isMe ? `<button class="u-action-btn ${susp ? 'success' : 'danger'}" data-toggle="${u.id}" data-active="${!susp}" title="${susp ? 'Activate' : 'Suspend'}"><i class="fas fa-${susp ? 'play' : 'ban'}"></i></button>` : ''}
          ${!isMe ? `<button class="u-action-btn danger" data-del="${u.id}" title="Delete"><i class="fas fa-trash"></i></button>` : ''}
        </div>
      </td>
    </tr>`;
  }

  $('selectAll').onchange = e => {
    const list = filtered().filter(u => u.id !== auth.profile.id);
    if (e.target.checked) list.forEach(u => selected.add(u.id));
    else selected.clear();
    render();
    updateBulkBar();
  };

  function syncSelectAllCheckbox(list) {
    const selectable = list.filter(u => u.id !== auth.profile.id);
    if (!selectable.length) { $('selectAll').checked = false; return; }
    const allSel = selectable.every(u => selected.has(u.id));
    const someSel = selectable.some(u => selected.has(u.id));
    $('selectAll').checked = allSel;
    $('selectAll').indeterminate = someSel && !allSel;
  }

  function updateBulkBar() {
    $('bulkCount').textContent = `${selected.size} selected`;
    $('bulkBar').classList.toggle('show', selected.size > 0);
  }

  document.querySelectorAll('[data-bulk]').forEach(btn => btn.onclick = () => {
    const a = btn.dataset.bulk;
    if (a === 'clear') { selected.clear(); render(); updateBulkBar(); return; }
    if (!selected.size) return;
    if (a === 'ids') bulkChangeIds();
    if (a === 'reset') bulkResetPasswords();
  });

  function openManager(id) {
    const u = users.find(x => x.id === id);
    if (!u) return;
    const isMe = u.id === auth.profile.id;
    const currentUid = getUserId(u) || '';
    const pwdNever = u.password_changed_at === null;
    const pwdDate = u.password_changed_at ? formatRelativeTime(u.password_changed_at) : null;

    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog mgr-modal';
    dialog.innerHTML = `
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <div class="modal-title"><i class="fas fa-sliders"></i> Manage user</div>
            <div class="modal-sub">${escapeHtml(u.full_name || u.email)} · ${escapeHtml(u.email)}</div>
          </div>
          <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
        </div>
        <div class="modal-body">
          <div class="mgr-identity">
            <div class="mgr-section-head"><i class="fas fa-id-card"></i> Identity & access</div>
            <div class="mgr-grid">
              <div class="mgr-field">
                <label class="mgr-field-label">Full name</label>
                <input type="text" id="mgrName" value="${escapeHtml(u.full_name || '')}" placeholder="Dr. Jane Smith">
              </div>
              <div class="mgr-field">
                <label class="mgr-field-label">User ID ${isMe ? '<span class="hint">your account</span>' : ''}</label>
                <input type="text" id="mgrUid" class="mono" inputmode="numeric" pattern="[0-9]*" maxlength="20" value="${escapeHtml(currentUid)}" placeholder="e.g. 9001">
                <div class="mgr-field-msg" id="mgrUidMsg">Login: <span class="mono">${escapeHtml(currentUid || '?')}@lpu.in</span></div>
              </div>
              <div class="mgr-field">
                <label class="mgr-field-label">Department</label>
                <input type="text" id="mgrDept" value="${escapeHtml(u.department || '')}" placeholder="CSE">
              </div>
              <div class="mgr-field">
                <label class="mgr-field-label">Phone</label>
                <input type="text" id="mgrPhone" value="${escapeHtml(u.phone || '')}" placeholder="+91 ...">
              </div>
            </div>
            <div class="mgr-selfid-warn" id="mgrSelfWarn">
              <i class="fas fa-triangle-exclamation"></i>
              <div><strong>This is your own account.</strong> If you change your user ID, you'll need to log in with the <strong>new ID</strong> on your next session — you'll be signed out automatically after saving. Make sure you remember it.</div>
            </div>
            <div class="mgr-field" style="margin-top:14px">
              <label class="mgr-field-label">Role</label>
              <div class="mgr-role-group">
                <button type="button" class="mgr-role-btn" data-role="faculty">
                  <i class="fas fa-chalkboard-user"></i>
                  <div class="mgr-role-btn-body"><div class="mgr-role-btn-title">Faculty</div><div class="mgr-role-btn-sub">Can book rooms, mark leave</div></div>
                </button>
                <button type="button" class="mgr-role-btn" data-role="admin">
                  <i class="fas fa-shield-halved"></i>
                  <div class="mgr-role-btn-body"><div class="mgr-role-btn-title">Admin</div><div class="mgr-role-btn-sub">Full system access</div></div>
                </button>
              </div>
              ${isMe ? '<div class="mgr-field-msg" style="margin-top:6px">You cannot change your own role.</div>' : ''}
            </div>
          </div>
          <div class="mgr-pw-section">
            <div class="mgr-section-head"><i class="fas fa-lock"></i> Password <span class="mgr-badge">Optional</span></div>
            <div class="mgr-pw-status ${pwdNever ? 'warn' : 'ok'}">
              <i class="fas fa-${pwdNever ? 'exclamation-triangle' : 'check-circle'}"></i>
              <span>${pwdNever ? '<strong>Never changed</strong> — user is still on the temporary password' : `Last changed <strong>${escapeHtml(pwdDate)}</strong>`}</span>
            </div>
            ${isMe ? `
              <div class="mgr-pw-note">
                <i class="fas fa-info-circle"></i>
                <div>To change <strong>your own</strong> password, please use the <a href="profile.html" style="color:inherit;text-decoration:underline;font-weight:600">Profile page</a>. This ensures your current session stays valid.</div>
              </div>
            ` : `
              <div class="mgr-field">
                <label class="mgr-field-label">New password <span class="hint">Leave blank to keep current</span></label>
                <div class="mgr-pw-row">
                  <input type="password" id="mgrPwd" class="mono" placeholder="Min 6 characters" autocomplete="new-password">
                  <button type="button" class="mgr-pw-btn" id="mgrPwdToggle" title="Show password"><i class="fas fa-eye"></i></button>
                  <button type="button" class="mgr-pw-btn primary" id="mgrPwdGen" title="Generate random"><i class="fas fa-dice"></i></button>
                </div>
              </div>
              <div class="mgr-pw-note danger" id="mgrPwNote" style="display:none">
                <i class="fas fa-triangle-exclamation"></i>
                <div>Setting a new password will require this user to log in with the <strong>new password</strong> on their next session. Their current session stays active until it expires naturally.</div>
              </div>
            `}
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn" data-close>Cancel</button>
          <button class="btn btn-primary" id="mgrSave"><i class="fas fa-check"></i> Save changes</button>
        </div>
      </div>`;

    document.body.appendChild(dialog);
    dialog.showModal();

    const nameInput = dialog.querySelector('#mgrName');
    const uidInput = dialog.querySelector('#mgrUid');
    const uidMsg = dialog.querySelector('#mgrUidMsg');
    const selfWarn = dialog.querySelector('#mgrSelfWarn');
    const pwdInput = dialog.querySelector('#mgrPwd');
    const pwdNote = dialog.querySelector('#mgrPwNote');
    const saveBtn = dialog.querySelector('#mgrSave');

    let selectedRole = u.role;
    const roleBtns = dialog.querySelectorAll('[data-role]');
    function setRole(r) {
      selectedRole = r;
      roleBtns.forEach(b => b.classList.toggle('selected', b.dataset.role === r));
      if (isMe) roleBtns.forEach(b => b.disabled = true);
    }
    roleBtns.forEach(b => b.onclick = () => { if (isMe) return; setRole(b.dataset.role); });
    setRole(u.role);

    function validateUid() {
      const raw = uidInput.value.replace(/\D/g, '').slice(0, 20);
      uidInput.value = raw;
      if (isMe) selfWarn.classList.toggle('show', raw !== currentUid && /^\d{3,20}$/.test(raw));
      if (raw === currentUid) {
        uidMsg.innerHTML = `Login: <span class="mono">${escapeHtml(raw || '?')}@lpu.in</span>`;
        uidMsg.className = 'mgr-field-msg';
        uidInput.classList.remove('invalid');
        return true;
      }
      if (!/^\d{3,20}$/.test(raw)) {
        uidMsg.textContent = 'Must be 3–20 digits';
        uidMsg.className = 'mgr-field-msg warn';
        uidInput.classList.add('invalid');
        return false;
      }
      const collides = users.some(x => x.id !== u.id && (x.email || '').toLowerCase() === `${raw}@lpu.in`.toLowerCase());
      if (collides) {
        uidMsg.textContent = `Already taken · ${raw}@lpu.in`;
        uidMsg.className = 'mgr-field-msg warn';
        uidInput.classList.add('invalid');
        return false;
      }
      uidMsg.innerHTML = `Will become: <span class="mono">${escapeHtml(raw)}@lpu.in</span>`;
      uidMsg.className = 'mgr-field-msg ok';
      uidInput.classList.remove('invalid');
      return true;
    }
    uidInput.oninput = validateUid;
    validateUid();

    if (pwdInput) {
      dialog.querySelector('#mgrPwdToggle').onclick = () => {
        const isPwd = pwdInput.type === 'password';
        pwdInput.type = isPwd ? 'text' : 'password';
        dialog.querySelector('#mgrPwdToggle').innerHTML = isPwd ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
      };
      dialog.querySelector('#mgrPwdGen').onclick = () => {
        pwdInput.value = Math.random().toString(36).slice(-10);
        pwdInput.type = 'text';
        dialog.querySelector('#mgrPwdToggle').innerHTML = '<i class="fas fa-eye-slash"></i>';
        pwdNote.style.display = 'flex';
      };
      pwdInput.oninput = () => { pwdNote.style.display = pwdInput.value.length ? 'flex' : 'none'; };
    }

    saveBtn.onclick = async () => {
      if (!validateUid()) { toast('Fix user ID first', 'error'); return; }
      const newPwd = pwdInput ? pwdInput.value.trim() : '';
      if (newPwd && newPwd.length < 6) { toast('Password must be 6+ characters', 'error'); return; }
      const newUid = uidInput.value.trim();
      const uidChanged = newUid !== currentUid;

      if (isMe && uidChanged) {
        const ok = confirm(`You're changing YOUR OWN user ID.\n\nOld ID: ${currentUid || '—'}\nNew ID: ${newUid}\nNew login: ${newUid}@lpu.in\n\nYou'll be signed out after saving. Continue?`);
        if (!ok) return;
      }

      saveBtn.disabled = true;
      saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…';

      const { data, error } = await supabase.rpc('admin_update_user', {
        p_user_id: u.id,
        p_full_name: nameInput.value.trim() || null,
        p_department: dialog.querySelector('#mgrDept').value.trim() || null,
        p_phone: dialog.querySelector('#mgrPhone').value.trim() || null,
        p_role: selectedRole,
        p_new_userid: uidChanged ? newUid : null,
        p_new_password: newPwd || null,
      });

      saveBtn.disabled = false;
      saveBtn.innerHTML = '<i class="fas fa-check"></i> Save changes';
      if (error) { toast(error.message, 'error'); return; }
      if (data?.error) { toast(data.error, 'error'); return; }

      const changes = [];
      if (uidChanged) changes.push(`user ID → ${newUid}`);
      if (newPwd) changes.push('password reset');
      toast(changes.length ? `Saved — ${changes.join(', ')}` : 'Saved', 'success');
      dialog.close(); dialog.remove();

      if (isMe && uidChanged) {
        toast('Your user ID changed — signing out in 2 seconds…', 'info');
        setTimeout(async () => {
          try { await supabase.auth.signOut(); } catch {}
          location.replace('./login.html');
        }, 2000);
        return;
      }
      await load();
    };

    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  function bulkChangeIds() {
    const sel = users.filter(u => selected.has(u.id));
    if (!sel.length) return;
    const updates = new Map();
    sel.forEach(u => updates.set(u.id, getUserId(u) || ''));
    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content modal-wide">
      <div class="modal-header">
        <div><div class="modal-title">Bulk change user IDs</div><div class="modal-sub">${sel.length} user${sel.length === 1 ? '' : 's'} selected</div></div>
        <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div style="padding:12px 14px;background:var(--info-soft);border:1px solid var(--info-soft-border);border-radius:10px;font-size:12px;color:var(--info-text);line-height:1.55;margin-bottom:16px">
          <i class="fas fa-info-circle" style="margin-right:6px"></i>Only rows where the new ID differs from the current one will be updated.
        </div>
        <div id="bulkList"></div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close>Cancel</button>
        <button class="btn btn-primary" id="bulkSave"><i class="fas fa-check"></i> Apply</button>
      </div>
    </div>`;
    document.body.appendChild(dialog);
    dialog.showModal();
    const listEl = dialog.querySelector('#bulkList');
    function renderList() {
      listEl.innerHTML = sel.map(u => {
        const cur = getUserId(u) || '';
        return `<div style="display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:10px;background:var(--bg-subtle);border:1px solid var(--border);margin-bottom:8px">
          <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px;color:var(--text)">${escapeHtml(u.full_name || u.email)}</div><div style="font-size:11px;color:var(--text-secondary);margin-top:2px;font-family:monospace">${escapeHtml(u.email)}</div></div>
          <div style="width:130px;flex-shrink:0">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="20" data-bulk-input="${u.id}" value="${escapeHtml(updates.get(u.id))}" placeholder="${escapeHtml(cur)}" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-family:monospace;font-size:13px;text-align:right;background:var(--surface);color:var(--text)">
            <div data-bulk-hint="${u.id}" style="font-size:10px;color:var(--text-muted);text-align:right;margin-top:3px">Current: ${escapeHtml(cur || '—')}</div>
          </div>
        </div>`;
      }).join('');
      listEl.querySelectorAll('[data-bulk-input]').forEach(input => {
        input.oninput = () => {
          const raw = input.value.replace(/\D/g, '').slice(0, 20);
          input.value = raw;
          updates.set(input.dataset.bulkInput, raw);
          validateRow(input.dataset.bulkInput);
        };
        validateRow(input.dataset.bulkInput);
      });
    }
    function validateRow(uid) {
      const input = listEl.querySelector(`[data-bulk-input="${uid}"]`);
      const hint = listEl.querySelector(`[data-bulk-hint="${uid}"]`);
      const u = users.find(x => x.id === uid);
      const cur = getUserId(u) || '';
      const nv = updates.get(uid) || '';
      if (nv === cur) { input.style.borderColor = ''; hint.style.color = 'var(--text-muted)'; hint.textContent = `Current: ${cur || '—'}`; return true; }
      if (!/^\d{3,20}$/.test(nv)) { input.style.borderColor = 'var(--danger)'; hint.style.color = 'var(--danger)'; hint.textContent = 'Invalid (3–20 digits)'; return false; }
      if (users.some(x => x.id !== uid && !selected.has(x.id) && (x.email || '').toLowerCase() === `${nv}@lpu.in`.toLowerCase())) { input.style.borderColor = 'var(--danger)'; hint.style.color = 'var(--danger)'; hint.textContent = `Taken · ${nv}@lpu.in`; return false; }
      if (sel.filter(x => (updates.get(x.id) || '') === nv).length > 1) { input.style.borderColor = 'var(--danger)'; hint.style.color = 'var(--danger)'; hint.textContent = 'Duplicate in batch'; return false; }
      input.style.borderColor = ''; hint.style.color = 'var(--text-muted)'; hint.textContent = `→ ${nv}@lpu.in`; return true;
    }
    renderList();
    dialog.querySelector('#bulkSave').onclick = async () => {
      const payload = [];
      for (const u of sel) {
        const nv = updates.get(u.id) || '';
        if (nv === (getUserId(u) || '')) continue;
        if (!/^\d{3,20}$/.test(nv)) return toast(`Invalid ID for ${u.full_name}`, 'error');
        payload.push({ user_id: u.id, new_userid: nv });
      }
      if (!payload.length) return toast('No changes', 'error');
      const btn = dialog.querySelector('#bulkSave');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Applying…';
      const { data, error } = await supabase.rpc('admin_bulk_change_userids', { p_updates: payload });
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-check"></i> Apply';
      if (error) return toast(error.message, 'error');
      if (data?.error) return toast(data.error, 'error');
      toast(`${data.updated || 0} user ID${data.updated === 1 ? '' : 's'} updated`, 'success');
      dialog.close(); dialog.remove();
      await load();
    };
    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  function bulkResetPasswords() {
    const sel = users.filter(u => selected.has(u.id));
    if (!sel.length) return;
    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content modal-wide">
      <div class="modal-header">
        <div><div class="modal-title">Bulk reset passwords</div><div class="modal-sub">${sel.length} user${sel.length === 1 ? '' : 's'} selected</div></div>
        <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div style="padding:12px 14px;background:var(--warning-soft);border:1px solid var(--warning-soft-border);border-radius:10px;font-size:12px;color:var(--warning-text);line-height:1.55;margin-bottom:16px">
          <i class="fas fa-triangle-exclamation" style="margin-right:6px"></i>Each user's <strong>next login</strong> must use the new password. Their current session stays active until it expires naturally.
        </div>
        <div id="bulkResetList">
          ${sel.map(u => `<div style="padding:8px 12px;background:var(--bg-subtle);border-radius:7px;margin-bottom:6px;display:flex;justify-content:space-between;gap:12px;font-size:12px"><span style="color:var(--text);font-weight:500">${escapeHtml(u.full_name || u.email)}</span><span style="font-family:monospace;font-size:11px;color:var(--text-secondary)">${escapeHtml(u.email)}</span></div>`).join('')}
        </div>
        <div id="bulkResetResults" style="display:none;margin-top:16px"></div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close>Cancel</button>
        <button class="btn btn-danger" id="bulkResetBtn"><i class="fas fa-key"></i> Reset all</button>
      </div>
    </div>`;
    document.body.appendChild(dialog);
    dialog.showModal();
    dialog.querySelector('#bulkResetBtn').onclick = async () => {
      const btn = dialog.querySelector('#bulkResetBtn');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting…';
      const creds = [], errs = [];
      for (const u of sel) {
        const pwd = Math.random().toString(36).slice(-10);
        const { data, error } = await supabase.rpc('admin_reset_password', { p_user_id: u.id, p_new_password: pwd });
        if (error) { errs.push(`${u.email}: ${error.message}`); continue; }
        if (data?.error) { errs.push(`${u.email}: ${data.error}`); continue; }
        creds.push({ name: u.full_name || u.email, uid: getUserId(u) || '', email: u.email, password: pwd });
      }
      const resultEl = dialog.querySelector('#bulkResetResults');
      resultEl.style.display = 'block';
      resultEl.innerHTML = `
        <div style="padding:12px 14px;background:var(--success-soft);border:1px solid var(--success-soft-border);border-radius:10px;margin-bottom:12px;font-size:13px;font-weight:600;color:var(--success-text)">
          <i class="fas fa-check-circle" style="margin-right:6px"></i>${creds.length} password${creds.length === 1 ? '' : 's'} reset${errs.length ? ` · ${errs.length} failed` : ''}
        </div>
        ${creds.map(c => `<div style="padding:12px 14px;background:var(--success-soft);border:1px solid var(--success-soft-border);border-radius:10px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px"><span style="font-weight:600;font-size:13px;color:var(--success-text)">${escapeHtml(c.name)}</span><span style="font-size:11px;color:var(--success-text);opacity:.75">Login: <strong>${escapeHtml(c.uid)}</strong></span></div><input readonly value="${escapeHtml(c.password)}" style="width:100%;padding:8px 12px;font-family:monospace;font-size:12px;border:1px solid var(--success-soft-border);border-radius:7px;background:var(--surface);color:var(--success-text)"></div>`).join('')}
        ${errs.length ? `<div style="padding:12px;background:var(--danger-soft);border:1px solid var(--danger-soft-border);border-radius:8px;margin-top:12px;font-size:12px;color:var(--danger-text)"><strong>Failed:</strong>${errs.map(e => `<div style="margin-top:4px">• ${escapeHtml(e)}</div>`).join('')}</div>` : ''}
        <div style="margin-top:14px;text-align:right"><button class="btn btn-sm" id="dlCreds"><i class="fas fa-download"></i> Download CSV</button></div>`;
      const dl = resultEl.querySelector('#dlCreds');
      if (dl) {
        const url = 'data:text/csv;charset=utf-8,' + encodeURIComponent('Name,UserID,Email,Password\n' + creds.map(c => `"${c.name.replace(/"/g,'""')}","${c.uid}","${c.email}","${c.password}"`).join('\n'));
        dl.onclick = () => { const a = document.createElement('a'); a.href = url; a.download = `passwords-${Date.now()}.csv`; a.click(); };
      }
      btn.style.display = 'none';
      dialog.querySelectorAll('[data-close]').forEach(x => x.textContent = 'Done');
      toast(`Reset complete for ${creds.length} user${creds.length === 1 ? '' : 's'}`, 'success');
      await load();
    };
    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  $('addBtn').onclick = () => {
    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content modal-wide">
      <div class="modal-header">
        <div><div class="modal-title">Add new user</div><div class="modal-sub">Create a faculty or admin account.</div></div>
        <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px">
          <label class="field" style="margin-bottom:0"><span>Full name *</span><input class="input" data-field="full_name" placeholder="Jane Doe" autofocus></label>
          <label class="field" style="margin-bottom:0"><span>User ID *</span><input class="input" data-field="userid" inputmode="numeric" pattern="[0-9]*" maxlength="20" placeholder="e.g. 9001" style="font-family:monospace"><div style="font-size:11px;color:var(--text-secondary);margin-top:4px">Numeric — used as <span class="mono">id@lpu.in</span></div></label>
          <label class="field" style="margin-bottom:0"><span>Password *</span><input class="input" type="text" data-field="password" value="${Math.random().toString(36).slice(-8)}"><div style="font-size:11px;color:var(--text-secondary);margin-top:4px">User will be forced to change on first login.</div></label>
          <label class="field" style="margin-bottom:0"><span>Phone</span><input class="input" data-field="phone" placeholder="+91 ..."></label>
          <label class="field" style="margin-bottom:0"><span>Role *</span><select class="input" data-field="role"><option value="faculty">faculty</option><option value="admin">admin</option></select></label>
          <label class="field" style="margin-bottom:0"><span>Department</span><input class="input" data-field="department" placeholder="CSE"></label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close>Cancel</button>
        <button class="btn btn-primary" data-save><i class="fas fa-user-plus"></i> Create user</button>
      </div>
    </div>`;
    document.body.appendChild(dialog);
    dialog.showModal();
    const uidInput = dialog.querySelector('[data-field="userid"]');
    uidInput.oninput = () => { uidInput.value = uidInput.value.replace(/\D/g, '').slice(0, 20); };
    dialog.querySelector('[data-save]').onclick = async () => {
      const get = f => dialog.querySelector(`[data-field="${f}"]`).value.trim();
      if (!get('full_name')) return toast('Full name required', 'error');
      if (!/^\d{3,20}$/.test(get('userid'))) return toast('User ID must be 3–20 digits', 'error');
      if (get('password').length < 6) return toast('Password must be 6+ characters', 'error');
      const btn = dialog.querySelector('[data-save]');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating…';
      const { data, error } = await supabase.rpc('admin_create_user', {
        p_email: `${get('userid')}@lpu.in`, p_password: get('password'), p_full_name: get('full_name'),
        p_role: get('role'), p_department: get('department') || null, p_phone: get('phone') || null,
      });
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-user-plus"></i> Create user';
      if (error) return toast(error.message, 'error');
      if (data?.error) return toast(data.error, 'error');
      toast('User created', 'success');
      dialog.close(); dialog.remove();
      await load();
    };
    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  };

  function viewSchedule(id) {
    const u = users.find(x => x.id === id);
    if (!u) return;
    const classes = tt.filter(t => t.faculty_id === id);
    const byDay = new Map();
    classes.forEach(c => { if (!byDay.has(c.day_of_week)) byDay.set(c.day_of_week, []); byDay.get(c.day_of_week).push(c); });
    const schedHtml = [1,2,3,4,5,6,0].filter(d => byDay.has(d)).map(d => {
      const items = byDay.get(d).sort((a, b) => a.slot_id.localeCompare(b.slot_id));
      return `<div style="margin-bottom:16px">
        <div style="font-size:11px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">${DOW[d]}</div>
        ${items.map(c => `<div style="padding:10px 12px;background:var(--surface-hover);border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px"><div><div style="font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--brand);font-size:12px">${escapeHtml(c.course_code || '—')}</div><div style="color:var(--text-secondary);font-size:11px;margin-top:2px">${escapeHtml(c.course_name || '')} · ${escapeHtml(c.room_id)}</div></div><div style="color:var(--text-secondary);font-family:'JetBrains Mono',monospace;font-size:11px">${escapeHtml(c.slot_id)}</div></div>`).join('')}
      </div>`;
    }).join('') || '<div class="empty" style="padding:20px"><i class="fas fa-inbox"></i><br>No classes assigned yet</div>';
    const dialog = document.createElement('dialog');
    dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content modal-wide">
      <div class="modal-header">
        <div><div class="modal-title">${escapeHtml(u.full_name || u.email)}</div><div class="modal-sub">${escapeHtml(u.email)} · ${escapeHtml(u.department || 'No department')}</div></div>
        <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:16px;padding:16px 0;border-bottom:1px solid var(--border);margin-bottom:20px">
          <div><div class="label-small">Weekly classes</div><div style="font-size:20px;font-weight:700">${classes.length}</div></div>
          <div><div class="label-small">Courses</div><div style="font-size:20px;font-weight:700">${new Set(classes.map(c => c.course_code).filter(Boolean)).size}</div></div>
          <div><div class="label-small">Teaching days</div><div style="font-size:20px;font-weight:700">${byDay.size}</div></div>
        </div>
        ${schedHtml}
      </div>
      <div class="modal-footer">
        <button class="btn" data-close>Close</button>
        <button class="btn btn-primary" id="editFromSched"><i class="fas fa-sliders"></i> Manage user</button>
      </div>
    </div>`;
    document.body.appendChild(dialog);
    dialog.showModal();
    dialog.querySelector('#editFromSched').onclick = () => { dialog.close(); dialog.remove(); openManager(id); };
    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  async function toggleUser(id, active) {
    if (id === auth.profile.id) return toast('You cannot suspend yourself', 'error');
    const { error } = await supabase.from('profiles').update({
      is_active: !active,
      suspended_at: active ? new Date().toISOString() : null,
      suspended_reason: active ? 'Suspended by admin' : null,
    }).eq('id', id);
    if (error) return toast(error.message, 'error');
    toast(active ? 'Suspended' : 'Reactivated', 'success');
    await load();
  }

  async function deleteUser(id) {
    const u = users.find(x => x.id === id);
    if (!u) return;
    if (id === auth.profile.id) return toast('You cannot delete yourself', 'error');
    if (!confirm(`Delete ${u.email}?\n\nThis will permanently remove the auth account, profile, and all their bookings, timetable rows, and activity.`)) return;
    const { data, error } = await supabase.rpc('admin_delete_user', { p_user_id: id });
    if (error) return toast(error.message, 'error');
    if (data?.error) return toast(data.error, 'error');
    toast('User deleted', 'success');
    await load();
  }

  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
    roleFilter = b.dataset.r;
    document.querySelectorAll('[data-r]').forEach(x => x.classList.toggle('on', x === b));
    render();
  });
  $('search').oninput = e => { search = e.target.value.trim(); render(); };
  $('flFilterBtn').onclick = () => {
    roleFilter = 'firstlogin';
    document.querySelectorAll('[data-r]').forEach(x => x.classList.toggle('on', x.dataset.r === 'firstlogin'));
    render();
  };

  await load();
})();
</script>
<!-- Centralized site banner -->
<script type="module" src="js/banner.js"></script>
