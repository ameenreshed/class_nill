<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faculty · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
<style>
.batch-section{margin-bottom:20px;padding:14px;background:var(--bg-subtle);border-radius:10px}
.batch-section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:12px}
.batch-section-title{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px}
.batch-section-title i{color:var(--brand);font-size:12px}
.student-chip{display:inline-flex;align-items:center;padding:4px 10px;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:11px;color:var(--text);margin:3px 3px 0 0}
.student-chip .dot{width:6px;height:6px;border-radius:50%;margin-right:6px}
.dot.ok{background:var(--success)}
.dot.bad{background:var(--danger)}
</style>
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-header">
    <div><h1 class="page-title"><i class="fas fa-chalkboard-user"></i> Faculty</h1><p class="page-subtitle">Manage faculty accounts, view workload and batch-wise students.</p></div>
    <button class="btn btn-primary" id="addBtn"><i class="fas fa-user-plus"></i> Add faculty</button>
  </div>
  <div class="admin-tabs">
    <a href="admin-faculty.html" class="admin-tab active"><i class="fas fa-chalkboard-user"></i> Faculty</a>
    <a href="admin-batches.html" class="admin-tab"><i class="fas fa-users-rectangle"></i> Batches</a>
    <a href="admin-courses.html" class="admin-tab"><i class="fas fa-book"></i> Courses</a>
    <a href="admin-timetable.html" class="admin-tab"><i class="fas fa-table"></i> Timetable</a>
    <a href="admin-bookings.html" class="admin-tab"><i class="fas fa-calendar-check"></i> Bookings</a>
    <a href="admin-rooms.html" class="admin-tab"><i class="fas fa-door-open"></i> Rooms</a>
    <a href="admin-buildings.html" class="admin-tab"><i class="fas fa-building"></i> Buildings</a>
    <a href="admin-slots.html" class="admin-tab"><i class="fas fa-clock"></i> Time slots</a>
    <a href="admin-calendar.html" class="admin-tab"><i class="fas fa-calendar-days"></i> Calendar</a>
    <a href="admin-users.html" class="admin-tab"><i class="fas fa-users"></i> Users</a>
  </div>

  <div class="stats" id="stats"></div>

  <div class="row" style="margin-bottom:16px;gap:8px">
    <div class="chips" id="filters">
      <button class="chip on" data-f="all">All</button>
      <button class="chip" data-f="active">Active</button>
      <button class="chip" data-f="suspended">Suspended</button>
    </div>
    <div class="search-wrap" style="margin-left:auto;max-width:360px">
      <i class="fas fa-search search-icon"></i>
      <input class="input" id="search" placeholder="Search name, email, department…">
    </div>
  </div>

  <div class="table-wrap"><table>
    <thead><tr>
      <th>Faculty</th><th>Department</th><th>Batches</th><th>Courses</th><th>Weekly classes</th><th>Status</th><th style="text-align:right">Actions</th>
    </tr></thead>
    <tbody id="body"></tbody>
  </table></div>
</div>

<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, toast } from './js/core.js';

(async () => {
  const auth = await requireRole(['admin']);
  if (!auth) return;
  renderNav(auth.profile);

  const $ = id => document.getElementById(id);
  const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  let faculty = [], tt = [], users = [], sections = [], filter = 'all', search = '';

  async function load() {
    const [{ data: f }, { data: t }, { data: u }, { data: s }] = await Promise.all([
      supabase.from('profiles').select('*').in('role', ['faculty', 'admin']).order('full_name'),
      supabase.from('timetable').select('*').eq('is_active', true),
      supabase.from('profiles').select('*'),
      supabase.from('sections').select('*').order('section_id'),
    ]);
    faculty = f ?? [];
    tt = t ?? [];
    users = u ?? [];
    sections = s ?? [];
    renderStats();
    render();
  }

  function renderStats() {
    const active = faculty.filter(f => f.is_active !== false).length;
    const susp = faculty.filter(f => f.is_active === false).length;
    const totalClasses = tt.length;
    $('stats').innerHTML = `
      <div class="stat"><i class="fas fa-chalkboard-user stat-icon"></i><div class="stat-value">${faculty.length}</div><div class="stat-label">Total faculty</div></div>
      <div class="stat"><i class="fas fa-circle-check stat-icon" style="color:var(--success)"></i><div class="stat-value" style="color:var(--success)">${active}</div><div class="stat-label">Active</div></div>
      <div class="stat"><i class="fas fa-ban stat-icon" style="color:var(--danger)"></i><div class="stat-value" style="color:var(--danger)">${susp}</div><div class="stat-label">Suspended</div></div>
      <div class="stat"><i class="fas fa-table stat-icon"></i><div class="stat-value">${totalClasses}</div><div class="stat-label">Classes scheduled</div></div>`;
  }

  function render() {
    let list = faculty;
    if (filter === 'active') list = list.filter(f => f.is_active !== false);
    else if (filter === 'suspended') list = list.filter(f => f.is_active === false);
    if (search) {
      const q = search.toLowerCase();
      list = list.filter(f => (f.full_name || '').toLowerCase().includes(q) || (f.email || '').toLowerCase().includes(q) || (f.department || '').toLowerCase().includes(q));
    }
    if (!list.length) { $('body').innerHTML = '<tr><td colspan="7" class="empty"><i class="fas fa-user-slash"></i>No faculty match</td></tr>'; return; }

    $('body').innerHTML = list.map(f => {
      const init = ((f.full_name || f.email || '?').trim()[0] || '?').toUpperCase();
      const classes = tt.filter(t => t.faculty_id === f.id);
      const batches = new Set(classes.map(c => c.section_id));
      const courses = new Set(classes.map(c => c.course_code).filter(Boolean));
      const susp = f.is_active === false;
      return `<tr>
        <td><div style="display:flex;align-items:center;gap:10px"><span class="avatar-sm">${escapeHtml(init)}</span><div><div style="color:var(--text);font-weight:500">${escapeHtml(f.full_name || f.email)}</div><div style="font-size:11px;color:var(--text-muted)">${escapeHtml(f.email)}</div></div></div></td>
        <td class="dim">${escapeHtml(f.department || '—')}</td>
        <td>${batches.size} batch${batches.size === 1 ? '' : 'es'}</td>
        <td>${courses.size} course${courses.size === 1 ? '' : 's'}</td>
        <td>${classes.length} class${classes.length === 1 ? '' : 'es'}</td>
        <td>${susp ? '<span class="badge badge-rejected">suspended</span>' : '<span class="badge badge-approved">active</span>'}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn btn-sm" data-view="${f.id}" title="View batches & students"><i class="fas fa-eye"></i></button>
          <button class="btn btn-sm" data-edit="${f.id}" title="Edit"><i class="fas fa-pen"></i></button>
          <button class="btn btn-sm ${susp ? 'btn-success' : 'btn-danger'}" data-toggle="${f.id}" data-active="${!susp}" title="${susp ? 'Activate' : 'Suspend'}"><i class="fas fa-${susp ? 'play' : 'ban'}"></i></button>
        </td>
      </tr>`;
    }).join('');

    document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => view(b.dataset.view));
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => edit(b.dataset.edit));
    document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => toggle(b.dataset.toggle, b.dataset.active === 'true'));
  }

  /* ============ VIEW — batch-wise students ============ */
  function view(id) {
    const f = faculty.find(x => x.id === id);
    if (!f) return;
    const classes = tt.filter(t => t.faculty_id === id);
    const batchIds = [...new Set(classes.map(c => c.section_id))];

    // Group students by batch
    const studentsByBatch = new Map();
    batchIds.forEach(bid => {
      studentsByBatch.set(bid, users.filter(u => u.role === 'student' && u.section_id === bid));
    });

    // Group classes by day for schedule
    const byDay = new Map();
    classes.forEach(c => { if (!byDay.has(c.day_of_week)) byDay.set(c.day_of_week, []); byDay.get(c.day_of_week).push(c); });

    const batchesHtml = batchIds.length
      ? batchIds.map(bid => {
          const sec = sections.find(s => s.section_id === bid);
          const students = studentsByBatch.get(bid) || [];
          const batchClasses = classes.filter(c => c.section_id === bid);
          const courseList = [...new Set(batchClasses.map(c => c.course_code).filter(Boolean))];
          return `<div class="batch-section">
            <div class="batch-section-head">
              <div class="batch-section-title"><i class="fas fa-users-rectangle"></i>${escapeHtml(bid)}${sec ? ` — ${escapeHtml(sec.name)}` : ''}</div>
              <span class="badge badge-admin">${students.length} student${students.length === 1 ? '' : 's'}</span>
            </div>
            ${courseList.length ? `<div style="font-size:11px;color:var(--text-muted);margin-bottom:8px"><strong>Courses:</strong> ${courseList.map(c => escapeHtml(c)).join(', ')}</div>` : ''}
            <div>
              ${students.length ? students.map(s => `<span class="student-chip"><span class="dot ${s.is_active === false ? 'bad' : 'ok'}"></span>${escapeHtml(s.full_name || s.email)}</span>`).join('') : '<span class="dim" style="font-size:12px">No students assigned to this batch</span>'}
            </div>
          </div>`;
        }).join('')
      : '<div class="empty" style="padding:24px"><i class="fas fa-users-rectangle"></i><br>Not teaching any batch yet. Assign classes in the Timetable page.</div>';

    const schedHtml = [1,2,3,4,5,6,0].filter(d => byDay.has(d)).map(d => {
      const items = byDay.get(d).sort((a, b) => a.slot_id.localeCompare(b.slot_id));
      return `<div style="margin-bottom:12px">
        <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px">${DOW[d]}</div>
        ${items.map(c => `<div style="padding:8px 10px;background:var(--surface-hover);border-radius:6px;margin-bottom:4px;display:flex;justify-content:space-between;font-size:12px">
          <div><span style="font-family:monospace;font-weight:700;color:var(--brand)">${escapeHtml(c.course_code || '—')}</span> · ${escapeHtml(c.section_id)} · ${escapeHtml(c.room_id)}</div>
          <div style="color:var(--text-muted);font-family:monospace">${escapeHtml(c.slot_id)}</div>
        </div>`).join('')}
      </div>`;
    }).join('') || '<div class="empty" style="padding:16px">No classes assigned</div>';

    const dialog = document.createElement('dialog'); dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content modal-wide">
      <div class="modal-header">
        <div><div class="modal-title">${escapeHtml(f.full_name || f.email)}</div><div class="modal-sub">${escapeHtml(f.email)} · ${escapeHtml(f.department || 'No department')}</div></div>
        <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px">
          <div><div class="label-small">Batches teaching</div><div style="font-weight:600;font-size:15px;color:var(--text)">${batchIds.length}</div></div>
          <div><div class="label-small">Total classes</div><div style="font-weight:600;font-size:15px;color:var(--text)">${classes.length}</div></div>
          <div><div class="label-small">Courses</div><div style="font-weight:600;font-size:15px;color:var(--text)">${new Set(classes.map(c => c.course_code).filter(Boolean)).size}</div></div>
        </div>

        <h3 style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:10px"><i class="fas fa-users-rectangle" style="color:var(--brand)"></i> Batches & students</h3>
        ${batchesHtml}

        <h3 style="font-size:14px;font-weight:600;color:var(--text);margin:20px 0 10px"><i class="fas fa-calendar-week" style="color:var(--brand)"></i> Weekly schedule</h3>
        ${schedHtml}
      </div>
      <div class="modal-footer">
        <button class="btn" data-close>Close</button>
        <button class="btn btn-primary" id="editFromView"><i class="fas fa-pen"></i> Edit account</button>
      </div>
    </div>`;
    document.body.appendChild(dialog); dialog.showModal();

    dialog.querySelector('#editFromView').onclick = () => { dialog.close(); dialog.remove(); edit(id); };
    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  /* ============ ADD FACULTY ============ */
  $('addBtn').onclick = () => {
    const dialog = document.createElement('dialog'); dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content">
      <div class="modal-header">
        <div><div class="modal-title">Add new faculty</div><div class="modal-sub">Creates a login account with faculty role.</div></div>
        <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <label class="field"><span>Full name *</span><input class="input" data-field="full_name" placeholder="Dr. Jane Smith" autofocus></label>
        <label class="field"><span>Email *</span><input class="input" type="email" data-field="email" placeholder="jane@lpu.in"></label>
        <label class="field"><span>Password *</span><input class="input" type="text" data-field="password" value="${Math.random().toString(36).slice(-8)}"><div class="pw-hint">Share this with the faculty member.</div></label>
        <label class="field"><span>Department</span><input class="input" data-field="department" placeholder="CSE"></label>
        <label class="field"><span>Phone</span><input class="input" data-field="phone" placeholder="+91 ..."></label>
        <div class="info-banner" style="padding:12px;background:var(--info-soft);border:1px solid var(--info-soft-border);border-radius:8px;font-size:12px;color:var(--info-text);margin-top:8px">
          <i class="fas fa-info-circle"></i> After creating, assign their classes in the <a href="admin-timetable.html" style="color:inherit;text-decoration:underline">Timetable</a> page.
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close>Cancel</button>
        <button class="btn btn-primary" data-save><i class="fas fa-user-plus"></i> Create faculty</button>
      </div>
    </div>`;
    document.body.appendChild(dialog); dialog.showModal();

    dialog.querySelector('[data-save]').onclick = async () => {
      const get = f => dialog.querySelector(`[data-field="${f}"]`).value.trim();
      if (!get('full_name')) return toast('Full name required', 'error');
      if (!get('email')) return toast('Email required', 'error');
      if (get('password').length < 6) return toast('Password must be 6+ characters', 'error');

      const btn = dialog.querySelector('[data-save]');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating…';

      const { data, error } = await supabase.rpc('admin_create_user', {
        p_email: get('email'),
        p_password: get('password'),
        p_full_name: get('full_name'),
        p_role: 'faculty',
        p_department: get('department') || null,
        p_section_id: null,
        p_phone: get('phone') || null,
      });

      if (error) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-user-plus"></i> Create faculty'; return toast(error.message, 'error'); }
      if (data?.error) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-user-plus"></i> Create faculty'; return toast(data.error, 'error'); }

      toast('Faculty created', 'success');
      dialog.close(); dialog.remove();
      await load();
    };

    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  };

  /* ============ EDIT ============ */
  function edit(id) {
    const f = faculty.find(x => x.id === id);
    if (!f) return;
    const dialog = document.createElement('dialog'); dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content">
      <div class="modal-header">
        <div><div class="modal-title">Edit ${escapeHtml(f.email)}</div></div>
        <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <label class="field"><span>Full name</span><input class="input" data-field="full_name" value="${escapeHtml(f.full_name || '')}"></label>
        <label class="field"><span>Department</span><input class="input" data-field="department" value="${escapeHtml(f.department || '')}"></label>
        <label class="field"><span>Phone</span><input class="input" data-field="phone" value="${escapeHtml(f.phone || '')}"></label>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close>Cancel</button>
        <button class="btn btn-primary" data-save><i class="fas fa-check"></i> Save</button>
      </div>
    </div>`;
    document.body.appendChild(dialog); dialog.showModal();

    dialog.querySelector('[data-save]').onclick = async () => {
      const get = f => dialog.querySelector(`[data-field="${f}"]`).value.trim();
      const { error } = await supabase.from('profiles').update({
        full_name: get('full_name') || null,
        department: get('department') || null,
        phone: get('phone') || null,
      }).eq('id', id);
      if (error) return toast(error.message, 'error');
      toast('Updated', 'success');
      dialog.close(); dialog.remove();
      await load();
    };

    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  async function toggle(id, active) {
    const { error } = await supabase.from('profiles').update({
      is_active: !active,
      suspended_at: active ? new Date().toISOString() : null,
      suspended_reason: active ? 'Suspended by admin' : null,
    }).eq('id', id);
    if (error) return toast(error.message, 'error');
    toast(active ? 'Suspended' : 'Reactivated', 'success');
    await load();
  }

  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
    filter = b.dataset.f;
    document.querySelectorAll('[data-f]').forEach(x => x.classList.toggle('on', x === b));
    render();
  });
  $('search').oninput = e => { search = e.target.value.trim(); render(); };

  await load();
})();
</script>
</body>
</html>
