<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timetable · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
<style>
.conflict-box{padding:10px 12px;background:var(--warning-soft);border:1px solid var(--warning-soft-border);border-radius:8px;color:var(--warning-text);font-size:12px;margin-top:8px;line-height:1.5}
.conflict-box ul{margin:4px 0 0 18px}
</style>
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-header">
    <div>
      <h1 class="page-title"><i class="fas fa-table"></i> Timetable</h1>
      <p class="page-subtitle">Assign classes to faculty. Conflicts detected automatically.</p>
    </div>
    <div class="row">
      <button class="btn" id="exportBtn"><i class="fas fa-download"></i> Export</button>
      <button class="btn btn-primary" id="addBtn"><i class="fas fa-plus"></i> Add row</button>
    </div>
  </div>
  <div class="admin-tabs">
    <a href="admin-rooms.html" class="admin-tab"><i class="fas fa-door-open"></i> Rooms</a>
    <a href="admin-timetable.html" class="admin-tab active"><i class="fas fa-table"></i> Timetable</a>
    <a href="admin-import.html" class="admin-tab"><i class="fas fa-file-import"></i> Import</a>
    <a href="admin-bookings.html" class="admin-tab"><i class="fas fa-calendar-check"></i> Bookings</a>
    <a href="admin-faculty.html" class="admin-tab"><i class="fas fa-users"></i> Users</a>
    <a href="admin-slots.html" class="admin-tab"><i class="fas fa-clock"></i> Time slots</a>
    <a href="admin-calendar.html" class="admin-tab"><i class="fas fa-calendar-days"></i> Calendar</a>
    <a href="admin-settings.html" class="admin-tab"><i class="fas fa-gear"></i> Settings</a>
  </div>
  <div class="row" style="margin-bottom:16px;gap:8px">
    <select class="input" id="facFilter" style="max-width:220px"><option value="">All faculty</option></select>
    <select class="input" id="dayFilter" style="max-width:160px">
      <option value="">All days</option>
      <option value="1">Mon</option><option value="2">Tue</option><option value="3">Wed</option>
      <option value="4">Thu</option><option value="5">Fri</option><option value="6">Sat</option><option value="0">Sun</option>
    </select>
    <div class="search-wrap" style="margin-left:auto;max-width:360px">
      <i class="fas fa-search search-icon"></i>
      <input class="input" id="search" placeholder="Search course, room, faculty…">
    </div>
  </div>
  <div class="table-wrap"><table>
    <thead><tr>
      <th>Faculty</th><th>Day</th><th>Slot</th><th>Room</th><th>Course</th><th style="text-align:right">Actions</th>
    </tr></thead>
    <tbody id="body"></tbody>
  </table></div>
</div>
<script type="module">
import { requireRole, renderNav, supabase, escapeHtml, toast, todayISO } from './js/core.js';
(async () => {
  const auth = await requireRole(['admin']); if (!auth) return;
  renderNav(auth.profile);
  const $ = id => document.getElementById(id);
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let tt = [], slots = [], rooms = [], users = [], facFilter = '', day = '', search = '';

  async function load() {
    const [{ data: t }, { data: s }, { data: r }, { data: u }] = await Promise.all([
      supabase.from('timetable').select('*').eq('is_active', true).order('day_of_week').order('slot_id'),
      supabase.from('time_slots').select('*').eq('is_active', true).order('sort_order'),
      supabase.from('rooms').select('room_id,display_name').order('room_id'),
      supabase.from('profiles').select('id,full_name,email').eq('role', 'faculty').order('full_name'),
    ]);
    tt = t ?? []; slots = s ?? []; rooms = r ?? []; users = u ?? [];
    $('facFilter').innerHTML = `<option value="">All faculty</option>${users.map(u => `<option value="${u.id}" ${facFilter === u.id ? 'selected' : ''}>${escapeHtml(u.full_name || u.email)}</option>`).join('')}`;
    render();
  }

  function render() {
    let list = tt;
    if (facFilter) list = list.filter(r => r.faculty_id === facFilter);
    if (day !== '') list = list.filter(r => r.day_of_week === parseInt(day));
    if (search) {
      const q = search.toLowerCase();
      list = list.filter(r =>
        (r.course_code || '').toLowerCase().includes(q)
        || (r.course_name || '').toLowerCase().includes(q)
        || r.room_id.toLowerCase().includes(q));
    }
    const slotMap = new Map(slots.map(s => [s.slot_id, s]));
    const roomMap = new Map(rooms.map(r => [r.room_id, r.display_name]));
    const userMap = new Map(users.map(u => [u.id, u]));
    if (!list.length) {
      $('body').innerHTML = '<tr><td colspan="6" class="empty"><i class="fas fa-inbox"></i>No rows match</td></tr>';
      return;
    }
    $('body').innerHTML = list.map(r => {
      const slot = slotMap.get(r.slot_id);
      const fac = userMap.get(r.faculty_id);
      return `<tr>
        <td class="dim" style="font-size:12px">${escapeHtml(fac?.full_name || fac?.email || '—')}</td>
        <td style="font-weight:500">${DOW[r.day_of_week]}</td>
        <td><div class="mono" style="font-size:12px">${escapeHtml(slot?.label || r.slot_id)}</div>
          <div style="font-size:10px;color:var(--text-muted)">${slot?.start_time.slice(0,5)}–${slot?.end_time.slice(0,5)}</div></td>
        <td class="mono">${escapeHtml(roomMap.get(r.room_id) || r.room_id)}</td>
        <td><div style="font-size:12px;font-weight:600">${escapeHtml(r.course_code || '—')}</div>
          <div style="font-size:11px;color:var(--text-muted)">${escapeHtml(r.course_name || '')}</div></td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn btn-sm" data-edit="${r.id}"><i class="fas fa-pen"></i></button>
          <button class="btn btn-sm btn-danger" data-del="${r.id}"><i class="fas fa-trash"></i></button>
        </td>
      </tr>`;
    }).join('');
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => edit(tt.find(x => x.id === b.dataset.edit)));
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      if (!confirm('Delete this row?')) return;
      const { error } = await supabase.from('timetable').delete().eq('id', b.dataset.del);
      if (error) return toast(error.message, 'error');
      toast('Deleted', 'success'); await load();
    });
  }

  function edit(existing) {
    if (!slots.length) return toast('Create a time slot first', 'error');
    if (!rooms.length) return toast('Create a room first', 'error');
    if (!users.length) return toast('Create a faculty user first', 'error');
    const dialog = document.createElement('dialog'); dialog.className = 'modal-dialog';
    dialog.innerHTML = `<div class="modal-content modal-wide">
      <div class="modal-header">
        <div class="modal-title">${existing ? 'Edit' : 'Add'} timetable row</div>
        <button class="modal-close" data-close><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
          <label class="field"><span>Faculty *</span>
            <select class="input" data-field="faculty_id">
              ${users.map(u => `<option value="${u.id}" ${existing?.faculty_id === u.id ? 'selected' : ''}>${escapeHtml(u.full_name || u.email)}</option>`).join('')}
            </select>
          </label>
          <label class="field"><span>Day *</span>
            <select class="input" data-field="day_of_week">
              ${[1,2,3,4,5,6,0].map(d => `<option value="${d}" ${existing?.day_of_week === d ? 'selected' : ''}>${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d]}</option>`).join('')}
            </select>
          </label>
          <label class="field"><span>Period *</span>
            <select class="input" data-field="slot_id">
              ${slots.map(s => `<option value="${escapeHtml(s.slot_id)}" ${existing?.slot_id === s.slot_id ? 'selected' : ''}>${escapeHtml(s.label || s.slot_id)}</option>`).join('')}
            </select>
          </label>
          <label class="field"><span>Room *</span>
            <select class="input" data-field="room_id">
              ${rooms.map(r => `<option value="${escapeHtml(r.room_id)}" ${existing?.room_id === r.room_id ? 'selected' : ''}>${escapeHtml(r.display_name)}</option>`).join('')}
            </select>
          </label>
          <label class="field"><span>Course code</span>
            <input class="input" data-field="course_code" value="${escapeHtml(existing?.course_code || '')}" placeholder="CS401">
          </label>
          <label class="field"><span>Course name</span>
            <input class="input" data-field="course_name" value="${escapeHtml(existing?.course_name || '')}" placeholder="Compiler Design">
          </label>
        </div>
        <div id="conflictZone"></div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close>Cancel</button>
        <button class="btn btn-primary" data-save>Save</button>
      </div>
    </div>`;
    document.body.appendChild(dialog); dialog.showModal();
    dialog.querySelector('[data-save]').onclick = async () => {
      const get = f => dialog.querySelector(`[data-field="${f}"]`).value.trim();
      const fac = get('faculty_id'), dow = parseInt(get('day_of_week')), slot = get('slot_id'), room = get('room_id');
      if (!fac || !slot || !room) return toast('Faculty, period, and room are required', 'error');
      const conflicts = [];
      const rClash = tt.find(t => t.room_id === room && t.day_of_week === dow && t.slot_id === slot && t.id !== existing?.id);
      if (rClash) conflicts.push(`Room ${room} already used by another class`);
      const fClash = tt.find(t => t.faculty_id === fac && t.day_of_week === dow && t.slot_id === slot && t.id !== existing?.id);
      if (fClash) conflicts.push('This faculty is already teaching at this time');
      if (conflicts.length) {
        dialog.querySelector('#conflictZone').innerHTML = `<div class="conflict-box"><strong><i class="fas fa-triangle-exclamation"></i> Conflicts detected</strong><ul>${conflicts.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul></div>`;
        return;
      }
      const payload = {
        faculty_id: fac, day_of_week: dow, slot_id: slot, room_id: room,
        course_code: get('course_code') || null,
        course_name: get('course_name') || null,
        is_active: true,
      };
      const r = existing
        ? await supabase.from('timetable').update(payload).eq('id', existing.id)
        : await supabase.from('timetable').insert(payload);
      if (r.error) return toast(r.error.message, 'error');
      toast(existing ? 'Updated' : 'Added', 'success');
      dialog.close(); dialog.remove(); await load();
    };
    const close = () => { dialog.close(); dialog.remove(); };
    dialog.querySelectorAll('[data-close]').forEach(x => x.onclick = close);
    dialog.addEventListener('close', () => { if (dialog.isConnected) dialog.remove(); });
    dialog.onclick = e => { if (e.target === dialog) close(); };
  }

  $('facFilter').onchange = e => { facFilter = e.target.value; render(); };
  $('dayFilter').onchange = e => { day = e.target.value; render(); };
  $('search').oninput = e => { search = e.target.value.trim(); render(); };
  $('addBtn').onclick = () => edit();

  $('exportBtn').onclick = () => {
    const userMap = new Map(users.map(u => [u.id, u]));
    const csv = ['faculty_email,day_of_week,slot_id,room_id,course_code,course_name'].concat(
      tt.map(r => [userMap.get(r.faculty_id)?.email || '', r.day_of_week, r.slot_id, r.room_id, r.course_code || '', `"${(r.course_name || '').replace(/"/g, '""')}"`].join(','))
    ).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `timetable-${todayISO()}.csv`; a.click();
    toast('Exported', 'success');
  };

  await load();
})();
</script>
</body>
</html>
