<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#EA580C">
<title>Sign in · LPU Scheduler</title>
<script>(function(){try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'))}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mobile-app.css">
<!-- Cloudflare Turnstile (explicit render — we mount it from JS) -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>

<div class="auth-shell">
  <div class="auth-brand-panel">
    <div class="auth-brand-content">
      <div class="auth-brand-mark"><i class="fas fa-calendar-check"></i></div>
      <h1 class="auth-brand-title">LPU Scheduler</h1>
      <p class="auth-brand-tagline">Live classroom availability for LPU faculty, students, and admins.</p>
    </div>
    <div class="auth-brand-footer">© LPU Scheduler</div>
  </div>

  <div class="auth-form-panel">
    <div class="auth-form-wrap">
      <div class="auth-mobile-brand">
        <div class="auth-mobile-brand-icon"><i class="fas fa-calendar-check"></i></div>
        <span>LPU Scheduler</span>
      </div>

      <div class="auth-form-header">
        <h2 class="auth-form-title">Sign in</h2>
        <p class="auth-form-sub">Enter your credentials to continue.</p>
      </div>

      <form id="loginForm" autocomplete="on" novalidate>
        <label class="field">
          <span>Email</span>
          <input class="input" type="email" id="email" name="email"
                 autocomplete="email" required>
        </label>

        <label class="field">
          <span>Password</span>
          <div class="pwd-wrap">
            <input class="input" type="password" id="password" name="password"
                   autocomplete="current-password" required>
            <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="Toggle password visibility">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </label>

        <div id="turnstileWidget" style="margin:4px 0 14px;min-height:65px"></div>

        <div class="login-error" id="errorBox" role="alert"></div>

        <button class="btn btn-primary btn-block" type="submit" id="submitBtn" disabled>
          <i class="fas fa-right-to-bracket"></i> Sign in
        </button>
      </form>
    </div>
  </div>
</div>

<script type="module">
import { supabase, escapeHtml, waitForSession } from './js/core.js';

/* ═══════════════════════════════════════════════════════
   REPLACE THIS with your Cloudflare Turnstile site key
   (get it from Cloudflare Dashboard → Turnstile → your widget)
   ═══════════════════════════════════════════════════════ */
const TURNSTILE_SITE_KEY = '0x4AAAAAAFk78nRRRuS58LzL';

const $ = id => document.getElementById(id);
const form = $('loginForm');
const errorBox = $('errorBox');
const submitBtn = $('submitBtn');
const pwdToggle = $('pwdToggle');

let turnstileToken = null;
let turnstileWidget = null;

/* ── URL error params ── */
const errParam = new URLSearchParams(location.search).get('err');
if (errParam === 'suspended') showError('Your account has been suspended. Contact an administrator.');
else if (errParam === 'expired') showError('Your session expired. Please sign in again.');

/* ── Password visibility ── */
pwdToggle.onclick = () => {
  const p = $('password');
  const show = p.type === 'password';
  p.type = show ? 'text' : 'password';
  pwdToggle.innerHTML = show
    ? '<i class="fas fa-eye-slash"></i>'
    : '<i class="fas fa-eye"></i>';
  pwdToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
};

/* ── Floating theme toggle (top-right) ── */
const themeBtn = document.createElement('button');
themeBtn.type = 'button';
themeBtn.className = 'nav-icon-btn';
themeBtn.style.cssText = 'position:fixed;top:20px;right:20px;z-index:10;width:40px;height:40px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-sm)';
themeBtn.setAttribute('aria-label', 'Toggle theme');
document.body.appendChild(themeBtn);

function paintThemeBtn() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  themeBtn.innerHTML = dark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
}
paintThemeBtn();

themeBtn.onclick = () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const next = dark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch {}
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', next === 'dark' ? '#0B1220' : '#EA580C');
  paintThemeBtn();
};

/* ── Helpers ── */
function showError(msg) {
  errorBox.innerHTML = `<i class="fas fa-circle-exclamation"></i> ${escapeHtml(msg)}`;
  errorBox.classList.add('show');
}
function hideError() {
  errorBox.classList.remove('show');
  errorBox.innerHTML = '';
}
function setLoading(on) {
  submitBtn.disabled = on || !turnstileToken;
  submitBtn.innerHTML = on
    ? '<i class="fas fa-spinner fa-spin"></i> Signing in…'
    : '<i class="fas fa-right-to-bracket"></i> Sign in';
}
function updateSubmitState() {
  submitBtn.disabled = !turnstileToken;
}

/* ── Turnstile ── */
(async () => {
  if (TURNSTILE_SITE_KEY === '0x4AAAAAAFk78nRRRuS58LzL') {
    console.warn('[login] Turnstile site key not configured — set TURNSTILE_SITE_KEY in login.html');
    // Fail-open in dev so you can still sign in. Remove this block in production.
    turnstileToken = '__DEV_BYPASS__';
    updateSubmitState();
    return;
  }

  try {
    const turnstile = await new Promise((resolve, reject) => {
      const start = Date.now();
      const tick = () => {
        if (window.turnstile) return resolve(window.turnstile);
        if (Date.now() - start > 8000) return reject(new Error('Turnstile failed to load'));
        setTimeout(tick, 100);
      };
      tick();
    });

    turnstileWidget = turnstile.render('#turnstileWidget', {
      sitekey: TURNSTILE_SITE_KEY,
      theme: document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light',
      callback: (token) => {
        turnstileToken = token;
        updateSubmitState();
        hideError();
      },
      'expired-callback': () => {
        turnstileToken = null;
        updateSubmitState();
        // auto-reset so the widget refreshes itself
        if (window.turnstile && turnstileWidget !== null) {
          window.turnstile.reset(turnstileWidget);
        }
      },
      'error-callback': () => {
        turnstileToken = null;
        updateSubmitState();
        showError('Verification failed. Please refresh the page.');
      },
    });
  } catch (err) {
    console.error('[login] Turnstile:', err);
    showError('Security check failed to load. Check your connection and refresh the page.');
  }
})();

/* ── Submit ── */
form.onsubmit = async (e) => {
  e.preventDefault();
  hideError();

  if (!turnstileToken) {
    return showError('Please complete the security check.');
  }

  const email = $('email').value.trim().toLowerCase();
  const password = $('password').value;

  if (!email || !password) return showError('Email and password are required.');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('Enter a valid email address.');

  setLoading(true);

  try {
    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password,
      options: { captchaToken: turnstileToken },
    });

    if (error) {
      setLoading(false);
      turnstileToken = null;
      if (window.turnstile && turnstileWidget !== null) {
        window.turnstile.reset(turnstileWidget);
      }
      return showError(
        error.message === 'Invalid login credentials' ? 'Incorrect email or password.' :
        error.message === 'Email not confirmed'       ? 'Your email is not confirmed. Contact an administrator.' :
        error.message
      );
    }

    if (!data?.user) {
      setLoading(false);
      return showError('Sign-in failed — no user returned.');
    }

    const { data: profile, error: pErr } = await supabase
      .from('profiles')
      .select('role, is_active')
      .eq('id', data.user.id)
      .single();

    if (pErr || !profile) {
      await supabase.auth.signOut();
      setLoading(false);
      return showError('Profile not found. Contact an administrator.');
    }
    if (profile.is_active === false) {
      await supabase.auth.signOut();
      setLoading(false);
      return showError('Your account has been suspended. Contact an administrator.');
    }

    // ▼ Role-aware redirect — now includes 'student'
    location.replace(
      profile.role === 'admin'   ? 'admin.html'   :
      profile.role === 'student' ? 'student.html' :
                                   'faculty.html'
    );
  } catch (err) {
    console.error(err);
    setLoading(false);
    showError('Network error — check your connection and try again.');
  }
};

/* ── Auto-redirect if a session already exists ── */
(async () => {
  try {
    const session = await waitForSession(1200);
    if (!session?.user) return;
    const { data: profile } = await supabase
      .from('profiles')
      .select('role, is_active')
      .eq('id', session.user.id)
      .single();
    if (!profile || profile.is_active === false) return;
    location.replace(
      profile.role === 'admin'   ? 'admin.html'   :
      profile.role === 'student' ? 'student.html' :
                                   'faculty.html'
    );
  } catch {}
})();
</script>

<script type="module" src="js/pwa.js"></script>
</body>
</html>
